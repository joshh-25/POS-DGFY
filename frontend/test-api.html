<!DOCTYPE html>
<html>
<head>
    <title>Test Packaging API</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .result {
            background: white;
            border: 2px solid #333;
            padding: 20px;
            margin: 20px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        .error {
            background: #ffebee;
            border-color: #c62828;
        }
        .success {
            background: #e8f5e9;
            border-color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>Packaging API Test</h1>

    <button onclick="testGetAllItems()">Test GET /api/items</button>
    <button onclick="testGetPackagingItems()">Test GET /api/items?category=packaging</button>
    <button onclick="testGetItemById(7)">Test GET /api/items/7 (Glass Bottles)</button>

    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        async function testGetAllItems() {
            await makeRequest(`${API_BASE}/items`, 'All Items');
        }

        async function testGetPackagingItems() {
            await makeRequest(`${API_BASE}/items?category=packaging`, 'Packaging Items Only');
        }

        async function testGetItemById(id) {
            await makeRequest(`${API_BASE}/items/${id}`, `Item ${id} Details`);
        }

        async function makeRequest(url, title) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';

            try {
                resultDiv.innerHTML = `<strong>${title}</strong>\n\nLoading...`;
                resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);

                const response = await fetch(url);
                const data = await response.json();

                resultDiv.className = 'result success';
                resultDiv.innerHTML = `<strong>${title}</strong>\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;

                // Special check for packaging_specs
                if (data.data && data.data.items) {
                    const packagingItems = data.data.items.filter(item => item.category === 'packaging');
                    resultDiv.innerHTML += `\n\n=== PACKAGING ITEMS ANALYSIS ===\n`;
                    resultDiv.innerHTML += `Total items: ${data.data.items.length}\n`;
                    resultDiv.innerHTML += `Packaging items: ${packagingItems.length}\n\n`;

                    packagingItems.forEach(item => {
                        resultDiv.innerHTML += `\nItem: ${item.name} (${item.sku_code})\n`;
                        resultDiv.innerHTML += `Has packaging_specs: ${!!item.packaging_specs}\n`;
                        resultDiv.innerHTML += `packaging_specs type: ${typeof item.packaging_specs}\n`;
                        if (item.packaging_specs) {
                            resultDiv.innerHTML += `packaging_specs value: ${JSON.stringify(item.packaging_specs, null, 2)}\n`;
                        }
                    });
                }

                if (data.data && !data.data.items && data.data.category === 'packaging') {
                    resultDiv.innerHTML += `\n\n=== SINGLE ITEM ANALYSIS ===\n`;
                    resultDiv.innerHTML += `Has packaging_specs: ${!!data.data.packaging_specs}\n`;
                    resultDiv.innerHTML += `packaging_specs type: ${typeof data.data.packaging_specs}\n`;
                    if (data.data.packaging_specs) {
                        resultDiv.innerHTML += `packaging_specs value: ${JSON.stringify(data.data.packaging_specs, null, 2)}\n`;
                    }
                }

            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>${title}</strong>\n\nError: ${error.message}\n\nMake sure the backend server is running on http://localhost:3000`;
            }
        }
    </script>
</body>
</html>
