name: dglaundry

# Surebizcorp closed-qualification overlay. Use with the base production
# Compose file. It starts mysql, migrate, api, worker, and gateway only; the
# monitoring profiles remain available for a later, measured activation.
services:
  mysql:
    command: ["mysqld", "--max_connections=30", "--innodb_buffer_pool_size=128M", "--skip-name-resolve"]
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  migrate:
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  api:
    environment:
      DGLAUNDRY_DEPLOYMENT_ENV: qualification
      DGLAUNDRY_CONFIG_REVISION: ${DGLAUNDRY_CONFIG_REVISION:?Set the reviewed qualification configuration revision}
      DGFY_MODE: ${DGLAUNDRY_DGFY_MODE:?Set disabled for dark setup or sandbox after provider review}
      DGFY_ISSUER: ${DGLAUNDRY_DGFY_ISSUER:?Set the exact DGFY staging issuer}
      DGFY_CLIENT_ID: ${DGLAUNDRY_DGFY_CLIENT_ID:?Set the registered staging browser client id}
      DGFY_PARTNER_APP_ID: ${DGLAUNDRY_DGFY_PARTNER_APP_ID:?Set the registered DGLaundry partner app id}
      DGFY_REDIRECT_URI: ${DGLAUNDRY_DGFY_REDIRECT_URI:?Set the exact Surebizcorp staging callback}
      DGFY_PARTNER_TOKEN_URL: ${DGLAUNDRY_DGFY_PARTNER_TOKEN_URL:?Set the DGFY staging machine-token URL}
      DGFY_PARTNER_INBOUND_AUDIENCE: ${DGLAUNDRY_DGFY_PARTNER_INBOUND_AUDIENCE:?Set the exact Surebizcorp API origin accepted as DGFY staging service-token audience}
      DGFY_PARTNER_INBOUND_CLIENT_ID: ${DGLAUNDRY_DGFY_PARTNER_INBOUND_CLIENT_ID:?Set the registered DGFY staging service-client ID}
      DGFY_SESSION_CONTEXT_URL: ${DGLAUNDRY_DGFY_SESSION_CONTEXT_URL:?Set the DGFY staging session-context URL}
      DGFY_REGISTRATION_INTENT_URL: ${DGLAUNDRY_DGFY_REGISTRATION_INTENT_URL:?Set the DGFY staging registration-intent URL}
      DGFY_LOCATION_INTENT_URL: ${DGLAUNDRY_DGFY_LOCATION_INTENT_URL:?Set the DGFY staging location-intent URL}
      DGFY_STAFF_INVITATION_URL: ${DGLAUNDRY_DGFY_STAFF_INVITATION_URL:?Set the DGFY staging invitation URL}
      DGFY_PARTNER_PUBLIC_KEYS_JSON: ${DGLAUNDRY_DGFY_PARTNER_PUBLIC_KEYS_JSON:?Set pinned DGFY staging partner keys}
      MYSQL_POOL_SIZE: "3"
      TELEMETRY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    mem_limit: 384m
    cpus: "0.75"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    mem_limit: 192m
    cpus: "0.5"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  gateway:
    mem_limit: 64m
    cpus: "0.25"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
