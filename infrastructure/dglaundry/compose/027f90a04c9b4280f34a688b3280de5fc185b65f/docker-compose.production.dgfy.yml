name: dglaundry

# Apply this overlay only after DGFY has registered the exact Surebizcorp
# callback and issued the asymmetric credentials. The base stack remains safe
# in DGFY_MODE=disabled without mounting provider placeholders.
services:
  api:
    environment:
      DGFY_PARTNER_SIGNING_KEY_ID: ${DGLAUNDRY_DGFY_PARTNER_SIGNING_KEY_ID:?Set the registered DGFY signing key id}
      DGFY_PARTNER_CLIENT_ID: ${DGLAUNDRY_DGFY_PARTNER_CLIENT_ID:?Set the registered DGFY machine client id}
      DGFY_PARTNER_CLIENT_ASSERTION_KEY_ID: ${DGLAUNDRY_DGFY_PARTNER_CLIENT_ASSERTION_KEY_ID:?Set the registered machine assertion key id}
      DGFY_PARTNER_CLIENT_ASSERTION_PRIVATE_KEY_FILE: /run/secrets/dgfy_partner_client_assertion_private_key
      DGFY_PARTNER_PUBLIC_KEYS_JSON: ${DGLAUNDRY_DGFY_PARTNER_PUBLIC_KEYS_JSON:?Set pinned DGFY partner public keys}
      DGFY_PARTNER_TOKEN_URL: ${DGLAUNDRY_DGFY_PARTNER_TOKEN_URL:-https://api.dgfy.ph/oidc/token}
    secrets:
      - dgfy_client_secret
      - dgfy_partner_signing_private_key
      - dgfy_partner_client_assertion_private_key
  worker:
    secrets:
      - dgfy_outbound_signing_key
      - dgfy_outbound_auth_token

secrets:
  dgfy_client_secret: {file: "${DGLAUNDRY_SECRETS_DIR:-./secrets}/dgfy_client_secret"}
  dgfy_partner_signing_private_key: {file: "${DGLAUNDRY_DGFY_PARTNER_SIGNING_PRIVATE_KEY_FILE:-${DGLAUNDRY_SECRETS_DIR:-./secrets}/dgfy_partner_signing_private_key}"}
  dgfy_partner_client_assertion_private_key: {file: "${DGLAUNDRY_DGFY_PARTNER_CLIENT_ASSERTION_PRIVATE_KEY_FILE:-${DGLAUNDRY_SECRETS_DIR:-./secrets}/dgfy_partner_client_assertion_private_key}"}
  dgfy_outbound_signing_key: {file: "${DGLAUNDRY_OUTBOUND_SIGNING_KEY_FILE:-${DGLAUNDRY_SECRETS_DIR:-./secrets}/dgfy_outbound_signing_key}"}
  dgfy_outbound_auth_token: {file: "${DGLAUNDRY_SECRETS_DIR:-./secrets}/dgfy_outbound_auth_token"}
