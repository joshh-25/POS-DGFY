# Host-level nginx vhost for the stage.dgfy.ph environment.
#
# SOURCE OF TRUTH for /etc/nginx/sites-available/dgfy-staging on the staging
# host. Until 2026-07-28 this file existed ONLY on that server, with no tracked
# copy anywhere in this repo -- the same untracked-drift problem that produced
# the max_connections=20 surprise documented in
# docs/ops/STAGE_CONNECTION_EXHAUSTION_AND_CSP_INCIDENT_2026-07-27.md.
#
# Why this environment needs a HOST nginx at all, unlike prod/beta:
# /opt/dgfy-stage/docker-compose.yml is a hand-diverged copy of
# infrastructure/docker/docker-compose.yml that bundles NO nginx or certbot
# service. It publishes the containers straight onto loopback --
# backend 127.0.0.1:6000, skupervisor :9081, pos :9082, storefront :9083 --
# and this file is what fronts them. So changes to
# infrastructure/docker/nginx/nginx.conf.template (which configures the
# CONTAINERIZED nginx used by prod/beta) do NOT reach stage.dgfy.ph. Any proxy
# path that must exist on both has to be added in both places.
#
# TLS is terminated upstream (responses carry `Server: openresty`), which is why
# every server block below is plain `listen 80` with no ssl_certificate.
#
# To apply after editing:
#   scp this file to the host, then as root:
#     cp stage.dgfy.ph.conf /etc/nginx/sites-available/dgfy-staging
#     nginx -t && systemctl reload nginx
#   (reload, not restart -- reload does not drop in-flight connections)
#
# The host is reachable via the OpenVPN-connected jump box when direct access
# is unavailable:  ssh lima-sieitz-insider  ->  ssh sieitz-dgfy-local

server {
    listen 80;
    listen [::]:80;

    server_name stage.dgfy.ph;

    client_max_body_size 100M;

    resolver 127.0.0.53 valid=30s ipv6=off;

    location /api {
        set $backend_upstream localhost:6000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        set $backend_upstream localhost:6000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin OpenFreeMap tile proxy -- see
    # packages/web-core/src/components/maps/mapLibreShared.js. In the old PM2/
    # vite-preview production topology this was handled by Vite's own
    # preview-server proxy, not nginx; replicated here since the frontend
    # container is static-only.
    location /openfreemap/ {
        set $openfreemap_upstream tiles.openfreemap.org;
        rewrite ^/openfreemap/(.*)$ /$1 break;
        proxy_pass https://$openfreemap_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $openfreemap_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin PostHog (EU cloud) proxy. posthog-js's core chunk is bundled
    # and already same-origin, but it lazily fetches session replay, surveys,
    # web vitals, and dead-click autocapture from eu-assets.i.posthog.com and
    # its remote config from /array/ at runtime -- all blocked by the
    # storefront's strict `script-src 'self' blob:` CSP. Routing them under
    # /ingest/ makes them 'self' too, so the CSP needs no loosening, and it
    # also survives ad-blockers. Three locations, matching PostHog's own nginx
    # recipe: static assets and remote config share the *-assets host,
    # everything else (event capture, feature flags, session recording ingest)
    # goes to the regional API host. Mirrors the /ingest/ blocks in
    # infrastructure/docker/nginx/nginx.conf.template -- keep the two in sync.
    #
    # The frontend reaches these because VITE_POSTHOG_HOST is "/ingest"; if
    # that build arg is ever set to a direct PostHog host again, these blocks
    # go unused and the CSP errors come back.
    location /ingest/static/ {
        set $posthog_assets_upstream eu-assets.i.posthog.com;
        rewrite ^/ingest/static/(.*)$ /static/$1 break;
        proxy_pass https://$posthog_assets_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_assets_upstream;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $posthog_assets_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ingest/array/ {
        set $posthog_assets_upstream eu-assets.i.posthog.com;
        rewrite ^/ingest/array/(.*)$ /array/$1 break;
        proxy_pass https://$posthog_assets_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_assets_upstream;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $posthog_assets_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ingest/ {
        set $posthog_upstream eu.i.posthog.com;
        rewrite ^/ingest/(.*)$ /$1 break;
        proxy_pass https://$posthog_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_upstream;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $posthog_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # #452: affiliate short-link alias. /s/{short_code} is a client-side SPA route -- the
    # storefront app reads the code out of window.location.pathname and resolves it via
    # GET /api/v1/dgfy/affiliate/s/{short_code}. nginx only has to hand it the app shell.
    #
    # No rewrite (unlike /tenant-store/ elsewhere): stripping the prefix would gain nothing --
    # the container's try_files falls through to /index.html either way -- and the browser
    # URL is untouched by a rewrite regardless, so the SPA sees /s/... in both cases.
    #
    # This block is functionally covered by `location /` today. It exists so the contract is
    # explicit: narrowing `location /` later must not silently break every printed QR code.
    location /s/ {
        set $frontend_upstream localhost:9083;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store";
    }

    location / {
        set $frontend_upstream localhost:9083;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

