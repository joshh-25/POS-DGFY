# Host-level nginx vhost for the dev.dgfy.ph environment.
#
# SOURCE OF TRUTH for /etc/nginx/sites-available/dgfy-dev-staging on
# vm-sieitzstaging (ssh sieitz-dgfy-remote). Had no tracked copy anywhere in
# this repo until 2026-08-07 -- the same drift this vhost's sibling,
# stage.dgfy.ph.conf, called out on 2026-07-28. This file was read directly
# off the host during the DGFY-283 iMin diagnostics investigation; treat any
# future manual edit on the host as something to bring back here in the same
# commit, not as a one-off.
#
# Compose dir for this environment: /opt/dgfy-dev (services: mysql, redis,
# backend, frontend -- no containerized nginx/certbot, matching stage's
# shape; see stage.dgfy.ph.conf for why). Backend on 127.0.0.1:5000,
# frontend's three surfaces on 127.0.0.1:8081-8083 (skupervisor/pos/store).
# `api.dev.dgfy.ph`'s upstream (:5100) has no running service behind it as
# of 2026-08-07 -- apps/dgfy-api was removed from the repo (ADR 0032); this
# block is dead until/unless that service returns.
#
# TLS is terminated upstream (confirmed via `curl -v https://pos.dev.dgfy.ph`
# returning 200 from outside the host while every block below is plain
# `listen 80`), same posture as stage.
#
# To apply after editing:
#   scp this file to the host, then as root:
#     cp dev.dgfy.ph.conf /etc/nginx/sites-available/dgfy-dev-staging
#     nginx -t && systemctl reload nginx
#   (reload, not restart -- reload does not drop in-flight connections)
#
# Direct: ssh sieitz-dgfy-remote (resolves to vm-sieitzstaging).

# Attribution log format for the two POS-facing vhosts below. Plain
# `combined` only ever showed the proxy's own IP and a generic User-Agent
# string for every request -- during the DGFY-283 investigation that was
# still enough to prove a request sequence stopped exactly at the terminal-
# occupancy check, but only by eyeballing timestamps and paths by hand.
# `$http_x_pos_terminal_id` and `$http_x_pos_error_ref` are sent by
# frontend/src/services/api.js (POS surface only, see IS_POS_SURFACE) so a
# cashier can read a reference code off the terminal screen and grep it
# straight out of this log, with no Sentry lookup, DSN, or device network
# egress required. `$request_time`/`$upstream_status` separate "nginx never
# got a response from backend" from "backend answered but slowly" --
# indistinguishable in `combined`.
log_format dgfy_dev_debug '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'terminal=$http_x_pos_terminal_id ref=$http_x_pos_error_ref '
                           'rt=$request_time upstream_status=$upstream_status';

server {
    listen 80;
    listen [::]:80;

    server_name dev.dgfy.ph;

    resolver 127.0.0.53 valid=30s;
    access_log /var/log/nginx/access.log dgfy_dev_debug;

    location /api {
        set $backend_upstream localhost:5000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        set $backend_upstream localhost:5000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin OpenFreeMap tile proxy -- see
    # frontend/src/components/maps/mapLibreShared.js. In the old PM2/
    # vite-preview production topology this was handled by Vite's own
    # preview-server proxy, not nginx; replicated here since the frontend
    # container is static-only.
    location /openfreemap/ {
        set $openfreemap_upstream tiles.openfreemap.org;
        rewrite ^/openfreemap/(.*)$ /$1 break;
        proxy_pass https://$openfreemap_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $openfreemap_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream localhost:8083;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name pos.dev.dgfy.ph;

    client_max_body_size 100M;

    resolver 127.0.0.53 valid=30s;
    access_log /var/log/nginx/access.log dgfy_dev_debug;

    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # POS intentionally has no /openfreemap proxy -- the app calls
    # tiles.openfreemap.org directly when VITE_APP_SURFACE=pos and no
    # VITE_TILE_BASE is set (see mapLibreShared.js shouldUseLocalTileProxy).
    # This matches confirmed live production behavior, not an oversight.

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

