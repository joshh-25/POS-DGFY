# One-shot: applies Sequelize migrations (apps/dgfy-migration-runner, the
# migration domain that used to live in backend/) against the landlord DB,
# then exits. dgfy-api (docker-compose.api.yml) depends on this completing
# successfully instead of migrating itself on boot -- see
# infrastructure/docker/dgfy-migration-runner/.
#
# Pulled into the main project via docker-compose.yml's `include:` --
# always run `docker compose` from that file's directory, not this one
# directly.
services:
  dgfy-migration-runner:
    image: ghcr.io/sieitzz/dgfy-migration-runner:${IMAGE_TAG:-latest}
    restart: "no"
    # WAS: env_file: .env (blanket -- every one of ~100 vars, whether used
    # or not, most of which this service never touches). Explicit instead,
    # matching what PROD's own hand-maintained file has done since the
    # 2026-08-28 SOPS cutover (#360) -- confirmed against
    # apps/dgfy-migration-runner/src/config/sequelize.config.cjs, this
    # service only ever reads these 6 vars.
    #
    # DB_HOST/DB_PORT/DB_DIALECT are duplicated here and in
    # docker-compose.api.yml rather than factored into a shared file --
    # it's 3 literal lines, not worth a shared-vars indirection for.
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DIALECT: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [dgfy_internal]
