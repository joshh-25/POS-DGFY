server {
    listen 8085;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        absolute_redirect off;
        return 308 /admin/;
    }

    # Hashed assets must fail with a real 404 when absent; returning the SPA
    # shell as JavaScript can poison browser caches across a rollback.
    location ^~ /admin/assets/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
