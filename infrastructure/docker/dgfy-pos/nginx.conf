server {
    listen 8082;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build output. A chunk deleted by a redeploy must 404
    # here: falling through to the SPA rewrite below would answer a module
    # request with index.html (200 text/html), which the browser can't
    # evaluate as a module script, and which the POS service worker would
    # then cache AS the script -- making the failure survive every
    # subsequent reload. No `always` on add_header: a 404 must not inherit
    # the immutable policy, or a chunk restored by a rollback stays 404 in
    # the browser's HTTP cache.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA shell plus the unhashed public/ files (sw.js, manifest, precache
    # manifest, icons) must revalidate on every load so a deploy is picked
    # up on the next navigation. `no-cache`, not `no-store`: the service
    # worker's isCacheableResponse only rejects `no-store`, so `no-store`
    # here would stop it caching these for offline use; `no-cache` still
    # gets cheap 304s while keeping the response storable.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
