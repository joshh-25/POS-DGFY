server {
    listen 8081;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build output -- see the dgfy-pos nginx.conf for the full
    # rationale on why a missing chunk must 404 here, not fall through to the
    # SPA rewrite below.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
