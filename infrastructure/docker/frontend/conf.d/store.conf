server {
    listen 8083;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html/store;
    index index.html;

    # Content-hashed build output -- see pos.conf for the full rationale.
    # Assumes VITE_STORE_BASE_PATH stays "/" (the Dockerfile default): the
    # edge nginx rewrites /tenant-store/* to /* before proxying here
    # (nginx.conf.template), so this container always sees /assets/...
    # regardless of which public path served it.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
