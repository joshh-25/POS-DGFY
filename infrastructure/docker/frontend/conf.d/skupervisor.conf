server {
    listen 8081;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html/skupervisor;
    index index.html;

    # Content-hashed build output -- see pos.conf for the full rationale.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
