# ==============================================================================
# dgfy-platform -- reusable production/beta Docker Compose
# ==============================================================================
# Self-contained: only references pre-built images from GHCR, EXCEPT for
# nginx/nginx.conf.template and nginx/init-letsencrypt.sh (copy the
# infrastructure/docker/nginx/ directory alongside this file on the server
# too). Copy this file + a filled-in .env (start from .env.example) +
# nginx/ to the server and run:
#
#   docker compose up -d
#
# Docker creates the ./data/* bind-mount directories automatically on first
# run if they don't already exist.
#
# Domains (SKUPERVISOR_DOMAIN / POS_DOMAIN / STOREFRONT_DOMAIN / CERT_DOMAIN
# in .env) are what let the SAME compose file + images serve DEV/QA/PROD/
# beta -- only .env differs per environment, see .env.example.
#
# --- First-time HTTPS setup ---------------------------------------------
#
# skupervisor/pos/storefront are only reachable through the bundled nginx
# service, which needs a Let's Encrypt certificate before it can serve
# HTTPS. After the FIRST `docker compose up -d` on a fresh server, run once:
#
#   ./nginx/init-letsencrypt.sh
#
# Not needed again after that -- the `certbot` service renews the
# certificate automatically, but nginx needs a manual reload after a
# renewal actually happens (see init-letsencrypt.sh's closing note).
# ==============================================================================

name: dgfy-platform

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # log_bin_trust_function_creators: a migration creates a trigger
    # (20260406000001-add-tenant-compliance-program.cjs). MySQL 8 ships
    # with binary logging on by default and requires SUPER privilege to
    # create triggers/functions while it's on -- the app's DB_USER below
    # is intentionally a scoped, non-root/non-SUPER user, so this flag is
    # needed instead.
    #
    # max_connections: MUST stay at or above dgfy-api's connection budget --
    # TENANT_MAX_CACHED_CONNECTIONS x TENANT_DB_POOL_MAX + LANDLORD_DB_POOL_MAX,
    # which is 20 x 7 + 30 = 170 at the defaults in
    # apps/dgfy-api/src/config/connectionBudget.js. MySQL's own default is 151,
    # i.e. BELOW that budget -- relying on it silently under-provisions the
    # server. 200 leaves headroom for the healthcheck, migrations, and admin
    # sessions. Keep this in sync with DB_MAX_CONNECTIONS on the dgfy-api
    # service; dgfy-api logs a warning at boot when the two disagree.
    command: >
      mysqld
      --log-bin-trust-function-creators=1
      --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies Sequelize migrations (apps/dgfy-migration-runner, the
  # migration domain that used to live in backend/) against the landlord DB,
  # then exits. dgfy-api below depends on this completing successfully instead
  # of migrating itself on boot -- see infrastructure/docker/dgfy-migration-runner/.
  dgfy-migration-runner:
    image: ghcr.io/sieitzz/dgfy-migration-runner:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DIALECT: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks: [dgfy_internal]

  # apps/dgfy-api is the backend, refactored into apps/ (see docs/ai/CLAUDE.md)
  # -- now the single source of truth (backend/ removed). The migration domain
  # runs separately in dgfy-migration-runner above, so dgfy-api no longer runs
  # db:migrate itself.
  dgfy-api:
    image: ghcr.io/sieitzz/dgfy-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DIALECT: mysql
      REDIS_URL: redis://redis:6379
      PORT: 5100
      # Must match the mysql service's --max_connections above. The backend
      # compares its own pool budget against this at boot and warns on a
      # mismatch instead of failing later under load.
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-200}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_BACKEND_DSN: ${SENTRY_BACKEND_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
      SENTRY_DEBUG: ${SENTRY_DEBUG:-false}
    volumes:
      - ./data/dgfy-api/uploads:/app/uploads
      - ./data/dgfy-api/storage:/app/storage
      - ./data/dgfy-api/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      dgfy-migration-runner:
        condition: service_completed_successfully
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5100/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  dgfy-ims:
    image: ghcr.io/sieitzz/dgfy-ims:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No host port: reachable only via dgfy_internal, through the nginx
    # service below.
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/"]
      interval: 15s
      timeout: 5s
      retries: 5

  dgfy-pos:
    image: ghcr.io/sieitzz/dgfy-pos:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/"]
      interval: 15s
      timeout: 5s
      retries: 5

  dgfy-storefront:
    image: ghcr.io/sieitzz/dgfy-storefront:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Reverse proxy routing SKUPERVISOR_DOMAIN / POS_DOMAIN /
  # STOREFRONT_DOMAIN (+STOREFRONT_ALT_DOMAIN) to `dgfy-api`/`dgfy-ims`/
  # `dgfy-pos`/`dgfy-storefront` by Host header. Stock image, not
  # custom-built -- nginx.conf.template is bind-mounted and rendered via the
  # official image's built-in envsubst entrypoint step using the environment
  # vars below. See nginx/nginx.conf.template and nginx/init-letsencrypt.sh
  # (one-time HTTPS bootstrap, run once manually after the first
  # `docker compose up -d` on a fresh server).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      SKUPERVISOR_DOMAIN: ${SKUPERVISOR_DOMAIN}
      POS_DOMAIN: ${POS_DOMAIN}
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN}
      STOREFRONT_ALT_DOMAIN: ${STOREFRONT_ALT_DOMAIN:-}
      DGFY_API_DOMAIN: ${DGFY_API_DOMAIN:-_}
      CERT_DOMAIN: ${CERT_DOMAIN}
      # PROD domain group -- added 2026-08-23 (#329/#401) so this file matches the
      # live server, which has carried these since the 2026-07-20 dgfy.ph cutover
      # (see infrastructure/docker/env/prod.compose-fragment.yml, captured from the
      # server, and docs/ops/PRODUCTION_READINESS_POSTHOG_AND_NGINX_DRIFT.md's now
      # -resolved drift finding). Required by nginx.conf.template's PRODUCTION
      # server blocks AND by the beta group's redirect targets.
      SKUPERVISOR_DOMAIN_PROD: ${SKUPERVISOR_DOMAIN_PROD}
      POS_DOMAIN_PROD: ${POS_DOMAIN_PROD}
      STOREFRONT_DOMAIN_PROD: ${STOREFRONT_DOMAIN_PROD}
      STOREFRONT_ALT_DOMAIN_PROD: ${STOREFRONT_ALT_DOMAIN_PROD:-}
      CERT_DOMAIN_PROD: ${CERT_DOMAIN_PROD}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./data/nginx/custom-storefronts:/etc/nginx/custom-storefronts:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      dgfy-api:
        condition: service_healthy
      dgfy-ims:
        condition: service_healthy
      dgfy-pos:
        condition: service_healthy
      dgfy-storefront:
        condition: service_healthy
    networks: [dgfy_internal]

  # Renews the Let's Encrypt certificate automatically (only actually
  # renews within 30 days of expiry, so roughly every ~60 days). nginx
  # must be reloaded after a renewal to pick up the new cert -- this is
  # NOT automated (would require giving this container Docker socket
  # access); see nginx/init-letsencrypt.sh's closing note.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    networks: [dgfy_internal]

networks:
  dgfy_internal:
    driver: bridge
