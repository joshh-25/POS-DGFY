# ==============================================================================
# dgfy-platform -- reusable production/beta Docker Compose (entry file)
# ==============================================================================
# Split into per-concern files (#1236) so no single file mixes the data
# layer, the migration one-shot, the API's ~50-var environment block, the
# three static frontends, and the reverse proxy. `include:` below pulls the
# other four files into this same Compose project -- `docker compose` is
# still invoked exactly as before (`docker compose up -d`, `docker compose
# config`, etc.) from this directory; nothing that calls Compose needs to
# know about the split (confirmed against publish-platform.yml,
# deploy-sops.sh, verify-deployment.yml -- none of them pass -f flags, they
# all just `cd` here and run `docker compose ...`).
#
# Self-contained: only references pre-built images from GHCR, EXCEPT for
# nginx/nginx.conf.template and nginx/init-letsencrypt.sh (copy the
# infrastructure/docker/nginx/ directory alongside this file on the server
# too). Copy this directory (all 5 compose files + nginx/) + a filled-in
# .env (start from .env.example) + nginx/ to the server and run:
#
#   docker compose up -d
#
# Docker creates the ./data/* bind-mount directories automatically on first
# run if they don't already exist.
#
# Domains (SKUPERVISOR_DOMAIN / POS_DOMAIN / STOREFRONT_DOMAIN / CERT_DOMAIN
# in .env) are what let the SAME compose files + images serve DEV/QA/PROD/
# beta -- only .env differs per environment, see .env.example. PROD is the
# one exception: its own hand-maintained file set on the server bakes these
# (and the rest of dgfy-api's non-secret config) as literals instead of
# reading .env at all -- see infrastructure/docker/env/prod.sops-cutover
# -fragment.yml's EDIT 4 and this file's own header note on that.
#
# --- First-time HTTPS setup ---------------------------------------------
#
# skupervisor/pos/storefront are only reachable through the bundled nginx
# service (docker-compose.proxy.yml), which needs a Let's Encrypt
# certificate before it can serve HTTPS. After the FIRST `docker compose up
# -d` on a fresh server, run once:
#
#   ./nginx/init-letsencrypt.sh
#
# Not needed again after that -- the `certbot` service renews the
# certificate automatically, but nginx needs a manual reload after a
# renewal actually happens (see init-letsencrypt.sh's closing note).
# ==============================================================================

name: dgfy-platform

include:
  - docker-compose.migration.yml
  - docker-compose.api.yml
  - docker-compose.frontend.yml
  - docker-compose.proxy.yml

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # log_bin_trust_function_creators: a migration creates a trigger
    # (20260406000001-add-tenant-compliance-program.cjs). MySQL 8 ships
    # with binary logging on by default and requires SUPER privilege to
    # create triggers/functions while it's on -- the app's DB_USER below
    # is intentionally a scoped, non-root/non-SUPER user, so this flag is
    # needed instead.
    #
    # max_connections: MUST stay at or above dgfy-api's connection budget --
    # TENANT_MAX_CACHED_CONNECTIONS x TENANT_DB_POOL_MAX + LANDLORD_DB_POOL_MAX,
    # which is 20 x 7 + 30 = 170 at the defaults in
    # apps/dgfy-api/src/config/connectionBudget.js. MySQL's own default is 151,
    # i.e. BELOW that budget -- relying on it silently under-provisions the
    # server. 200 leaves headroom for the healthcheck, migrations, and admin
    # sessions. Keep this in sync with DB_MAX_CONNECTIONS in
    # docker-compose.api.yml; dgfy-api logs a warning at boot when the two
    # disagree.
    command: >
      mysqld
      --log-bin-trust-function-creators=1
      --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks: [dgfy_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dgfy_internal:
    driver: bridge
