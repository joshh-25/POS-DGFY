# Local development only. Auto-merged by `docker compose` when run from this
# directory. Builds images from source instead of pulling from GHCR, and
# exposes a few convenience ports. Do not use this file on a server.
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up --build
#
# nginx needs a cert at ./data/certbot/conf/live/dev.localhost/ before it
# will start (its config has no HTTP-only fallback) -- generate one first:
#   ./nginx/dev-certs/generate.sh
#
# Then add to /etc/hosts to exercise the real domain routing locally:
#   127.0.0.1 skupervisor.localhost pos.localhost localhost

services:
  dgfy-migration-runner:
    image: dgfy-migration-runner:dev
    build:
      context: ../..
      dockerfile: infrastructure/docker/dgfy-migration-runner/Dockerfile

  dgfy-api:
    image: dgfy-api:dev
    build:
      context: ../..
      dockerfile: infrastructure/docker/dgfy-api/Dockerfile
    ports:
      - "5100:5100"

  dgfy-ims:
    image: dgfy-ims:dev
    build:
      context: ../..
      dockerfile: infrastructure/docker/dgfy-ims/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SENTRY_ENABLED: "false"

  dgfy-pos:
    image: dgfy-pos:dev
    build:
      context: ../..
      dockerfile: infrastructure/docker/dgfy-pos/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SENTRY_ENABLED: "false"

  dgfy-storefront:
    image: dgfy-storefront:dev
    build:
      context: ../..
      dockerfile: infrastructure/docker/dgfy-storefront/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_STORE_BASE_PATH: /
        VITE_SENTRY_ENABLED: "false"

  nginx:
    environment:
      SKUPERVISOR_DOMAIN: skupervisor.localhost
      POS_DOMAIN: pos.localhost
      STOREFRONT_DOMAIN: localhost
      STOREFRONT_ALT_DOMAIN: ""
      CERT_DOMAIN: dev.localhost

  mysql:
    ports:
      - "3306:3306"
