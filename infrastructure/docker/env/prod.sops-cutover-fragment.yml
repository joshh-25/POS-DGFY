# =============================================================================
# MySQL port -- separate line item, not bundled into this cutover (#402)
# =============================================================================
#
# The live server still publishes MySQL to the host (`ports: ["3306:3306"]
# # TEMPORARY! remove once fixed`, confirmed live 2026-08-28). Not required
# by anything this cutover does -- dgfy-migration-runner and dgfy-api both
# reach mysql over the internal dgfy_internal network by service name, never
# via the host port. Encrypting MYSQL_ROOT_PASSWORD/DB_PASSWORD while this
# port stays open to the internet protects the value at rest, not the port
# authenticating with it. Remove as its own reviewable change (#402), after
# confirming nothing depends on host-level 3306 access -- don't assume the
# "TEMPORARY" comment means it's safe.
