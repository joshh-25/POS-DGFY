# =============================================================================
# MySQL port -- separate line item, not bundled into the env_file rewrite
# =============================================================================
#
# The live server publishes MySQL to the host:
#
#   mysql:
#     ports:
#       - "3306:3306" # TEMPORARY! remove once fixed
#
# This is not in this repo's docker-compose.yml and is not required by
# anything this cutover does -- dgfy-migration-runner and dgfy-api both reach
# mysql over the internal dgfy_internal network by service name, never via
# the host port. Encrypting MYSQL_ROOT_PASSWORD/DB_PASSWORD while this port
# stays open to the internet is a real gap: SOPS protects the value at rest,
# not a listening port using that value for auth. Remove the `ports:` block
# above as its own reviewable change (own commit, own line in the PR
# description) so it can be reverted independently if something unexpected
# turns out to depend on host-level 3306 access -- check for that dependency
# BEFORE removing, don't assume the "TEMPORARY" comment means it's safe.
