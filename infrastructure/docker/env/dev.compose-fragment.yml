# Cutover fragment for /opt/dgfy-dev/docker-compose.yml (PR #55: backend/
# service -> dgfy-api + dgfy-migration-runner).
#
# NOT a drop-in replacement, and NOT meant to be passed to `docker compose
# -f docker-compose.yml -f dev.compose-fragment.yml` -- /opt/dgfy-dev's
# compose file is hand-maintained, not a git checkout (see
# docs/deployment/2026-07-20-dgfy-ph-production-cutover-runbook.md). Apply
# by hand: DELETE the existing `backend:` service block below `redis:` and
# PASTE both services below in its place. `mysql:`, `redis:`, `frontend:`,
# and the top-level `networks:` block stay untouched.
#
# Captured from the live server 2026-08-10 (see plan Phase 0 dump) --
# reconcile again before applying if /opt/dgfy-dev/docker-compose.yml has
# changed since.
#
# --- Things this fragment deliberately does NOT change (verify, don't guess) ---
#
# 1. Network name: this server's compose defines `dgfy_dev` (NOT
#    `dgfy_internal`, the name used in the repo's own
#    infrastructure/docker/docker-compose.yml). Both services below join
#    dgfy_dev, matching every other service already in this file.
#
# 2. Host-port remap: infrastructure/nginx-host/dev.dgfy.ph.conf's `/api`
#    and `/uploads` locations proxy to `127.0.0.1:5000` (host nginx is a
#    SEPARATE process on this VM, not part of this compose file, and is
#    NOT being changed as part of this cutover). The container now listens
#    on 5100 internally (PORT: 5100 below) -- so the published port stays
#    "127.0.0.1:5000:5100", remapping host 5000 to container 5100. Do NOT
#    change this to "5100:5100": that breaks /api on dev (host nginx still
#    dials 5000) AND simultaneously brings the dormant api.dev.dgfy.ph vhost
#    (already configured, pointed at :5100, currently connection-refused)
#    live -- publicly exposing this API on a hostname nothing has ever
#    served. Confirmed dormant during Phase 0: `ss -ltnp` on this host shows
#    nothing on 5100/6100.
#
# 3. `DB_MAX_CONNECTIONS` / mysql `--max_connections`: this server's mysql
#    still runs at MySQL's implicit default (151), below the app's 170
#    worst-case budget (see docs/ops/DEV_STAGING_ENVIRONMENT_HEALTH_2026-08-08.md
#    Finding 3) -- a pre-existing gap, not something PR #55 introduces or
#    fixes. Deliberately left alone here to keep this cutover's diff to
#    exactly "rename backend -> dgfy-api/migration-runner"; raise it as a
#    separate, deliberate change (see that doc's Fix section) whenever you
#    want, before or after this cutover -- just not silently bundled into it.

services:
  # New service: the migration domain (migrations/, sequelize-cli), split
  # out of backend/ into apps/dgfy-migration-runner. dgfy-api below depends
  # on this completing successfully instead of migrating itself on boot.
  dgfy-migration-runner:
    image: ghcr.io/sieitzz/dgfy-platform/migration-runner:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DIALECT: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks: [dgfy_dev]

  # Replaces `backend:`. Same app, same .env, same everything else -- only
  # the image, service name, internal port (5000 -> 5100), and data-volume
  # paths (data/backend/* -> data/dgfy-api/*) change.
  dgfy-api:
    image: ghcr.io/sieitzz/dgfy-platform/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DIALECT: mysql
      REDIS_URL: redis://redis:6379
      PORT: 5100
    volumes:
      - ./data/dgfy-api/uploads:/app/uploads
      - ./data/dgfy-api/storage:/app/storage
      - ./data/dgfy-api/logs:/app/logs
    ports:
      - "127.0.0.1:5000:5100"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      dgfy-migration-runner:
        condition: service_completed_successfully
    networks: [dgfy_dev]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5100/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# --- Data move (run BEFORE `docker compose up`, while the stack is down) ---
#
#   cd /opt/dgfy-dev
#   docker compose down
#   mkdir -p data/dgfy-api
#   mv data/backend/uploads data/dgfy-api/uploads
#   mv data/backend/storage data/dgfy-api/storage
#   mv data/backend/logs    data/dgfy-api/logs
#   # data/dgfy-api/logs may already exist (empty, root-owned, leftover from
#   # the earlier ADR-0032 apps/dgfy-api attempt) -- `mv` into an existing
#   # empty dir works fine; verify it really is empty first if unsure.
#   docker compose config >/dev/null   # validates the hand-edited file
#   docker compose up -d --remove-orphans
