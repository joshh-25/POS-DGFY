# Catch-all for unmatched Host headers (mirrors the `return 404;` blocks
# certbot generated on the VPS for skupervisor.dgfy.ph / pos.dgfy.ph / dgfy.ph)
# and serves the container HEALTHCHECK, which hits http://localhost/nginx-health
# with a Host header that won't match any of the real vhosts.
server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 404;
    }
}
