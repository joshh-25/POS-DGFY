server {
    listen 80;
    server_name dgfy.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dgfy.ph store.dgfy.ph;
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/dgfy.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dgfy.ph/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin OpenFreeMap tile proxy. In the current PM2/vite-preview
    # production topology this is handled by Vite's own preview-server proxy
    # (frontend/apps/store/vite.config.js `preview.proxy`), not nginx —
    # replicated here since the Docker frontend container is static-only.
    location /openfreemap/ {
        resolver 127.0.0.11 valid=30s;
        # set must precede rewrite ... break — break halts all subsequent
        # rewrite-module directives in this location, including a later set.
        set $openfreemap_upstream tiles.openfreemap.org;
        rewrite ^/openfreemap/(.*)$ /$1 break;
        proxy_pass https://$openfreemap_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $openfreemap_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /tenant-store {
        return 301 /tenant-store/;
    }

    location /tenant-store/ {
        rewrite ^/tenant-store/(.*)$ /$1 break;
        proxy_pass http://frontend:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://frontend:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
