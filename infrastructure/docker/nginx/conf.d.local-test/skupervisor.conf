# Local-test only: port-based routing (no Host header / TLS needed), mirrors
# the old PM2 dev port for skupervisor. Overrides the production conf.d at
# runtime via a bind mount — see local-test/docker-compose.yml.
server {
    listen 5173;
    server_name _;
    client_max_body_size 8m;

    # Docker recreates backend/frontend on every rebuild, giving them a new
    # internal IP -- a bare proxy_pass resolves the hostname once per
    # worker and never again, so it silently 502s against the old IP after
    # any recreation. Routing through a variable forces re-resolution via
    # this resolver on each connection instead. See
    # infrastructure/docker/nginx/nginx.conf.template for the fuller
    # writeup (same fix applied there first).
    resolver 127.0.0.11 valid=10s;

    location /api {
        set $backend_upstream backend:5000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        set $backend_upstream backend:5000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin OpenFreeMap tile proxy — see nginx/conf.d/skupervisor.dgfy.ph.conf
    # for why this exists.
    location /openfreemap/ {
        resolver 127.0.0.11 valid=30s;
        # set must precede rewrite ... break — break halts all subsequent
        # rewrite-module directives in this location, including a later set.
        set $openfreemap_upstream tiles.openfreemap.org;
        rewrite ^/openfreemap/(.*)$ /$1 break;
        proxy_pass https://$openfreemap_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $openfreemap_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream frontend:8081;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
