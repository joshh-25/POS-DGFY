# Deploys already-pushed GHCR images to a running server over SSH.
#
# NOTE: this workflow gives GitHub Actions a production SSH private key,
# which docs/architecture/adr/0030-free-tier-signed-release-authorization.md
# (rules 1, 16, 18, 22) explicitly prohibits. See that ADR's "Amendment
# (2026-07-02)" section for the scoped decision that supersedes those rules
# for this specific image-based deployment path.
#
# `vpn_required: true` connects to a VPN via OpenVPN before the SSH steps run -- see that ADR's
# "Amendment (2026-07-06)" section for the scoped decision covering this VPN-gated variant. As of
# #598/#599, every registered self-hosted runner sits on the same internal LAN as the DEV/STAGING
# server (vm-sieitzstaging IS that server), so no caller needs this today -- it exists as a
# fallback for a GitHub-hosted runner, which would need it. See docs/ops/
# CI_RUNNER_MIGRATION_HANDOFF.md for the current topology and the switch-back procedure.
#
# Assumes infrastructure/docker/docker-compose.yml + a filled-in .env +
# nginx/ have already been copied to /opt/dgfy-platform on the target
# server (see that file's header comment) and, for a fresh server,
# ./nginx/init-letsencrypt.sh has been run once manually.
#
# PROD-ONLY SOPS PATH (ADR 0060, docs/ops/SOPS_SECRETS_CUTOVER_RUNBOOK.md):
# for inputs.environment == 'PROD' only, the final step below calls
# ./deploy-sops.sh instead of the inline pull+up sequence -- that server no
# longer keeps a blanket .env; deploy-sops.sh decrypts secrets/*.env,
# assembles the environment, runs the in-image pre-flight gate, and does
# `docker compose up -d --remove-orphans` itself. DEV/STAGING are UNCHANGED
# and keep the inline path below unconditionally -- this workflow is shared
# by all three environments (deploy.yml -> deployment-orchestrator.yml ->
# this file), and deploy-sops.sh / secrets/*.env / an age key exist on none of
# those boxes. The staleness guard stays exactly where it is, before any decrypt
# step -- it only inspects IMAGE_TAG.
#
# DO NOT MERGE THIS CHANGE until docs/ops/SOPS_SECRETS_CUTOVER_RUNBOOK.md's
# Phases 1-5 have actually run and verified on the PROD server --
# deploy-sops.sh and secrets/ must already exist there, or the next PROD
# deploy breaks. No new GitHub secret is required: the age key already
# lives on the server at /etc/dgfy/age/keys.txt, and the account CI deploys
# as (gha) is already in the docker group that can read it.
name: Publish Platform (SSH Deploy)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to resolve SSH_PRIVATE_KEY/SSH_TARGET secrets from
        required: true
        type: string
      vpn_required:
        description: Connect to a VPN (OVPN_CONFIG/OVPN_USERNAME/OVPN_PASSWORD secrets) before SSH-ing in -- only needed on a GitHub-hosted runner, see header comment
        required: false
        type: boolean
        default: false
      runner_labels_json:
        description: JSON array passed to runs-on for the publish job
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: Write OpenVPN config
        if: inputs.vpn_required
        env:
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
        run: |
          printf '%s\n' "$OVPN_CONFIG" > /tmp/client.ovpn

      - name: Install OpenVPN
        if: inputs.vpn_required
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Connect to VPN
        if: inputs.vpn_required
        uses: kota65535/github-openvpn-connect-action@v2
        with:
          config_file: /tmp/client.ovpn
          username: ${{ secrets.OVPN_USERNAME }}
          password: ${{ secrets.OVPN_PASSWORD }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SSH_TARGET#*@}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart platform containers
        env:
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_DIR: ${{ secrets.DOCKER_DIR }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          # Token is piped over the existing SSH stdin into `docker login
          # --password-stdin` on the remote -- never an argv or env var on
          # that host, so it can't leak via `ps aux` there.
          #
          # SENTRY_RELEASE (#633): the backend image is built
          # environment-agnostically (no build-args, unlike frontend's
          # `VITE_SENTRY_RELEASE` baked in at `docker build` time in
          # deploy-frontend.yml) -- its config is entirely runtime-.env-driven.
          # docker-compose.yml already declares `SENTRY_RELEASE: ${SENTRY_RELEASE:-}`
          # as a passthrough, but nothing ever set a value, so every backend
          # Sentry event carried release: null. Passing it as a shell env var
          # here (same mechanism already used for $DOCKER_DIR/$GITHUB_ACTOR)
          # fills that gap at the one point every environment's deploy goes
          # through. Note: the target server's own docker-compose.yml must
          # actually contain that passthrough line for this to take effect --
          # #401 documents PROD's copy is currently drifted and missing it.
          #
          # Staleness guard (PR #55): $DOCKER_DIR on the server is
          # hand-maintained, NOT a git checkout (see this file's header
          # comment) -- it does not pick up the compose-file service/image
          # rename from `backend` to `dgfy-api` + `dgfy-migration-runner`
          # just because this workflow merged. Without this check, a server
          # whose compose wasn't updated yet would `pull`/`up` cleanly
          # against the now-frozen `backend:<tag>` image while everything
          # else moves on -- a green deploy that silently leaves the API on
          # stale code. Fail loudly instead.
          #
          # `docker compose pull` retry (2026-08-14, #342): the server pulls
          # mysql:8.0/redis:7-alpine from docker.io ANONYMOUSLY (only GHCR
          # gets a login above), which is subject to Docker Hub's per-IP
          # anonymous pull limits and has intermittently timed out
          # authenticating. 3 attempts with growing backoff (15s, 45s)
          # before giving up. Deliberately only the pull is retried --
          # `docker compose up -d` runs once, since blindly repeating a
          # partial container restart is not safe. Durable fix is either a
          # Docker Hub account (new secret, not done here) or mirroring
          # mysql/redis into GHCR -- this retry is the no-new-secrets first
          # move, not the end state.
          # PROD_SOPS_PATH: only PROD calls deploy-sops.sh, which does its own
          # `docker compose pull` (image validated by the in-image pre-flight
          # gate) and `docker compose up -d --remove-orphans` internally --
          # so on that branch this step does not run those commands itself,
          # it delegates to the script. DEV/STAGING keep today's inline pull
          # (with its retry loop) + up unconditionally.
          PROD_SOPS_PATH=0
          if [ "${{ inputs.environment }}" = "PROD" ]; then PROD_SOPS_PATH=1; fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin && \
             cd $DOCKER_DIR && \
             COMPOSE_IMAGES=\$(docker compose config --images) && \
             { echo \"\$COMPOSE_IMAGES\" | grep -q 'sieitzz/dgfy-api' && echo \"\$COMPOSE_IMAGES\" | grep -q 'sieitzz/dgfy-migration-runner'; } || { echo \"::error::\$(pwd) compose has no dgfy-api/migration-runner image reference -- server compose is stale, refusing to deploy.\" >&2; exit 1; } && \
             if [ \"$PROD_SOPS_PATH\" = 1 ]; then \
               SENTRY_RELEASE=\"$SENTRY_RELEASE\" ./deploy-sops.sh && docker logout ghcr.io; \
             else \
               ok=0; for delay in 0 15 45; do [ \"\$delay\" -gt 0 ] && { echo \"::warning::docker compose pull failed, retrying in \${delay}s\" >&2; sleep \"\$delay\"; }; if docker compose pull; then ok=1; break; fi; done; [ \"\$ok\" = 1 ] || { echo \"::error::docker compose pull failed after 3 attempts\" >&2; exit 1; } && \
               SENTRY_RELEASE=\"$SENTRY_RELEASE\" docker compose up -d --remove-orphans && docker logout ghcr.io; \
             fi" \
            <<< "$GITHUB_TOKEN"

      # Hosted runners are ephemeral and threw these away for free. On a
      # persistent self-hosted runner (vm-sieitzstaging), a deploy key and
      # OpenVPN config written to disk would otherwise survive on a box that
      # also serves DEV/STAGING traffic -- clean up regardless of outcome.
      - name: Clean up deploy credentials
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key /tmp/client.ovpn
