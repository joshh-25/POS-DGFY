name: Configure CI artifact S3 lifecycle

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the managed 30-day CI artifact lifecycle rules"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  configure-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install AWS CLI v2 when unavailable
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1 && aws --version 2>&1 | grep -q '^aws-cli/2\.'; then
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) aws_arch="x86_64" ;;
            aarch64|arm64) aws_arch="aarch64" ;;
            *) echo "::error::Unsupported runner architecture for AWS CLI v2."; exit 1 ;;
          esac
          install_root="$RUNNER_TEMP/aws-cli-install"
          bin_dir="$RUNNER_TEMP/aws-cli-bin"
          mkdir -p "$install_root" "$bin_dir"
          curl --fail --silent --show-error \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            --output "$RUNNER_TEMP/awscliv2.zip"
          python3 - "$RUNNER_TEMP/awscliv2.zip" "$install_root" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          from zipfile import ZipFile

          archive_path = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          with ZipFile(archive_path) as archive:
              for member in archive.infolist():
                  target = (destination / member.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe path in AWS CLI installer archive: {member.filename}")
                  archive.extract(member, destination)
                  mode = (member.external_attr >> 16) & 0o777
                  if mode and stat.S_ISREG(member.external_attr >> 16):
                      os.chmod(target, mode)
          PY
          "$install_root/aws/install" --install-dir "$install_root/aws-cli" --bin-dir "$bin_dir" >/dev/null
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Apply and verify artifact lifecycle rules
        shell: bash
        env:
          ARTIFACT_S3_ACCESS_KEY_ID: ${{ vars.ARTIFACT_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_S3_ACCESS_KEY_SECRET }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
          ARTIFACT_S3_BUCKET: ${{ vars.ARTIFACT_S3_BUCKET }}
          ARTIFACT_S3_ENDPOINT: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          APPLY: ${{ inputs.apply || false }}
        run: |
          if [[ "$APPLY" == "true" ]]; then
            bash scripts/ci-s3-set-artifact-lifecycle.sh --apply
          else
            bash scripts/ci-s3-set-artifact-lifecycle.sh
          fi
