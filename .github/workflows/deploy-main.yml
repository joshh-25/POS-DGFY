  # Single SSH deploy that refreshes all four images on the server in one
  # `docker compose pull && up -d`. Runs unless any image build actually
  # failed or was cancelled - a `skipped` result (e.g. a build_* dispatch
  # that only left one box checked, guard-branch/resolve-build-plan failing
  # and skipping every job transitively, or #1610's build-skip plan
  # legitimately skipping every app) must still allow publish to proceed
  # with whichever images did build, matching deployment-orchestrator.yml's
  # publish gate.
  #
  # #1610: dropped the "at least one build actually succeeded" OR-clause the previous version of
  # this condition had. That clause could never be satisfied by a genuine "every app is skip-
  # eligible" dispatch (a true no-op re-dispatch, or an operator re-running purely to force a
  # compose restart) -- every build job would be 'skipped', none 'success', and publish would never
  # run at all, despite nothing being wrong. Gating directly on guard-branch's and
  # resolve-build-plan's own `result == 'success'` (added to `needs:` below) closes the ONLY other
  # way every build job could legitimately end up 'skipped' (a whole-job crash upstream, which
  # already transitively skips everything) -- so once both of those explicitly succeeded, the
  # remaining "every build job is skipped" case is always either an unchecked build_* input or a
  # verified-safe #1610 skip, never a silent failure.
  # #1977 (Phase 342): creates each app's bare `X.Y.Z` production floor alias from the
  # same digest as its `X.Y.Z-rN` revision tag (`scripts/promote-image-alias.js` -- refuses
  # an existing alias on a different digest or revision, creates only when absent or
  # already identical). Backend PROD is alias-only by construction here: the revision tag
  # is environment-neutral, so the resolve-build-plan job above already skipped rebuilding
  # it (content-equivalent to the STAGING candidate dispatch's own publish) and this job
  # aliases that reused staging digest -- never an environment-specific backend rebuild.
  # Frontend revision tags were just built above with production VITE_* values; the alias
  # pins the same digest under the floor. A direct production hotfix flows through this
  # same job (paired revision/canonical tags, no staging predecessor required).
  #
  # Skipped entirely when `release_revision` is empty (a legacy no-revision dispatch -- the
  # builders themselves fail closed on PROD without it, so any build actually attempted
  # already required it; a builds-unchecked dispatch keeps its historical no-alias behavior).
  promote-aliases:
    needs: [ guard-branch, resolve-build-plan, dgfy-api, dgfy-migration-runner, frontend-ims-prod, frontend-pos-prod, frontend-storefront-prod, frontend-opis-prod ]
    if: >-
      !cancelled() &&
      needs.guard-branch.result == 'success' &&
      needs.resolve-build-plan.result == 'success' &&
      needs.dgfy-api.result != 'failure' &&
      needs.dgfy-api.result != 'cancelled' &&
      needs.dgfy-migration-runner.result != 'failure' &&
      needs.dgfy-migration-runner.result != 'cancelled' &&
      needs.frontend-ims-prod.result != 'failure' &&
      needs.frontend-ims-prod.result != 'cancelled' &&
      needs.frontend-pos-prod.result != 'failure' &&
      needs.frontend-pos-prod.result != 'cancelled' &&
      needs.frontend-storefront-prod.result != 'failure' &&
      needs.frontend-storefront-prod.result != 'cancelled' &&
      needs.frontend-opis-prod.result != 'failure' &&
      needs.frontend-opis-prod.result != 'cancelled' &&
      (inputs.release_revision_api != '' || inputs.release_revision_migration_runner != '' || inputs.release_revision_frontend_ims != '' || inputs.release_revision_frontend_pos != '' || inputs.release_revision_frontend_storefront != '' || inputs.release_revision_frontend_opis != '')
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v4

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Promote revision tags to floor aliases
        shell: bash
        run: |
          set -euo pipefail
          FAILURES=0
          SKIPPED=0
          for APP in dgfy-api dgfy-migration-runner dgfy-ims dgfy-pos dgfy-storefront dgfy-opis; do
            # #2055 (Phase 346): each app aliases its OWN allocated revision -- an unchecked
            # app-group (empty input, nothing built) is skipped, never aliased blind.
            case "${APP}" in
              dgfy-api) APP_REVISION="${{ inputs.release_revision_api }}" ;;
              dgfy-migration-runner) APP_REVISION="${{ inputs.release_revision_migration_runner }}" ;;
              dgfy-ims) APP_REVISION="${{ inputs.release_revision_frontend_ims }}" ;;
              dgfy-pos) APP_REVISION="${{ inputs.release_revision_frontend_pos }}" ;;
              dgfy-storefront) APP_REVISION="${{ inputs.release_revision_frontend_storefront }}" ;;
              dgfy-opis) APP_REVISION="${{ inputs.release_revision_frontend_opis }}" ;;
            esac
            if [ -z "${APP_REVISION:-}" ]; then
              echo "[promote-aliases] ${APP}: no revision input for this app-group (unchecked build) -- skipping, not aliasing."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            FLOOR="$(node -p "require('./apps/${APP}/package.json').version")"
            RESOLVED="$(node scripts/resolve-release-tags.js --app "${APP}" --version "${FLOOR}" --environment PROD --revision "${APP_REVISION}")"
            SOURCE_TAG="$(node -p "JSON.parse(process.argv[1]).productionTag" "${RESOLVED}")"
            ALIAS_TAG="$(node -p "JSON.parse(process.argv[1]).canonicalAlias" "${RESOLVED}")"
            IMAGE="ghcr.io/sieitzz/${APP}"
            echo "[promote-aliases] ${APP}: ${SOURCE_TAG} -> ${ALIAS_TAG}"
            if ! node scripts/promote-image-alias.js --source "${IMAGE}:${SOURCE_TAG}" --target "${IMAGE}:${ALIAS_TAG}" --revision "${APP_REVISION}"; then
              echo "::error::floor-alias promotion failed for ${APP} -- refusing to deploy PROD with an unaliased revision tag."
              FAILURES=$((FAILURES + 1))
            fi
            # When backend images are skipped (content-equivalent), deploy-api.yml / deploy-migration-runner.yml
            # do not run and therefore the latest tag is not updated. Alias latest here so PROD compose
            # (${IMAGE_TAG:-latest}) pulls the current release:
            if [ "${APP}" = "dgfy-api" ] || [ "${APP}" = "dgfy-migration-runner" ]; then
              echo "[promote-aliases] ${APP}: ${SOURCE_TAG} -> latest"
              if ! docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${SOURCE_TAG}"; then
                echo "::error::latest-alias promotion failed for ${APP}"
                FAILURES=$((FAILURES + 1))
              fi
            fi
          done
          if [ "${FAILURES}" -ne 0 ]; then
            echo "::error::${FAILURES} floor-alias promotion(s) failed -- see errors above."
            exit 1
          fi
          echo "[promote-aliases] floor aliases verified (${SKIPPED} unchecked app(s) skipped)."

  publish:
    needs: [ guard-branch, resolve-build-plan, dgfy-api, dgfy-migration-runner, frontend-ims-prod, frontend-pos-prod, frontend-storefront-prod, frontend-opis-prod, promote-aliases ]
    if: >-
      inputs.deploy && !cancelled() &&
      needs.guard-branch.result == 'success' &&
      needs.resolve-build-plan.result == 'success' &&
      needs.dgfy-api.result != 'failure' &&
      needs.dgfy-api.result != 'cancelled' &&
      needs.dgfy-migration-runner.result != 'failure' &&
      needs.dgfy-migration-runner.result != 'cancelled' &&
      needs.frontend-ims-prod.result != 'failure' &&
      needs.frontend-ims-prod.result != 'cancelled' &&
      needs.frontend-pos-prod.result != 'failure' &&
      needs.frontend-pos-prod.result != 'cancelled' &&
      needs.frontend-storefront-prod.result != 'failure' &&
      needs.frontend-storefront-prod.result != 'cancelled' &&
      needs.frontend-opis-prod.result != 'failure' &&
      needs.frontend-opis-prod.result != 'cancelled' &&
      needs.promote-aliases.result != 'failure' &&
      needs.promote-aliases.result != 'cancelled'
    uses: ./.github/workflows/publish-platform.yml
    with:
      environment: PROD
      # No vpn_required change needed here: this job SSHes to secrets.SSH_TARGET
      # (PROD, public-internet Linode), not the DEV/STAGING LAN, so
      # publish-platform.yml's vpn_required default (false, L52) already applies to
      # both classes. A future hosted job added to this workflow that targets
      # DEV/STAGING would need vpn_required: true -- don't inherit this silence.
      # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
      # (ubuntu-latest) is the intended class for every production build/deploy job.
      # Flip in Phase 234 (live cutover) or as the logged fallback switch -- never silently.
      # Phase 234 Wave 3 (#1365, F-5): delegates to the file-level runner_labels_json
      # workflow_dispatch input above -- one flip point covers all 6 jobs; see that input's own
      # commented/active default: pair for the fallback-switch mechanism.
      runner_labels_json: ${{ inputs.runner_labels_json }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
