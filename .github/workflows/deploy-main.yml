  # Three frontend image builds (one per app, prod-only), run independently
  # in parallel -- no `needs` between them. issue #322 Phase 6 replaced the
  # single combined `frontend` image with one image per app; this workflow
  # originally chained all 6 jobs (3 apps x beta/prod, added 2026-08-14,
  # #427, after a real GHCR secondary-rate-limit 403 when two large pushes
  # ran in parallel -- see run 31728787346). The very next day, #433 found
  # and fixed the *actual* root cause: all three build workflows were also
  # pushing a second, full `mode=max` registry cache image to GHCR on every
  # build, roughly doubling push volume -- that duplication (not raw
  # parallel-push count) is what tripped the rate limit, and #433 removed it
  # from `deploy-frontend.yml`/`deploy-api.yml`/`deploy-migration-runner.yml`.
  # #433's PR also layered this `needs` serialization on top of that fix, as
  # a second, never-independently-re-justified safeguard. Beta retired
  # 2026-08-23 (#329/#895) halved the chain to 3 jobs but kept it serialized
  # at the time (see ADR 0071's Amendments), without re-checking either the
  # real root cause or current image sizes.
  #
  # Removed 2026-08-25 (#1041): DEV/STAGING's `deployment-orchestrator.yml`
  # has run these same three builds fully in parallel, no `needs` chain at
  # all, on every dispatch since the #322 frontend split, with no rate-limit
  # recurrence -- same registry, same runner pool, same-sized images PROD
  # pushes (~27-33 MB compressed each, confirmed against GHCR directly; a
  # modest size, not the "large" pre-split combined-image pushes #427's
  # incident described). Matches DEV/STAGING parity now. One bound worth
  # knowing: only 2 self-hosted runners exist (`vm-openproject`,
  # `vm-sieitzstaging`), so GitHub can still only run 2 of these 3 jobs at
  # once regardless -- the win here is a couple of minutes off the old
  # fully-serial chain, not a 3x speedup. If a GHCR rate limit does recur,
  # reverting this is a one-line `needs:` re-add per job below.
  frontend-ims-prod:
    needs: [ guard-branch, resolve-build-plan ]
