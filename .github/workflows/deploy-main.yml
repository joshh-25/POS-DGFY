name: Deploy Main (PROD)

# Renamed from "Build Images (main)"/build-main.yml 2026-08-14 as part of
# removing every auto-build/auto-deploy trigger repo-wide (see deploy.yml's
# header comment for the full rationale). No push trigger anymore -- dispatch
# this by hand from the Actions tab, with the branch selector left on `main`
# (this workflow file must exist on `main` to be dispatchable against it; it
# reaches there the normal way, by being promoted from develop -> staging ->
# main like any other change). #1050 (2026-08-25): that assumption was never
# actually enforced -- `gh workflow run` with no `--ref` dispatches against
# the repo's *default* branch (`develop`, not `main`), and nothing in this
# file checked `github.ref` before running. The `guard-branch` job below is
# the enforcement; see its comment.
on:
  workflow_dispatch:
    inputs:
      build_api:
        description: Build/push dgfy-api and dgfy-migration-runner (always paired -- see the dgfy-api job comment for why they're never split). Uncheck to skip.
        type: boolean
        default: true
      build_frontend_ims:
        description: Build/push the dgfy-ims image. Uncheck to skip.
        type: boolean
        default: true
      build_frontend_pos:
        description: Build/push the dgfy-pos image. Uncheck to skip.
        type: boolean
        default: true
      build_frontend_storefront:
        description: Build/push the dgfy-storefront image. Uncheck to skip.
        type: boolean
        default: true
      build_frontend_opis:
        description: Build/push the dgfy-opis image. Uncheck to skip.
        type: boolean
        default: true
      deploy:
        description: SSH-deploy to the server after images are pushed
        type: boolean
        default: true
      runner_labels_json:
        description: >-
          JSON array passed to runs-on for every build/publish job below. Phase 234 Wave 3
          (#1365) live cutover: hosted is the active default. Emergency fallback (F-5) --
          if hosted is unavailable, re-dispatch with this input set to
          '["sieitz-runner"]' instead of comment/uncommenting the 6 pair sites and pushing a
          commit to main. See docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md's Phase 234 entry.
        required: false
        type: string
        # default: '["ubuntu-latest"]'
        default: '["sieitz-runner"]'
      candidate_source_sha_api:
        description: >-
          ADR 0081 Decision 8 candidate source identity, PER APP (#1610 amendment; originally one
          shared value, #1588, epic #1548 Wave 4, Phase 279) -- covers BOTH dgfy-api and
          dgfy-migration-runner, since build_api above always rebuilds them as one paired unit (a
          repair that touches either always lists both in its manifest apps_touched, so they never
          actually diverge). Set this on the normal three-stage flow's release/<candidate_id> ->
          main dispatch, or the #1007-gated release/<label> -> main exception, to
          scripts/check-promotion-candidate.js's `resolveCandidateSourceShaByApp()` result for
          dgfy-api (NOT the manifest's raw current_staging_sha -- an app a repair never touched must
          keep its earlier identity, matching what its STAGING image actually carries). Leave empty
          for a main hotfix outside the ordinary promotion flow -- an empty value omits the
          org.dgfy-platform.candidate-source-sha OCI label entirely, which
          scripts/check-image-version-parity.js treats as expected evidence of a hotfix/#1007
          exception, not a defect. See .agents/skills/promoter/references/promotion-runbook.md.
        required: false
        type: string
        default: ''
      candidate_source_sha_frontend_ims:
        description: >-
          Same contract as candidate_source_sha_api above, resolved for dgfy-ims specifically (its
          own build_frontend_ims flag rebuilds it independently of the other two frontends).
        required: false
        type: string
        default: ''
      candidate_source_sha_frontend_pos:
        description: >-
          Same contract as candidate_source_sha_api above, resolved for dgfy-pos specifically (its
          own build_frontend_pos flag rebuilds it independently of the other two frontends).
        required: false
        type: string
        default: ''
      candidate_source_sha_frontend_storefront:
        description: >-
          Same contract as candidate_source_sha_api above, resolved for dgfy-storefront specifically
          (its own build_frontend_storefront flag rebuilds it independently of the other
          frontends).
        required: false
        type: string
        default: ''
      candidate_source_sha_frontend_opis:
        description: Same candidate source identity contract as the other frontend apps, for dgfy-opis.
        required: false
        type: string
        default: ''
      release_revision_api:
        description: >-
          Per-app artifact revision for dgfy-api (#2055, Phase 346 -- its own allocated rN,
          e.g. "r16"). Required when dgfy-api is selected for a release/<candidate_id> -> main
          promotion dispatch AND for a
          direct production hotfix (which uses the same paired revision/canonical tags without
          a staging parity predecessor): every PROD builder resolves its revision tag from its
          app-group's value (frontend X.Y.Z-rN with production VITE_* values, backend the
          environment-neutral X.Y.Z-rN -- backend PROD reuses the staging digest, it is never
          rebuilt environment-specific) and fails closed without it. The promote-aliases job
          below then creates each app's bare X.Y.Z floor alias from the same digest via
          scripts/promote-image-alias.js. See .agents/skills/promoter/references/promotion-runbook.md.
        required: false
        type: string
        default: ''
      release_revision_migration_runner:
        description: >-
          Independent per-app artifact revision for dgfy-migration-runner. It shares the
          build_api checkbox with dgfy-api but retains its own immutable image history. Required
          when selected for a release/<candidate_id> -> main promotion or direct production hotfix.
        required: false
        type: string
        default: ''
      release_revision_frontend_ims:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-ims specifically
          (frontend X.Y.Z-rN with production VITE_* values). Promotion and direct-hotfix
          dispatch only.
        required: false
        type: string
        default: ''
      release_revision_frontend_pos:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-pos specifically
          (frontend X.Y.Z-rN with production VITE_* values). Promotion and direct-hotfix
          dispatch only.
        required: false
        type: string
        default: ''
      release_revision_frontend_storefront:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-storefront
          specifically (frontend X.Y.Z-rN with production VITE_* values). Promotion and
          direct-hotfix dispatch only.
        required: false
        type: string
        default: ''
      release_revision_frontend_opis:
        description: Same per-app revision contract as the other frontend apps, for dgfy-opis.
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# PROD-ONLY (2026-08-23, #329/#895): beta.dgfy.ph retired -- nginx now
# redirects every *.beta.dgfy.ph host straight to its *.dgfy.ph equivalent
# (#894/#896), so the `dgfy-{ims,pos,storefront}-beta` images/containers this
# workflow used to build and deploy no longer have anything to serve.
# Dispatching this with every build_* box left checked (the default) now
# builds and deploys four frontend images, prod-only (dgfy-opis added by issue #2052):
#
#   * dgfy-ims:latest / dgfy-pos:latest / dgfy-storefront:latest / dgfy-opis:latest
#                         -- built against the PROD GitHub Environment's
#                         VITE_* (dgfy.ph auth/handoff URLs). Served by the
#                         `dgfy-{ims,pos,storefront,opis}` containers -> the
#                         *.dgfy.ph production domains AND, via the nginx
#                         redirect, every *.beta.dgfy.ph request too.
#   * api / migration-runner -- built ONCE (from apps/dgfy-api, plus a paired
#                         migration-runner image). Both jobs now build against
#                         the PROD GitHub Environment -- this was already a
#                         functional no-op even under the old dual-deploy
#                         setup (deploy-api.yml reads no `vars.*`, only
#                         `secrets.GITHUB_TOKEN`) since flipping it just
#                         retires the now-meaningless BETA distinction for
#                         these two jobs. The image TAG itself was renamed
#                         off `beta` to `latest` below (#913) -- this comment
#                         is about the `environment:` input, a separate thing
#                         from the tag.
#
# `image_tags: "latest"` (#913, 2026-08-25): the shared backend was tagged
# `beta` from the retired beta/prod split, a name that outlived its own
# meaning once #329/#895/#896 retired beta.dgfy.ph. Renamed here alongside
# the frontend-split cutover's own coordinated server restart (docs/
# deployment/2026-08-23-frontend-split-cutover-runbook.md), rather than as a
# separate downtime window -- the server's `.env` `IMAGE_TAG=beta` -> `latest`
# edit lands in that same `docker compose up -d`, not on its own (that server
# edit + restart is #913's remaining, human-only scope as of this comment).
#
# After all five images are pushed, a SINGLE publish job SSH-deploys once
# (docker compose pull && up -d against the server's own compose), which
# refreshes all four frontend containers and backend:latest in one go. The
# deploy is resolved from the PROD Environment's SSH secrets (validated in
# the 2026-07-20 cutover).
#
# NOTE (shared api, no gate): a build_api dispatch restarts the shared
# dgfy-api (+ dgfy-migration-runner), with no approval gate beyond whoever
# has dispatch access. This is unchanged from the dual-deploy window.

jobs:
  # #1050: hard branch guard, ahead of every build/publish job below. This
  # workflow is PROD-only and has no legitimate reason to ever act on
  # anything but `main` -- deploy.yml already covers DEV/STAGING. Failing
  # here, not "remembering to pass --ref main", is the actual fix: on
  # 2026-08-25 a dispatch with no --ref silently ran against the repo's
  # *default* branch (`develop`), and PROD ran unreviewed, unpromoted code
  # for ~30 minutes before anyone noticed via head_sha inspection.
  # Phase 233 (#1365) anchor exception, deliberate, not an omission: this job
  # stays self-hosted permanently, with no commented hosted alternate. It is a
  # ~1-minute control-plane job (routing it hosted buys nothing and costs
  # minutes), and it is the always-available anchor the Phase 233 Wave 2
  # in-workflow runner preflight hooks into -- a preflight that itself ran on
  # the class it is checking would be a chicken-and-egg (if hosted is
  # unavailable, a hosted preflight job never starts). See
  # docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md's Phase 233 entry.
  guard-branch:
    runs-on: ['sieitz-runner']  # #923: generic, either box
    # Raised from 1 to 5 (Phase 233, #1365, Wave 2 R-2): the runner-preflight step below makes its
    # own network calls (gh api / curl) on top of the branch-ref check, which would trip a
    # 1-minute timeout on a slow API response.
    timeout-minutes: 5
    steps:
      - name: Refuse to run against anything but main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::deploy-main.yml was dispatched against '${{ github.ref }}', not refs/heads/main. This workflow is PROD-only -- use deploy.yml for develop/staging. Re-dispatch with the branch selector (or --ref) set to main."
            exit 1
          fi
          echo "OK: dispatched against refs/heads/main."

      # Phase 233 (#1365), Wave 2 H2 / Phase 234 Wave 3 (live cutover): runs the same pre-dispatch
      # preflight scripts/ci-runner-preflight.js exposes to `promoter` (H1). Probes --class both
      # (F-4), not a single class: the active class is self-hosted again as of 2026-09-10's revert
      # (#1810), but single-class probing can never produce the informative mixed-state exit code
      # once both classes are legitimately in play (activeRouting is derived from the file itself,
      # not passed here).
      # guard-branch is the deliberate anchor for this (Wave 1 Sec 1.4): it always runs, and every
      # downstream job carries `needs: guard-branch`, so a failure here stops the whole dispatch
      # before any build starts -- "hosted-runner unavailability fails clearly and permits only the
      # documented, logged fallback strategy" (#1365's own acceptance criterion). This step does
      # NOT flip any routing value itself, on any exit code -- it only reports.
      #
      # Plain full checkout, not sparse (#1528, 2026-09-03): a sparse checkout here was the sole
      # sparse-checkout site in this repo's entire workflow set, and self-hosted runners persist
      # their `_work` directory across every job that lands there -- not just this workflow's own.
      # A later, unrelated job (any PR's build-check, on either shared self-hosted box) landing on
      # the same runner after this step ran repeatedly inherited a half-checked-out tree, breaking
      # unrelated PRs' CI (confirmed twice same-day against PR #1536). The perf saving sparse
      # bought here (a ~1-5 minute control-plane job avoiding a full clone) isn't worth poisoning
      # the shared runner pool for every other job on the repo. This job also keeps its own
      # workspace-hygiene guard below (belt and braces, since it's the historical source of the
      # poisoning): even a well-intentioned future sparse-checkout re-add here would still be
      # caught pre-checkout rather than corrupting the shared workspace again.
      #
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - name: Checkout for runner preflight
        uses: actions/checkout@v4

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Runner availability preflight
        id: runner_preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-runner-preflight.js --target-sha "${{ github.sha }}" --class both >> "$GITHUB_STEP_SUMMARY" || {
            status=$?
            if [ "$status" -eq 3 ]; then
              echo "::error::Runner preflight says a documented flip is required -- see the step summary above and comment/uncomment the alternate lines in deploy-main.yml (docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md). This job intentionally fails rather than silently degrading."
            else
              echo "::error::Runner preflight could not confirm the active class is available -- see the step summary above."
            fi
            exit 1
          }

  # #1610: resolves, per app, whether this dispatch's build can be safely SKIPPED -- the tag is
  # already published under the current revision (idempotent re-dispatch) or under a different
  # revision whose tracked build inputs are content-identical to what's being rebuilt now. This is
  # what stops a retry after a partial failure from re-tripping ADR 0081 Decision 7's tag-
  # immutability guard for every app that already succeeded (#1610's own reported incident -- every
  # retry re-rebuilt, and re-refused, apps that had nothing left to do). Decision 7's guard itself
  # (scripts/check-tag-immutability.js) is completely unmodified and still runs, unconditionally, in
  # every build job that actually executes below -- this job only decides whether an attempt is made
  # at all. Full four-outcome table and the fail-closed reasoning: scripts/resolve-build-skip-plan.js's
  # own header comment.
  #
  # Fail-closed asymmetry, deliberate (see the script's header for the full argument): a per-app
  # indeterminate read (registry unreachable, unreadable/disagreeing label, an undiffable revision)
  # degrades to BUILD for that one app -- resolve-build-skip-plan.js never throws for that case, it
  # folds it into the plan as `should_build_<app>=true`. Only a genuine CRASH of this job (a bug in
  # the script itself, not a per-app read) is allowed to halt the whole dispatch: every downstream
  # build job below requires `needs.resolve-build-plan.result == 'success'` in its own `if:`, so a
  # job failure here transitively skips every build, the same way a `guard-branch` failure already
  # does today.
  #
  # fetch-depth: 0 is required, not optional -- the content-equivalence diff below needs to reach an
  # arbitrary, dynamically-discovered "already published" revision, which the default shallow
  # (depth-1) checkout every other job in this file uses would not contain locally. Workspace-
  # hygiene v1 steps are duplicated here byte-for-byte, same as every other job in this file (see
  # guard-branch's own comment on why this is deliberately inline and duplicated rather than shared).
  resolve-build-plan:
    needs: guard-branch
    if: needs.guard-branch.result == 'success'
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 10
    outputs:
      should_build_dgfy_api: ${{ steps.resolve.outputs.should_build_dgfy_api }}
      should_build_dgfy_migration_runner: ${{ steps.resolve.outputs.should_build_dgfy_migration_runner }}
      should_build_dgfy_ims: ${{ steps.resolve.outputs.should_build_dgfy_ims }}
      should_build_dgfy_pos: ${{ steps.resolve.outputs.should_build_dgfy_pos }}
      should_build_dgfy_storefront: ${{ steps.resolve.outputs.should_build_dgfy_storefront }}
      should_build_dgfy_opis: ${{ steps.resolve.outputs.should_build_dgfy_opis }}
    steps:
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # #1716: this job went straight from checkout to running resolve-build-skip-plan.js with no
      # install step at all -- that script requires check-app-version-bump.js, which in turn
      # requires resolve-web-core-reachability.js's `madge` (#1704/#1708), a devDependency never
      # installed here. Full `npm ci` (not --omit=dev) since madge is itself a devDependency this
      # step needs at runtime. Mirrors promotion-quality-gate.yml's own root-level
      # "Setup Node.js"/"Install repository dependencies" pattern.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Resolve build-skip plan
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # #1977 (Phase 342); #2055 (Phase 346): --release-revisions-json makes the skip
          # check hit each selected app's own revision-aware matrix tag. An omitted entry in a
          # modern map is unselected; explicit --release-revision callers retain legacy fallback.
          # Backend PROD on a promotion dispatch is the mechanism that actually skips the
          # environment-specific rebuild: the revision tag already exists from the STAGING
          # candidate dispatch with byte-identical tracked inputs, so the plan resolves
          # content-equivalent/skip and the promote-aliases job below aliases the reused
          # staging digest instead of rebuilding it.
          SKIP_ARGS=(--revision "${{ github.sha }}" --environment PROD)
          API_SELECTED=false
          MIGRATION_SELECTED=false
          [ -z "${API_R//[[:space:]]/}" ] || API_SELECTED=true
          [ -z "${MIGRATION_R//[[:space:]]/}" ] || MIGRATION_SELECTED=true
          if [ "${API_SELECTED}" != "${MIGRATION_SELECTED}" ]; then
            echo "::error::PROD dispatch must select dgfy-api and dgfy-migration-runner artifact revisions together or omit both."
            exit 1
          fi
          REVISIONS_JSON="$(node -e "const m={};const put=(k,v)=>{if(v&&String(v).trim())m[k]=String(v).trim();};put('dgfy-api',process.env.API_R);put('dgfy-migration-runner',process.env.MIGRATION_R);put('dgfy-ims',process.env.IMS_R);put('dgfy-pos',process.env.POS_R);put('dgfy-storefront',process.env.STOREFRONT_R);put('dgfy-opis',process.env.OPIS_R);console.log(JSON.stringify(m))")"
          if [ "${REVISIONS_JSON}" != "{}" ]; then
            SKIP_ARGS+=(--release-revisions-json "${REVISIONS_JSON}")
          fi
          node scripts/resolve-build-skip-plan.js "${SKIP_ARGS[@]}"
        env:
          API_R: ${{ inputs.release_revision_api }}
          MIGRATION_R: ${{ inputs.release_revision_migration_runner }}
          IMS_R: ${{ inputs.release_revision_frontend_ims }}
          POS_R: ${{ inputs.release_revision_frontend_pos }}
          STOREFRONT_R: ${{ inputs.release_revision_frontend_storefront }}
          OPIS_R: ${{ inputs.release_revision_frontend_opis }}

  # Shared dgfy-api image (environment-agnostic; built once, tagged latest
  # to match deploy-api.yml's/deploy-migration-runner.yml's image_tags
  # input below -- see #913 for why this was renamed off beta). The
  # server's own .env IMAGE_TAG rename is separate, human-only scope
  # (also #913). backend = api + migration-runner
  # together, never separately -- see deploy.yml's comment on the same
  # coupling (compose's depends_on: service_completed_successfully means a
  # mismatched pair is a schema/code mismatch waiting to happen).
  #
  # #1610: build_api stays ONE shared checkbox gating both this job and dgfy-migration-runner's
  # eligibility to run at all, but each job ANDs it with its OWN independently-resolved skip verdict
  # -- these are genuinely separate images with genuinely separate package.json versions, and one
  # can be skip-eligible while the other isn't (e.g. dgfy-api's code changed with no new migration).
  # Nothing about deploy-order or the server's compose depends_on requires their CI build cycles to
  # march in lockstep -- only their human-facing dispatch checkbox stays coupled.
  dgfy-api:
    needs: [ guard-branch, resolve-build-plan ]
    if: >-
      needs.guard-branch.result == 'success' && needs.resolve-build-plan.result == 'success' &&
      inputs.build_api && needs.resolve-build-plan.outputs.should_build_dgfy_api == 'true'
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: PROD
      image_tags: "latest"
      candidate_source_sha: ${{ inputs.candidate_source_sha_api }}
      release_revision: ${{ inputs.release_revision_api }}
      # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
