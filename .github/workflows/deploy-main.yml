name: Deploy Main (PROD)

# Renamed from "Build Images (main)"/build-main.yml 2026-08-14 as part of
# removing every auto-build/auto-deploy trigger repo-wide (see deploy.yml's
# header comment for the full rationale). No push trigger anymore -- dispatch
# this by hand from the Actions tab, with the branch selector left on `main`
# (this workflow file must exist on `main` to be dispatchable against it; it
# reaches there the normal way, by being promoted from develop -> staging ->
# main like any other change).
on:
  workflow_dispatch:
    inputs:
      components:
        description: Which images to build. backend = api + migration-runner together (see deploy.yml for why they're never split).
        type: choice
        options:
          - all
          - backend
          - frontend
        default: all
      deploy:
        description: SSH-deploy to the server after images are pushed
        type: boolean
        default: true

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# PROD-ONLY (2026-08-23, #329/#895): beta.dgfy.ph retired -- nginx now
# redirects every *.beta.dgfy.ph host straight to its *.dgfy.ph equivalent
# (#894/#896), so the `frontend-beta` image/container this workflow used to
# build and deploy no longer has anything to serve. Dispatching this with
# components:all (the default) now builds and deploys a single frontend:
#
#   * frontend:latest  -- built against the PROD GitHub Environment's VITE_*
#                         (dgfy.ph auth/handoff URLs). Served by the
#                         `frontend` container -> the *.dgfy.ph production
#                         domains AND, via the nginx redirect, every
#                         *.beta.dgfy.ph request too.
#   * api / migration-runner -- built ONCE (from apps/dgfy-api, plus a paired
#                         migration-runner image). Both jobs now build against
#                         the PROD GitHub Environment -- this was already a
#                         functional no-op even under the old dual-deploy
#                         setup (deploy-api.yml reads no `vars.*`, only
#                         `secrets.GITHUB_TOKEN`) since flipping it just
#                         retires the now-meaningless BETA distinction for
#                         these two jobs. The image TAG stays `beta` for now
#                         (see below) -- this comment is about the
#                         `environment:` input, a separate thing from the tag.
#
# `image_tags: "beta"` is kept deliberately, NOT renamed here: the server's
# .env still sets `IMAGE_TAG=beta`, and renaming it needs a coordinated
# server .env edit + api/migration-runner restart -- exactly the downtime
# this cutover was designed to avoid. Tracked as its own follow-up (#329
# Phase G), not part of this cleanup.
#
# After the image(s) are pushed, a SINGLE publish job SSH-deploys once
# (docker compose pull && up -d against the server's own compose), which
# refreshes frontend:latest and backend:beta in one go. The deploy is
# resolved from the PROD Environment's SSH secrets (validated in the
# 2026-07-20 cutover).
#
# NOTE (shared api, no gate): a components:all/backend dispatch restarts the
# shared dgfy-api (+ dgfy-migration-runner), with no approval gate beyond
# whoever has dispatch access. This is unchanged from the dual-deploy window.

jobs:
  # Shared dgfy-api image (environment-agnostic; built once, tagged beta to
  # match the server's IMAGE_TAG=beta). backend = api + migration-runner
  # together, never separately -- see deploy.yml's comment on the same
  # coupling (compose's depends_on: service_completed_successfully means a
  # mismatched pair is a schema/code mismatch waiting to happen).
  dgfy-api:
    if: inputs.components == 'all' || inputs.components == 'backend'
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: PROD
      image_tags: "beta"
      # GHA billing exhausted -- running on self-hosted (vm-sieitzstaging).
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Paired one-shot migration image dgfy-api depends on at compose-up.
  dgfy-migration-runner:
    if: inputs.components == 'all' || inputs.components == 'backend'
    uses: ./.github/workflows/deploy-migration-runner.yml
    with:
      environment: PROD
      image_tags: "beta"
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Prod frontend image (dgfy.ph VITE_* baked in). Now the only frontend this
  # workflow builds -- frontend-beta was removed 2026-08-23 (#329/#895), and
  # with it the #427 serialization that used to make this job `needs:
  # frontend-beta` (a beta build failure can no longer block the prod
  # deploy).
  frontend-prod:
    if: inputs.components == 'all' || inputs.components == 'frontend'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: PROD
      image_tags: "latest"
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Single SSH deploy that refreshes all images on the server in one
  # `docker compose pull && up -d`. Runs unless any image build actually
  # failed or was cancelled - a `skipped` result (e.g. once a changed-paths
  # gate is added here) must still allow publish to proceed with whichever
  # images did build, matching deployment-orchestrator.yml's publish gate.
  publish:
    needs: [ dgfy-api, dgfy-migration-runner, frontend-prod ]
    if: >-
      inputs.deploy && !cancelled() &&
      needs.dgfy-api.result != 'failure' &&
      needs.dgfy-migration-runner.result != 'failure' &&
      needs.frontend-prod.result != 'failure' &&
      (needs.dgfy-api.result == 'success' || needs.dgfy-migration-runner.result == 'success' || needs.frontend-prod.result == 'success')
    uses: ./.github/workflows/publish-platform.yml
    with:
      environment: PROD
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: read
