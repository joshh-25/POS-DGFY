      candidate_source_sha: ${{ inputs.candidate_source_sha_frontend_storefront }}
      release_revision: ${{ inputs.release_revision_frontend_storefront }}
      # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
