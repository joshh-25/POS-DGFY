name: Deploy Main (BETA + PROD dual-deploy)

# Renamed from "Build Images (main)"/build-main.yml 2026-08-14 as part of
# removing every auto-build/auto-deploy trigger repo-wide (see deploy.yml's
# header comment for the full rationale). No push trigger anymore -- dispatch
# this by hand from the Actions tab, with the branch selector left on `main`
# (this workflow file must exist on `main` to be dispatchable against it; it
# reaches there the normal way, by being promoted from develop -> staging ->
# main like any other change).
on:
  workflow_dispatch:
    inputs:
      components:
        description: Which images to build. backend = api + migration-runner together (see deploy.yml for why they're never split).
        type: choice
        options:
          - all
          - backend
          - frontend
        default: all
      deploy:
        description: SSH-deploy to the server after images are pushed
        type: boolean
        default: true

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# DUAL-DEPLOY (2026-07-20): dgfy.ph went live in production alongside
# beta.dgfy.ph, both domain groups sharing ONE backend/MySQL/Redis on the same
# server. Dispatching this with components:all (the default) builds BOTH
# frontends and deploys them together:
#
#   * frontend:beta    -- built against the BETA GitHub Environment's VITE_*
#                         (beta.dgfy.ph auth/handoff URLs). Served by the
#                         `frontend-beta` container -> *.beta.dgfy.ph.
#   * frontend:latest  -- built against the PROD GitHub Environment's VITE_*
#                         (dgfy.ph auth/handoff URLs). Served by the `frontend`
#                         container -> the *.dgfy.ph production domains.
#   * api:beta         -- built ONCE and shared (from apps/dgfy-api, plus a
#                         paired migration-runner:beta image). The api image
#                         is environment-agnostic (deploy-api.yml passes no
#                         per-env build args; its runtime config is the
#                         server's hand-maintained .env), so there is no
#                         separate prod api build.
#
# After all three images are pushed, a SINGLE publish job SSH-deploys once
# (docker compose pull && up -d against the server's own compose), which
# refreshes frontend-beta:beta, frontend:latest and backend:beta in one go.
# The deploy is resolved from the PROD Environment's SSH secrets (validated in
# the 2026-07-20 cutover); BETA and PROD carry the same deploy secrets since it
# is one server.
#
# NOTE (shared api, no gate): a components:all/backend dispatch restarts the
# shared dgfy-api (+ dgfy-migration-runner) that BOTH beta and prod now
# depend on, with no approval gate beyond whoever has dispatch access. This
# is the accepted interim behaviour for the dual-deploy window.
#
# Future cleanup (Option B, out of scope here): make PROD the sole deploy
# owner and reduce BETA to frontend-only vars. See the cutover runbook:
# docs/deployment/2026-07-20-dgfy-ph-production-cutover-runbook.md

jobs:
  # Shared dgfy-api image (environment-agnostic; built once, tagged beta to
  # match the server's IMAGE_TAG=beta). backend = api + migration-runner
  # together, never separately -- see deploy.yml's comment on the same
  # coupling (compose's depends_on: service_completed_successfully means a
  # mismatched pair is a schema/code mismatch waiting to happen).
  dgfy-api:
    if: inputs.components == 'all' || inputs.components == 'backend'
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: BETA
      image_tags: "beta"
      # GHA billing exhausted -- running on self-hosted (vm-sieitzstaging).
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Paired one-shot migration image dgfy-api depends on at compose-up.
  dgfy-migration-runner:
    if: inputs.components == 'all' || inputs.components == 'backend'
    uses: ./.github/workflows/deploy-migration-runner.yml
    with:
      environment: BETA
      image_tags: "beta"
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Beta frontend image (beta.dgfy.ph VITE_* baked in).
  frontend-beta:
    if: inputs.components == 'all' || inputs.components == 'frontend'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: BETA
      image_tags: "beta"
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Prod frontend image (dgfy.ph VITE_* baked in).
  #
  # `needs: frontend-beta` added 2026-08-14 (#427): this job and
  # frontend-beta both push a large image to GHCR, and running them in
  # parallel is what tripped GHCR's secondary rate limit in run
  # 31728787346 (frontend-prod's push got a 403 mid-deploy while
  # frontend-beta, started slightly earlier, succeeded). Serializing them
  # costs ~4-5 extra minutes of wall-clock on this workflow only.
  #
  # Side effect worth knowing: `needs` on a job whose `if:` does not
  # reference success()/always()/failure()/cancelled() keeps GitHub's
  # default implicit gate -- frontend-prod now only runs if frontend-beta
  # actually succeeded, where before they were independent attempts. If
  # frontend-beta fails, frontend-prod is skipped (not attempted), and the
  # publish job below correctly refuses to deploy either -- its `if`
  # requires BOTH frontend-beta.result != 'failure' AND
  # frontend-prod.result != 'failure', so a beta failure blocks prod's
  # deploy too even though frontend-prod itself never ran.
  frontend-prod:
    needs: frontend-beta
    if: inputs.components == 'all' || inputs.components == 'frontend'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: PROD
      image_tags: "latest"
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Single SSH deploy that refreshes all three images on the server in one
  # `docker compose pull && up -d`. Runs unless any image build actually
  # failed or was cancelled - a `skipped` result (e.g. once a changed-paths
  # gate is added here) must still allow publish to proceed with whichever
  # images did build, matching deployment-orchestrator.yml's publish gate.
  publish:
    needs: [ dgfy-api, dgfy-migration-runner, frontend-beta, frontend-prod ]
    if: >-
      inputs.deploy && !cancelled() &&
      needs.dgfy-api.result != 'failure' &&
      needs.dgfy-migration-runner.result != 'failure' &&
      needs.frontend-beta.result != 'failure' &&
      needs.frontend-prod.result != 'failure' &&
      (needs.dgfy-api.result == 'success' || needs.dgfy-migration-runner.result == 'success' || needs.frontend-beta.result == 'success' || needs.frontend-prod.result == 'success')
    uses: ./.github/workflows/publish-platform.yml
    with:
      environment: PROD
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: read
