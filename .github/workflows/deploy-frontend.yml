name: Deploy Frontend Image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tags:
        description: Comma-separated branch tags, e.g. "latest,beta"
        required: true
        type: string
      runner_labels_json:
        description: JSON array passed to runs-on for this build job
        required: false
        type: string
        default: '["self-hosted", "sieitz-runner"]'  # #923: generic, either box
    outputs:
      sha_tag:
        value: ${{ jobs.build-and-push.outputs.sha_tag }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sieitzz/dgfy-platform/frontend

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            IFS=',' read -ra TAG_ARR <<< "${{ inputs.image_tags }}"
            for t in "${TAG_ARR[@]}"; do echo "${IMAGE_NAME}:${t}"; done
            echo "${IMAGE_NAME}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ephemeral runners get a fresh builder every run, so the layer cache has
      # to travel through the GitHub Actions cache instead of living on a
      # retained local builder (that only worked on the old persistent
      # self-hosted runners; see git history for that approach). This is the
      # canonical `frontend` cache scope -- deploy-frontend.yml is the only
      # writer, so PR builds (pr-frontend-build-checks.yml) read from it via
      # cache-from without ever writing back to it.
      - uses: docker/setup-buildx-action@v3

      # Single image builds all 3 SPAs (skupervisor/pos/storefront) via
      # `npm run build:all` -- one nginx serves them on 3 internal ports.
      # VITE_API_BASE_URL/VITE_ASSET_BASE_URL are deliberately NOT set here:
      # this one image serves 3 different public hostnames, and both fall
      # back cleanly to relative/same-origin behavior when unset (see
      # frontend/src/utils/runtimeConfig.js resolveApiBaseUrl/
      # resolveAssetOrigin).
      #
      # VITE_DGFY_AUTH_URL/VITE_SKUPERVISOR_REGISTRATION_URL/
      # VITE_DGFY_RESET_URL/VITE_SKUPERVISOR_BASE_URL/
      # VITE_STOREFRONT_ACCOUNT_URL are NOT strictly required for
      # correctness -- businessRegistrationUrl.js and skupervisorHandoff.js
      # already derive the right cross-app URL from window.location.origin
      # at runtime when these are unset, which is what makes one shared
      # image serve multiple domains (beta.dgfy.ph, eventually dgfy.ph)
      # correctly without a rebuild. Set explicitly anyway as a deliberate
      # belt-and-suspenders layer, independent of that runtime heuristic.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Registry cache (type=registry) removed 2026-08-14 (#427) -- it
          # was added in #415 as "reachable from either runner type," a
          # reason that stopped applying once #386 recorded self-hosted as
          # the only CI tier (type=gha is already reachable from
          # self-hosted). It was actively harmful for this job specifically:
          # this workflow is called once per environment (DEV/STAGING/BETA/
          # PROD) with ~37 differing VITE_* build-args each time, but writes
          # ONE registry ref (${{ env.IMAGE_NAME }}:buildcache) shared by all
          # four -- each environment's build evicted the previous one's
          # cache, so it was rarely a hit (see #428). It also doubled this
          # job's GHCR push volume on every build, which is what actually
          # tripped GHCR's secondary rate limit in run 31728787346
          # (deploy-main.yml's frontend-prod, 2026-08-13). type=gha,scope=
          # frontend is unaffected and stays as the only cache.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_STORE_BASE_PATH=${{ vars.VITE_STORE_BASE_PATH }}
            VITE_TENANT_STORE_BASE_PATH=${{ vars.VITE_TENANT_STORE_BASE_PATH }}
            VITE_ROOT_TENANT_SLUGS=${{ vars.VITE_ROOT_TENANT_SLUGS }}
            VITE_PAYMENTS_ENABLED=${{ vars.VITE_PAYMENTS_ENABLED }}
            VITE_STOREFRONT_SANDBOX_QRPH_ENABLED=${{ vars.VITE_STOREFRONT_SANDBOX_QRPH_ENABLED }}
            VITE_MENU_PDF_IMPORT_ENABLED=${{ vars.VITE_MENU_PDF_IMPORT_ENABLED }}
            VITE_MENU_IMPORT_BATCH_ENABLED=${{ vars.VITE_MENU_IMPORT_BATCH_ENABLED }}
            VITE_BUILD_STAMP=${{ github.sha }}
            VITE_DGFY_AUTH_URL=${{ vars.VITE_DGFY_AUTH_URL }}
            VITE_SKUPERVISOR_REGISTRATION_URL=${{ vars.VITE_SKUPERVISOR_REGISTRATION_URL }}
            VITE_DGFY_RESET_URL=${{ vars.VITE_DGFY_RESET_URL }}
            VITE_SKUPERVISOR_BASE_URL=${{ vars.VITE_SKUPERVISOR_BASE_URL }}
            VITE_STOREFRONT_ACCOUNT_URL=${{ vars.VITE_STOREFRONT_ACCOUNT_URL }}
            VITE_SENTRY_ENABLED=${{ vars.VITE_SENTRY_ENABLED }}
            VITE_SENTRY_DSN_SKUPERVISOR=${{ vars.VITE_SENTRY_DSN_SKUPERVISOR }}
            VITE_SENTRY_DSN_POS=${{ vars.VITE_SENTRY_DSN_POS }}
            VITE_SENTRY_DSN_STORE=${{ vars.VITE_SENTRY_DSN_STORE }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.VITE_SENTRY_ENVIRONMENT }}
            VITE_SENTRY_RELEASE=${{ github.sha }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
            VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE }}
            VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE }}
            VITE_SENTRY_TRACE_PROPAGATION_TARGETS=${{ vars.VITE_SENTRY_TRACE_PROPAGATION_TARGETS }}
            VITE_SENTRY_TRACE_PROPAGATION_ENABLED=${{ vars.VITE_SENTRY_TRACE_PROPAGATION_ENABLED }}
            VITE_POSTHOG_ENABLED=${{ vars.VITE_POSTHOG_ENABLED }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_ENVIRONMENT=${{ vars.VITE_POSTHOG_ENVIRONMENT }}
            VITE_POSTHOG_SESSION_REPLAY_STORE=${{ vars.VITE_POSTHOG_SESSION_REPLAY_STORE }}
            VITE_POSTHOG_SESSION_REPLAY_POS=${{ vars.VITE_POSTHOG_SESSION_REPLAY_POS }}
            SENTRY_UPLOAD_SOURCEMAPS=${{ vars.SENTRY_UPLOAD_SOURCEMAPS }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_SKUPERVISOR=${{ vars.SENTRY_PROJECT_SKUPERVISOR }}
            SENTRY_PROJECT_POS=${{ vars.SENTRY_PROJECT_POS }}
            SENTRY_PROJECT_STORE=${{ vars.SENTRY_PROJECT_STORE }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # PROD server pull/restart happens in the `publish` job of
      # deployment-orchestrator.yml -> publish-platform.yml, keyed off
      # this job's environment, not steps.meta.outputs.sha_tag.
