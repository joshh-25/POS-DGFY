name: Deploy Frontend Image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tags:
        description: Comma-separated branch tags, e.g. "latest,beta"
        required: true
        type: string
    outputs:
      sha_tag:
        value: ${{ jobs.build-and-push.outputs.sha_tag }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sieitzz/dgfy-platform/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            IFS=',' read -ra TAG_ARR <<< "${{ inputs.image_tags }}"
            for t in "${TAG_ARR[@]}"; do echo "${IMAGE_NAME}:${t}"; done
            echo "${IMAGE_NAME}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Single image builds all 3 SPAs (skupervisor/pos/storefront) via
      # `npm run build:all` -- one nginx serves them on 3 internal ports.
      # VITE_API_BASE_URL/VITE_ASSET_BASE_URL are deliberately NOT set here:
      # this one image serves 3 different public hostnames, and both fall
      # back cleanly to relative/same-origin behavior when unset (see
      # frontend/src/utils/runtimeConfig.js resolveApiBaseUrl/
      # resolveAssetOrigin).
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_STORE_BASE_PATH=${{ vars.VITE_STORE_BASE_PATH }}
            VITE_TENANT_STORE_BASE_PATH=${{ vars.VITE_TENANT_STORE_BASE_PATH }}
            VITE_ROOT_TENANT_SLUGS=${{ vars.VITE_ROOT_TENANT_SLUGS }}
            VITE_PAYMENTS_ENABLED=${{ vars.VITE_PAYMENTS_ENABLED }}
            VITE_BUILD_STAMP=${{ github.sha }}

      # PROD server pull/restart happens in the `publish` job of
      # deployment-orchestrator.yml -> publish-platform.yml, keyed off
      # this job's environment, not steps.meta.outputs.sha_tag.
