name: Deploy Frontend Image

on:
  workflow_call:
    inputs:
      app:
        description: One of dgfy-ims, dgfy-pos, dgfy-storefront
        required: true
        type: string
      environment:
        required: true
        type: string
      image_tags:
        description: Comma-separated branch tags, e.g. "latest,beta"
        required: true
        type: string
      runner_labels_json:
        description: JSON array passed to runs-on for this build job
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box
      candidate_source_sha:
        description: >-
          ADR 0081 Decision 8 candidate source identity -- scripts/check-promotion-candidate.js's
          manifest source_develop_sha (no staging repairs yet) or current_staging_sha (once repairs
          exist), resolved by the promoter before dispatching deploy.yml/deploy-main.yml. Stamped as
          the org.dgfy-platform.candidate-source-sha OCI label when non-empty. Left empty for DEV
          builds and any dispatch outside a to-staging/release promotion -- scripts/check-image-
          version-parity.js only compares STAGING/PROD images that carry it, and treats a PROD image
          with no matching STAGING predecessor under this identity as expected evidence of a #1007
          expedited promotion or a main hotfix, not a defect.
        required: false
        type: string
        default: ''
    outputs:
      sha_tag:
        value: ${{ jobs.build-and-push.outputs.sha_tag }}
      version_tag:
        value: ${{ jobs.build-and-push.outputs.version_tag }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    env:
      IMAGE_NAME: ghcr.io/sieitzz/${{ inputs.app }}
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v4

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Compute image tags
        id: meta
        shell: bash
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          IMAGE_SERVER_URL: ${{ github.server_url }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            IFS=',' read -ra TAG_ARR <<< "${{ inputs.image_tags }}"
            for t in "${TAG_ARR[@]}"; do echo "${IMAGE_NAME}:${t}"; done
            echo "${IMAGE_NAME}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

          # ADR 0081 Decisions 1/3: X.Y.Z[-channel] version tag, read from
          # apps/${APP}/package.json, never written here (Decision 6 -- bumps are PR-authored).
          # Channel suffix keyed off this workflow's own `environment` input, which is always DEV
          # (deploy.yml), STAGING (deploy.yml), or PROD (deploy-main.yml) -- see
          # deployment-orchestrator.yml.
          case "$ENVIRONMENT" in
            DEV) CHANNEL_SUFFIX="-dev" ;;
            STAGING) CHANNEL_SUFFIX="-staging" ;;
            PROD) CHANNEL_SUFFIX="" ;;
            *) echo "::error::Unknown environment '$ENVIRONMENT' -- expected DEV, STAGING, or PROD (ADR 0081 Decision 1's channel derivation)." >&2; exit 1 ;;
          esac
          APP_PKG_VERSION="$(node -p "require('./apps/${APP}/package.json').version")"
          VERSION_TAG="${APP_PKG_VERSION}${CHANNEL_SUFFIX}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

          # ADR 0081 Decision 8 (#1588, epic #1548 Wave 4, Phase 279): stamp the candidate source
          # identity as its own label, distinct from org.opencontainers.image.revision (Decision 1/7's
          # build-commit SHA, which differs across the to-staging->staging and release/*->main merge
          # commits even for identical candidate content). Computed here, not inline in the labels:
          # block below, so a blank input cleanly omits the line instead of stamping an empty label --
          # docker/build-push-action's multi-line labels input is a plain heredoc from this step's own
          # output, same pattern already used for `tags` above.
          {
            echo "labels<<LABELS_EOF"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${IMAGE_SERVER_URL}/${IMAGE_REPOSITORY}"
            echo "org.opencontainers.image.version=${VERSION_TAG}"
            if [ -n "${CANDIDATE_SOURCE_SHA:-}" ]; then
              echo "org.dgfy-platform.candidate-source-sha=${CANDIDATE_SOURCE_SHA}"
            fi
            echo "LABELS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ephemeral runners get a fresh builder every run, so the layer cache has
      # to travel through the GitHub Actions cache instead of living on a
      # retained local builder (that only worked on the old persistent
      # self-hosted runners; see git history for that approach). Cache scope
      # is per-app now (issue #322 Phase 6) -- this workflow is called once
      # per (app, environment) pair, so a scope shared across apps would
      # evict itself the same way the pre-split single `frontend` scope used
      # to evict itself across environments (see #428). PR builds
      # (pr-frontend-build-checks.yml) read from each app's scope via
      # cache-from without ever writing back to it.
      - uses: docker/setup-buildx-action@v3

      # Each app now builds and pushes its own image (issue #322 Phase 6 --
      # previously one image built all 3 SPAs via `npm run build:all`). The
      # cross-app URL args (VITE_DGFY_AUTH_URL et al.) are passed to every
      # app regardless: not strictly required for correctness --
      # businessRegistrationUrl.js/skupervisorHandoff.js already derive the
      # right sibling domain from window.location.origin at runtime when
      # unset -- but set explicitly anyway as a deliberate belt-and-suspenders
      # layer, independent of that runtime heuristic. VITE_API_URL is the
      # only URL var actually required; the others fall back cleanly to
      # relative/same-origin behavior (see
      # packages/web-core/src/utils/runtimeConfig.js resolveApiBaseUrl/
      # resolveAssetOrigin).
      - name: Compute build args
        id: build_args
        shell: bash
        env:
          APP: ${{ inputs.app }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
          VITE_STORE_BASE_PATH: ${{ vars.VITE_STORE_BASE_PATH }}
          VITE_TENANT_STORE_BASE_PATH: ${{ vars.VITE_TENANT_STORE_BASE_PATH }}
          VITE_ROOT_TENANT_SLUGS: ${{ vars.VITE_ROOT_TENANT_SLUGS }}
          VITE_PAYMENTS_ENABLED: ${{ vars.VITE_PAYMENTS_ENABLED }}
          VITE_STOREFRONT_SANDBOX_QRPH_ENABLED: ${{ vars.VITE_STOREFRONT_SANDBOX_QRPH_ENABLED }}
          VITE_MENU_PDF_IMPORT_ENABLED: ${{ vars.VITE_MENU_PDF_IMPORT_ENABLED }}
          VITE_MENU_IMPORT_BATCH_ENABLED: ${{ vars.VITE_MENU_IMPORT_BATCH_ENABLED }}
          VITE_BUILD_STAMP: ${{ github.sha }}
          VITE_DGFY_AUTH_URL: ${{ vars.VITE_DGFY_AUTH_URL }}
          VITE_SKUPERVISOR_REGISTRATION_URL: ${{ vars.VITE_SKUPERVISOR_REGISTRATION_URL }}
          VITE_DGFY_RESET_URL: ${{ vars.VITE_DGFY_RESET_URL }}
          VITE_SKUPERVISOR_BASE_URL: ${{ vars.VITE_SKUPERVISOR_BASE_URL }}
          VITE_STOREFRONT_ACCOUNT_URL: ${{ vars.VITE_STOREFRONT_ACCOUNT_URL }}
          VITE_POS_TERMINAL_URL: ${{ vars.VITE_POS_TERMINAL_URL }}
          VITE_SENTRY_ENABLED: ${{ vars.VITE_SENTRY_ENABLED }}
          VITE_SENTRY_DSN_SKUPERVISOR: ${{ vars.VITE_SENTRY_DSN_SKUPERVISOR }}
          VITE_SENTRY_DSN_POS: ${{ vars.VITE_SENTRY_DSN_POS }}
          VITE_SENTRY_DSN_STORE: ${{ vars.VITE_SENTRY_DSN_STORE }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE }}
          VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: ${{ vars.VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE }}
          VITE_SENTRY_TRACE_PROPAGATION_TARGETS: ${{ vars.VITE_SENTRY_TRACE_PROPAGATION_TARGETS }}
          VITE_SENTRY_TRACE_PROPAGATION_ENABLED: ${{ vars.VITE_SENTRY_TRACE_PROPAGATION_ENABLED }}
          VITE_POSTHOG_ENABLED: ${{ vars.VITE_POSTHOG_ENABLED }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_ENVIRONMENT: ${{ vars.VITE_POSTHOG_ENVIRONMENT }}
          VITE_POSTHOG_SESSION_REPLAY_STORE: ${{ vars.VITE_POSTHOG_SESSION_REPLAY_STORE }}
          VITE_POSTHOG_SESSION_REPLAY_POS: ${{ vars.VITE_POSTHOG_SESSION_REPLAY_POS }}
          SENTRY_UPLOAD_SOURCEMAPS: ${{ vars.SENTRY_UPLOAD_SOURCEMAPS }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_SKUPERVISOR: ${{ vars.SENTRY_PROJECT_SKUPERVISOR }}
          SENTRY_PROJECT_POS: ${{ vars.SENTRY_PROJECT_POS }}
          SENTRY_PROJECT_STORE: ${{ vars.SENTRY_PROJECT_STORE }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: |
          set -euo pipefail

          COMMON="VITE_API_URL=${VITE_API_URL}
          VITE_ASSET_BASE_URL=${VITE_ASSET_BASE_URL}
          VITE_BUILD_STAMP=${VITE_BUILD_STAMP}
          VITE_DGFY_AUTH_URL=${VITE_DGFY_AUTH_URL}
          VITE_SKUPERVISOR_REGISTRATION_URL=${VITE_SKUPERVISOR_REGISTRATION_URL}
          VITE_DGFY_RESET_URL=${VITE_DGFY_RESET_URL}
          VITE_SKUPERVISOR_BASE_URL=${VITE_SKUPERVISOR_BASE_URL}
          VITE_STOREFRONT_ACCOUNT_URL=${VITE_STOREFRONT_ACCOUNT_URL}
          VITE_POS_TERMINAL_URL=${VITE_POS_TERMINAL_URL}
          VITE_SENTRY_ENABLED=${VITE_SENTRY_ENABLED}
          VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT}
          VITE_SENTRY_RELEASE=${VITE_SENTRY_RELEASE}
          VITE_SENTRY_TRACES_SAMPLE_RATE=${VITE_SENTRY_TRACES_SAMPLE_RATE}
          VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE}
          VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=${VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE}
          VITE_SENTRY_TRACE_PROPAGATION_TARGETS=${VITE_SENTRY_TRACE_PROPAGATION_TARGETS}
          VITE_SENTRY_TRACE_PROPAGATION_ENABLED=${VITE_SENTRY_TRACE_PROPAGATION_ENABLED}
          VITE_POSTHOG_ENABLED=${VITE_POSTHOG_ENABLED}
          VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}
          VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}
          VITE_POSTHOG_ENVIRONMENT=${VITE_POSTHOG_ENVIRONMENT}
          SENTRY_UPLOAD_SOURCEMAPS=${SENTRY_UPLOAD_SOURCEMAPS}
          SENTRY_ORG=${SENTRY_ORG}
          SENTRY_URL=${SENTRY_URL}"

          case "${APP}" in
            dgfy-ims)
              PER_APP="VITE_MENU_PDF_IMPORT_ENABLED=${VITE_MENU_PDF_IMPORT_ENABLED}
          VITE_MENU_IMPORT_BATCH_ENABLED=${VITE_MENU_IMPORT_BATCH_ENABLED}
          VITE_SENTRY_DSN_SKUPERVISOR=${VITE_SENTRY_DSN_SKUPERVISOR}
          SENTRY_PROJECT_SKUPERVISOR=${SENTRY_PROJECT_SKUPERVISOR}"
              ;;
            dgfy-pos)
              PER_APP="VITE_MENU_PDF_IMPORT_ENABLED=${VITE_MENU_PDF_IMPORT_ENABLED}
          VITE_MENU_IMPORT_BATCH_ENABLED=${VITE_MENU_IMPORT_BATCH_ENABLED}
          VITE_SENTRY_DSN_POS=${VITE_SENTRY_DSN_POS}
          VITE_POSTHOG_SESSION_REPLAY_POS=${VITE_POSTHOG_SESSION_REPLAY_POS}
          SENTRY_PROJECT_POS=${SENTRY_PROJECT_POS}"
              ;;
            dgfy-storefront)
              PER_APP="VITE_STORE_BASE_PATH=${VITE_STORE_BASE_PATH}
          VITE_TENANT_STORE_BASE_PATH=${VITE_TENANT_STORE_BASE_PATH}
          VITE_ROOT_TENANT_SLUGS=${VITE_ROOT_TENANT_SLUGS}
          VITE_PAYMENTS_ENABLED=${VITE_PAYMENTS_ENABLED}
          VITE_STOREFRONT_SANDBOX_QRPH_ENABLED=${VITE_STOREFRONT_SANDBOX_QRPH_ENABLED}
          VITE_SENTRY_DSN_STORE=${VITE_SENTRY_DSN_STORE}
          VITE_POSTHOG_SESSION_REPLAY_STORE=${VITE_POSTHOG_SESSION_REPLAY_STORE}
          SENTRY_PROJECT_STORE=${SENTRY_PROJECT_STORE}"
              ;;
            *)
              echo "::error::unknown app '${APP}' -- expected dgfy-ims, dgfy-pos, or dgfy-storefront"
              exit 1
              ;;
          esac

          {
            echo "args<<EOF"
            printf '%s\n' "${COMMON}"
            printf '%s\n' "${PER_APP}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ inputs.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache (type=registry) removed 2026-08-14 (#427) -- see
          # the setup-buildx-action step comment above for why type=gha,
          # scoped per app, is the only cache now.
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
          build-args: |
            ${{ steps.build_args.outputs.args }}
            APP_VERSION=${{ steps.meta.outputs.version_tag }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # ADR 0081 Decision 7 (the ADR's one [binding] clause), #1575: refuse to publish the version
      # tag over a different revision. Deliberately a separate, cheap `docker buildx imagetools
      # create` on the digest just pushed above, not a second tag in the build-push step's own
      # `tags:` list -- see deploy-api.yml's matching step comment for the full "why".
      - name: Publish version tag, refusing a different-revision overwrite (ADR 0081 Decision 7)
        shell: bash
        run: |
          node scripts/check-tag-immutability.js \
            --image "${IMAGE_NAME}" \
            --tag "${{ steps.meta.outputs.version_tag }}" \
            --revision "${{ github.sha }}" \
            --digest "${{ steps.build.outputs.digest }}"

      # PROD server pull/restart happens in the `publish` job of
      # deployment-orchestrator.yml -> publish-platform.yml, keyed off
      # this job's environment, not steps.meta.outputs.sha_tag.
