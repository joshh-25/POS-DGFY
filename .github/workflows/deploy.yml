name: Build & Deploy Platform

# Consolidated manual-dispatch build+deploy for DEV/STAGING, replacing
# build-develop.yml, build-staging.yml, build-manual.yml, and
# build-beta-manual.yml (all deleted 2026-08-14, #417). PROD stays on its
# own workflow -- see deploy-main.yml -- rather than being folded in here:
# a mistake there restarts the shared dgfy-api that dgfy.ph's production
# traffic depends on (beta.dgfy.ph retired 2026-08-23, #329/#895 -- not "both"
# beta and prod anymore), with no approval gate available on GitHub Free, so
# it gets a separate, more deliberate dispatch entry rather than a dropdown
# option buried in this one. That reasoning is independent of beta ever
# having existed -- it's about not burying a no-approval-gate PROD dispatch
# in the same dropdown DEV/STAGING casually dispatches from, so the split
# stays even though beta is gone (considered and confirmed, #1041).
#
# Every push-triggered build/deploy in the repo is gone as of #419. Pat's
# own framing: "we'll remove the auto-triggers. We'll manually trigger them
# and choose which platforms and environment to deploy. This way, we can
# FULLY DECIDE when to build and deploy." Breaking `develop` is explicitly
# acceptable under this model -- accountability is on-demand (via
# scripts/integrate-prs.js or whoever's manual build fails), not automatic.
#
# The old `components` input (a single-select choice: all/backend/frontend/
# dgfy-ims/dgfy-pos/dgfy-storefront) originally had a fourth option, `auto`,
# that read a revision label off the currently-deployed image and rebuilt
# only what changed since then. Dropped 2026-08-14 (#420) -- Pat's own
# pushback: "why do we still have change detection on the manual deploy,
# when we're supposed to be able to pick which platforms to build and push?"
# `components` itself was replaced 2026-08-25 (#1050) by the four per-image
# `build_*` booleans below, all defaulting true -- the single-select choice
# made building e.g. backend and one frontend app in the same dispatch
# impossible (you'd need two separate dispatches); booleans let you uncheck
# just what you don't need, same "pick which platforms" intent as above.
#
# There used to be a separate `environment` choice input (DEV/STAGING/BETA)
# alongside the branch selector every workflow_dispatch already has, plus a
# `guard-ref` job whose only purpose was catching the two disagreeing (e.g.
# selector left on `develop`, environment picked `BETA`). Removed 2026-08-14
# (#423, same day) -- Pat's own pushback: the branch<->environment mapping
# below is already 1:1, so the second selection was pure redundancy that
# only existed to be picked wrong. `resolve-environment` derives it from
# the branch instead, which eliminates the mismatch class rather than
# detecting it. There is deliberately no override for dispatching one
# branch's code against another environment's secrets/target -- that
# pathway (previously `allow_ref_mismatch`) is gone; a genuine cross-branch
# build need is rare enough to handle by pushing to the target branch first.
#
# CONFIRMED end-to-end 2026-08-13: DEV via run 31724177658 (build + SSH
# publish all succeeded, deployed revision label matched develop HEAD) and
# STAGING via run 31727201728 (same, against staging HEAD -- NOT run
# 31726388197, which is a real self-hosted-runner stall on `guard-ref`
# that timed out and was cancelled; see #432. The re-dispatch with no
# change succeeded, which is 31727201728). BETA+PROD dual-deploy also
# confirmed via run 31728787346 (deploy-main.yml).
on:
  workflow_dispatch:
    inputs:
      build_api:
        description: >-
          Build/push dgfy-api and dgfy-migration-runner (always paired --
          compose's depends_on: service_completed_successfully means a
          mismatched pair, new api schema expectations against an old
          migration set or vice versa, is a real failure mode, not just
          caution). Uncheck to skip.
        type: boolean
        default: true
      build_frontend_ims:
        description: Build/push the dgfy-ims image. Uncheck to skip.
        type: boolean
        default: true
      build_frontend_pos:
        description: Build/push the dgfy-pos image. Uncheck to skip.
        type: boolean
        default: true
      build_frontend_storefront:
        description: Build/push the dgfy-storefront image. Uncheck to skip.
        type: boolean
        default: true
      build_frontend_opis:
        description: Build/push the dgfy-opis image. Uncheck to skip.
        type: boolean
        default: true
      deploy:
        description: SSH-deploy to the server after images are pushed
        type: boolean
        default: true
      candidate_source_sha:
        description: >-
          ADR 0081 Decision 8 candidate source identity (#1588, epic #1548 Wave 4, Phase 279) --
          set this ONLY when dispatching against staging as part of a to-staging/<candidate_id>
          promotion, to scripts/check-promotion-candidate.js's manifest source_develop_sha (no
          staging repairs yet) or current_staging_sha (once repairs exist). Leave empty for a DEV
          dispatch or any ad hoc STAGING rebuild outside a real promotion -- an empty value omits
          the org.dgfy-platform.candidate-source-sha OCI label entirely rather than stamping a
          misleading one. See .agents/skills/promoter/references/promotion-runbook.md.
        type: string
        default: ''
      release_revision_api:
        description: >-
          Per-app artifact revision for dgfy-api and dgfy-migration-runner (#2055, Phase 346 --
          each app's own allocated rN, e.g. "r16"). Set these four ONLY when the STAGING
          dispatch is part of a to-staging/<candidate_id> promotion (promoter-filled from the
          candidate manifest's per-app release_revision map) -- the builders fail closed
          without them, and the published staging tags carry them (backend X.Y.Z-rN).
          Leave all four empty for a DEV dispatch (revisions are allocated per app from GHCR
          on develop, or ad-hoc X.Y.Z-<slug>-dev tags on a feature branch) or any ad hoc
          STAGING rebuild outside a real promotion (which the builders refuse -- STAGING
          outside a tracked candidate has no revision to publish under).
        type: string
        default: ''
      release_revision_frontend_ims:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-ims specifically
          (frontend X.Y.Z-rN-staging). STAGING candidate dispatch only.
        type: string
        default: ''
      release_revision_frontend_pos:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-pos specifically
          (frontend X.Y.Z-rN-staging). STAGING candidate dispatch only.
        type: string
        default: ''
      release_revision_frontend_storefront:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-storefront
          specifically (frontend X.Y.Z-rN-staging). STAGING candidate dispatch only.
        type: string
        default: ''
      environment_override:
        description: >-
          Manual environment override (DEV or STAGING). Defaults to empty (auto-derived from branch).
          Use DEV to deploy a feature branch to the DEV environment without merging to develop.
        type: string
        default: ''

concurrency:
  group: deploy-${{ github.ref_name }}
  # false, matching build-develop.yml's original reasoning: this is a manual
  # action now, not a push burst, so there's no "queue instead of losing a
  # diff" pressure -- but cancelling a real in-flight deploy mid-SSH because
  # someone fat-fingered a second dispatch is worse than making the second
  # one wait.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve-environment:
    runs-on: ['sieitz-runner']  # #923: generic, either box
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      image_tags: ${{ steps.resolve.outputs.image_tags }}
    steps:
      - name: Derive environment from the dispatched branch
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # #2055 (Phase 346): feature branches dispatch DEV ad-hoc -- same environment, but
          # the orchestrator tags X.Y.Z-<slug>-dev (never candidate-selectable) and publishes
          # the sha tag only, never the moving `develop` tag. develop keeps the moving tag;
          # staging keeps its own. main is still refused here unconditionally.
          case "${{ github.ref_name }}" in
            develop) ENV=DEV; TAGS=develop ;;
            staging) ENV=STAGING; TAGS=staging ;;
            main)
              echo "::error::deploy.yml was dispatched against 'main'. This workflow covers DEV/STAGING only -- for main/PROD, use deploy-main.yml instead."
              exit 1
              ;;
            *)
              ENV=DEV; TAGS=
              echo "::notice::Branch '${{ github.ref_name }}' is not develop/staging -- ad-hoc DEV dispatch: images publish under X.Y.Z-<slug>-dev + sha tags only (never the moving 'develop' tag, never promotion-eligible). For main/PROD, use deploy-main.yml instead."
              ;;
          esac
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "image_tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "OK: branch '${{ github.ref_name }}' -> environment '$ENV' (image_tags='$TAGS')."

  build-and-push:
    needs: resolve-environment
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      # Only DEV or STAGING ever reach this job -- resolve-environment errors
      # out (and this job never runs) for main, since main deploys go through
      # deploy-main.yml instead. No 'beta'
      # fallback is needed here anymore (#329/#895).
      # #2055: ad-hoc DEV (any branch but develop) publishes the sha tag only -- the moving
      # `develop` tag stays on the develop line, so a feature-branch dispatch can never
      # redirect the shared DEV target at unreviewed code.
      image_tags: ${{ needs.resolve-environment.outputs.image_tags }}
      publish: ${{ inputs.deploy }}
      # The self-hosted runner already sits on the DEV/STAGING network and,
      # for DEV/STAGING, IS the deploy target -- the OpenVPN hop hosted
      # runners needed would have it tunnel into itself.
      vpn_required: false
      build_api: ${{ inputs.build_api }}
      build_frontend_ims: ${{ inputs.build_frontend_ims }}
      build_frontend_pos: ${{ inputs.build_frontend_pos }}
      build_frontend_storefront: ${{ inputs.build_frontend_storefront }}
      build_frontend_opis: ${{ inputs.build_frontend_opis }}
      runner_labels_json: '["sieitz-runner"]'  # #923: DEV/STAGING, either box (see CI_RUNNER_MIGRATION_HANDOFF.md)
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
      release_revision_api: ${{ inputs.release_revision_api }}
      release_revision_frontend_ims: ${{ inputs.release_revision_frontend_ims }}
      release_revision_frontend_pos: ${{ inputs.release_revision_frontend_pos }}
      release_revision_frontend_storefront: ${{ inputs.release_revision_frontend_storefront }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
