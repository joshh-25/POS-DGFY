name: Build & Deploy Platform

# Consolidated manual-dispatch build+deploy for DEV/STAGING, replacing
# build-develop.yml, build-staging.yml, build-manual.yml, and
# build-beta-manual.yml (all deleted 2026-08-14, #417). PROD stays on its
# own workflow -- see deploy-main.yml -- rather than being folded in here:
# a mistake there restarts the shared dgfy-api that dgfy.ph's production
# traffic depends on (beta.dgfy.ph retired 2026-08-23, #329/#895 -- not "both"
# beta and prod anymore), with no approval gate available on GitHub Free, so
# it gets a separate, more deliberate dispatch entry rather than a dropdown
# option buried in this one. That reasoning is independent of beta ever
# having existed -- it's about not burying a no-approval-gate PROD dispatch
# in the same dropdown DEV/STAGING casually dispatches from, so the split
# stays even though beta is gone (considered and confirmed, #1041).
#
# Every push-triggered build/deploy in the repo is gone as of #419. Pat's
# own framing: "we'll remove the auto-triggers. We'll manually trigger them
# and choose which platforms and environment to deploy. This way, we can
# FULLY DECIDE when to build and deploy." Breaking `develop` is explicitly
# acceptable under this model -- accountability is on-demand (via
# scripts/integrate-prs.js or whoever's manual build fails), not automatic.
#
# `components` originally had a fourth option, `auto`, that read a revision
# label off the currently-deployed image and rebuilt only what changed since
# then. Dropped 2026-08-14 (#420) -- Pat's own pushback: "why do we still
# have change detection on the manual deploy, when we're supposed to be able
# to pick which platforms to build and push?"
#
# There used to be a separate `environment` choice input (DEV/STAGING/BETA)
# alongside the branch selector every workflow_dispatch already has, plus a
# `guard-ref` job whose only purpose was catching the two disagreeing (e.g.
# selector left on `develop`, environment picked `BETA`). Removed 2026-08-14
# (#423, same day) -- Pat's own pushback: the branch<->environment mapping
# below is already 1:1, so the second selection was pure redundancy that
# only existed to be picked wrong. `resolve-environment` derives it from
# the branch instead, which eliminates the mismatch class rather than
# detecting it. There is deliberately no override for dispatching one
# branch's code against another environment's secrets/target -- that
# pathway (previously `allow_ref_mismatch`) is gone; a genuine cross-branch
# build need is rare enough to handle by pushing to the target branch first.
#
# CONFIRMED end-to-end 2026-08-13: DEV via run 31724177658 (build + SSH
# publish all succeeded, deployed revision label matched develop HEAD) and
# STAGING via run 31727201728 (same, against staging HEAD -- NOT run
# 31726388197, which is a real self-hosted-runner stall on `guard-ref`
# that timed out and was cancelled; see #432. The re-dispatch with no
# change succeeded, which is 31727201728). BETA+PROD dual-deploy also
# confirmed via run 31728787346 (deploy-main.yml).
on:
  workflow_dispatch:
    inputs:
      components:
        description: >-
          Which images to build/push. backend = api + migration-runner
          together, never separately -- compose's depends_on:
          service_completed_successfully means a mismatched pair (new api
          schema expectations against an old migration set, or vice versa)
          is a real failure mode, not just caution. frontend = all 3 frontend
          apps; dgfy-ims/dgfy-pos/dgfy-storefront build just one.
        type: choice
        options:
          - all
          - backend
          - frontend
          - dgfy-ims
          - dgfy-pos
          - dgfy-storefront
        default: all
      deploy:
        description: SSH-deploy to the server after images are pushed
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref_name }}
  # false, matching build-develop.yml's original reasoning: this is a manual
  # action now, not a push burst, so there's no "queue instead of losing a
  # diff" pressure -- but cancelling a real in-flight deploy mid-SSH because
  # someone fat-fingered a second dispatch is worse than making the second
  # one wait.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve-environment:
    runs-on: ['sieitz-runner']  # #923: generic, either box
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Derive environment from the dispatched branch
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            develop) ENV=DEV ;;
            staging) ENV=STAGING ;;
            *)
              echo "::error::No environment is mapped to branch '${{ github.ref_name }}'. This workflow only recognizes develop (DEV) and staging (STAGING) -- dispatch from one of those branches using the branch selector above. For main/PROD, use deploy-main.yml instead (beta.dgfy.ph was retired 2026-08-23, #329/#895 -- main no longer maps to a BETA environment here)."
              exit 1
              ;;
          esac
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "OK: branch '${{ github.ref_name }}' -> environment '$ENV'."

  build-and-push:
    needs: resolve-environment
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      # Only DEV or STAGING ever reach this job -- resolve-environment errors
      # out (and this job never runs) for any other branch, main included,
      # since main deploys go through deploy-main.yml instead. No 'beta'
      # fallback is needed here anymore (#329/#895).
      image_tags: ${{ needs.resolve-environment.outputs.environment == 'DEV' && 'develop' || 'staging' }}
      publish: ${{ inputs.deploy }}
      # The self-hosted runner already sits on the DEV/STAGING network and,
      # for DEV/STAGING, IS the deploy target -- the OpenVPN hop hosted
      # runners needed would have it tunnel into itself.
      vpn_required: false
      build_api: ${{ inputs.components == 'all' || inputs.components == 'backend' }}
      build_frontend_ims: ${{ inputs.components == 'all' || inputs.components == 'frontend' || inputs.components == 'dgfy-ims' }}
      build_frontend_pos: ${{ inputs.components == 'all' || inputs.components == 'frontend' || inputs.components == 'dgfy-pos' }}
      build_frontend_storefront: ${{ inputs.components == 'all' || inputs.components == 'frontend' || inputs.components == 'dgfy-storefront' }}
      runner_labels_json: '["sieitz-runner"]'  # #923: DEV/STAGING, either box (see CI_RUNNER_MIGRATION_HANDOFF.md)
    secrets: inherit
    permissions:
      contents: read
      packages: write
