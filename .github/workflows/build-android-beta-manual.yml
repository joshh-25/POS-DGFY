name: Build Android Beta Release (manual)

# Builds a signed beta-flavor release APK of the iMin Android wrapper via
# scripts/build-android-beta-release.sh and uploads it as a workflow
# artifact. Manual only -- run from the Actions tab when a beta APK is
# needed for distribution/testing.
on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Run a clean Gradle build (./gradlew clean) before assembling"
        type: boolean
        default: false

concurrency:
  group: build-android-beta-manual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build beta release APK
        run: |
          if [[ "${{ inputs.clean }}" == "true" ]]; then
            bash scripts/build-android-beta-release.sh --clean
          else
            bash scripts/build-android-beta-release.sh
          fi

      - name: Upload beta release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-beta-release-${{ github.run_number }}
          path: releases/android/**
          if-no-files-found: error
          retention-days: 30
