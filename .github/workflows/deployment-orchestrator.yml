name: Deployment Orchestrator

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to resolve build-arg vars / deploy secrets from (PROD/QA/DEV)
        required: true
        type: string
      image_tags:
        description: Comma-separated branch tags, e.g. "latest,beta"
        required: true
        type: string
      publish:
        description: Whether to SSH-deploy to the target server after images are pushed
        required: false
        type: boolean
        default: false
      vpn_required:
        description: Whether the target server needs a VPN connection before SSH-deploy (see publish-platform.yml)
        required: false
        type: boolean
        default: false
      build_api:
        description: Whether to build/push the dgfy-api and dgfy-migration-runner images. Defaults true so deploy-main.yml's all-components dispatch is unaffected; deploy.yml sets this from its own explicit components input.
        required: false
        type: boolean
        default: true
      build_frontend_ims:
        description: Whether to build/push the dgfy-ims image. Defaults true so deploy-main.yml's all-components dispatch is unaffected; deploy.yml sets this from its own explicit components input.
        required: false
        type: boolean
        default: true
      build_frontend_pos:
        description: Whether to build/push the dgfy-pos image. Defaults true so deploy-main.yml's all-components dispatch is unaffected; deploy.yml sets this from its own explicit components input.
        required: false
        type: boolean
        default: true
      build_frontend_storefront:
        description: Whether to build/push the dgfy-storefront image. Defaults true so deploy-main.yml's all-components dispatch is unaffected; deploy.yml sets this from its own explicit components input.
        required: false
        type: boolean
        default: true
      build_frontend_opis:
        description: Whether to build/push the dgfy-opis image. Defaults true so deploy-main.yml's all-components dispatch is unaffected; deploy.yml sets this from its own explicit components input.
        required: false
        type: boolean
        default: true
      runner_labels_json:
        description: JSON array passed to runs-on for build/publish jobs
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box
      candidate_source_sha:
        description: >-
          ADR 0081 Decision 8 candidate source identity, threaded straight through to each builder
          workflow's own input of the same name -- see deploy-api.yml's input description for the
          full contract. Left empty outside a to-staging promotion (deploy.yml's DEV/STAGING calls
          this workflow for both; only the STAGING dispatch of an actual promotion should ever set
          this non-empty).
        required: false
        type: string
        default: ''
      release_revision_api:
        description: >-
          Per-app artifact revision for dgfy-api AND dgfy-migration-runner (#2055, Phase 346 --
          each app keeps its own allocated rN, e.g. "r16"; #1977's single candidate-wide value,
          Phase 342). Covers both backends because build_api always rebuilds them as one paired
          unit (a repair touching either always lists both in its manifest apps_touched, so the
          promoter hands both the same value here -- their published tags still carry each
          app's own floor). Required on a STAGING candidate dispatch (builders fail closed
          without it); DEV ignores it (revisions are allocated in resolve-build-plan below).
        required: false
        type: string
        default: ''
      release_revision_frontend_ims:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-ims specifically
          (its own build_frontend_ims flag rebuilds it independently of the other two
          frontends). STAGING candidate dispatch only; DEV ignores it.
        required: false
        type: string
        default: ''
      release_revision_frontend_pos:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-pos specifically
          (its own build_frontend_pos flag rebuilds it independently of the other two
          frontends). STAGING candidate dispatch only; DEV ignores it.
        required: false
        type: string
        default: ''
      release_revision_frontend_storefront:
        description: >-
          Same per-app contract as release_revision_api above, for dgfy-storefront
          specifically (its own build_frontend_storefront flag rebuilds it independently
          of the other two frontends). STAGING candidate dispatch only; DEV ignores it.
        required: false
        type: string
        default: ''
      release_revision_frontend_opis:
        description: Same per-app contract as the other frontend release revisions, for dgfy-opis.
        required: false
        type: string
        default: ''
    outputs:
      frontend_ims_sha_tag:
        value: ${{ jobs.frontend-ims.outputs.sha_tag }}
      frontend_ims_version_tag:
        value: ${{ jobs.frontend-ims.outputs.version_tag }}
      frontend_pos_sha_tag:
        value: ${{ jobs.frontend-pos.outputs.sha_tag }}
      frontend_pos_version_tag:
        value: ${{ jobs.frontend-pos.outputs.version_tag }}
      frontend_storefront_sha_tag:
        value: ${{ jobs.frontend-storefront.outputs.sha_tag }}
      frontend_storefront_version_tag:
        value: ${{ jobs.frontend-storefront.outputs.version_tag }}
      frontend_opis_sha_tag:
        value: ${{ jobs.frontend-opis.outputs.sha_tag }}
      frontend_opis_version_tag:
        value: ${{ jobs.frontend-opis.outputs.version_tag }}
      dgfy_api_sha_tag:
        value: ${{ jobs.dgfy-api.outputs.sha_tag }}
      dgfy_api_version_tag:
        value: ${{ jobs.dgfy-api.outputs.version_tag }}
      migration_runner_sha_tag:
        value: ${{ jobs.dgfy-migration-runner.outputs.sha_tag }}
      migration_runner_version_tag:
        value: ${{ jobs.dgfy-migration-runner.outputs.version_tag }}

permissions:
  contents: read
  packages: write

jobs:
  # #1610 follow-up: deploy-main.yml (PROD) has carried this build-skip resolution since ADR 0081
  # Decision 7 residue was fixed there, but this shared workflow -- used by deploy.yml's DEV/STAGING
  # dispatch -- never got the same fix. Net effect: every DEV/STAGING dispatch force-rebuilt the
  # paired dgfy-api/dgfy-migration-runner unit (and every checked frontend) even when an app's own
  # code hadn't changed at all, tripping ADR 0081 Decision 7's tag-immutability guard on the
  # untouched app every time a sibling did need a rebuild. Ported verbatim from deploy-main.yml's
  # own `resolve-build-plan` job (same script, same four-outcome table, same fail-closed reasoning --
  # see scripts/resolve-build-skip-plan.js's header comment) with one addition: `--environment` is
  # passed here (deploy-main.yml never does) so the script checks the correctly channel-suffixed tag
  # (-dev/-staging) instead of PROD's bare X.Y.Z -- see deriveChannelSuffix in that script.
  resolve-build-plan:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 10
    outputs:
      should_build_dgfy_api: ${{ steps.resolve.outputs.should_build_dgfy_api }}
      should_build_dgfy_migration_runner: ${{ steps.resolve.outputs.should_build_dgfy_migration_runner }}
      should_build_dgfy_ims: ${{ steps.resolve.outputs.should_build_dgfy_ims }}
      should_build_dgfy_pos: ${{ steps.resolve.outputs.should_build_dgfy_pos }}
      should_build_dgfy_storefront: ${{ steps.resolve.outputs.should_build_dgfy_storefront }}
      should_build_dgfy_opis: ${{ steps.resolve.outputs.should_build_dgfy_opis }}
      # #2055 (Phase 346): the per-app revision map (JSON object) and DEV ad-hoc marker the
      # builder jobs consume -- see the "Resolve per-app artifact revisions" step below.
      revisions_json: ${{ steps.revisions.outputs.revisions_json }}
      dev_pr_ref: ${{ steps.revisions.outputs.dev_pr_ref }}
    steps:
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # #1716: this job went straight from checkout to running resolve-build-skip-plan.js with no
      # install step at all -- that script requires check-app-version-bump.js, which in turn
      # requires resolve-web-core-reachability.js's `madge` (#1704/#1708), a devDependency never
      # installed here. Full `npm ci` (not --omit=dev) since madge is itself a devDependency this
      # step needs at runtime. Mirrors promotion-quality-gate.yml's own root-level
      # "Setup Node.js"/"Install repository dependencies" pattern.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci

      # #2055 (Phase 346): every build needs exactly one DEV identity before the skip plan
      # (and the builders) can resolve its tag. Three cases, matching the builder meta
      # step's own contract:
      #   - DEV on `develop` -- allocate each app's own revision from GHCR
      #     (scripts/allocate-artifact-revision.js: max-plus-one per app+floor, same-source
      #     retry reuses its own N so a re-dispatch converges instead of burning a number).
      #     The map is emitted as revisions_json for the skip plan AND the builder jobs, so
      #     both resolve byte-identical tags -- allocation happens exactly once per dispatch.
      #   - DEV on any other branch -- ad-hoc: no allocation, dev_pr_ref carries the raw ref
      #     (the resolver sanitizes it to X.Y.Z-<slug>-dev, never candidate-selectable).
      #   - STAGING -- revisions arrive per app-group from the dispatch inputs
      #     (promoter-filled from the candidate manifest's per-app release_revision map);
      #     groups fan out to apps (api covers both backends).
      - name: Resolve per-app artifact revisions
        id: revisions
        shell: bash
        env:
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_REVISION_API: ${{ inputs.release_revision_api }}
          RELEASE_REVISION_IMS: ${{ inputs.release_revision_frontend_ims }}
          RELEASE_REVISION_POS: ${{ inputs.release_revision_frontend_pos }}
          RELEASE_REVISION_STOREFRONT: ${{ inputs.release_revision_frontend_storefront }}
          RELEASE_REVISION_OPIS: ${{ inputs.release_revision_frontend_opis }}
        run: |
          set -euo pipefail
          if [ "${DISPATCH_ENVIRONMENT}" = "DEV" ] && [ "${REF_NAME}" != "develop" ]; then
            echo "[revisions] feature-branch DEV dispatch on '${REF_NAME}' -- ad-hoc tags (X.Y.Z-<slug>-dev), never promotion-eligible (#2055)."
            echo "revisions_json={}" >> "$GITHUB_OUTPUT"
            echo "dev_pr_ref=${REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${DISPATCH_ENVIRONMENT}" = "DEV" ]; then
            echo "[revisions] DEV dispatch on develop -- allocating per-app revisions from GHCR (#2055)."
            REVISIONS_JSON="$(for APP in dgfy-api dgfy-migration-runner dgfy-ims dgfy-pos dgfy-storefront dgfy-opis; do
              FLOOR="$(node -p "require('./apps/${APP}/package.json').version")"
              ALLOC="$(node scripts/allocate-artifact-revision.js --image "ghcr.io/sieitzz/${APP}" --floor "${FLOOR}" --revision "${GITHUB_SHA}")"
              echo "[revisions] ${ALLOC}"
              N="$(node -p "JSON.parse(process.argv[1]).revision" "${ALLOC}")"
              printf '%s=%s\n' "${APP}" "${N}"
            done | node -e "const m={};for(const l of require('fs').readFileSync(0,'utf8').trim().split('\n')){if(!l)continue;const i=l.indexOf('=');m[l.slice(0,i)]='r'+l.slice(i+1);}console.log(JSON.stringify(m))")"
            echo "revisions_json=${REVISIONS_JSON}" >> "$GITHUB_OUTPUT"
            echo "dev_pr_ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REVISIONS_JSON="$(node -e "const m={};const put=(k,v)=>{if(v&&String(v).trim())m[k]=String(v).trim();};put('dgfy-api',process.env.RELEASE_REVISION_API);put('dgfy-migration-runner',process.env.RELEASE_REVISION_API);put('dgfy-ims',process.env.RELEASE_REVISION_IMS);put('dgfy-pos',process.env.RELEASE_REVISION_POS);put('dgfy-storefront',process.env.RELEASE_REVISION_STOREFRONT);put('dgfy-opis',process.env.RELEASE_REVISION_OPIS);console.log(JSON.stringify(m))")"
          echo "[revisions] STAGING dispatch -- per-app revisions from dispatch inputs: ${REVISIONS_JSON}"
          echo "revisions_json=${REVISIONS_JSON}" >> "$GITHUB_OUTPUT"
          echo "dev_pr_ref=" >> "$GITHUB_OUTPUT"

      - name: Resolve build-skip plan
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          SKIP_ARGS=(--revision "${{ github.sha }}" --environment "${{ inputs.environment }}")
          REVISIONS_JSON='${{ steps.revisions.outputs.revisions_json }}'
          if [ -n "${REVISIONS_JSON}" ] && [ "${REVISIONS_JSON}" != "{}" ]; then
            SKIP_ARGS+=(--release-revisions-json "${REVISIONS_JSON}")
          fi
          if [ -n "${{ steps.revisions.outputs.dev_pr_ref }}" ]; then
            SKIP_ARGS+=(--dev-pr-ref "${{ steps.revisions.outputs.dev_pr_ref }}")
          fi
          node scripts/resolve-build-skip-plan.js "${SKIP_ARGS[@]}"

  dgfy-api:
    # The backend, refactored into apps/dgfy-api -- now the source of truth
    # (backend/ removed). See infrastructure/docker/dgfy-api/Dockerfile.
    needs: resolve-build-plan
    if: inputs.build_api && needs.resolve-build-plan.outputs.should_build_dgfy_api == 'true'
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.image_tags }}
      runner_labels_json: ${{ inputs.runner_labels_json }}
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
      release_revision: ${{ fromJSON(needs.resolve-build-plan.outputs.revisions_json).dgfy-api }}
      dev_pr_ref: ${{ needs.resolve-build-plan.outputs.dev_pr_ref }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  dgfy-migration-runner:
    # One-shot migration image the dgfy-api service depends on at compose-up
    # (applies Sequelize migrations, then exits). Must be published alongside
    # dgfy-api -- see infrastructure/docker/dgfy-migration-runner/Dockerfile.
    # #1610: build_api stays ONE shared checkbox gating both this job and dgfy-api's eligibility to
    # run at all, but each job ANDs it with its OWN independently-resolved skip verdict -- an
    # API-only change correctly skips rebuilding this image (and vice versa), rather than treating
    # the pair as always-rebuild-together. See resolve-build-plan's own comment above.
    needs: resolve-build-plan
    if: inputs.build_api && needs.resolve-build-plan.outputs.should_build_dgfy_migration_runner == 'true'
    uses: ./.github/workflows/deploy-migration-runner.yml
    with:
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.image_tags }}
      runner_labels_json: ${{ inputs.runner_labels_json }}
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
      release_revision: ${{ fromJSON(needs.resolve-build-plan.outputs.revisions_json).dgfy-migration-runner }}
      dev_pr_ref: ${{ needs.resolve-build-plan.outputs.dev_pr_ref }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  frontend-ims:
    # Builds/pushes the dgfy-ims image -- see
    # infrastructure/docker/dgfy-ims/Dockerfile. One image per app since
    # issue #322 Phase 6 (previously one combined `frontend` image built all
    # 3 SPAs).
    needs: resolve-build-plan
    if: inputs.build_frontend_ims && needs.resolve-build-plan.outputs.should_build_dgfy_ims == 'true'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      app: dgfy-ims
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.image_tags }}
      runner_labels_json: ${{ inputs.runner_labels_json }}
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
      release_revision: ${{ fromJSON(needs.resolve-build-plan.outputs.revisions_json).dgfy-ims }}
      dev_pr_ref: ${{ needs.resolve-build-plan.outputs.dev_pr_ref }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  frontend-pos:
    # Builds/pushes the dgfy-pos image -- see
    # infrastructure/docker/dgfy-pos/Dockerfile.
    needs: resolve-build-plan
    if: inputs.build_frontend_pos && needs.resolve-build-plan.outputs.should_build_dgfy_pos == 'true'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      app: dgfy-pos
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.image_tags }}
      runner_labels_json: ${{ inputs.runner_labels_json }}
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
      release_revision: ${{ fromJSON(needs.resolve-build-plan.outputs.revisions_json).dgfy-pos }}
      dev_pr_ref: ${{ needs.resolve-build-plan.outputs.dev_pr_ref }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  frontend-storefront:
    # Builds/pushes the dgfy-storefront image -- see
    # infrastructure/docker/dgfy-storefront/Dockerfile.
    needs: resolve-build-plan
    if: inputs.build_frontend_storefront && needs.resolve-build-plan.outputs.should_build_dgfy_storefront == 'true'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      app: dgfy-storefront
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.image_tags }}
      runner_labels_json: ${{ inputs.runner_labels_json }}
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
      release_revision: ${{ fromJSON(needs.resolve-build-plan.outputs.revisions_json).dgfy-storefront }}
      dev_pr_ref: ${{ needs.resolve-build-plan.outputs.dev_pr_ref }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  frontend-opis:
    # Builds/pushes the dgfy-opis image -- see
    # infrastructure/docker/dgfy-opis/Dockerfile (issue #2052).
    needs: resolve-build-plan
    if: inputs.build_frontend_opis && needs.resolve-build-plan.outputs.should_build_dgfy_opis == 'true'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      app: dgfy-opis
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.image_tags }}
      runner_labels_json: ${{ inputs.runner_labels_json }}
      candidate_source_sha: ${{ inputs.candidate_source_sha }}
      release_revision: ${{ fromJSON(needs.resolve-build-plan.outputs.revisions_json).dgfy-opis }}
      dev_pr_ref: ${{ needs.resolve-build-plan.outputs.dev_pr_ref }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  publish:
    needs: [ resolve-build-plan, dgfy-api, dgfy-migration-runner, frontend-ims, frontend-pos, frontend-storefront, frontend-opis ]
    # dgfy-api/dgfy-migration-runner/frontend-* are conditionally skipped
    # (build_api/build_frontend above, and now also #1610's resolve-build-plan verdict), and
    # `needs.<job>.result` on a skipped job is 'skipped', not 'success' -- so this can't require all
    # five to be 'success' like it used to. `!cancelled()` is required too: without a status-check
    # function here, a skipped need would skip this job as well. Publish goes ahead as long as
    # resolve-build-plan itself didn't fail outright (a whole-job crash, not a per-app skip -- see
    # that job's own comment) and none of the build jobs actually failed.
    #
    # #1610: dropped the "at least one build actually succeeded" OR-clause the previous version of
    # this condition had, mirroring deploy-main.yml's own fix -- every app being legitimately
    # skip-eligible (a true no-op re-dispatch) must still allow publish to proceed, not block it.
    if: >-
      inputs.publish && !cancelled() &&
      needs.resolve-build-plan.result == 'success' &&
      needs.dgfy-api.result != 'failure' &&
      needs.dgfy-migration-runner.result != 'failure' &&
      needs.frontend-ims.result != 'failure' &&
      needs.frontend-pos.result != 'failure' &&
      needs.frontend-storefront.result != 'failure' &&
      needs.frontend-opis.result != 'failure'
    uses: ./.github/workflows/publish-platform.yml
    with:
      environment: ${{ inputs.environment }}
      vpn_required: ${{ inputs.vpn_required }}
      runner_labels_json: ${{ inputs.runner_labels_json }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
