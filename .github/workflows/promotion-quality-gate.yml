name: Promotion Quality Gate

# Renamed from pr-quality-checks.yml (#1018/#1008 Phase 3). Was `workflow_dispatch`-only since
# 2026-08-14 (#416) -- permanently `if: false` in pr-checks.yml before that, since #338/#345 found
# its first full run took ~14min and it isn't path-filtered, so wiring it into every PR reproduced
# that cost on every push. #1015/#1016 (this epic's earlier phases) cut the backend test matrix
# from ~19.6min to ~2-4min and made the local release gate instrumented/selectable -- the thing
# that made this workflow too expensive to run automatically no longer holds at the old cost, so
# #927 ("where does this run in the promotion flow") is answered here: **once per promotion PR
# into `staging`/`main`, not per PR into `develop`.** The `pr-` prefix stopped fitting the moment
# that became true -- this file is not "a PR check", it's the CI-side half of the promotion gate,
# with `npm run gate:release:local` (invoked by `promoter`, see .agents/skills/promoter/SKILL.md)
# as the complementary local half. Deliberately NOT wired into `pr-checks.yml` or made to run on
# every PR into `develop` -- that would reproduce exactly the cost #416 removed it to avoid; the
# `gate` job below is what keeps this scoped to promotion PRs specifically.
#
# `workflow_call`/`workflow_dispatch` stay for the same reasons they always did: a future caller
# wanting this path-gated differently, and a manual full run against an arbitrary branch without
# waiting for a real promotion PR to open. Both bypass the `gate` job's promotion check entirely
# (see its own comment) -- that's intentional, matching how the original `workflow_dispatch` always
# ran unconditionally by hand.
#
# 2026-08-26 (#1063), temporary: the gate itself is suspected stale/unreliable (unclear whether
# it's outdated test scripts or something else) and needs dedicated investigation time Pat doesn't
# have right now. Two different relaxations, by leg:
#   - `to-staging/*` -> `staging` (the optional soak leg): every quality job below is skipped
#     entirely (`if: ... && needs.gate.outputs.is_staging_leg != 'true'`) -- no runner time spent,
#     no results at all on this leg until #1063 is resolved.
#   - `release/*` -> `main` (the default `develop -> main` promotion, and the `staging -> main` leg
#     of the optional soak), plus any `workflow_dispatch`/`workflow_call` run: every quality job
#     still runs in full, but `continue-on-error: true` -- a red run no longer blocks the merge.
# Net effect: there is currently no leg where a red run from this workflow blocks a promotion --
# said plainly rather than glossed over. This is meant to be temporary: once #1063 is resolved,
# drop the `is_staging_leg` exclusion from every `if:` and flip every `continue-on-error` back to
# unconditionally false (or remove it), and this comment goes with it.
# `scripts/check-pr-quality-workflow.js` enforces the *shape* of this exception (the exact `if:`
# and `continue-on-error:` pair below, not a blanket bypass) -- see that file's own comment for why
# a blanket forbid of `continue-on-error` was the previous state (#1003).
on:
  pull_request:
    branches:
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_call:
    inputs: &runner_labels_input
      runner_labels_json:
        description: >-
          JSON array passed to runs-on for quality jobs. Pinned to sieitz-lg
          (#923) -- dgfy-api-quality (2 service containers, 4GB heap) and
          frontend-quality (3 sequential vite builds + playwright chromium)
          are the two heaviest jobs in the repo.
        required: false
        type: string
        default: '["sieitz-lg"]'
  workflow_dispatch:
    inputs: *runner_labels_input

concurrency:
  # pull_request.number is unset for workflow_dispatch/workflow_call -- github.run_id is always
  # unique, so it falls back to "never cancel/collide with itself" for those triggers instead of
  # erroring on a blank group key.
  group: promotion-quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether this run is a real promotion PR. Mirrors
  # scripts/check-compliance-impact.js:219-222's PROMOTION_HEAD_PREFIX_BY_BASE literally (base
  # staging -> head prefix to-staging/, base main -> head prefix release/) rather than inventing a
  # second detection mechanism -- that file can't be `require()`d for its constant (it's a
  # run-to-completion script with no module.exports, not a module), so the two prefix pairs are
  # kept in sync by hand; scripts/check-pr-quality-workflow.js asserts both files still contain the
  # same literals so a future edit to one that isn't mirrored here fails CI instead of drifting
  # silently. A `workflow_dispatch`/`workflow_call` trigger always proceeds unconditionally -- same
  # behavior this workflow always had for those triggers, no promotion check applies to a manual
  # run or a reusable-workflow caller.
  gate:
    runs-on: ['sieitz-runner']
    timeout-minutes: 2
    outputs:
      is_promotion: ${{ steps.check.outputs.is_promotion }}
      # #1063: true only for the `staging` base / `to-staging/*` head shape -- the leg every
      # quality job below is skipped entirely on. Defaults to false everywhere else (the `main` leg,
      # and any workflow_dispatch/workflow_call run) -- those still run the jobs in full, but every
      # job is also unconditionally `continue-on-error: true` (see each job below), so they run
      # advisory too, not blocking.
      is_staging_leg: ${{ steps.check.outputs.is_staging_leg }}
    steps:
      - name: Determine whether this is a promotion PR
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "is_promotion=true" >> "$GITHUB_OUTPUT"
            echo "is_staging_leg=false" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event ($EVENT_NAME) -- proceeding unconditionally, not the staging leg (jobs still run advisory via continue-on-error, same as every other non-staging-leg run)"
            exit 0
          fi
          case "$BASE_REF" in
            staging)
              case "$HEAD_REF" in
                to-staging/*)
                  echo "is_promotion=true" >> "$GITHUB_OUTPUT"
                  echo "is_staging_leg=true" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;
            main)
              case "$HEAD_REF" in
                release/*)
                  echo "is_promotion=true" >> "$GITHUB_OUTPUT"
                  echo "is_staging_leg=false" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;
          esac
          echo "is_promotion=false" >> "$GITHUB_OUTPUT"
          echo "is_staging_leg=false" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_REF head=$HEAD_REF does not match a known promotion head prefix -- skipping quality jobs"

  dgfy-api-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs (advisory only, see
    # continue-on-error below) everywhere else -- see the workflow-level comment at the top of
    # this file.
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-api/package-lock.json
            apps/dgfy-migration-runner/package-lock.json

      - name: Install API dependencies
        working-directory: apps/dgfy-api
        run: npm ci

      - name: Install migration-runner dependencies
        working-directory: apps/dgfy-migration-runner
        run: npm ci

      - name: Prepare test schema
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Enforce modular architecture guardrails
        working-directory: apps/dgfy-api
        run: npm run check:architecture-guardrails

      - name: Enforce controller architecture boundaries
        working-directory: apps/dgfy-api
        run: npm run check:controller-boundaries

      - name: Run API lint
        working-directory: apps/dgfy-api
        run: npm run lint

      - name: Run dgfy-api test matrix
        working-directory: .
        run: node scripts/run-backend-test-matrix.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Run F&B contracts with open-handle diagnostics
        working-directory: apps/dgfy-api
        run: >-
          npm test -- --detectOpenHandles --runTestsByPath
          tests/fnbMode.usecases.test.js
          tests/posCheckoutFnbContracts.usecase.test.js
          tests/storeFnbModifiers.usecases.test.js
          tests/fnbModifierCondition.migration.test.js
          tests/storeValidator.fnbModifiers.test.js
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Audit required indexes
        working-directory: apps/dgfy-api
        run: npm run audit:indexes
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Upload API test-matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgfy-api-test-matrix-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/backend-test-matrix/**
          if-no-files-found: ignore
          retention-days: 5

  migration-runner-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs (advisory only, see
    # continue-on-error below) everywhere else -- see the workflow-level comment at the top of
    # this file.
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-migration-runner/package-lock.json

      - name: Install migration-runner dependencies
        working-directory: apps/dgfy-migration-runner
        run: npm ci

      - name: Apply migrations against a fresh MySQL schema
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

  # Split into one job per app (issue #322 Phase 6 -- previously one
  # frontend-quality job against the monolith apps/dgfy-web). The F&B
  # contract vitest list below is split by where each test actually lives
  # now: 6 of the original 7 are in packages/web-core (mounted by both
  # dgfy-ims and dgfy-pos, but vitest only ever runs from dgfy-ims -- see
  # dgfy-ims/vite.config.js's test.include -- to keep web-core dependency-
  # and node_modules-free); the 7th, storefrontErrorMessages.test.js, is
  # storefront's own local test.
  frontend-ims-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs (advisory only, see
    # continue-on-error below) everywhere else -- see the workflow-level comment at the top of
    # this file.
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-ims/package-lock.json

      - name: Install dgfy-ims dependencies
        working-directory: apps/dgfy-ims
        run: npm ci

      - name: Run dgfy-ims lint
        working-directory: apps/dgfy-ims
        run: npm run lint

      - name: Run shared F&B contract tests
        working-directory: apps/dgfy-ims
        run: >-
          npx vitest run
          ../../packages/web-core/src/features/fnb/__tests__/kitchenQueueDisplay.test.js
          ../../packages/web-core/src/features/fnb/__tests__/fnbMode.contract.test.js
          ../../packages/web-core/src/features/pos/__tests__/terminalViewModeContracts.test.js
          ../../packages/web-core/src/features/pos/__tests__/FnbModifierPickerDialog.test.jsx
          ../../packages/web-core/src/features/pos/__tests__/posFnbModifierManager.session.test.jsx
          ../../packages/web-core/src/features/pos/__tests__/serviceOptionsModal.contract.test.jsx
          ../../packages/web-core/src/config/__tests__/permissionsFrontendParity.test.js

  frontend-pos-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs (advisory only, see
    # continue-on-error below) everywhere else -- see the workflow-level comment at the top of
    # this file.
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-pos/package-lock.json

      - name: Install dgfy-pos dependencies
        working-directory: apps/dgfy-pos
        run: npm ci

      - name: Run dgfy-pos lint
        working-directory: apps/dgfy-pos
        run: npm run lint

  frontend-storefront-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs (advisory only, see
    # continue-on-error below) everywhere else -- see the workflow-level comment at the top of
    # this file.
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-storefront/package-lock.json

      - name: Install dgfy-storefront dependencies
        working-directory: apps/dgfy-storefront
        run: npm ci

      - name: Run dgfy-storefront lint
        working-directory: apps/dgfy-storefront
        run: npm run lint

      - name: Run storefront vitest suite
        working-directory: apps/dgfy-storefront
        run: npx vitest run

      - name: Build dgfy-storefront
        working-directory: apps/dgfy-storefront
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/dgfy-storefront
        run: npx playwright install --with-deps chromium

      - name: Run deterministic F&B browser contract
        working-directory: apps/dgfy-storefront
        run: npm run test:e2e:fnb-contract

      - name: Upload F&B browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnb-playwright-contract-${{ github.sha }}
          path: |
            apps/dgfy-storefront/playwright-report/fnb-contract/**
            apps/dgfy-storefront/test-results/fnb-contract/**
          if-no-files-found: ignore
          retention-days: 5

  repository-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs (advisory only, see
    # continue-on-error below) everywhere else -- see the workflow-level comment at the top of
    # this file.
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Validate blocking PR quality workflow contract
        run: npm run check:pr-quality-workflow

      - name: Run governed documentation lint
        run: npm run lint:docs

      - name: Run compatibility-seam contract gate
        run: npm run check:compat-seams

      # Guards the retired backend/frontend/android/apps-dgfy-web paths (issue
      # #914): a develop-based in-flight branch's PR could otherwise silently
      # reintroduce one of these -- git's directory-rename detection has no
      # signal for a brand-new subdirectory with no base counterpart (the
      # "silent reappearance" failure mode, documented five times in
      # docs/architecture/backend-absorption.md's changelog). --strict fails
      # this step, not just warns.
      - name: Check retired-path resurrection
        run: npm run report:frontend-split-sync:post-merge

      # PR-context only: github.event.pull_request.{base,head}.sha don't
      # exist under a plain workflow_dispatch run (this workflow is no
      # longer called with pull_request context by default -- see the on:
      # block comment above), so skip cleanly there instead of diffing two
      # empty SHAs.
      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"
