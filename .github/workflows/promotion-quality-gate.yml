        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-ims/package-lock.json

      - name: Install dgfy-ims dependencies
        continue-on-error: true
        id: install_ims_deps
        working-directory: apps/dgfy-ims
        run: npm ci
        timeout-minutes: 10

      # packages/web-core has no lint script/devDependencies of its own (ADR 0071 Decision 4
      # [binding] -- it must never get its own node_modules or test runner), so coverage runs from
      # dgfy-ims's already-installed ESLint via --resolve-plugins-relative-to, the same pattern the
      # "Run shared F&B contract tests" step below already uses for web-core's test suite. #918.
      # Blocking on the release/*->main leg since #1712 -- #1433/PR #1437 already downgraded every
      # remaining real ESLint error in packages/web-core to `warn` (13 react-hooks React-Compiler
      # diagnostics + 1 react/no-unescaped-entities), specifically to make this flip safe. Verified
      # live (not just inherited from #1433/#1437): a fresh `npx eslint ../../packages/web-core
      # --ext .js,.jsx --resolve-plugins-relative-to .` run turned up one further real error this
      # PR also fixes (`ResponsiveImage.jsx`'s `eslint-disable-next-line` sat 3 comment lines above
