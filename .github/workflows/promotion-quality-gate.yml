    # dgfy-api-quality's comments above for the release/* -> main-leg-only
    # reasoning (F-3) -- same logic applies here.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 15
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        continue-on-error: true
        id: setup_node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        continue-on-error: true
        id: install_repo_deps
        run: npm ci
        timeout-minutes: 10

      - name: Run governed documentation lint
        continue-on-error: true
        id: run_docs_lint
        run: npm run lint:docs
        # included as optional advisory evidence since #2236
        timeout-minutes: 5

      # ADR 0082 Decision 8 / #1278 PR 2 (Phase 298): validates a release/<candidate_id> -> main
      # candidate carries a matching docs/releases/notes/<candidate_id>.md (schema, candidate_id,
      # production_date, production_commit -- either pending or a real 40-hex SHA -- the app version
      # table, and the required Included/Operational notes sections). Exits 0 ("not applicable") on
      # any other head, including a main hotfix's fix/* branch -- that path stays a procedural
      # obligation on incident-responder's own SKILL.md, not this check (Decision 8's own "path
      # coverage" paragraph). Ships advisory (continue-on-error: true) on first landing, per
      # Decision 8's "advisory first, flip blocking only once clean-run evidence exists" rollout --
      # same pattern check:app-versions (ADR 0081 Decision 9) already went through in this repo.
      - name: Run release-notes check
        continue-on-error: true
        id: run_release_notes
        run: npm run check:release-notes
        timeout-minutes: 5

      # Guards the retired backend/frontend/android/apps-dgfy-web paths (issue
      # #914): a develop-based in-flight branch's PR could otherwise silently
      # reintroduce one of these -- git's directory-rename detection has no
      # signal for a brand-new subdirectory with no base counterpart (the
      # "silent reappearance" failure mode, documented five times in
      # docs/architecture/backend-absorption.md's changelog). --strict fails
      # this step, not just warns.
      - name: Check retired-path resurrection
        continue-on-error: true
        id: check_retired_path_resurrection
        run: npm run report:frontend-split-sync:post-merge
        timeout-minutes: 5

      # PR-context only: github.event.pull_request.{base,head}.sha don't
      # exist under a plain workflow_dispatch run (this workflow is no
      # longer called with pull_request context by default -- see the on:
      # block comment above), so skip cleanly there instead of diffing two
      # empty SHAs.
      # Blocking since 2026-09-04 (#1552): pure, deterministic, zero flake surface, git-native --
      # same class of check as the `validate_*` steps above -- and the root cause of its 6/13
      # recurrence (nothing upstream caught the violation before merge) is fixed via a new
      # `.husky/pre-commit` guard in the same PR; this step stays as the CI-side backstop for
      # `git commit --no-verify`. See docs/ops/RELEASE_CANDIDATE_POLICY.md's matching 2026-09-04
      # amendment.
      - name: Check changed-file whitespace
        continue-on-error: true
        id: check_whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"

      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install repository dependencies|${{ steps.install_repo_deps.outcome }}
            Run governed documentation lint|${{ steps.run_docs_lint.outcome }}
            Run release-notes check|${{ steps.run_release_notes.outcome }}
            Check retired-path resurrection|${{ steps.check_retired_path_resurrection.outcome }}
            Check changed-file whitespace|${{ steps.check_whitespace.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### repository-docs-quality step outcomes"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '{print "| " $1 " | " $2 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs after every quality job and records results as PR evidence. This is a
  # workflow_dispatch report job, not a required check or promotion gate.
  report-quality-evidence:
    needs:
      - dgfy-api-quality
      - migration-runner-quality
      - web-core-quality
      - frontend-pos-quality
      - frontend-storefront-quality
      - frontend-opis-quality
      - repository-dependency-quality
      - repository-ci-contracts-quality
      - repository-docs-quality
      - frontend-budgets-quality
      - pos-sales-e2e-quality
    if: always()
    # runs-on: ['ubuntu-latest']
    runs-on: ['sieitz-runner']
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - name: Check out the workflow revision
        id: checkout_reporter
        continue-on-error: true
        uses: actions/checkout@v7
      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."
      - name: Setup Node.js
        continue-on-error: true
        id: setup_reporter_node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root locked dependencies
        continue-on-error: true
        id: install_reporter_dependencies
        run: npm ci --ignore-scripts
      - name: Post advisory quality evidence to the associated PR
        id: post_quality_evidence
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DGFY_API_FAILURES: ${{ needs.dgfy-api-quality.outputs.real_failures }}
          MIGRATION_RUNNER_FAILURES: ${{ needs.migration-runner-quality.outputs.real_failures }}
          WEB_CORE_FAILURES: ${{ needs.web-core-quality.outputs.real_failures }}
          POS_FAILURES: ${{ needs.frontend-pos-quality.outputs.real_failures }}
          STOREFRONT_FAILURES: ${{ needs.frontend-storefront-quality.outputs.real_failures }}
          OPIS_FAILURES: ${{ needs.frontend-opis-quality.outputs.real_failures }}
          REPOSITORY_DEPENDENCY_FAILURES: ${{ needs.repository-dependency-quality.outputs.real_failures }}
          REPOSITORY_CI_CONTRACTS_FAILURES: ${{ needs.repository-ci-contracts-quality.outputs.real_failures }}
          REPOSITORY_DOCS_FAILURES: ${{ needs.repository-docs-quality.outputs.real_failures }}
          FRONTEND_BUDGETS_FAILURES: ${{ needs.frontend-budgets-quality.outputs.real_failures }}
          POS_SALES_E2E_FAILURES: ${{ needs.pos-sales-e2e-quality.outputs.real_failures }}
        run: node scripts/post-quality-suite-evidence.js --run-id "$RUN_ID"

  salvage-api-evidence:
    needs: [dgfy-api-quality]
    # 2026-08-31 (#1253): is_staging_leg exclusion added -- this job never carried it even before
    # #1124/#1165 (it was added by that same commit), but under #1253's intent (the staging leg
    # never runs this gate at all) it has nothing to salvage when dgfy-api-quality itself was
    # skipped; without this it would otherwise burn a 5-minute-timeout runner slot salvaging
    # evidence for a job that never ran (dgfy-api-quality.conclusion == 'skipped' would read as
    # needing salvage, per the needsSalvage check below).
    if: always()
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too -- BUT: co-location
    # invariant (F-2), binding. This job's active class MUST always match
    # dgfy-api-quality's active class above -- it recomputes and reads that job's
    # workspace path directly, which only exists on the same box under self-hosted.
    # Flipping this job hosted while dgfy-api-quality stays self-hosted (or vice
    # versa) breaks salvage silently (if-no-files-found: warn + continue-on-error --
    # no red check).
    #
    # Phase 234 Wave 0 (#1375) resolution: flipping both hosted does NOT silently
    # degrade #1124/#1165 evidence recovery to a no-op anymore. F-3 (verified against
    # the tree): the recommended re-implementation over actions/upload-artifact
    # (if: always()) already exists -- it's dgfy-api-quality's own "Upload API
    # test-matrix evidence" step below (L547-556) -- so that path was never actually
    # lost. What genuinely cannot be recovered on an ephemeral hosted runner is the
    # narrower case this job exists for: the job envelope dying mid-run, before any
    # step -- always() or not -- gets to execute (run 33241398956). That loss is
    # accepted, not fixed (a chunked/streaming upload redesign is out of proportion
    # to a residual this narrow); what shipped instead is a loudness guarantee -- see
    # the first step below, which fires only when this job lands on a hosted runner
    # and says so explicitly, rather than degrading silently the way the old
    # if-no-files-found: warn path did.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # #1375 (Phase 234 Wave 0): this job's real salvage capability only exists on the
      # self-hosted co-location box (see the header comment above) -- `runner.environment`
      # is the step-level context (`'github-hosted' | 'self-hosted'`) that can see which
      # class this specific run landed on; a job-level `if:` cannot read it at all, which
      # is why this is gated per-step rather than on the job. Fires only when this job's
      # `runs-on:` resolved hosted (the flipped-both case F-3 covers), and is loud, not
      # silent, about the residual: the below is the one case the F-3 fix does not cover.
      - name: Warn if evidence salvage is unavailable on this runner
        continue-on-error: true
        id: warn_salvage_unavailable_hosted
        if: runner.environment != 'self-hosted'
        run: |
          echo '::warning::salvage-api-evidence: cross-job evidence salvage is not available on an ephemeral hosted runner (runner.environment=${{ runner.environment }}). dgfy-api-quality'"'"'s own "if: always()" upload ("Upload API test-matrix evidence") remains the evidence path. The uncovered case is envelope-death only -- see #1375.'
          {
            echo '### `salvage-api-evidence`: unavailable on this (hosted) runner'
            echo ''
            echo 'This job landed on a GitHub-hosted runner, where cross-job evidence salvage is'
            echo 'definitionally unavailable -- an ephemeral VM'"'"'s job workspace does not persist'
            echo 'across jobs the way the self-hosted co-location box'"'"'s does.'
            echo ''
            echo '`dgfy-api-quality`'"'"'s own `if: always()` upload step ("Upload API test-matrix'
            echo 'evidence", this file) remains the evidence path and is unaffected.'
            echo ''
            echo 'The only case left uncovered is the job envelope dying mid-run, before any step --'
            echo '`always()` or not -- ever executes (run 33241398956). That loss is accepted, not'
            echo 'recovered here. See #1375.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Independently recomputes the same durable path dgfy-api-quality's matrix step resolved --
      # this is a separate job, so it has no access to that job's $GITHUB_ENV. Deterministic given
      # the same run id/attempt and the two jobs sharing a runner (see the assumptions above), so
      # recomputing here is correct, not fragile. `dirname "$RUNNER_WORKSPACE"` rather than a
      # literal `${{ runner.workspace }}/..` -- confirmed live (#1124/#1165, PR #1167 dispatch
      # verification) that actions/upload-artifact@v4 rejects any `path:` glob containing `..`.
      - name: Resolve durable evidence path
        continue-on-error: true
        id: resolve_evidence_path
        if: runner.environment == 'self-hosted'
        run: echo "RELEASE_GATES_EVIDENCE_ROOT=$(dirname "$RUNNER_WORKSPACE")/_dgfy_gate_evidence/${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Check dgfy-api-quality's real job conclusion
        continue-on-error: true
        id: check_api_quality_envelope
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: Number(process.env.RUN_ID),
            });
            const job = jobs.find((j) => j.name === 'dgfy-api-quality');
            const needsSalvage = Boolean(job) && job.conclusion !== 'success';
            core.setOutput('needs_salvage', String(needsSalvage));
            console.log(`dgfy-api-quality real conclusion: ${job?.conclusion ?? 'not found'} -> needs_salvage=${needsSalvage}`);

      - name: Upload salvaged API test-matrix evidence
        continue-on-error: true
        id: upload_salvaged_evidence
        if: runner.environment == 'self-hosted' && steps.check_api_quality_envelope.outputs.needs_salvage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dgfy-api-test-matrix-salvaged-${{ github.sha }}
          path: ${{ env.RELEASE_GATES_EVIDENCE_ROOT }}/**
          if-no-files-found: warn
          retention-days: 30

      - name: Sweep salvaged evidence
        continue-on-error: true
        id: sweep_salvaged_evidence
        if: always() && runner.environment == 'self-hosted'
        run: rm -rf "${{ env.RELEASE_GATES_EVIDENCE_ROOT }}"
