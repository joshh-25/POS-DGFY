        env:
          STEP_OUTCOMES: |
            Checkout|${{ steps.checkout.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-storefront dependencies|${{ steps.install_storefront_deps.outcome }}
            Run dgfy-storefront lint|${{ steps.run_storefront_lint.outcome }}
            Run storefront vitest suite|${{ steps.run_storefront_vitest.outcome }}
            Build dgfy-storefront|${{ steps.build_storefront.outcome }}
            Install Playwright Chromium|${{ steps.install_playwright.outcome }}
            Run deterministic F&B browser contract|${{ steps.run_fnb_browser_contract.outcome }}
            Upload F&B browser evidence|${{ steps.upload_fnb_browser_evidence.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  repository-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough).
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 15
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        id: install_repo_deps
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      # Name corrected 2026-08-26 (#1066 follow-up): this workflow's own quality checks stopped
      # being blocking under #1063, so "blocking" in this step's name was stale -- the contract it
      # validates (the sanctioned #1063 if:/continue-on-error: shape) isn't about blocking either.
      # Also now runs its own regression tests (RF-4): check:pr-quality-workflow was previously the
      # only thing that ran the validator; test:pr-quality-workflow existed in package.json but had
      # no call site, so its fixtures -- including the checkAdvisoryFailureReportingShape negative
      # cases added alongside this comment -- never actually ran anywhere.
      - name: Validate PR quality workflow contract
        id: validate_pr_quality_workflow
        run: npm run check:pr-quality-workflow && npm run test:pr-quality-workflow
        continue-on-error: true
        timeout-minutes: 5

      - name: Run governed documentation lint
        id: run_docs_lint
        run: npm run lint:docs
        continue-on-error: true
        timeout-minutes: 5

      - name: Run compatibility-seam contract gate
        id: run_compat_seams
        run: npm run check:compat-seams
        continue-on-error: true
        timeout-minutes: 5

      # Guards the retired backend/frontend/android/apps-dgfy-web paths (issue
      # #914): a develop-based in-flight branch's PR could otherwise silently
      # reintroduce one of these -- git's directory-rename detection has no
      # signal for a brand-new subdirectory with no base counterpart (the
      # "silent reappearance" failure mode, documented five times in
      # docs/architecture/backend-absorption.md's changelog). --strict fails
      # this step, not just warns.
      - name: Check retired-path resurrection
        id: check_retired_path_resurrection
        run: npm run report:frontend-split-sync:post-merge
        continue-on-error: true
        timeout-minutes: 5

      # PR-context only: github.event.pull_request.{base,head}.sha don't
      # exist under a plain workflow_dispatch run (this workflow is no
      # longer called with pull_request context by default -- see the on:
      # block comment above), so skip cleanly there instead of diffing two
      # empty SHAs.
      - name: Check changed-file whitespace
        id: check_whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        continue-on-error: true
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"

      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Checkout|${{ steps.checkout.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install repository dependencies|${{ steps.install_repo_deps.outcome }}
            Validate PR quality workflow contract|${{ steps.validate_pr_quality_workflow.outcome }}
            Run governed documentation lint|${{ steps.run_docs_lint.outcome }}
            Run compatibility-seam contract gate|${{ steps.run_compat_seams.outcome }}
            Check retired-path resurrection|${{ steps.check_retired_path_resurrection.outcome }}
            Check changed-file whitespace|${{ steps.check_whitespace.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  # 2026-08-26 (#1066 follow-up), added alongside the step-level continue-on-error fix above: since
  # every quality job's own `conclusion` now always reads success (that's the whole point of the fix
  # -- see the workflow-level comment), a red run's signal would otherwise be lost the moment nobody
  # happens to open this specific run by hand. This job reads each quality job's own `real_failures`
  # output (set by that job's own "Record real per-step outcomes" step, from steps.<id>.outcome --
  # NOT the Actions API's steps[].conclusion, which is post-override and would never show a failure
  # here; see the workflow-level comment's #1066 RF-1 note for why the first version of this job was
  # wrong) and files it where it won't be lost: one comment on #1063 (already the standing tracking
  # issue for "this gate is unreliable, needs investigation"), not a new issue per run -- avoids
  # issue-spam across retries while still leaving a paper trail to pick up later. Deduped per commit
  # SHA (skips if #1063 already carries a comment for this SHA) so a re-run or a `workflow_dispatch`
  # retry against the same commit doesn't pile up duplicates. The reporting step itself carries
  # `continue-on-error: true` (#1066 RF-2) so a `gh` API hiccup here doesn't turn this job's own
  # check-run red -- the one thing this job must never do is become a new blocking check itself.
  report-advisory-failures:
    needs:
      - gate
      - dgfy-api-quality
      - migration-runner-quality
      - frontend-ims-quality
      - frontend-pos-quality
      - frontend-storefront-quality
      - repository-quality
    if: >-
      always() && needs.gate.outputs.is_promotion == 'true' &&
      needs.gate.outputs.is_staging_leg != 'true'
    runs-on: ['sieitz-runner']
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report real quality-job failures on #1063
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
          DGFY_API_FAILURES: ${{ needs.dgfy-api-quality.outputs.real_failures }}
          MIGRATION_RUNNER_FAILURES: ${{ needs.migration-runner-quality.outputs.real_failures }}
          IMS_FAILURES: ${{ needs.frontend-ims-quality.outputs.real_failures }}
          POS_FAILURES: ${{ needs.frontend-pos-quality.outputs.real_failures }}
          STOREFRONT_FAILURES: ${{ needs.frontend-storefront-quality.outputs.real_failures }}
          REPOSITORY_FAILURES: ${{ needs.repository-quality.outputs.real_failures }}
        run: |
          set -uo pipefail

          FAILURES=""
          add_if_present() {
            local job_name="$1" value="$2"
            if [ -n "$value" ]; then
              FAILURES="${FAILURES}- **${job_name}**: ${value}
          "
            fi
          }
          add_if_present "dgfy-api-quality" "$DGFY_API_FAILURES"
          add_if_present "migration-runner-quality" "$MIGRATION_RUNNER_FAILURES"
          add_if_present "frontend-ims-quality" "$IMS_FAILURES"
          add_if_present "frontend-pos-quality" "$POS_FAILURES"
          add_if_present "frontend-storefront-quality" "$STOREFRONT_FAILURES"
          add_if_present "repository-quality" "$REPOSITORY_FAILURES"

          if [ -z "$FAILURES" ]; then
            echo "No real step failures reported by any quality job this run -- nothing to report."
            exit 0
          fi

          # --jq is gh's own bundled jq engine -- no standalone jq binary dependency.
          ALREADY_REPORTED=$(gh issue view 1063 --json comments \
            --jq ".comments[] | select(.body | contains(\"sha=${HEAD_SHA}\")) | .id" | head -1)
          if [ -n "$ALREADY_REPORTED" ]; then
            echo "Already reported for sha=${HEAD_SHA} (comment ${ALREADY_REPORTED}) -- skipping duplicate."
            exit 0
          fi

          {
            echo "<!-- promotion-quality-gate-advisory-failure sha=${HEAD_SHA} run=${RUN_ID} -->"
            echo "### promotion-quality-gate advisory failure(s) -- \`${HEAD_SHA}\`"
            echo
            echo "These quality jobs are advisory (\`continue-on-error: true\` on every step, #1066"
            echo "correction) so this run did not block the merge -- but real steps failed. Filed"
            echo "here automatically so it isn't lost; not a substitute for #1063's own root-cause."
            echo
            echo "Run: https://github.com/${REPO}/actions/runs/${RUN_ID}"
            if [ -n "$PR_URL" ]; then
              echo "PR: ${PR_URL}"
            fi
            echo
            echo "$FAILURES"
          } > /tmp/advisory-failure-comment.md

          gh issue comment 1063 --body-file /tmp/advisory-failure-comment.md
