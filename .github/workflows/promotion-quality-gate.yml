name: Promotion Quality Gate

# Operator-dispatched evidence suite. No pull_request trigger is intentional: the operator chooses
# whether to run these checks and which candidate branch to inspect. Every user step is advisory;
# promotion eligibility remains governed by pr-checks.yml, compliance preflight, merge safety, and
# the production tenant-schema report. See docs/ops/RELEASE_CANDIDATE_POLICY.md.

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for quality jobs.
        required: false
        type: string
        # default: '["ubuntu-latest"]'
        default: '["sieitz-lg"]'

concurrency:
  # Each operator dispatch has its own group; a later dispatch does not cancel an earlier run.
  group: promotion-quality-gate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dgfy-api-quality:
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough) -- including the mysql/redis containers below, now started and
    # waited-on as ordinary steps rather than the runner's own `services:` mechanism, so they're
    # covered too (2026-08-26 #1066 follow-up, see that same comment).
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too. The `|| '["sieitz-lg"]'`
    # fallback literal is reached only on the release/* -> main leg (see the
    # workflow_dispatch input above) -- flipping it routes
    # exactly the prod promotion leg, by construction, no if:/matrix conditional
    # needed or wanted. salvage-api-evidence below MUST always carry this job's same
    # active class -- see that job's own comment for why.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 45
    outputs:
      # #1066 RF-1: the *real* per-step outcome, read from steps.<id>.outcome (survives
      # continue-on-error) by the "Record real per-step outcomes" step below -- consumed directly by
      # report-quality-evidence via needs.<job>.outputs.real_failures, supplemented by job conclusions from the Actions
      # API (whose steps[].conclusion is post-override and would never show a failure here).
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # #1066 RF-2: mysql/redis used to be GitHub's built-in `services:` containers, provisioned by
      # the runner-generated "Initialize containers" step BEFORE any user step (even an
      # `if: always()` one) runs -- no continue-on-error, job- or step-level, reaches that phase, so
      # a container failing its own health check still left this job's check-run red regardless of
      # every other fix in this file. Replaced with explicit steps so container start/wait is itself
      # a step continue-on-error can absorb and record_outcomes can report. Same images/env/ports/
      # health commands as the services: blocks they replace. Only one runner in this repo carries
      # the sieitz-lg label and a self-hosted runner runs one job at a time (confirmed live via
      # `gh api repos/.../actions/runners`), so dgfy-api-quality and migration-runner-quality can
      # never contend for the fixed 3306/6379 ports -- ephemeral ports would be unneeded complexity
      # here. The one real hazard `services:` had no defence against: `concurrency:
      # cancel-in-progress: true` (see top of file) can kill a running job mid-container-lifetime,
      # leaking a container that still holds the port for the next run -- start_services below
      # sweeps by label before starting anything, which is strictly more robust than what it
      # replaces, not just non-blocking.
      - name: Start service containers
        continue-on-error: true
        id: start_services
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker ps -aq --filter "label=dgfy-ci-quality-gate=1" | xargs -r docker rm -f
          docker run -d --name "$MYSQL_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -e MYSQL_ROOT_PASSWORD=testpassword \
            -e MYSQL_DATABASE=sku_inventory_manager_test \
            -p 3306:3306 \
            mysql:8.0
          docker run -d --name "$REDIS_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for service containers
        continue-on-error: true
        id: wait_services
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for _ in $(seq 1 12); do
            docker exec "$MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword && mysql_ready=1 && break
            sleep 10
          done
          for _ in $(seq 1 12); do
            docker exec "$REDIS_CONTAINER" redis-cli ping && redis_ready=1 && break
            sleep 10
          done
          [ -n "${mysql_ready:-}" ] && [ -n "${redis_ready:-}" ]

      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        continue-on-error: true
        id: setup_node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-api/package-lock.json
            apps/dgfy-migration-runner/package-lock.json

      - name: Install API dependencies
        continue-on-error: true
        id: install_api_deps
        working-directory: apps/dgfy-api
        run: npm ci
        timeout-minutes: 10

      - name: Install migration-runner dependencies
        continue-on-error: true
        id: install_migration_runner_deps
        working-directory: apps/dgfy-migration-runner
        run: npm ci
        timeout-minutes: 10

      - name: Prepare test schema
        continue-on-error: true
        id: prepare_test_schema
        # #1066 RF-2: skip rather than cascade into a confusing connection-refused failure if the
        # replacement containers above never came up -- wait_services.outcome already recorded the
        # real cause; this and the other three DB-touching steps below would otherwise all report
        # their own (misleading, redundant) failure for the same one root cause.
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        timeout-minutes: 10
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      # #1431 Phase 2 (gate 8, runtime.doctor): dgfy-api-quality, not migration-runner-quality --
      # that job never runs `npm ci` in apps/dgfy-api, so doctor-runtime.js (ESM, imports
      # sequelize + dotenv from the API tree) cannot run there; this job already installs the API
      # deps and already migrates the same mysql:8.0 container ("Prepare test schema" above).
      # NODE_ENV: test is required -- doctor-runtime.js defaults it to development, which would
      # send resolveDatabaseName() at sku_inventory_manager instead of DB_NAME_TEST.
      # #1431 Phase C (2026-09-03): blocking -- workflow_dispatch evidence (clean pass, fault-probe
      # real fail, see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md) confirmed this step fails for real
      # on a genuine defect.
      - name: Run runtime schema doctor
        continue-on-error: true
        id: run_runtime_doctor
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-api
        run: npm run doctor:runtime
        timeout-minutes: 5
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Enforce modular architecture guardrails
        continue-on-error: true
        id: enforce_arch_guardrails
        working-directory: apps/dgfy-api
        run: npm run check:architecture-guardrails
        # included as optional advisory evidence since #2236
        timeout-minutes: 5

      - name: Enforce controller architecture boundaries
        continue-on-error: true
        id: enforce_controller_boundaries
        working-directory: apps/dgfy-api
        run: npm run check:controller-boundaries
        # included as optional advisory evidence since #2236
        timeout-minutes: 5

      - name: Run API lint
        continue-on-error: true
        id: run_api_lint
        working-directory: apps/dgfy-api
        run: npm run lint
        # included as optional advisory evidence since #2236
        timeout-minutes: 5

      # #1124/#1165: three durability fixes landed on this step together, all responding to run
      # 33241398956 (a real `release/*->main` promotion) where this step finished in 3 minutes
      # (vs ~19 healthy) and the *next* step then killed the whole job 3 seconds in -- destroying
      # every downstream step, including the artifact upload, and leaving zero evidence of what
      # failed.
      #   1. RELEASE_TARGET_SHA pins the matrix's own evidence directory to the same SHA the
      #      "Upload API test-matrix evidence" step's `path:` uses (github.sha) -- previously these
      #      coincided only by construction (both happen to resolve to the checked-out HEAD on a
      #      pull_request/workflow_dispatch run) rather than by a shared value, a landmine for any
      #      future caller that passes a different ref.
      #   2. RELEASE_GATES_EVIDENCE_ROOT points the script at a durable, job-workspace-external
      #      directory instead of the default `.tmp/release-gates` (which dies with the job) --
      #      salvage-api-evidence (bottom of this file) uploads straight from there even if this
      #      step itself is killed mid-run, and #1124's persist-after-every-chunk change to the
      #      script means a partial JSON survives that too. `dirname "$RUNNER_WORKSPACE"` is
      #      `_work`'s parent, not `runner.temp` (`_work/_temp`) -- the latter is wiped per job,
      #      the former isn't (confirmed by this file's own long-standing reliance on a fixed
      #      3306/6379 port pair surviving across jobs on the same runner). Resolved via shell
      #      (`dirname`) into `$GITHUB_ENV` rather than written as `${{ runner.workspace }}/..`
      #      directly in YAML -- confirmed live (#1124/#1165, PR #1167 dispatch verification) that
      #      `actions/upload-artifact@v4` rejects any `path:` glob containing a literal `..`
      #      ("Relative pathing '.' and '..' is not allowed"), so the artifact upload step below
      #      needs an already-resolved, `..`-free absolute path to reference.
      #   3. The step summary write (scripts/summarize-backend-test-matrix.js) makes this step's
      #      own result visible in the GitHub Checks UI's summary panel even if it's the *next*
      #      step that kills the job -- $GITHUB_STEP_SUMMARY is flushed when a step ends, which
      #      this step reaches even on run 33241398956's exact failure shape.
      - name: Run dgfy-api test matrix
        continue-on-error: true
        id: run_test_matrix
        if: steps.wait_services.outcome == 'success'
        working-directory: .
        run: |
          set +e
          echo "RELEASE_GATES_EVIDENCE_ROOT=$(dirname "$RUNNER_WORKSPACE")/_dgfy_gate_evidence/${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          export RELEASE_GATES_EVIDENCE_ROOT="$(dirname "$RUNNER_WORKSPACE")/_dgfy_gate_evidence/${{ github.run_id }}-${{ github.run_attempt }}"
          node scripts/run-backend-test-matrix.js
          status=$?
          node scripts/summarize-backend-test-matrix.js >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
        # #1124/#986: raised from 30 to 35 alongside flipping the test matrix's own default to
        # continue-on-failure (every db-tier group now runs instead of stopping at the first
        # failure) -- deliberately NOT raising the 45-minute job timeout to match. Keeping the step
        # timeout as the first tripwire means a runaway run is still absorbed by this step's own
        # continue-on-error instead of taking down the whole job via the job-level timeout, which
        # continue-on-error cannot soften.
        timeout-minutes: 35
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
          RELEASE_TARGET_SHA: ${{ github.sha }}
          # #1432: this hosted runner is 2-vCPU on a private repo, so Jest's own
          # getMaxWorkers() resolves to 1 and shouldRunInBand() then runs the entire
          # 616-file fast tier in one in-band process, whose single heap OOMs partway
          # through. Forcing >=2 workers flips it out of in-band; the memory limit
          # bounds each worker's heap so it recycles instead of growing unbounded.
          # This is a concurrency fix, not a heap-size one -- see #1432's plan for why
          # raising NODE_OPTIONS further does not address the actual cause.
          BACKEND_TEST_MATRIX_FAST_MAX_WORKERS: 2
          BACKEND_TEST_MATRIX_FAST_WORKER_IDLE_MEMORY_LIMIT: 1G

      - name: Run F&B contracts with open-handle diagnostics
        continue-on-error: true
        id: run_fnb_contracts
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-api
        run: >-
          npm test -- --detectOpenHandles --runTestsByPath
          tests/fnbMode.usecases.test.js
          tests/posCheckoutFnbContracts.usecase.test.js
          tests/storeFnbModifiers.usecases.test.js
          tests/fnbModifierCondition.migration.test.js
          tests/storeValidator.fnbModifiers.test.js
        timeout-minutes: 10
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      # 2026-09-04 (#1552): root cause confirmed via direct log evidence (run 33540494543, job
      # 99965311245) -- an orphaned `test_tenant_schema-bootstrap-idempotent_*` fixture (sync()-built,
      # not migration-built, so genuinely missing indexes) survives into this step only when the
      # preceding test-matrix step's process dies before its own afterEach cleanup runs (#1432's
      # already-tracked OOM class), then gets audited as if it were a real tenant.
      # SCHEMA_INDEX_AUDIT_MODE/SCHEMA_INDEX_AUDIT_EXCLUDE_TEST_TENANTS below activate the exclusion
      # filter this exact scenario already exists for and is already unit-tested
      # (schemaIndexAuditService.test.js) and already used locally (`audit:indexes:local`) -- this
      # step was simply the one caller that never turned it on. Config-only fix, zero new logic.
      # Stays advisory (continue-on-error kept) pending one post-fix evidence cycle -- see
      # docs/ops/RELEASE_CANDIDATE_POLICY.md's matching 2026-09-04 amendment for the explicit
      # unblock criterion.
      - name: Audit required indexes
        continue-on-error: true
        id: audit_indexes
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-api
        run: npm run audit:indexes
        timeout-minutes: 10
        env:
          NODE_ENV: test
          SCHEMA_INDEX_AUDIT_MODE: test
          SCHEMA_INDEX_AUDIT_EXCLUDE_TEST_TENANTS: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      # #1124: path now points at RELEASE_GATES_EVIDENCE_ROOT (the same durable dir the matrix step
      # itself was pointed at above), not the job-workspace-relative `.tmp/release-gates` -- one
      # source of truth, not a mirror that can drift. `if-no-files-found` flipped from `ignore` to
      # `error`: a missing artifact is itself real signal ("the matrix produced nothing"), and
      # `ignore` is exactly what turned that into total silence on run 33241398956 -- an `error`
      # here still can't block anything (continue-on-error, plus record_outcomes below reports it as
      # a real failure instead of dropping it). retention-days raised 5->30 to match this file's
      # other long-lived evidence uploads (build-android-manual.yml, compliance-preflight-sweep.yml)
      # -- this is promotion evidence, not routine per-push scratch. The `steps.run_test_matrix...`
      # guard on `if:` keeps a legitimately-skipped matrix (services never came up) from being
      # reported as a missing-artifact failure it isn't.
      - name: Upload API test-matrix evidence
        continue-on-error: true
        id: upload_test_matrix_evidence
        if: always() && steps.run_test_matrix.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: dgfy-api-test-matrix-${{ github.sha }}
          path: ${{ env.RELEASE_GATES_EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Stop service containers
        continue-on-error: true
        id: stop_services
        if: always()
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
        # Best-effort teardown, deliberately not part of STEP_OUTCOMES below: `docker rm -f` on a
        # container that already exited or was already removed by another cleanup path returns a
        # non-zero exit that has nothing to do with this job's real result -- reporting it to #1063
        # would be exactly the false-positive noise this whole mechanism exists to avoid. `|| true`
        # on each removal keeps this step itself from ever reporting `failure`.
        run: |
          docker rm -f "$MYSQL_CONTAINER" 2>/dev/null || true
          docker rm -f "$REDIS_CONTAINER" 2>/dev/null || true

      # #1066 RF-1: steps.<id>.outcome is the pre-override raw result -- the one field that still
      # says "failure" even when that same step's continue-on-error swallowed it for the job's own
      # conclusion. Explicit id-by-id (GitHub Actions has no "list every step in this job" runtime
      # enumeration), one line per step above. Container start/wait are now steps too (RF-2, no
      # longer a runner-generated "Initialize containers" phase outside continue-on-error's reach --
      # see the workflow-level comment) so they're included below; stop_services is deliberately
      # excluded, see its own comment.
      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
          STEP_OUTCOMES: |
            Start service containers|${{ steps.start_services.outcome }}
            Wait for service containers|${{ steps.wait_services.outcome }}
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install API dependencies|${{ steps.install_api_deps.outcome }}
            Install migration-runner dependencies|${{ steps.install_migration_runner_deps.outcome }}
            Prepare test schema|${{ steps.prepare_test_schema.outcome }}
            Run runtime schema doctor|${{ steps.run_runtime_doctor.outcome }}
            Enforce modular architecture guardrails|${{ steps.enforce_arch_guardrails.outcome }}
            Enforce controller architecture boundaries|${{ steps.enforce_controller_boundaries.outcome }}
            Run API lint|${{ steps.run_api_lint.outcome }}
            Run dgfy-api test matrix|${{ steps.run_test_matrix.outcome }}
            Run F&B contracts with open-handle diagnostics|${{ steps.run_fnb_contracts.outcome }}
            Audit required indexes|${{ steps.audit_indexes.outcome }}
            Upload API test-matrix evidence|${{ steps.upload_test_matrix_evidence.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  migration-runner-quality:
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough) -- including the mysql container below, now started and
    # waited-on as an ordinary step rather than the runner's own `services:` mechanism, so it's
    # covered too (2026-08-26 #1066 follow-up, see that same comment).
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too. See gate/
    # dgfy-api-quality's comments above for the release/* -> main-leg-only
    # reasoning (F-3) -- same logic applies here.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 20
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # #1066 RF-2: see dgfy-api-quality's identical comment above -- same replacement, same
      # reasoning, one fewer container (no redis here).
      - name: Start service containers
        continue-on-error: true
        id: start_services
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-migrun-mysql-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker ps -aq --filter "label=dgfy-ci-quality-gate=1" | xargs -r docker rm -f
          docker run -d --name "$MYSQL_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -e MYSQL_ROOT_PASSWORD=testpassword \
            -e MYSQL_DATABASE=sku_inventory_manager_test \
            -p 3306:3306 \
            mysql:8.0

      - name: Wait for service containers
        continue-on-error: true
        id: wait_services
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-migrun-mysql-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for _ in $(seq 1 12); do
            docker exec "$MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword && mysql_ready=1 && break
            sleep 10
          done
          [ -n "${mysql_ready:-}" ]

      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
