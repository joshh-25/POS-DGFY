name: Promotion Quality Gate

# Renamed from pr-quality-checks.yml (#1018/#1008 Phase 3). Was `workflow_dispatch`-only since
# 2026-08-14 (#416) -- permanently `if: false` in pr-checks.yml before that, since #338/#345 found
# its first full run took ~14min and it isn't path-filtered, so wiring it into every PR reproduced
# that cost on every push. #1015/#1016 (this epic's earlier phases) cut the backend test matrix
# from ~19.6min to ~2-4min and made the local release gate instrumented/selectable -- the thing
# that made this workflow too expensive to run automatically no longer holds at the old cost, so
# #927 ("where does this run in the promotion flow") is answered here: **once per promotion PR
# into `staging`/`main`, not per PR into `develop`.** The `pr-` prefix stopped fitting the moment
# that became true -- this file is not "a PR check", it's the CI-side half of the promotion gate,
# with `npm run gate:release:local` (invoked by `promoter`, see .agents/skills/promoter/SKILL.md)
# as the complementary local half. Deliberately NOT wired into `pr-checks.yml` or made to run on
# every PR into `develop` -- that would reproduce exactly the cost #416 removed it to avoid; the
# `gate` job below is what keeps this scoped to promotion PRs specifically.
#
# `workflow_call`/`workflow_dispatch` stay for the same reasons they always did: a future caller
# wanting this path-gated differently, and a manual full run against an arbitrary branch without
# waiting for a real promotion PR to open. Both bypass the `gate` job's promotion check entirely
# (see its own comment) -- that's intentional, matching how the original `workflow_dispatch` always
# ran unconditionally by hand.
#
# 2026-08-26 (#1063), temporary: the gate itself is suspected stale/unreliable (unclear whether
# it's outdated test scripts or something else) and needs dedicated investigation time Pat doesn't
# have right now. Two different relaxations, by leg:
#   - `to-staging/*` -> `staging` (the optional soak leg): every quality job below is skipped
#     entirely (`if: ... && needs.gate.outputs.is_staging_leg != 'true'`) -- no runner time spent,
#     no results at all on this leg until #1063 is resolved.
#   - `release/*` -> `main` (the default `develop -> main` promotion, and the `staging -> main` leg
#     of the optional soak), plus any `workflow_dispatch`/`workflow_call` run: every quality job
#     still runs in full.
# Net effect: there is currently no leg where a red run from this workflow blocks a promotion on a
# real step-level failure -- said plainly rather than glossed over. See the 2026-08-26 #1066
# corrections below for what "blocks" means precisely, and for the narrow set of things (job-
# envelope failures, cancellation, runner unavailability) that remain genuinely outside this file's
# control. This is meant to be temporary: once #1063 is resolved, drop the `is_staging_leg`
# exclusion from every `if:` and remove every `continue-on-error` (job- and step-level both), and
# this whole comment block.
# `scripts/check-pr-quality-workflow.js` enforces the *shape* of this exception (the exact `if:`
# and `continue-on-error:` pairs below, not a blanket bypass) -- see that file's own comment for why
# a blanket forbid of `continue-on-error` was the previous state (#1003).
#
# 2026-08-26 (#1066, RF-1/RF-2 pr-reviewer findings on PR #1068), two corrections:
#
# 1. Job-level `continue-on-error: true` alone (the original #1063/#1064 shape, still present below)
#    does NOT make a red run show green, and does not clear a PR's `mergeStateStatus`. Confirmed
#    live on PR #1066 (`gh api .../actions/runs/<id>/jobs`): job-level `continue-on-error` only
#    spares the *workflow run's own conclusion* -- the individual job/check-run this workflow
#    publishes to the PR still reports its real `conclusion: failure` when a step inside it fails,
#    and GitHub computes `mergeStateStatus` from each check run's own conclusion, not the workflow's
#    rollup. Fix: every step inside every quality job below now *also* carries its own
#    `continue-on-error: true` -- GitHub Actions only rolls a step's failure into the job's own
#    conclusion when that specific step lacks it, which is the actual mechanism for a job's
#    check-run to report `success` regardless of what happens inside it. The job-level line stays
#    too (harmless, keeps `scripts/check-pr-quality-workflow.js`'s original shape guard intact) but
#    was never sufficient by itself.
#
# 2. The first attempt at a `report-advisory-failures` job (below) tried to re-derive real failures
#    from the Actions Jobs API's `steps[].conclusion` field. pr-reviewer (PR #1068, RF-1) caught
#    that this is wrong and confirmed it independently against this repo's own run `32620370627`:
#    `steps[].conclusion` is the *post-override* value (matches the `conclusion` context, not
#    `outcome`) -- a step with `continue-on-error: true` that genuinely fails still reports
#    `conclusion: "success"` via that API. The Jobs-API approach was therefore dead code that would
#    never detect any of the failures this workflow now swallows. Fixed: each quality job now has a
#    "Record real per-step outcomes" step (`if: always()`) that reads `steps.<id>.outcome` (the
#    *pre-override* raw result -- the one field that actually survives `continue-on-error`) for each
#    of its own steps by explicit id, and exposes a job output (`real_failures`) that
#    `report-advisory-failures` reads directly via `needs.<job>.outputs.real_failures` -- no Actions
#    API call needed for detection at all anymore.
#
# 3. (RF-2, pr-reviewer's second PR #1068 blocker) The prior version of this file left the
#    `mysql`/`redis` `services:` blocks on `dgfy-api-quality`/`migration-runner-quality` as a
#    documented "known, accepted residual gap" -- GitHub's own service-container health check
#    happens during job *provisioning*, before any step (even `if: always()`) runs, so no
#    continue-on-error at any level could reach it, and a failing container still left the job's
#    check-run red. The reviewer correctly refused a PR-body "accepted" declaration as a substitute
#    for actually fixing it. Fix: both `services:` blocks are replaced with ordinary steps
#    ("Start service containers" / "Wait for service containers" / "Stop service containers") that
#    do the same docker run + health-check-polling `services:` did internally, but as steps this
#    file's own continue-on-error and record_outcomes mechanism can absorb and report like any
#    other. Confirmed safe against a same-host port collision: only one runner in this repo carries
#    the `sieitz-lg` label and a self-hosted runner runs one job at a time (`gh api
#    repos/.../actions/runners`), so the two jobs below can never contend for the fixed 3306/6379
#    ports -- ephemeral per-run ports would be unneeded complexity here. `start_services` also
#    sweeps any same-labelled leftover container before starting new ones, which `services:` itself
#    had no way to do -- a real (if never yet observed) hazard given this workflow's own
#    `concurrency: cancel-in-progress: true` (below) can kill a job mid-container-lifetime. Every
#    step in both jobs, and every long-running step across the rest of this file, now also carries
#    its own `timeout-minutes` (a **job**-level timeout kills the job with no continue-on-error
#    reaching it either -- the same shape of gap as the service containers, just less obvious).
#
# **What can still turn a check-run non-green, said plainly rather than glossed over:** after the
# fix above, no *user step*, *service container*, or *step timeout* can. What remains outside any
# continue-on-error's reach: the `gate` job's own step failing (its outputs stay empty and every
# quality job below is skipped rather than shown red -- a different, also-named failure mode, not a
# silent gap, see that job's own comment), the `report-advisory-failures` job envelope itself (its
# one step is continue-on-error, the job is not), a job-level `timeout-minutes` expiry as a
# last-resort backstop once a step's own timeout has already been exceeded, workflow/job
# cancellation (this file's own `concurrency: cancel-in-progress: true` -- benign in the normal case
# since the cancelled check-run belongs to the superseded SHA, not the PR's current head), and
# runner unavailability (a queued job is a pending check, not a red one, but AGENTS.md's Merge
# Safety rule treats a pending check as a hard stop too). None of these are addressed by this fix;
# naming them here is the difference between "accepted in a PR body" (what the reviewer correctly
# rejected) and "documented where the governed claim actually lives." For the record: GitHub's own
# `Initialize containers` step has never actually failed in this workflow's run history as of this
# writing -- this fix closes a real mechanism gap that had not yet been observed to fire, not an
# incident postmortem.
on:
  pull_request:
    branches:
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_call:
    inputs: &runner_labels_input
      runner_labels_json:
        description: >-
          JSON array passed to runs-on for quality jobs. Pinned to sieitz-lg
          (#923) -- dgfy-api-quality (2 docker-run mysql/redis containers, 4GB heap) and
          frontend-quality (3 sequential vite builds + playwright chromium)
          are the two heaviest jobs in the repo.
        required: false
        type: string
        default: '["sieitz-lg"]'
  workflow_dispatch:
    inputs: *runner_labels_input

concurrency:
  # pull_request.number is unset for workflow_dispatch/workflow_call -- github.run_id is always
  # unique, so it falls back to "never cancel/collide with itself" for those triggers instead of
  # erroring on a blank group key.
  group: promotion-quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether this run is a real promotion PR. Mirrors
  # scripts/check-compliance-impact.js:219-222's PROMOTION_HEAD_PREFIX_BY_BASE literally (base
  # staging -> head prefix to-staging/, base main -> head prefix release/) rather than inventing a
  # second detection mechanism -- that file can't be `require()`d for its constant (it's a
  # run-to-completion script with no module.exports, not a module), so the two prefix pairs are
  # kept in sync by hand; scripts/check-pr-quality-workflow.js asserts both files still contain the
  # same literals so a future edit to one that isn't mirrored here fails CI instead of drifting
  # silently. A `workflow_dispatch`/`workflow_call` trigger always proceeds unconditionally -- same
  # behavior this workflow always had for those triggers, no promotion check applies to a manual
  # run or a reusable-workflow caller.
  gate:
    runs-on: ['sieitz-runner']
    timeout-minutes: 2
    outputs:
      is_promotion: ${{ steps.check.outputs.is_promotion }}
      # #1063: true only for the `staging` base / `to-staging/*` head shape -- the leg every
      # quality job below is skipped entirely on. Defaults to false everywhere else (the `main` leg,
      # and any workflow_dispatch/workflow_call run) -- those still run the jobs in full, but every
      # step in every job carries its own `continue-on-error: true` (2026-08-26 #1066 correction --
      # see the workflow-level comment above; job-level alone doesn't achieve this), so they run
      # advisory too, not blocking.
      is_staging_leg: ${{ steps.check.outputs.is_staging_leg }}
    steps:
      # 2026-08-26 (#1066 follow-up): this step is now also continue-on-error, closing the last
      # user-controllable step in the workflow that wasn't. If it genuinely fails, its outputs stay
      # empty, every quality job's `if:` above evaluates false, and the PR shows no quality
      # check-runs at all this run -- a different failure mode than a red one, named honestly rather
      # than left as a silent gap; see the workflow-level comment.
      - name: Determine whether this is a promotion PR
        id: check
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "is_promotion=true" >> "$GITHUB_OUTPUT"
            echo "is_staging_leg=false" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event ($EVENT_NAME) -- proceeding unconditionally, not the staging leg (jobs still run advisory via continue-on-error, same as every other non-staging-leg run)"
            exit 0
          fi
          case "$BASE_REF" in
            staging)
              case "$HEAD_REF" in
                to-staging/*)
                  echo "is_promotion=true" >> "$GITHUB_OUTPUT"
                  echo "is_staging_leg=true" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;
            main)
              case "$HEAD_REF" in
                release/*)
                  echo "is_promotion=true" >> "$GITHUB_OUTPUT"
                  echo "is_staging_leg=false" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              ;;
          esac
          echo "is_promotion=false" >> "$GITHUB_OUTPUT"
          echo "is_staging_leg=false" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_REF head=$HEAD_REF does not match a known promotion head prefix -- skipping quality jobs"

  dgfy-api-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough) -- including the mysql/redis containers below, now started and
    # waited-on as ordinary steps rather than the runner's own `services:` mechanism, so they're
    # covered too (2026-08-26 #1066 follow-up, see that same comment).
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 45
    outputs:
      # #1066 RF-1: the *real* per-step outcome, read from steps.<id>.outcome (survives
      # continue-on-error) by the "Record real per-step outcomes" step below -- consumed directly by
      # report-advisory-failures via needs.dgfy-api-quality.outputs.real_failures, not the Actions
      # API (whose steps[].conclusion is post-override and would never show a failure here).
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # #1066 RF-2: mysql/redis used to be GitHub's built-in `services:` containers, provisioned by
      # the runner-generated "Initialize containers" step BEFORE any user step (even an
      # `if: always()` one) runs -- no continue-on-error, job- or step-level, reaches that phase, so
      # a container failing its own health check still left this job's check-run red regardless of
      # every other fix in this file. Replaced with explicit steps so container start/wait is itself
      # a step continue-on-error can absorb and record_outcomes can report. Same images/env/ports/
      # health commands as the services: blocks they replace. Only one runner in this repo carries
      # the sieitz-lg label and a self-hosted runner runs one job at a time (confirmed live via
      # `gh api repos/.../actions/runners`), so dgfy-api-quality and migration-runner-quality can
      # never contend for the fixed 3306/6379 ports -- ephemeral ports would be unneeded complexity
      # here. The one real hazard `services:` had no defence against: `concurrency:
      # cancel-in-progress: true` (see top of file) can kill a running job mid-container-lifetime,
      # leaking a container that still holds the port for the next run -- start_services below
      # sweeps by label before starting anything, which is strictly more robust than what it
      # replaces, not just non-blocking.
      - name: Start service containers
        id: start_services
        continue-on-error: true
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker ps -aq --filter "label=dgfy-ci-quality-gate=1" | xargs -r docker rm -f
          docker run -d --name "$MYSQL_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -e MYSQL_ROOT_PASSWORD=testpassword \
            -e MYSQL_DATABASE=sku_inventory_manager_test \
            -p 3306:3306 \
            mysql:8.0
          docker run -d --name "$REDIS_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for service containers
        id: wait_services
        continue-on-error: true
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 12); do
            docker exec "$MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword && mysql_ready=1 && break
            sleep 10
          done
          for i in $(seq 1 12); do
            docker exec "$REDIS_CONTAINER" redis-cli ping && redis_ready=1 && break
            sleep 10
          done
          [ -n "${mysql_ready:-}" ] && [ -n "${redis_ready:-}" ]

      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-api/package-lock.json
            apps/dgfy-migration-runner/package-lock.json

      - name: Install API dependencies
        id: install_api_deps
        working-directory: apps/dgfy-api
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Install migration-runner dependencies
        id: install_migration_runner_deps
        working-directory: apps/dgfy-migration-runner
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Prepare test schema
        id: prepare_test_schema
        # #1066 RF-2: skip rather than cascade into a confusing connection-refused failure if the
        # replacement containers above never came up -- wait_services.outcome already recorded the
        # real cause; this and the other three DB-touching steps below would otherwise all report
        # their own (misleading, redundant) failure for the same one root cause.
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Enforce modular architecture guardrails
        id: enforce_arch_guardrails
        working-directory: apps/dgfy-api
        run: npm run check:architecture-guardrails
        continue-on-error: true
        timeout-minutes: 5

      - name: Enforce controller architecture boundaries
        id: enforce_controller_boundaries
        working-directory: apps/dgfy-api
        run: npm run check:controller-boundaries
        continue-on-error: true
        timeout-minutes: 5

      - name: Run API lint
        id: run_api_lint
        working-directory: apps/dgfy-api
        run: npm run lint
        continue-on-error: true
        timeout-minutes: 5

      - name: Run dgfy-api test matrix
        id: run_test_matrix
        if: steps.wait_services.outcome == 'success'
        working-directory: .
        run: node scripts/run-backend-test-matrix.js
        continue-on-error: true
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Run F&B contracts with open-handle diagnostics
        id: run_fnb_contracts
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-api
        run: >-
          npm test -- --detectOpenHandles --runTestsByPath
          tests/fnbMode.usecases.test.js
          tests/posCheckoutFnbContracts.usecase.test.js
          tests/storeFnbModifiers.usecases.test.js
          tests/fnbModifierCondition.migration.test.js
          tests/storeValidator.fnbModifiers.test.js
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Audit required indexes
        id: audit_indexes
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-api
        run: npm run audit:indexes
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Upload API test-matrix evidence
        id: upload_test_matrix_evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dgfy-api-test-matrix-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/backend-test-matrix/**
          if-no-files-found: ignore
          retention-days: 5

      - name: Stop service containers
        id: stop_services
        if: always()
        continue-on-error: true
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
        # Best-effort teardown, deliberately not part of STEP_OUTCOMES below: `docker rm -f` on a
        # container that already exited or was already removed by another cleanup path returns a
        # non-zero exit that has nothing to do with this job's real result -- reporting it to #1063
        # would be exactly the false-positive noise this whole mechanism exists to avoid. `|| true`
        # on each removal keeps this step itself from ever reporting `failure`.
        run: |
          docker rm -f "$MYSQL_CONTAINER" 2>/dev/null || true
          docker rm -f "$REDIS_CONTAINER" 2>/dev/null || true

      # #1066 RF-1: steps.<id>.outcome is the pre-override raw result -- the one field that still
      # says "failure" even when that same step's continue-on-error swallowed it for the job's own
      # conclusion. Explicit id-by-id (GitHub Actions has no "list every step in this job" runtime
      # enumeration), one line per step above. Container start/wait are now steps too (RF-2, no
      # longer a runner-generated "Initialize containers" phase outside continue-on-error's reach --
      # see the workflow-level comment) so they're included below; stop_services is deliberately
      # excluded, see its own comment.
      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Start service containers|${{ steps.start_services.outcome }}
            Wait for service containers|${{ steps.wait_services.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install API dependencies|${{ steps.install_api_deps.outcome }}
            Install migration-runner dependencies|${{ steps.install_migration_runner_deps.outcome }}
            Prepare test schema|${{ steps.prepare_test_schema.outcome }}
            Enforce modular architecture guardrails|${{ steps.enforce_arch_guardrails.outcome }}
            Enforce controller architecture boundaries|${{ steps.enforce_controller_boundaries.outcome }}
            Run API lint|${{ steps.run_api_lint.outcome }}
            Run dgfy-api test matrix|${{ steps.run_test_matrix.outcome }}
            Run F&B contracts with open-handle diagnostics|${{ steps.run_fnb_contracts.outcome }}
            Audit required indexes|${{ steps.audit_indexes.outcome }}
            Upload API test-matrix evidence|${{ steps.upload_test_matrix_evidence.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  migration-runner-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough) -- including the mysql container below, now started and
    # waited-on as an ordinary step rather than the runner's own `services:` mechanism, so it's
    # covered too (2026-08-26 #1066 follow-up, see that same comment).
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 20
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # #1066 RF-2: see dgfy-api-quality's identical comment above -- same replacement, same
      # reasoning, one fewer container (no redis here).
      - name: Start service containers
        id: start_services
        continue-on-error: true
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-migrun-mysql-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker ps -aq --filter "label=dgfy-ci-quality-gate=1" | xargs -r docker rm -f
          docker run -d --name "$MYSQL_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -e MYSQL_ROOT_PASSWORD=testpassword \
            -e MYSQL_DATABASE=sku_inventory_manager_test \
            -p 3306:3306 \
            mysql:8.0

      - name: Wait for service containers
        id: wait_services
        continue-on-error: true
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-migrun-mysql-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 12); do
            docker exec "$MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword && mysql_ready=1 && break
            sleep 10
          done
          [ -n "${mysql_ready:-}" ]

      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-migration-runner/package-lock.json

      - name: Install migration-runner dependencies
        id: install_migration_runner_deps
        working-directory: apps/dgfy-migration-runner
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Apply migrations against a fresh MySQL schema
        id: apply_migrations
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

      - name: Stop service containers
        id: stop_services
        if: always()
        continue-on-error: true
        env:
          MYSQL_CONTAINER: dgfy-ci-migrun-mysql-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "$MYSQL_CONTAINER" 2>/dev/null || true

      # See dgfy-api-quality's identical comment above for why stop_services is excluded here too.
      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Start service containers|${{ steps.start_services.outcome }}
            Wait for service containers|${{ steps.wait_services.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install migration-runner dependencies|${{ steps.install_migration_runner_deps.outcome }}
            Apply migrations against a fresh MySQL schema|${{ steps.apply_migrations.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  # Split into one job per app (issue #322 Phase 6 -- previously one
  # frontend-quality job against the monolith apps/dgfy-web). The F&B
  # contract vitest list below is split by where each test actually lives
  # now: 6 of the original 7 are in packages/web-core (mounted by both
  # dgfy-ims and dgfy-pos, but vitest only ever runs from dgfy-ims -- see
  # dgfy-ims/vite.config.js's test.include -- to keep web-core dependency-
  # and node_modules-free); the 7th, storefrontErrorMessages.test.js, is
  # storefront's own local test.
  frontend-ims-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough).
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 20
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-ims/package-lock.json

      - name: Install dgfy-ims dependencies
        id: install_ims_deps
        working-directory: apps/dgfy-ims
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Run dgfy-ims lint
        id: run_ims_lint
        working-directory: apps/dgfy-ims
        run: npm run lint
        continue-on-error: true
        timeout-minutes: 5

      - name: Run shared F&B contract tests
        id: run_shared_fnb_contract_tests
        working-directory: apps/dgfy-ims
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          npx vitest run
          ../../packages/web-core/src/features/fnb/__tests__/kitchenQueueDisplay.test.js
          ../../packages/web-core/src/features/fnb/__tests__/fnbMode.contract.test.js
          ../../packages/web-core/src/features/pos/__tests__/terminalViewModeContracts.test.js
          ../../packages/web-core/src/features/pos/__tests__/FnbModifierPickerDialog.test.jsx
          ../../packages/web-core/src/features/pos/__tests__/posFnbModifierManager.session.test.jsx
          ../../packages/web-core/src/features/pos/__tests__/serviceOptionsModal.contract.test.jsx
          ../../packages/web-core/src/config/__tests__/permissionsFrontendParity.test.js

      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Checkout|${{ steps.checkout.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-ims dependencies|${{ steps.install_ims_deps.outcome }}
            Run dgfy-ims lint|${{ steps.run_ims_lint.outcome }}
            Run shared F&B contract tests|${{ steps.run_shared_fnb_contract_tests.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  frontend-pos-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough).
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
