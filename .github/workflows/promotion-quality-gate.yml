      # Kept as its own step rather than folded into the contract-tests step above: it costs ~1s,
      # it keeps the gate->step mapping 1:1 for GATE_RELEASE_LOCAL_CI_MAPPING.md, and a future edit
      # to gate 14's pattern can't silently drop the second file here (only
      # scrollKeyControls.behavior.test.js is genuinely outside gate 14's 107-file pattern --
      # terminalResponsiveScroll.contract.test.js already matches it via its `contract.test` name).
      # Blocking from its first PR: 2 files, ~1s, green, no external dependency.
      - name: Run scroll contracts
        continue-on-error: true
        id: run_scroll_contracts
        working-directory: apps/dgfy-ims
        timeout-minutes: 5
        run: >-
          npx vitest run
          ../../packages/web-core/src/features/pos/__tests__/terminalResponsiveScroll.contract.test.js
          ../../packages/web-core/src/features/pos/utils/__tests__/scrollKeyControls.behavior.test.js

      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
