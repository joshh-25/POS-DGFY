            Install dgfy-ims dependencies|${{ steps.install_ims_deps.outcome }}
            Run web-core lint|${{ steps.run_web_core_lint.outcome }}
            Run frontend contract tests|${{ steps.run_shared_fnb_contract_tests.outcome }}
            Run scroll contracts|${{ steps.run_scroll_contracts.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

