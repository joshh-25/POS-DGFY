        id: run_web_core_lint
        working-directory: apps/dgfy-ims
        run: npx eslint ../../packages/web-core --ext .js,.jsx --resolve-plugins-relative-to .
        timeout-minutes: 5

      # #1431 Phase 2 (gate 14, frontend.contracts): replaces the old hand-picked 7-file list with
      # the local gate's own `contract.test`/`integration.test` vitest path filters -- 107 files /
      # 552 tests, essentially all under packages/web-core/src, vs. the ~6.5% the old list covered.
      # Runs from the job's own root (not `working-directory: apps/dgfy-ims`, unlike its neighbors)
