          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5

      - name: Assert complete working tree (workspace-hygiene v1)
        id: workspace_hygiene_assert
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-ims/package-lock.json
            apps/dgfy-pos/package-lock.json
            apps/dgfy-storefront/package-lock.json

      - name: Install dgfy-ims dependencies
        id: install_ims_deps
        working-directory: apps/dgfy-ims
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Install dgfy-pos dependencies
        id: install_pos_deps
        working-directory: apps/dgfy-pos
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Install dgfy-storefront dependencies
        id: install_storefront_deps
        working-directory: apps/dgfy-storefront
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Record build floor
        id: record_build_floor
        run: echo "BUILD_STARTED_AT=$(date -u +%s000)" >> "$GITHUB_ENV"
        continue-on-error: true
        timeout-minutes: 1

      - name: Build dgfy-ims
        id: build_ims
        run: npm --prefix apps/dgfy-ims run build
        continue-on-error: true
        timeout-minutes: 10

      - name: Build dgfy-pos
        id: build_pos
        run: npm --prefix apps/dgfy-pos run build
        continue-on-error: true
        timeout-minutes: 10

      - name: Build dgfy-storefront
        id: build_storefront
        run: npm --prefix apps/dgfy-storefront run build
        continue-on-error: true
        timeout-minutes: 10

      # #1431 Phase C (2026-09-03): blocking -- workflow_dispatch evidence (clean pass, fault-probe
      # real fail, see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md) confirmed this step fails for real
      # on a genuine defect.
      - name: Check frontend budgets
        id: check_frontend_budgets
        run: >-
          npm run check:frontend-budgets --
          --skip-build --built-after "$BUILD_STARTED_AT"
          --report .tmp/frontend-budgets-report.json
        timeout-minutes: 5

      - name: Upload frontend budgets report
        id: upload_frontend_budgets_report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: frontend-budgets-report-${{ github.sha }}
          path: .tmp/frontend-budgets-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-ims dependencies|${{ steps.install_ims_deps.outcome }}
            Install dgfy-pos dependencies|${{ steps.install_pos_deps.outcome }}
            Install dgfy-storefront dependencies|${{ steps.install_storefront_deps.outcome }}
            Record build floor|${{ steps.record_build_floor.outcome }}
            Build dgfy-ims|${{ steps.build_ims.outcome }}
            Build dgfy-pos|${{ steps.build_pos.outcome }}
            Build dgfy-storefront|${{ steps.build_storefront.outcome }}
            Check frontend budgets|${{ steps.check_frontend_budgets.outcome }}
            Upload frontend budgets report|${{ steps.upload_frontend_budgets_report.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  repository-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough).
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too. See gate/
    # dgfy-api-quality's comments above for the release/* -> main-leg-only
    # reasoning (F-3) -- same logic applies here.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        id: workspace_hygiene_clear
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        id: workspace_hygiene_assert
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        id: install_repo_deps
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      # #1431 Phase 2 (gate 2, dependencies.audit.prod): runs without node_modules -- lockfile +
      # network only -- but placed after the install step above for readability, matching this
      # file's existing convention.
      # #1431 Phase C (2026-09-03): blocking -- the remediation PR (#1444) landed, and
      # workflow_dispatch fault-probe evidence confirmed this step fails for real on a genuine
      # defect (see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md).
      - name: Run production dependency audit
        id: run_dependency_audit_prod
        run: npm run audit:dependencies:prod
        timeout-minutes: 10

      # #1431 Phase 2 (gate 3, dependencies.audit.full): dev-inclusive variant. Recommended
      # (Phase 2 plan section 5, exception 2) to stay advisory in CI permanently, not just until
      # P2-3 -- this is the only Phase-2 gate whose verdict depends on the npm registry rather than
      # the repo (a new dev-only advisory can flip it red with zero code change here), and its
      # findings never ship.
      # #1431 Phase C (2026-09-03), settled: confirmed permanently advisory (Pat's call) --
      # real-failed on both the clean and fault-probe runs (a pre-existing npm-registry finding,
      # not something this PR's changes caused). Delegated to CI via gate-release-local.js's
      # CI_ENFORCED_GATES, but named in scripts/check-pr-quality-workflow.js's
      # ADVISORY_CI_ENFORCED_GATES so it never has to appear in BLOCKING_STEP_IDS.
      - name: Run full dependency audit
        id: run_dependency_audit_full
        run: npm run audit:dependencies
        continue-on-error: true
        timeout-minutes: 10

      # #1431 Phase 2 (gate 6, compliance.contracts): this job's checkout already carries
      # fetch-depth: 0, which resolveChangedFiles()'s `git merge-base HEAD origin/$GITHUB_BASE_REF`
      # needs. PR-context only -- under workflow_dispatch/workflow_call there is no
      # GITHUB_BASE_REF, so this passes trivially (empty diff, early exit); a dispatch run is not
      # evidence this gate works, only a real promotion PR is.
      # #1431 Phase C (2026-09-03): blocking -- a real PR-context run (PR #1458, closed unmerged)
      # confirmed clean-pass/fault-fail against an actual base ref, not just a trivial dispatch
      # early-exit (see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md).
      - name: Run compliance contract checks
        id: run_compliance_contracts
        run: npm run check:compliance
        timeout-minutes: 5

      # #1431 Phase 2 (gate 7, production.env.fixtures): a pure function over checked-in constants
      # -- 4 synthetic env fixtures against validateProductionEnv(), no DB, no network, no SOPS, no
      # real secret. No prerequisite, no flake surface, no external dependency, so this one is
      # blocking from its first PR rather than an advisory round first.
      - name: Run production env fixture checks
        id: run_production_env_fixtures
        run: npm run check:production-env
        timeout-minutes: 5

      # Name corrected 2026-08-26 (#1066 follow-up): this workflow's own quality checks stopped
      # being blocking under #1063, so "blocking" in this step's name was stale -- the contract it
      # validates (the sanctioned #1063 if:/continue-on-error: shape) isn't about blocking either.
      # Also now runs its own regression tests (RF-4): check:pr-quality-workflow was previously the
      # only thing that ran the validator; test:pr-quality-workflow existed in package.json but had
      # no call site, so its fixtures -- including the checkAdvisoryFailureReportingShape negative
      # cases added alongside this comment -- never actually ran anywhere.
      # Blocking on the release/*->main leg since #1431 Phase D follow-up (2026-09-04, #1550/#1551
      # triage): a pure, deterministic check over checked-in files -- no registry, no network, no
      # DB -- so it carries none of the flake risk that keeps e.g. dependencies.audit.full advisory.
      # First recorded blocking-flip disposition for these four `validate_*` steps; see
      # docs/ops/RELEASE_CANDIDATE_POLICY.md's matching 2026-09-04 amendment.
      - name: Validate PR quality workflow contract
        id: validate_pr_quality_workflow
        run: npm run check:pr-quality-workflow && npm run test:pr-quality-workflow
        timeout-minutes: 5

      # Phase 233 (#1365): the #1365 acceptance criterion is "workflow tests and
      # documentation verify runner routing so future edits cannot silently invert the
      # strategy" -- this is that check, run in the same step/job as the sibling
      # contract validator above so it costs no new runner slot.
      # Blocking since 2026-09-04 -- see the comment above the sibling step immediately above.
      - name: Validate runner routing contract
        id: validate_runner_routing
        run: npm run check:runner-routing && npm run test:runner-routing
        timeout-minutes: 5

      # #1528: authoring-time counterpart to the runtime workspace-hygiene steps added to every
      # self-hosted-reachable checkout site. A `sparse-checkout:` on a self-hosted job permanently
      # poisons the shared `_work` tree for every other job on that box -- this catches the PR that
      # would (re)introduce one, or that adds a new self-hosted checkout site without the guard.
      # Blocking since 2026-09-04 -- see the comment above "Validate PR quality workflow contract".
      - name: Validate workspace hygiene contract
        id: validate_workspace_hygiene
        run: npm run check:workspace-hygiene && npm run test:workspace-hygiene
        timeout-minutes: 5

      # #1374 Wave 4: regression coverage for compliance-preflight-sweep.yml's supervised-handoff
      # redesign (the hard-fail-step-is-last invariant, the report step's always()/exit-2-mapping
      # contract, the handoff step's dual guard, classify-pr-create wiring, the numeric-branch-
      # prefix-guarded delete, full-tree discovery) -- run in the same step/job as the sibling
      # contract validators above so it costs no new runner slot. Also runs the four
      # scripts/*preflight*.test.js files this repo already had but never wired to any npm script
      # (test:preflight-sweep is the first call site for any of them).
      # Blocking since 2026-09-04 (#1551): the failure that made this advisory
      # (scripts/check-compliance-sweep-workflow.test.js's step-order assertion colliding with
      # #1528's workspace-hygiene rollout) is fixed -- see that test's own #1551 comment. Blocking
      # since 2026-09-04 -- see the comment above "Validate PR quality workflow contract".
      - name: Validate compliance sweep contract
        id: validate_compliance_sweep
        run: npm run test:preflight-sweep
        timeout-minutes: 5

      - name: Run governed documentation lint
        id: run_docs_lint
        run: npm run lint:docs
        # blocking on the release/*->main leg since #1431 Phase 1
        timeout-minutes: 5

      - name: Run compatibility-seam contract gate
        id: run_compat_seams
        run: npm run check:compat-seams
        continue-on-error: true
        timeout-minutes: 5

      # Guards the retired backend/frontend/android/apps-dgfy-web paths (issue
      # #914): a develop-based in-flight branch's PR could otherwise silently
      # reintroduce one of these -- git's directory-rename detection has no
      # signal for a brand-new subdirectory with no base counterpart (the
      # "silent reappearance" failure mode, documented five times in
      # docs/architecture/backend-absorption.md's changelog). --strict fails
      # this step, not just warns.
      - name: Check retired-path resurrection
        id: check_retired_path_resurrection
        run: npm run report:frontend-split-sync:post-merge
        continue-on-error: true
        timeout-minutes: 5

      # PR-context only: github.event.pull_request.{base,head}.sha don't
      # exist under a plain workflow_dispatch run (this workflow is no
      # longer called with pull_request context by default -- see the on:
      # block comment above), so skip cleanly there instead of diffing two
      # empty SHAs.
      # Blocking since 2026-09-04 (#1552): pure, deterministic, zero flake surface, git-native --
      # same class of check as the `validate_*` steps above -- and the root cause of its 6/13
      # recurrence (nothing upstream caught the violation before merge) is fixed via a new
      # `.husky/pre-commit` guard in the same PR; this step stays as the CI-side backstop for
      # `git commit --no-verify`. See docs/ops/RELEASE_CANDIDATE_POLICY.md's matching 2026-09-04
      # amendment.
      - name: Check changed-file whitespace
        id: check_whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"

      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install repository dependencies|${{ steps.install_repo_deps.outcome }}
            Run production dependency audit|${{ steps.run_dependency_audit_prod.outcome }}
            Run full dependency audit|${{ steps.run_dependency_audit_full.outcome }}
            Run compliance contract checks|${{ steps.run_compliance_contracts.outcome }}
            Run production env fixture checks|${{ steps.run_production_env_fixtures.outcome }}
            Validate PR quality workflow contract|${{ steps.validate_pr_quality_workflow.outcome }}
            Validate runner routing contract|${{ steps.validate_runner_routing.outcome }}
            Validate workspace hygiene contract|${{ steps.validate_workspace_hygiene.outcome }}
            Validate compliance sweep contract|${{ steps.validate_compliance_sweep.outcome }}
            Run governed documentation lint|${{ steps.run_docs_lint.outcome }}
            Run compatibility-seam contract gate|${{ steps.run_compat_seams.outcome }}
            Check retired-path resurrection|${{ steps.check_retired_path_resurrection.outcome }}
            Check changed-file whitespace|${{ steps.check_whitespace.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  # 2026-08-26 (#1066 follow-up), added alongside the step-level continue-on-error fix above: since
  # every quality job's own `conclusion` now always reads success (that's the whole point of the fix
  # -- see the workflow-level comment), a red run's signal would otherwise be lost the moment nobody
  # happens to open this specific run by hand. This job reads each quality job's own `real_failures`
  # output (set by that job's own "Record real per-step outcomes" step, from steps.<id>.outcome --
  # NOT the Actions API's steps[].conclusion, which is post-override and would never show a failure
  # here; see the workflow-level comment's #1066 RF-1 note for why the first version of this job was
  # wrong) and files it where it won't be lost: one comment on the tracking issue, not a new issue
  # per run -- avoids issue-spam across retries while still leaving a paper trail to pick up later.
  # Deduped per commit SHA (skips if the tracking issue already carries a comment for this SHA) so a
  # re-run or a `workflow_dispatch` retry against the same commit doesn't pile up duplicates.
  #
  # 2026-08-29 (#1124/#1165), two changes:
  #   1. Replaced the `gh issue view`/`gh issue comment` shell-out with `actions/github-script@v7`.
  #      `gh` is not installed on these self-hosted runners (`gh: command not found`, exit 127 --
  #      confirmed live; there is no other use of `gh` anywhere in .github/workflows/ to have caught
  #      this earlier) and the old step's `set -uo pipefail` (no `-e`) meant that failure was 100%
  #      silent -- every advisory failure since this job was added has gone unreported. github-script
  #      is a node20 JS action the runner already knows how to fetch (same mechanism as
  #      actions/checkout and actions/upload-artifact, both of which demonstrably work here), needs
  #      no external binary, and needs no `jq` (the old script depended on `gh`'s bundled `--jq`).
  #   2. A dead job envelope is now itself reportable. Previously, a quality job that died mid-run
  #      (its own job envelope killed, as observed live on run 33241398956) never reached its
  #      "Record real per-step outcomes" step, so `outputs.real_failures` came back empty and this
  #      job saw *nothing to report* -- exactly the run that promoted to `main` with zero quality
  #      signal. Each job's `result` (via `needs.<job>.result`, which reflects the job's own
  #      conclusion independent of whether record_outcomes ran) is now read alongside its
  #      `real_failures` output, and a non-success/non-skipped result with no per-step detail is
  #      reported as "job envelope did not complete" -- distinct from, and no less real than, a
  #      per-step failure.
  #   3. Target moved from #1063 to #1124 (parameterized via ADVISORY_TRACKING_ISSUE): #1063's own
  #      root cause was found and fixed (PR #1067); #1124 is the current epic this evidence pipeline
  #      serves.
  # The reporting step itself still carries exactly one step-level `continue-on-error: true` (RF-2b,
  # unchanged) so a GitHub API hiccup here doesn't turn this job's own check-run red -- the one thing
  # this job must never do is become a new blocking check itself.
  report-advisory-failures:
    needs:
      - gate
      - dgfy-api-quality
      - migration-runner-quality
      - frontend-ims-quality
      - frontend-pos-quality
      - frontend-storefront-quality
      - repository-quality
      - frontend-budgets-quality
    # 2026-08-31 (#1253): restores the is_staging_leg exclusion #1124/#1165 item 4 dropped -- this
    # job has nothing to report when every job it depends on was itself skipped on the staging leg,
    # and skipping it too is what makes the staging leg's "no runner time spent" claim true again.
    if: always() && needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
  # Phase 233 (#1365) anchor exception, deliberate, not an omission: stays
  # self-hosted permanently, no commented hosted alternate. Must run even when
  # every job between gate and here was skipped or killed -- self-hosted is the
  # class this repo has direct visibility into. See
  # docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md's Phase 233 entry.
    runs-on: ['sieitz-runner']
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      # #1124: listJobsForWorkflowRun (the real, non-overridden job conclusion lookup this job's
      # own step now makes, see its comment) needs read access to this run's own Actions data.
      actions: read
    steps:
      # 2026-08-29 (#1124/#1165), live `workflow_dispatch` verification on PR #1167 caught a real
      # design bug in this step's first version: `needs.<job>.result` is NOT the job's true
      # conclusion when that job carries job-level `continue-on-error: true` (every quality job
      # does, per the sanctioned #1063 shape) -- GitHub Actions overrides `result` to `success` for
      # a downstream job's `needs` context regardless of what actually happened inside, confirmed
      # live: `dgfy-api-quality`'s job envelope died mid-run on that dispatch (matrix step
      # succeeded, job died 3s into the next step, real conclusion `failure`, steps after the
      # matrix never ran) and this job still saw `needs.dgfy-api-quality.result == 'success'`. The
      # REST Jobs API's own `.conclusion` field is NOT overridden the same way -- it matches the
      # check-run shown in the UI -- so that's what this queries instead, replacing the `*_RESULT`
      # env vars the first version relied on.
      - name: Report real quality-job failures
        id: report_failures
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ADVISORY_TRACKING_ISSUE: '1124'
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
          DGFY_API_FAILURES: ${{ needs.dgfy-api-quality.outputs.real_failures }}
          MIGRATION_RUNNER_FAILURES: ${{ needs.migration-runner-quality.outputs.real_failures }}
          IMS_FAILURES: ${{ needs.frontend-ims-quality.outputs.real_failures }}
          POS_FAILURES: ${{ needs.frontend-pos-quality.outputs.real_failures }}
          STOREFRONT_FAILURES: ${{ needs.frontend-storefront-quality.outputs.real_failures }}
          REPOSITORY_FAILURES: ${{ needs.repository-quality.outputs.real_failures }}
          FRONTEND_BUDGETS_FAILURES: ${{ needs.frontend-budgets-quality.outputs.real_failures }}
        with:
          github-token: ${{ github.token }}
          script: |
            const trackingIssue = Number(process.env.ADVISORY_TRACKING_ISSUE);
            const headSha = process.env.HEAD_SHA;
            const runId = Number(process.env.RUN_ID);
            const prUrl = process.env.PR_URL;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: runId,
            });
            const realConclusionOf = (jobName) => jobs.find((j) => j.name === jobName)?.conclusion;

            // #1431 Phase 1 (2026-09-02), PR-A: step *names* (not ids -- real_failures is built from
            // STEP_OUTCOMES' human-readable names, see each job's own record_outcomes step) for the
            // steps scripts/check-pr-quality-workflow.js's BLOCKING_STEP_IDS now marks blocking on
            // the release/*->main leg. Keep this list and that one in sync by hand -- there is no
            // shared source at runtime (this is workflow YAML embedded JS, that is a Node script).
            const BLOCKING_STEP_NAMES = new Set([
              'Enforce modular architecture guardrails',
              'Enforce controller architecture boundaries',
              'Run API lint',
              'Run dgfy-ims lint',
              'Run dgfy-pos lint',
              'Run dgfy-storefront lint',
              'Run storefront vitest suite',
              'Run governed documentation lint',
              // #1431 Phase 2 (2026-09-02), P2-1: gates 7 and 17 land blocking on their first PR.
              'Run production env fixture checks',
              'Run scroll contracts',
              // #1431 Phase C (2026-09-03): 5 more steps flip blocking on real-promotion evidence
              // (see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md for run IDs). 'Run full dependency
              // audit' is deliberately NOT here -- settled permanently advisory, see that step's
              // own comment above.
              'Run production dependency audit',
              'Run compliance contract checks',
              'Run runtime schema doctor',
              'Run frontend contract tests',
              'Check frontend budgets',
              // 2026-09-04 (#1550/#1551 triage): 4 more steps flip blocking -- pure, deterministic
              // checks over checked-in files, no registry/network/DB dependency. See
              // docs/ops/RELEASE_CANDIDATE_POLICY.md's matching 2026-09-04 amendment.
              'Validate PR quality workflow contract',
              'Validate runner routing contract',
              'Validate workspace hygiene contract',
              'Validate compliance sweep contract',
              // 2026-09-04 (#1552): pure, deterministic, git-native check; root cause of its
              // recurrence fixed via a new .husky/pre-commit guard in the same PR. 'Audit required
              // indexes' is deliberately NOT here -- fixed (env-var config only) but kept
              // advisory-with-reason pending one post-fix evidence cycle; see the step's own
              // comment above and docs/ops/RELEASE_CANDIDATE_POLICY.md's matching amendment.
              'Check changed-file whitespace',
            ]);

            const lines = [];
            // #1124 RF (forbidden-token check, scripts/check-pr-quality-workflow.js): each call's
            // second arg must be the SAME env var this job's real_failures output was assigned to
            // above -- a swapped or misspelled reference here silently drops that job's findings
            // instead of surfacing them, same class of bug #1066 RF-5 guarded against for the old
            // shell form.
            const addIfPresent = (jobName, failures) => {
              if (failures && failures.trim()) {
                const names = failures.split(',').map((n) => n.trim()).filter(Boolean);
                const blocking = names.filter((n) => BLOCKING_STEP_NAMES.has(n));
                const advisory = names.filter((n) => !BLOCKING_STEP_NAMES.has(n));
                const parts = [];
                if (blocking.length) {
                  parts.push(`blocking (this run is red): ${blocking.join(', ')}`);
                }
                if (advisory.length) {
                  parts.push(`advisory: ${advisory.join(', ')}`);
                }
                lines.push(`- **${jobName}**: ${parts.join(' | ')}`);
                return;
              }
              const conclusion = realConclusionOf(jobName);
              if (conclusion && conclusion !== 'success' && conclusion !== 'skipped') {
                lines.push(`- **${jobName}**: job envelope did not complete (conclusion=\`${conclusion}\`) -- no per-step evidence was recorded for this run`);
              }
            };
            addIfPresent('dgfy-api-quality', process.env.DGFY_API_FAILURES);
            addIfPresent('migration-runner-quality', process.env.MIGRATION_RUNNER_FAILURES);
            addIfPresent('frontend-ims-quality', process.env.IMS_FAILURES);
            addIfPresent('frontend-pos-quality', process.env.POS_FAILURES);
            addIfPresent('frontend-storefront-quality', process.env.STOREFRONT_FAILURES);
            addIfPresent('repository-quality', process.env.REPOSITORY_FAILURES);
            addIfPresent('frontend-budgets-quality', process.env.FRONTEND_BUDGETS_FAILURES);

            if (lines.length === 0) {
              console.log('No real step failures or dead job envelopes reported by any quality job this run -- nothing to report.');
              return;
            }

            const marker = `sha=${headSha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: trackingIssue,
            });
            const alreadyReported = comments.find((comment) => (comment.body || '').includes(marker));
            if (alreadyReported) {
              console.log(`Already reported for ${marker} (comment ${alreadyReported.id}) -- skipping duplicate.`);
              return;
            }

            const body = [
              `<!-- promotion-quality-gate-advisory-failure ${marker} run=${runId} -->`,
              `### promotion-quality-gate advisory failure(s) -- \`${headSha}\``,
              '',
              // Count derived from BLOCKING_STEP_NAMES.size (declared above), not hand-counted, so
              // a future blocking flip can't stale this summary the way #1552's own flip did (this
              // read #1431's original "15" verbatim, already one behind by the time this comment
              // would have posted). check-pr-quality-workflow.js's own BLOCKING_STEP_IDS stays a
              // second, hand-synced list -- #1557's cross-file drift risk, unchanged by this.
              `Since #1431 Phase 1 (PR-A), Phase 2 (P2-1), and Phase C, ${BLOCKING_STEP_NAMES.size} steps across these jobs are`,
              'blocking (no step-level `continue-on-error`) on the release/*->main leg and',
              'workflow_dispatch/workflow_call runs -- a failure there already reds out the job and',
              'this workflow\'s check-run',
              '(`AGENTS.md` Merge Safety hard stop). Every other step stays advisory',
              '(`continue-on-error: true`, #1066 correction), so a failure there alone does not block',
              'the merge. Findings below are labelled `blocking (this run is red)` vs `advisory` per',
              'job so this comment stays a truthful record of which is which. Filed here',
              'automatically so nothing is lost; not a substitute for this epic\'s own root-cause work.',
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`,
              ...(prUrl ? [`PR: ${prUrl}`] : []),
              '',
              ...lines,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: trackingIssue,
              body,
            });

  # #1124/#1165: salvages dgfy-api-quality's test-matrix evidence when that job's own envelope dies
  # mid-run, before "Upload API test-matrix evidence" (a step inside dgfy-api-quality itself) ever
  # gets to run -- exactly run 33241398956's shape (the matrix step finished; the *next* step then
  # killed the job 3s in; nothing downstream, including that upload step, ever ran). Reads from
  # RELEASE_GATES_EVIDENCE_ROOT, the same durable, job-workspace-external directory
  # dgfy-api-quality's matrix step was pointed at -- and, since #1124 also made the matrix script
  # persist its JSON after every chunk instead of only at the very end, a mid-run kill now leaves a
  # partial-but-valid artifact there for this job to pick up, not nothing.
  #
  # Only actually uploads when dgfy-api-quality did NOT really succeed -- on a clean pass, the
  # normal in-job upload already covered it, and this job has nothing worth salvaging. No
  # `actions/checkout` -- checkout would wipe the workspace this job depends on, and it needs no
  # repo content of its own.
  #
  # 2026-08-29 (#1124/#1165), live `workflow_dispatch` verification on PR #1167: this job's own
  # `if:` originally read `needs.dgfy-api-quality.result != 'success'` -- and never fired, even on
  # a run where dgfy-api-quality's job envelope genuinely died mid-run (real conclusion `failure`,
  # confirmed live). `needs.<job>.result` is overridden to `success` by that job's own job-level
  # `continue-on-error: true` regardless of its real outcome -- the same GitHub Actions quirk
  # report-advisory-failures' own comment now documents. A job's `if:` can only reference
  # `needs`/`vars`/`github` contexts, not run arbitrary script -- there is no `if:`-level fix -- so
  # the decision moved inside a step, which *can* call the REST Jobs API for the real, non-
  # overridden conclusion the same way report-advisory-failures does.
  #
  # Two assumptions, stated plainly rather than silently relied on: (a) exactly one runner carries
  # the `sieitz-lg` label, so this job schedules onto the same box dgfy-api-quality ran on --
  # already relied on elsewhere in this file for the fixed 3306/6379 service-container ports; (b)
  # `_work`'s parent directory is not swept between jobs on that runner. If either assumption breaks,
  # this job finds nothing, uploads nothing (`if-no-files-found: warn`, not `error` -- a missing
  # salvage directory is the expected case on a healthy run, not a failure), and the situation
  # degrades to exactly today's behavior rather than turning red.
  #
  # What this still cannot recover: the runner's own job log for the killed job (the HTTP 404
  # observed live on run 33241398956's dgfy-api-quality job). Nothing in a workflow file can fix
  # that -- the log is written by the very process that died. Said outright so this job isn't read
  # as full recovery.
  salvage-api-evidence:
    needs: [gate, dgfy-api-quality]
    # 2026-08-31 (#1253): is_staging_leg exclusion added -- this job never carried it even before
    # #1124/#1165 (it was added by that same commit), but under #1253's intent (the staging leg
    # never runs this gate at all) it has nothing to salvage when dgfy-api-quality itself was
    # skipped; without this it would otherwise burn a 5-minute-timeout runner slot salvaging
    # evidence for a job that never ran (dgfy-api-quality.conclusion == 'skipped' would read as
    # needing salvage, per the needsSalvage check below).
    if: always() && needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too -- BUT: co-location
    # invariant (F-2), binding. This job's active class MUST always match
    # dgfy-api-quality's active class above -- it recomputes and reads that job's
    # workspace path directly, which only exists on the same box under self-hosted.
    # Flipping this job hosted while dgfy-api-quality stays self-hosted (or vice
    # versa) breaks salvage silently (if-no-files-found: warn + continue-on-error --
    # no red check).
    #
    # Phase 234 Wave 0 (#1375) resolution: flipping both hosted does NOT silently
    # degrade #1124/#1165 evidence recovery to a no-op anymore. F-3 (verified against
    # the tree): the recommended re-implementation over actions/upload-artifact
    # (if: always()) already exists -- it's dgfy-api-quality's own "Upload API
    # test-matrix evidence" step below (L547-556) -- so that path was never actually
    # lost. What genuinely cannot be recovered on an ephemeral hosted runner is the
    # narrower case this job exists for: the job envelope dying mid-run, before any
    # step -- always() or not -- gets to execute (run 33241398956). That loss is
    # accepted, not fixed (a chunked/streaming upload redesign is out of proportion
    # to a residual this narrow); what shipped instead is a loudness guarantee -- see
    # the first step below, which fires only when this job lands on a hosted runner
    # and says so explicitly, rather than degrading silently the way the old
    # if-no-files-found: warn path did.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # #1375 (Phase 234 Wave 0): this job's real salvage capability only exists on the
      # self-hosted co-location box (see the header comment above) -- `runner.environment`
      # is the step-level context (`'github-hosted' | 'self-hosted'`) that can see which
      # class this specific run landed on; a job-level `if:` cannot read it at all, which
      # is why this is gated per-step rather than on the job. Fires only when this job's
      # `runs-on:` resolved hosted (the flipped-both case F-3 covers), and is loud, not
      # silent, about the residual: the below is the one case the F-3 fix does not cover.
      - name: Warn if evidence salvage is unavailable on this runner
        id: warn_salvage_unavailable_hosted
        if: runner.environment != 'self-hosted'
        continue-on-error: true
        run: |
          echo '::warning::salvage-api-evidence: cross-job evidence salvage is not available on an ephemeral hosted runner (runner.environment=${{ runner.environment }}). dgfy-api-quality'"'"'s own "if: always()" upload ("Upload API test-matrix evidence") remains the evidence path. The uncovered case is envelope-death only -- see #1375.'
          {
            echo '### `salvage-api-evidence`: unavailable on this (hosted) runner'
            echo ''
            echo 'This job landed on a GitHub-hosted runner, where cross-job evidence salvage is'
            echo 'definitionally unavailable -- an ephemeral VM'"'"'s job workspace does not persist'
            echo 'across jobs the way the self-hosted co-location box'"'"'s does.'
            echo ''
            echo '`dgfy-api-quality`'"'"'s own `if: always()` upload step ("Upload API test-matrix'
            echo 'evidence", this file) remains the evidence path and is unaffected.'
            echo ''
            echo 'The only case left uncovered is the job envelope dying mid-run, before any step --'
            echo '`always()` or not -- ever executes (run 33241398956). That loss is accepted, not'
            echo 'recovered here. See #1375.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Independently recomputes the same durable path dgfy-api-quality's matrix step resolved --
      # this is a separate job, so it has no access to that job's $GITHUB_ENV. Deterministic given
      # the same run id/attempt and the two jobs sharing a runner (see the assumptions above), so
      # recomputing here is correct, not fragile. `dirname "$RUNNER_WORKSPACE"` rather than a
      # literal `${{ runner.workspace }}/..` -- confirmed live (#1124/#1165, PR #1167 dispatch
      # verification) that actions/upload-artifact@v4 rejects any `path:` glob containing `..`.
      - name: Resolve durable evidence path
        id: resolve_evidence_path
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        run: echo "RELEASE_GATES_EVIDENCE_ROOT=$(dirname "$RUNNER_WORKSPACE")/_dgfy_gate_evidence/${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Check dgfy-api-quality's real job conclusion
        id: check_api_quality_envelope
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: Number(process.env.RUN_ID),
            });
            const job = jobs.find((j) => j.name === 'dgfy-api-quality');
            const needsSalvage = Boolean(job) && job.conclusion !== 'success';
            core.setOutput('needs_salvage', String(needsSalvage));
            console.log(`dgfy-api-quality real conclusion: ${job?.conclusion ?? 'not found'} -> needs_salvage=${needsSalvage}`);

      - name: Upload salvaged API test-matrix evidence
        id: upload_salvaged_evidence
        if: runner.environment == 'self-hosted' && steps.check_api_quality_envelope.outputs.needs_salvage == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dgfy-api-test-matrix-salvaged-${{ github.sha }}
          path: ${{ env.RELEASE_GATES_EVIDENCE_ROOT }}/**
          if-no-files-found: warn
          retention-days: 30

      - name: Sweep salvaged evidence
        id: sweep_salvaged_evidence
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        run: rm -rf "${{ env.RELEASE_GATES_EVIDENCE_ROOT }}"
