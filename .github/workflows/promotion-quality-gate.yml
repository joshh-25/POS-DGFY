        continue-on-error: true
        timeout-minutes: 5

      # #1431 Phase 2 (gate 14, frontend.contracts): replaces the old hand-picked 7-file list with
      # the local gate's own `contract.test`/`integration.test` vitest path filters -- 107 files /
      # 552 tests, essentially all under packages/web-core/src, vs. the ~6.5% the old list covered.
      # Runs from the job's own root (not `working-directory: apps/dgfy-ims`, unlike its neighbors)
      # because the npm script itself does `cd apps/dgfy-ims && ...`. Step id kept stable
      # (run_shared_fnb_contract_tests) per the Phase 2 plan so STEP_OUTCOMES/BLOCKING_STEP_IDS
      # wiring doesn't need to move; name changed to match, so BLOCKING_STEP_NAMES in
      # report-advisory-failures is updated to match too when this flips to blocking (P2-3). Do NOT
      # broaden further to the full IMS suite (327 files, ~2min, flaky under 2-vCPU CPU contention
      # per the plan's finding 3) -- this 107-file pattern is deliberately narrower and green.
      # Advisory for one run first (P2-1), then blocking (P2-3) -- a 15x coverage increase over a
      # step nobody has ever seen red is worth one insurance-premium advisory run.
      # #1431 Phase C (2026-09-03): blocking -- workflow_dispatch fault-probe evidence confirmed
      # this step fails for real on a genuine defect (see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md).
      - name: Run frontend contract tests
        id: run_shared_fnb_contract_tests
        timeout-minutes: 15
        run: npm run test:frontend:contracts

      # #1431 Phase 2 (gate 17, scroll.contracts): mirrors the local gate's exact two-file list.
      # Kept as its own step rather than folded into the contract-tests step above: it costs ~1s,
      # it keeps the gate->step mapping 1:1 for GATE_RELEASE_LOCAL_CI_MAPPING.md, and a future edit
      # to gate 14's pattern can't silently drop the second file here (only
      # scrollKeyControls.behavior.test.js is genuinely outside gate 14's 107-file pattern --
      # terminalResponsiveScroll.contract.test.js already matches it via its `contract.test` name).
      # Blocking from its first PR: 2 files, ~1s, green, no external dependency.
      - name: Run scroll contracts
        id: run_scroll_contracts
        working-directory: apps/dgfy-ims
        timeout-minutes: 5
        run: >-
          npx vitest run
          ../../packages/web-core/src/features/pos/__tests__/terminalResponsiveScroll.contract.test.js
          ../../packages/web-core/src/features/pos/utils/__tests__/scrollKeyControls.behavior.test.js

      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-ims dependencies|${{ steps.install_ims_deps.outcome }}
            Run dgfy-ims lint|${{ steps.run_ims_lint.outcome }}
            Run web-core lint|${{ steps.run_web_core_lint.outcome }}
            Run frontend contract tests|${{ steps.run_shared_fnb_contract_tests.outcome }}
            Run scroll contracts|${{ steps.run_scroll_contracts.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

