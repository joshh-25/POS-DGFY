        continue-on-error: true
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-pos/package-lock.json

      - name: Install dgfy-pos dependencies
        id: install_pos_deps
        working-directory: apps/dgfy-pos
        run: npm ci
        continue-on-error: true
        timeout-minutes: 10

      - name: Run dgfy-pos lint
        id: run_pos_lint
        working-directory: apps/dgfy-pos
        run: npm run lint
        continue-on-error: true
        timeout-minutes: 5

      - name: Record real per-step outcomes for advisory-failure reporting
        id: record_outcomes
        if: always()
        continue-on-error: true
        env:
          STEP_OUTCOMES: |
            Checkout|${{ steps.checkout.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-pos dependencies|${{ steps.install_pos_deps.outcome }}
            Run dgfy-pos lint|${{ steps.run_pos_lint.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  frontend-storefront-quality:
    needs: gate
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough).
    if: needs.gate.outputs.is_promotion == 'true' && needs.gate.outputs.is_staging_leg != 'true'
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 20
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        continue-on-error: true
