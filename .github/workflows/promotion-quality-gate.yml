        working-directory: apps/dgfy-storefront
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5

      - name: Run deterministic F&B browser contract
        continue-on-error: true
        id: run_fnb_browser_contract
        working-directory: apps/dgfy-storefront
        run: npm run test:e2e:fnb-contract
        timeout-minutes: 5

      # #1124: retention 5->30 and if-no-files-found ignore->error, matching the API test-matrix
      # upload's own fix above and for the same reason -- a missing artifact is real signal, not
      # something to swallow, and record_outcomes below reports it as a real failure instead of
      # silently dropping it.
      - name: Upload F&B browser evidence
        continue-on-error: true
        id: upload_fnb_browser_evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fnb-playwright-contract-${{ github.sha }}
          path: |
            apps/dgfy-storefront/playwright-report/fnb-contract/**
            apps/dgfy-storefront/test-results/fnb-contract/**
          if-no-files-found: error
          retention-days: 30

      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-storefront dependencies|${{ steps.install_storefront_deps.outcome }}
            Run dgfy-storefront lint|${{ steps.run_storefront_lint.outcome }}
            Run storefront vitest suite|${{ steps.run_storefront_vitest.outcome }}
            Build dgfy-storefront|${{ steps.build_storefront.outcome }}
            Install Playwright Chromium|${{ steps.install_playwright.outcome }}
            Run deterministic F&B browser contract|${{ steps.run_fnb_browser_contract.outcome }}
            Upload F&B browser evidence|${{ steps.upload_fnb_browser_evidence.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  # Issue #2052: OPIS (dgfy-opis) quality coverage -- lint plus a vite build of the new
  # fourth frontend app. Included in the optional operator-dispatched evidence suite.
  frontend-opis-quality:
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too. See gate/
    # dgfy-api-quality's comments above for the release/* -> main-leg-only
    # reasoning (F-3) -- same logic applies here.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 15
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        continue-on-error: true
        id: setup_node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-opis/package-lock.json

      - name: Install dgfy-opis dependencies
        continue-on-error: true
        id: install_opis_deps
        working-directory: apps/dgfy-opis
        run: npm ci
        timeout-minutes: 10

      - name: Run dgfy-opis lint
        continue-on-error: true
        id: run_opis_lint
        working-directory: apps/dgfy-opis
        run: npm run lint
        # Advisory on first landing (issue #2052) -- pending real-promotion evidence before any
        # blocking flip, same as #1712's job below. Contrast run_pos_lint above (blocking
        # since #1431 Phase 1).
        timeout-minutes: 5

      - name: Build dgfy-opis
        continue-on-error: true
        id: build_opis
        working-directory: apps/dgfy-opis
        run: npm run build
        # Advisory on first landing (issue #2052) -- see run_opis_lint above.
        timeout-minutes: 10

      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-opis dependencies|${{ steps.install_opis_deps.outcome }}
            Run dgfy-opis lint|${{ steps.run_opis_lint.outcome }}
            Build dgfy-opis|${{ steps.build_opis.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  # #1749 keeps this optional evidence job advisory and POS-owned. Its browser test bootstraps a
  # disposable tenant admin and terminal fixture, seeds a sellable item through the API, then
  # exercises checkout, stock, history/detail, and CSV export entirely in POS.
  pos-sales-e2e-quality:
    continue-on-error: true
    # Use the shared local CI runner pool so this browser job can spread across the available
    # workers. POS API and Vite ports are selected per run below to avoid host-service collisions.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ['sieitz-runner']
    # #1844/#1856: the original 20m job / 15m step budgets cancelled the first live run before its
    # evidence chain completed, while the temporary 200m/150m measurement window let a 3-second
    # browser-launch failure hang for 2h15m. Keep enough margin for the known ~22m healthy run, but
    # bound a broken run to a useful CI signal instead of a multi-hour runner occupation.
    timeout-minutes: 35
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # Same start/wait/stop-as-ordinary-steps pattern as dgfy-api-quality above (#1066 RF-2).
      # Containers are scoped to this job and removed in the cleanup step; the API and Vite use
      # free loopback ports selected for this run to avoid host-service collisions.
      - name: Start service containers
        continue-on-error: true
        id: start_services
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker ps -aq --filter "label=dgfy-ci-quality-gate=1" | xargs -r docker rm -f
          docker run -d --name "$MYSQL_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -e MYSQL_ROOT_PASSWORD=testpassword \
            -e MYSQL_DATABASE=sku_inventory_manager \
            -p 3306:3306 \
            mysql:8.0
          docker run -d --name "$REDIS_CONTAINER" \
            --label dgfy-ci-quality-gate=1 \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for service containers
        continue-on-error: true
        id: wait_services
        timeout-minutes: 3
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for _ in $(seq 1 12); do
            docker exec "$MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword && mysql_ready=1 && break
            sleep 10
          done
          for _ in $(seq 1 12); do
            docker exec "$REDIS_CONTAINER" redis-cli ping && redis_ready=1 && break
            sleep 10
          done
          [ -n "${mysql_ready:-}" ] && [ -n "${redis_ready:-}" ]

      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        continue-on-error: true
        id: setup_node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-api/package-lock.json
            apps/dgfy-migration-runner/package-lock.json
            apps/dgfy-pos/package-lock.json

      - name: Install API dependencies
        continue-on-error: true
        id: install_api_deps
        working-directory: apps/dgfy-api
        run: npm ci
        timeout-minutes: 10

      - name: Install migration-runner dependencies
        continue-on-error: true
        id: install_migration_runner_deps
        working-directory: apps/dgfy-migration-runner
        run: npm ci
        timeout-minutes: 10

      - name: Install dgfy-pos dependencies
        continue-on-error: true
        id: install_pos_deps
        working-directory: apps/dgfy-pos
        run: npm ci
        timeout-minutes: 10

      - name: Install Playwright Chromium
        continue-on-error: true
        id: install_playwright
        working-directory: apps/dgfy-pos
        run: |
          started=$SECONDS
          set +e
          npx playwright install --with-deps chromium
          status=$?
          echo "Chromium install duration: $((SECONDS - started)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
        timeout-minutes: 10

      # #1856: the install step remains advisory so its raw installer output is preserved, but this
      # exact post-install check is deliberately blocking. A swallowed timeout or partial download
      # must stop before schema setup and the E2E suite can misattribute the failure to browser
      # launch. BrowserType.executablePath() is the same resolved path Playwright will use.
      - name: Verify Playwright Chromium installation
        continue-on-error: true
        id: verify_playwright_install
        working-directory: apps/dgfy-pos
        shell: bash
        run: |
          set -euo pipefail
          executable_path="$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          echo "Resolved Playwright Chromium executable: ${executable_path:-<empty>}"
          if [ -z "$executable_path" ] || [ ! -x "$executable_path" ]; then
            echo "::error::Playwright Chromium executable is missing or not executable: ${executable_path:-<empty>}"
            exit 1
          fi
          echo "Playwright Chromium executable is present and executable."

      - name: Prepare test schema
        continue-on-error: true
        id: prepare_test_schema
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        timeout-minutes: 10
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager
          DB_USER: root
          DB_PASSWORD: testpassword

      # Provide the tenant used by the POS test's runtime-created admin account.
      - name: Register original legacy tenant fixture
        continue-on-error: true
        id: register_original_tenant
        if: steps.wait_services.outcome == 'success'
        working-directory: apps/dgfy-api
        run: node scripts/register_original_tenant.js --apply
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager
          DB_USER: root
          DB_PASSWORD: testpassword

      # Self-hosted runners may already serve an unrelated app on POS's historical local port 5000.
      # Select free loopback ports so Playwright starts the API and Vite server for this run itself.
      - name: Select isolated POS E2E ports
        continue-on-error: true
        id: select_pos_e2e_ports
        if: steps.wait_services.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          read -r api_port web_port < <(node --input-type=module <<'NODE'
          import net from 'node:net';

          const findPort = async (start) => {
            for (let port = start; port < start + 1000; port += 1) {
              const available = await new Promise((resolve) => {
                const server = net.createServer();
                server.once('error', () => resolve(false));
                server.listen({ host: '127.0.0.1', port, exclusive: true }, () => {
                  server.close(() => resolve(true));
                });
              });
              if (available) return port;
            }
            throw new Error(`No free loopback port found starting at ${start}`);
          };

          const apiPort = await findPort(5100);
          const webPort = await findPort(apiPort + 1);
          process.stdout.write(`${apiPort} ${webPort}\n`);
          NODE
          )
          {
            echo "PORT=${api_port}"
            echo "E2E_API_URL=http://127.0.0.1:${api_port}"
            echo "E2E_BASE_URL=http://127.0.0.1:${web_port}"
            echo "E2E_WEB_PORT=${web_port}"
            echo "VITE_API_URL=http://127.0.0.1:${api_port}/api/v1"
          } >> "$GITHUB_ENV"
          echo "Selected POS E2E API port ${api_port} and web port ${web_port}."

      # Advisory-only by deliberate rollout posture (Pat's call, #1749). Capture elapsed Playwright
      # time separately from the Chromium installation step for the acceptance comparison.
      - name: Run POS sales journey e2e
        continue-on-error: true
        id: run_pos_sales_e2e
        if: steps.wait_services.outcome == 'success' && steps.select_pos_e2e_ports.outcome == 'success'
        working-directory: apps/dgfy-pos
        run: |
          started=$SECONDS
          set +e
          timeout --signal=TERM --kill-after=60s 1500s npm run test:pos-sales-e2e
          status=$?
          echo "POS sales Playwright duration: $((SECONDS - started)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then
            echo "::warning::POS sales E2E exceeded the controlled 25-minute timeout; salvaging artifacts and outcome reporting."
            {
              echo "## POS sales E2E timeout salvage"
              echo
              echo "The E2E process exceeded the controlled 25-minute timeout and was terminated."
              echo "The step remains advisory; downstream artifact upload, cleanup, and outcome reporting will continue."
              echo "Raw exit status: $status"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
        # Keep the command-level timeout below this step ceiling so cleanup and evidence steps run.
        timeout-minutes: 30
        env:
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager
          DB_NAME_TEST: sku_inventory_manager
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      # Mirrors the API test-matrix / F&B browser evidence uploads elsewhere in this file --
      # if-no-files-found: error (a missing artifact is real signal, not something to swallow),
      # retention-days: 30 (promotion evidence, not routine per-push scratch).
      - name: Upload POS sales e2e evidence
        continue-on-error: true
        id: upload_pos_sales_e2e_evidence
        if: always() && steps.run_pos_sales_e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: pos-sales-e2e-${{ github.sha }}
          path: apps/dgfy-pos/test-results/**
          if-no-files-found: error
          retention-days: 30

      - name: Stop service containers
        continue-on-error: true
        id: stop_services
        if: always()
        env:
          MYSQL_CONTAINER: dgfy-ci-mysql-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          REDIS_CONTAINER: dgfy-ci-redis-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "$MYSQL_CONTAINER" 2>/dev/null || true
          docker rm -f "$REDIS_CONTAINER" 2>/dev/null || true

      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
          STEP_OUTCOMES: |
            Start service containers|${{ steps.start_services.outcome }}
            Wait for service containers|${{ steps.wait_services.outcome }}
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install API dependencies|${{ steps.install_api_deps.outcome }}
            Install migration-runner dependencies|${{ steps.install_migration_runner_deps.outcome }}
            Install dgfy-pos dependencies|${{ steps.install_pos_deps.outcome }}
            Install Playwright Chromium|${{ steps.install_playwright.outcome }}
            Verify Playwright Chromium installation|${{ steps.verify_playwright_install.outcome }}
            Prepare test schema|${{ steps.prepare_test_schema.outcome }}
            Register original legacy tenant fixture|${{ steps.register_original_tenant.outcome }}
            Select isolated POS E2E ports|${{ steps.select_pos_e2e_ports.outcome }}
            Run POS sales journey e2e|${{ steps.run_pos_sales_e2e.outcome }}
            Upload POS sales e2e evidence|${{ steps.upload_pos_sales_e2e_evidence.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  # #1431 Phase 2 (gate 16, frontend.budgets): the mapping doc's original recommendation ("add
  # builds to web-core-quality/frontend-pos-quality first") does not work -- check-frontend-
  # budgets.js needs all three dist/assets dirs in ONE job's workspace, and a build step added to
  # a different job is invisible here. This job owns all three builds itself, SEQUENTIALLY (not
  # check:frontend-budgets's own default concurrent build) -- pr-checks.yml's own comment records
  # #923's measurement of 3 concurrent vite builds in one job on this box: ~3.7min median, with a
  # documented exit-137 OOM (#662). Sequential steps are what avoid that, and they also deliver the
  # "ims/pos need real builds" prerequisite, just inside this one job instead of two others.
  # `--skip-build --built-after "$BUILD_STARTED_AT"` keeps the freshness guarantee real (the floor
  # is recorded in this job, before these builds) -- do NOT instead download dists from other jobs
  # as artifacts; extraction resets mtimes and the freshness check becomes meaningless.
  frontend-budgets-quality:
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too. See gate/
    # dgfy-api-quality's comments above for the release/* -> main-leg-only
    # reasoning (F-3) -- same logic applies here.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 30
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        continue-on-error: true
        id: setup_node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-ims/package-lock.json
            apps/dgfy-pos/package-lock.json
            apps/dgfy-storefront/package-lock.json

      - name: Install dgfy-ims dependencies
        continue-on-error: true
        id: install_ims_deps
        working-directory: apps/dgfy-ims
        run: npm ci
        timeout-minutes: 10

      - name: Install dgfy-pos dependencies
        continue-on-error: true
        id: install_pos_deps
        working-directory: apps/dgfy-pos
        run: npm ci
        timeout-minutes: 10

      - name: Install dgfy-storefront dependencies
        continue-on-error: true
        id: install_storefront_deps
        working-directory: apps/dgfy-storefront
        run: npm ci
        timeout-minutes: 10

      - name: Record build floor
        continue-on-error: true
        id: record_build_floor
        run: echo "BUILD_STARTED_AT=$(date -u +%s000)" >> "$GITHUB_ENV"
        timeout-minutes: 1

      - name: Build dgfy-ims
        continue-on-error: true
        id: build_ims
        run: npm --prefix apps/dgfy-ims run build
        timeout-minutes: 10

      - name: Build dgfy-pos
        continue-on-error: true
        id: build_pos
        run: npm --prefix apps/dgfy-pos run build
        timeout-minutes: 10

      - name: Build dgfy-storefront
        continue-on-error: true
        id: build_storefront
        run: npm --prefix apps/dgfy-storefront run build
        timeout-minutes: 10

      # #1431 Phase C (2026-09-03): blocking -- workflow_dispatch evidence (clean pass, fault-probe
      # real fail, see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md) confirmed this step fails for real
      # on a genuine defect.
      - name: Check frontend budgets
        continue-on-error: true
        id: check_frontend_budgets
        run: >-
          npm run check:frontend-budgets --
          --skip-build --built-after "$BUILD_STARTED_AT"
          --report .tmp/frontend-budgets-report.json
        timeout-minutes: 5

      - name: Upload frontend budgets report
        continue-on-error: true
        id: upload_frontend_budgets_report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-budgets-report-${{ github.sha }}
          path: .tmp/frontend-budgets-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install dgfy-ims dependencies|${{ steps.install_ims_deps.outcome }}
            Install dgfy-pos dependencies|${{ steps.install_pos_deps.outcome }}
            Install dgfy-storefront dependencies|${{ steps.install_storefront_deps.outcome }}
            Record build floor|${{ steps.record_build_floor.outcome }}
            Build dgfy-ims|${{ steps.build_ims.outcome }}
            Build dgfy-pos|${{ steps.build_pos.outcome }}
            Build dgfy-storefront|${{ steps.build_storefront.outcome }}
            Check frontend budgets|${{ steps.check_frontend_budgets.outcome }}
            Upload frontend budgets report|${{ steps.upload_frontend_budgets_report.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"

  # 2026-09-07 (#1690): the former single `repository-quality` job (13 steps across dependency
  # audits, compliance/env checks, CI-self-test contracts, and docs/release hygiene) is split into
  # 3 concern-based jobs below, following this workflow's own existing one-job-per-concern
  # convention (see `dgfy-api-quality` etc. above) -- so a red check-run in the Checks tab names
  # which of 3 domains failed instead of leaving the reader to open the run and scroll 13 steps to
  # find out. Every step's own id, command, and blocking/advisory status is unchanged; only the
  # job grouping and job name(s) changed. See docs/ops/RELEASE_CANDIDATE_POLICY.md's matching
  # 2026-09-07 amendment for the rationale and before/after job names.
  repository-dependency-quality:
    # Split from the former `repository-quality` job (#1690): dependency/compliance/env posture --
    # "is this repo's declared and installed state trustworthy" -- grouped separately from the
    # CI-self-test contracts (`repository-ci-contracts-quality`) and docs/release hygiene
    # (`repository-docs-quality`) below.
    # #1063: skipped entirely on the develop->staging soak leg; runs everywhere else with every
    # step advisory (`continue-on-error: true` on each step below, not just this job-level line --
    # 2026-08-26 #1066 correction, see the workflow-level comment at the top of this file for why
    # job-level alone wasn't enough).
    continue-on-error: true
    # Phase 233 (#1365) scaffold, INERT: per docs/ops/CI_RUNNER_POLICY.md, hosted
    # (ubuntu-latest) is the intended class for this job too. See gate/
    # dgfy-api-quality's comments above for the release/* -> main-leg-only
    # reasoning (F-3) -- same logic applies here.
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-lg"]') }}
    timeout-minutes: 15
    outputs:
      real_failures: ${{ steps.record_outcomes.outputs.real_failures }}
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        continue-on-error: true
        id: setup_node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        continue-on-error: true
        id: install_repo_deps
        run: npm ci
        timeout-minutes: 10

      # #1431 Phase 2 (gate 2, dependencies.audit.prod): runs without node_modules -- lockfile +
      # network only -- but placed after the install step above for readability, matching this
      # file's existing convention.
      # #1431 Phase C (2026-09-03): blocking -- the remediation PR (#1444) landed, and
      # workflow_dispatch fault-probe evidence confirmed this step fails for real on a genuine
      # defect (see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md).
      - name: Run production dependency audit
        continue-on-error: true
        id: run_dependency_audit_prod
        run: npm run audit:dependencies:prod
        timeout-minutes: 10

      # #1431 Phase 2 (gate 3, dependencies.audit.full): dev-inclusive variant. Recommended
      # (Phase 2 plan section 5, exception 2) to stay advisory in CI permanently, not just until
      # P2-3 -- this is the only Phase-2 gate whose verdict depends on the npm registry rather than
      # the repo (a new dev-only advisory can flip it red with zero code change here), and its
      # findings never ship.
      # #1431 Phase C (2026-09-03), settled: confirmed permanently advisory (Pat's call) --
      # real-failed on both the clean and fault-probe runs (a pre-existing npm-registry finding,
      # not something this PR's changes caused). It remains available in the operator suite.
      - name: Run full dependency audit
        continue-on-error: true
        id: run_dependency_audit_full
        run: npm run audit:dependencies
        timeout-minutes: 10

      # #1431 Phase 2 (gate 6, compliance.contracts): this job's checkout already carries
      # fetch-depth: 0, which resolveChangedFiles()'s `git merge-base HEAD origin/$GITHUB_BASE_REF`
      # needs. PR-context only -- under workflow_dispatch there is no
      # GITHUB_BASE_REF, so this passes trivially (empty diff, early exit); a dispatch run is not
      # evidence this gate works; manual dispatch skips this PR-context-only check.
      # #1431 Phase C (2026-09-03): blocking -- a real PR-context run (PR #1458, closed unmerged)
      # confirmed clean-pass/fault-fail against an actual base ref, not just a trivial dispatch
      # early-exit (see docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md).
      - name: Run compliance contract checks
        continue-on-error: true
        id: run_compliance_contracts
        run: npm run check:compliance
        timeout-minutes: 5

      # #1431 Phase 2 (gate 7, production.env.fixtures): a pure function over checked-in constants
      # -- 4 synthetic env fixtures against validateProductionEnv(), no DB, no network, no SOPS, no
      # real secret. No prerequisite, no flake surface, no external dependency, so this one is
      # blocking from its first PR rather than an advisory round first.
      - name: Run production env fixture checks
        continue-on-error: true
        id: run_production_env_fixtures
        run: npm run check:production-env
        timeout-minutes: 5

      - name: Run compatibility-seam contract gate
        continue-on-error: true
        id: run_compat_seams
        run: npm run check:compat-seams
        timeout-minutes: 5

      - name: Record real per-step outcomes for advisory-failure reporting
        continue-on-error: true
        id: record_outcomes
        if: always()
        env:
          STEP_OUTCOMES: |
            Clear stale sparse-checkout state|${{ steps.workspace_hygiene_clear.outcome }}
            Checkout|${{ steps.checkout.outcome }}
            Assert complete working tree|${{ steps.workspace_hygiene_assert.outcome }}
            Setup Node.js|${{ steps.setup_node.outcome }}
            Install repository dependencies|${{ steps.install_repo_deps.outcome }}
            Run production dependency audit|${{ steps.run_dependency_audit_prod.outcome }}
            Run full dependency audit|${{ steps.run_dependency_audit_full.outcome }}
            Run compliance contract checks|${{ steps.run_compliance_contracts.outcome }}
            Run production env fixture checks|${{ steps.run_production_env_fixtures.outcome }}
            Run compatibility-seam contract gate|${{ steps.run_compat_seams.outcome }}
        run: |
          FAILED=$(printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '$2=="failure" || $2=="cancelled"{print $1}' | paste -sd, - 2>/dev/null || true)
          {
            echo "real_failures<<GHA_EOF_1066"
            echo "$FAILED"
            echo "GHA_EOF_1066"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### repository-dependency-quality step outcomes"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            printf '%s\n' "$STEP_OUTCOMES" | awk -F'|' '{print "| " $1 " | " $2 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

