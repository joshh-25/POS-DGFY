name: Deploy Backend Image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tags:
        description: Comma-separated branch tags, e.g. "latest,beta"
        required: true
        type: string
    outputs:
      sha_tag:
        value: ${{ jobs.build-and-push.outputs.sha_tag }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sieitzz/dgfy-platform/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            IFS=',' read -ra TAG_ARR <<< "${{ inputs.image_tags }}"
            for t in "${TAG_ARR[@]}"; do echo "${IMAGE_NAME}:${t}"; done
            echo "${IMAGE_NAME}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # PROD server pull/restart happens in the `publish` job of
      # deployment-orchestrator.yml -> publish-platform.yml, keyed off
      # this job's environment, not steps.meta.outputs.sha_tag.
