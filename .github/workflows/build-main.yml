name: Build Images (main)

on:
  push:
    branches: [ main ]

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: PROD
      image_tags: "latest"
      publish: true
    secrets: inherit
    permissions:
      contents: read
      packages: write
