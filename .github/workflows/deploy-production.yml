name: Production Candidate Bundle

on:
  workflow_run:
    workflows: [ "Exact Master SHA Qualification" ]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release_target_sha:
        description: Exact origin/master SHA to bundle
        required: true
        type: string

concurrency:
  group: production-candidate-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENABLE_AUTO_PRODUCTION_DEPLOY: '0'

jobs:
  candidate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve exact master SHA
        id: target
        shell: bash
        run: |
          git fetch origin master --tags
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_SHA="${{ inputs.release_target_sha }}"
          else
            TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          test "$(git rev-parse origin/master)" = "$TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify automatic production deployment remains disabled
        run: test "$ENABLE_AUTO_PRODUCTION_DEPLOY" = "0"

      - name: Resolve reviewed batch manifest
        id: manifest
        shell: bash
        run: echo "path=$(npm run --silent find:reviewed-batch-manifest -- --base origin/master~1 --head '${{ steps.target.outputs.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Rebuild candidate inventory and regression notice
        run: |
          npm run check:batch-inventory -- --base origin/master~1 --head "${{ steps.target.outputs.sha }}" --reviewed-manifest "${{ steps.manifest.outputs.path }}" --write --require-ship --inventory ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json" --markdown ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.md"
          npm run validate:batch-inventory -- --inventory ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json" --base origin/master~1 --head "${{ steps.target.outputs.sha }}" --require-ship
          npm run check:regression-risk -- --inventory ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json" --output ".tmp/release-gates/${{ steps.target.outputs.sha }}/regression_risk_notice.json" --markdown ".tmp/release-gates/${{ steps.target.outputs.sha }}/regression_risk_notice.md" --target-sha "${{ steps.target.outputs.sha }}"

      - name: Build non-secret candidate handoff
        shell: bash
        run: |
          TARGET="${{ steps.target.outputs.sha }}"
          DIR=".tmp/release-gates/$TARGET"
          mkdir -p "$DIR"
          cat > "$DIR/github_production_candidate.json" <<JSON
          {
            "schema": "sku-github-production-candidate/v1",
            "target_sha": "$TARGET",
            "repository": "${{ github.repository }}",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "production_deploy_enabled": false,
            "external_signed_authorization_required": true,
            "contains_production_credentials": false,
            "regression_risk_notice": "$DIR/regression_risk_notice.json"
          }
          JSON

      - name: Upload short-lived candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-candidate-${{ steps.target.outputs.sha }}
          path: .tmp/release-gates/${{ steps.target.outputs.sha }}/**
          if-no-files-found: error
          retention-days: 5

      - name: Explain authorization boundary
        run: |
          {
            echo "## Production Candidate Only"
            echo ""
            echo "- Target SHA: \`${{ steps.target.outputs.sha }}\`"
            echo "- Live deployment: disabled"
            echo "- Production credentials: unavailable to GitHub"
            echo "- Regression risk notice: \`.tmp/release-gates/${{ steps.target.outputs.sha }}/regression_risk_notice.json\`"
            echo "- Next authority: root-owned external signed release controller"
          } >> "$GITHUB_STEP_SUMMARY"
