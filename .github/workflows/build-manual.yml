name: Build Images (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to build/deploy against
        required: true
        type: choice
        options:
          - DEV
          - STAGING
          - BETA
          - PROD
      publish:
        description: SSH-deploy to the selected environment after images are pushed
        required: true
        type: boolean
        default: true

concurrency:
  group: build-manual-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.environment == 'DEV' && 'develop' || inputs.environment == 'STAGING' && 'staging' || inputs.environment == 'BETA' && 'beta' || 'latest' }}
      publish: ${{ inputs.publish }}
      vpn_required: ${{ inputs.environment == 'DEV' || inputs.environment == 'STAGING' }}
      # Switch back to the free self-hosted runners if Actions minutes run
      # out. Pin the label so jobs avoid vm-sieitzstaging (AVX-less CPU ->
      # exit 132 on native addons like @napi-rs/canvas).
      # runner_labels_json: '["self-hosted","sieitz-ubuntu-runner"]'
      runner_labels_json: '["ubuntu-latest"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write
