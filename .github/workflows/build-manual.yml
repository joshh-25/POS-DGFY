name: Build Images (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to build/deploy against
        required: true
        type: choice
        options:
          - DEV
          - STAGING
          - BETA
          - PROD
      publish:
        description: SSH-deploy to the selected environment after images are pushed
        required: true
        type: boolean
        default: true

concurrency:
  group: build-manual-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.environment == 'DEV' && 'develop' || inputs.environment == 'STAGING' && 'staging' || inputs.environment == 'BETA' && 'beta' || 'latest' }}
      publish: ${{ inputs.publish }}
      # DEV/STAGING used to need this to reach the office-network VPN from a
      # hosted runner. The self-hosted runner (vm-sieitzstaging) already sits
      # on that network, so the hop is unnecessary for every environment now
      # -- and running it would have the runner open a VPN tunnel into itself.
      vpn_required: false
      # GHA billing exhausted -- running on self-hosted (vm-sieitzstaging).
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write
