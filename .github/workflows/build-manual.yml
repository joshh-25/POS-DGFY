name: Build Images (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to build/deploy against
        required: true
        type: choice
        options:
          - DEV
          - STAGING
          - BETA
          - PROD
      runner_target:
        description: Runner target for build and publish jobs
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - sieitz-ubuntu-runner
      publish:
        description: SSH-deploy to the selected environment after images are pushed
        required: true
        type: boolean
        default: true

concurrency:
  group: build-manual-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: ${{ inputs.environment }}
      image_tags: ${{ inputs.environment == 'DEV' && 'develop' || inputs.environment == 'STAGING' && 'staging' || inputs.environment == 'BETA' && 'beta' || 'latest' }}
      publish: ${{ inputs.publish }}
      vpn_required: ${{ inputs.environment == 'DEV' || inputs.environment == 'STAGING' }}
      runner_labels_json: ${{ inputs.runner_target == 'sieitz-ubuntu-runner' && '["self-hosted","sieitz-ubuntu-runner"]' || '["ubuntu-latest"]' }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
