name: PR Frontend Lint Check

# #1712: closes the develop-PR half of the gap this ADR (0067) and #1698 both name -- an ordinary
# `develop`-base PR that breaks frontend ESLint (a `no-undef`-class defect, exactly what #1698
# was) had no gate capable of catching it before this file, only `promotion-quality-gate.yml`'s
# advisory lint steps, which only run on a promotion leg. Deliberately narrow: lint only, no
# Docker build, no vite build -- the cheapest possible check, not a return of the old
# multi-concern `code-quality` job `pr-checks.yml`'s own header comment records removing (#416)
# and re-removing after PR #1003's revert.
#
# #1748: the residual gap #1712 deliberately left (`apps/dgfy-pos`/`apps/dgfy-storefront` lint
# staying promotion-leg-only) is closed here -- this workflow now takes an explicit `app` input
# (`dgfy-ims`/`dgfy-pos`/`dgfy-storefront`, no default) and `pr-checks.yml` calls it once per app
# behind that app's own changed-path gate. The `packages/web-core` lint step stays IMS-only: that
# package has no own dependencies/script (ADR 0071 Decision 4 [binding]), so coverage runs from
# the calling app's already-installed ESLint, and the issue keeps POS/Storefront checks app-local.

on:
  workflow_call:
    inputs:
      app:
        description: Which frontend app to lint (dgfy-ims, dgfy-pos, dgfy-storefront, or dgfy-opis)
        required: true
        type: string
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box

jobs:
  lint-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 10
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v7

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - name: Install app dependencies
        working-directory: apps/${{ inputs.app }}
        run: npm ci

      - name: Run app lint
        working-directory: apps/${{ inputs.app }}
        run: npm run lint

      # Same --resolve-plugins-relative-to pattern as promotion-quality-gate.yml's own
      # "Run web-core lint" step (#918) -- packages/web-core has no lint script/devDependencies
      # of its own (ADR 0071 Decision 4 [binding]), so coverage runs from the calling app's
      # already-installed ESLint. IMS-only (#1748): POS/Storefront/OPIS checks stay app-local, running
      # only their own `npm run lint`. Both lint steps in this job are blocking by default -- no
      # continue-on-error -- this is a brand-new job, not subject to promotion-quality-gate.yml's
      # #1063 advisory regime.
      - name: Run web-core lint
        if: inputs.app == 'dgfy-ims'
        working-directory: apps/${{ inputs.app }}
        run: npx eslint ../../packages/web-core --ext .js,.jsx --resolve-plugins-relative-to .
