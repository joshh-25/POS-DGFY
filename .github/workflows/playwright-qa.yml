name: Playwright QA, Performance & Security Suite

on:
  push:
    branches-ignore:
      - master

jobs:
  qa-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '>=18.0.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Browsers
        run: |
          cd frontend && npx playwright install --with-deps chromium

      - name: Run Build
        run: |
          npm run build

      - name: Run E2E Tests
        env:
          VITE_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          VITE_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          VITE_TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          VITE_TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          VITE_TEST_BASE_URL: http://localhost:5173
        run: |
          cd frontend && npm run test:e2e

      - name: Run Security E2E Tests
        env:
          VITE_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          VITE_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          VITE_TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          VITE_TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          VITE_TEST_BASE_URL: http://localhost:5173
        run: |
          cd frontend && npm run test:security

      - name: Run dependency security audit
        run: |
          cd frontend && npm run security:audit

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
