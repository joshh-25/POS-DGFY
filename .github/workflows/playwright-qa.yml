name: Playwright QA, Performance & Security Suite

on:
  push:
    branches-ignore:
      - master
      - main
  pull_request:
    branches-ignore:
      - master
      - main

jobs:
  qa-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Prepare test database
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
        run: |
          npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
          npx sequelize-cli db:seed:all --env development --config src/config/sequelize.config.cjs --seeders-path src/seeders

      - name: Install Playwright Browsers
        run: |
          npm --prefix frontend exec playwright install --with-deps chromium

      - name: Run Build
        run: |
          npm run build

      - name: Start local POS stack
        env:
          NODE_ENV: development
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
          VITE_PROXY_TARGET: http://127.0.0.1:5000
        run: |
          npm --prefix backend start > /tmp/pos-backend.log 2>&1 &
          echo $! > /tmp/pos-backend.pid

          npm --prefix frontend run dev:skupervisor > /tmp/pos-skupervisor.log 2>&1 &
          echo $! > /tmp/pos-skupervisor.pid

          npm --prefix frontend run dev:pos > /tmp/pos-terminal.log 2>&1 &
          echo $! > /tmp/pos-terminal.pid

          npm --prefix frontend run dev:store > /tmp/pos-storefront.log 2>&1 &
          echo $! > /tmp/pos-storefront.pid

          wait_for_http() {
            local name="$1"
            local url="$2"
            local accept_any_status="${3:-false}"

            for attempt in {1..60}; do
              if [ "$accept_any_status" = "true" ]; then
                status="$(curl -sS --max-time 2 -o /tmp/pos-stack-health.txt -w "%{http_code}" "$url" || true)"
                if [ "$status" != "000" ]; then
                  echo "$name is reachable at $url with HTTP $status"
                  return 0
                fi
              elif curl -fsS --max-time 2 "$url" >/dev/null 2>&1; then
                echo "$name is ready at $url"
                return 0
              fi

              sleep 2
            done

            echo "::error::$name did not become ready at $url"
            echo "----- backend log -----"
            tail -n 200 /tmp/pos-backend.log || true
            echo "----- skupervisor log -----"
            tail -n 120 /tmp/pos-skupervisor.log || true
            echo "----- pos terminal log -----"
            tail -n 120 /tmp/pos-terminal.log || true
            echo "----- storefront log -----"
            tail -n 120 /tmp/pos-storefront.log || true
            return 1
          }

          wait_for_http "Backend API" "http://127.0.0.1:5000/health" true
          wait_for_http "Skupervisor" "http://127.0.0.1:5173/login"
          wait_for_http "POS" "http://127.0.0.1:5174/"
          wait_for_http "Storefront" "http://127.0.0.1:5175/"

      - name: Run E2E Tests
        env:
          NODE_ENV: development
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
          VITE_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'admin@test.com' }}
          VITE_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Admin123!' }}
          VITE_TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || secrets.TEST_USER_EMAIL || 'admin@test.com' }}
          VITE_TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || secrets.TEST_USER_PASSWORD || 'Admin123!' }}
          VITE_TEST_BASE_URL: http://localhost:5173
          SKUPERVISOR_URL: http://localhost:5173
          POS_URL: http://localhost:5174
          STOREFRONT_URL: http://localhost:5175
          API_BASE_URL: http://localhost:5000
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
        run: |
          cd frontend && npm run test:e2e

      - name: Run Security E2E Tests
        env:
          NODE_ENV: development
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
          VITE_TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'admin@test.com' }}
          VITE_TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Admin123!' }}
          VITE_TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || secrets.TEST_USER_EMAIL || 'admin@test.com' }}
          VITE_TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || secrets.TEST_USER_PASSWORD || 'Admin123!' }}
          VITE_TEST_BASE_URL: http://localhost:5173
          SKUPERVISOR_URL: http://localhost:5173
          POS_URL: http://localhost:5174
          STOREFRONT_URL: http://localhost:5175
          API_BASE_URL: http://localhost:5000
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
        run: |
          cd frontend && npm run test:security

      - name: Run dependency security audit
        run: |
          cd frontend && npm run security:audit

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            /tmp/pos-backend.log
            /tmp/pos-skupervisor.log
            /tmp/pos-terminal.log
            /tmp/pos-storefront.log
          retention-days: 30
