name: Publish POS Receipt Package

# Used to ride inside build-develop.yml's push trigger (no `needs:` between
# the two, so a source change here without a version bump could never stall
# the deploy pipeline). build-develop.yml was deleted 2026-08-14 (#417) when
# every auto-build/auto-deploy trigger came off develop/staging/main -- this
# workflow gets its own `push` trigger instead of going manual-only like the
# rest. Reasoning: it's a 16s npm package publish, not a deploy, already
# path-gated by both this trigger's `paths:` filter and the runtime
# `changed` check below; frontend builds consume this package, so making it
# manual risks a stale published version silently breaking a later frontend
# build. `workflow_call`/`workflow_dispatch` stay for compatibility.
on:
  push:
    branches: [ develop ]
    paths:
      - 'packages/pos-receipt/**'
  workflow_call:
    inputs:
      before_sha:
        description: Commit before this push, used to detect receipt-package changes.
        required: true
        type: string
      runner_labels_json:
        description: JSON array passed to runs-on for the publish job.
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for the manual publish job.
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # `inputs` is only populated for workflow_call/workflow_dispatch -- for
    # the direct `push` trigger above it's empty, so fall back explicitly
    # rather than let fromJSON(null) error the job.
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-runner"]') }}  # #923: generic, either box
    timeout-minutes: 10
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sieitzz'

      - name: Check whether the receipt package changed
        id: changes
        shell: bash
        env:
          # inputs.before_sha only exists under workflow_call; for the
          # direct push trigger, use the push event's own before-SHA.
          BEFORE_SHA: ${{ inputs.before_sha || github.event.before }}
        run: |
          NULL_SHA="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${BEFORE_SHA}" = "${NULL_SHA}" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # New branch (null before_sha) or force-push/rewritten history
            # (before_sha no longer reachable) -- no diff is computable, so
            # assume changed rather than silently skip a publish.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${BEFORE_SHA}" "$GITHUB_SHA" -- packages/pos-receipt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify publish branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/develop' ]; then
            echo '::error::@sieitzz/pos-receipt can only be published from develop.'
            exit 1
          fi

      - name: Verify package archive
        if: steps.changes.outputs.changed == 'true'
        run: npm pack --dry-run
        working-directory: packages/pos-receipt

      - name: Smoke-test package import and rendering
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/pos-receipt
        run: |
          node --input-type=module <<'EOF'
          import { renderPosReceiptHtml, renderThermalReceiptText } from './src/index.js';

          const transaction = {
            invoice_number: 'SMOKE-001',
            created_at: '2026-01-01T00:00:00.000Z',
            lines: [{ name: '<unsafe>', quantity: 1, unit_price: 12.5 }],
            subtotal_amount: 12.5,
            total_amount: 12.5,
            payment_type: 'cash',
            payment_status: 'paid'
          };
          const html = renderPosReceiptHtml({ transaction, businessSettings: { pos_business_name: '<unsafe>' } });
          const thermal = renderThermalReceiptText({ transaction, paperWidth: '57mm' });
          if (!html.includes('&lt;unsafe&gt;') || !thermal.includes('TOTAL AMOUNT DUE')) {
            throw new Error('Receipt renderer smoke check failed.');
          }
          EOF

      - name: Require an unreleased package version
        if: steps.changes.outputs.changed == 'true'
        id: version
        working-directory: packages/pos-receipt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published. Bump the package version before changing receipt-package sources."
            exit 1
          fi
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish package
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/pos-receipt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
