name: PR DGFY API Code Checks

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

# Mirrors the `test-dgfy-api` job in ci.yml (which only runs on master pushes/PRs)
# so apps/dgfy-api gets the same architecture + compat-boundary + lint + test
# gate on develop/main PRs that backend/frontend already have.
jobs:
  code-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/dgfy-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce architecture guardrails
        working-directory: .
        run: npm run check:architecture:dgfy-api

      - name: Enforce compat-boundary guardrail (CMP-03)
        run: npm run check:compat-boundary

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
