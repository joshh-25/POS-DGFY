name: PR DGFY API Code Checks

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

# Fast architecture + lint gate for apps/dgfy-api on develop/main PRs. The full
# DB-backed test suite (mysql/redis services + test-matrix runner) runs in the
# `test-dgfy-api` job in ci.yml on master pushes/PRs; this lighter job keeps
# non-master PR feedback quick. apps/dgfy-api is the source of truth for the
# app (backend/ removed) -- see docs/ai/CLAUDE.md.
jobs:
  code-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/dgfy-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce architecture guardrails
        working-directory: .
        run: npm run check:architecture:dgfy-api

      - name: Run lint
        run: npm run lint
