name: Create Staging To Master PR

on:
  workflow_run:
    workflows: [ "Staging Qualification" ]
    types: [ completed ]
    branches: [ staging ]
  workflow_dispatch:

concurrency:
  group: create-staging-to-master-pr
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Resolve unchanged staging candidate
        id: candidate
        shell: bash
        run: |
          git fetch origin master staging
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            CANDIDATE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            CANDIDATE_SHA="$(git rev-parse origin/staging)"
          fi
          test "$(git rev-parse origin/staging)" = "$CANDIDATE_SHA"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve reviewed batch manifest
        id: manifest
        shell: bash
        run: echo "path=$(npm run --silent find:reviewed-batch-manifest -- --base origin/master --head '${{ steps.candidate.outputs.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Rebuild strict promotion inventory
        run: |
          npm run check:batch-inventory -- --base origin/master --head "${{ steps.candidate.outputs.sha }}" --reviewed-manifest "${{ steps.manifest.outputs.path }}" --write --require-ship --inventory ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/batch_inventory.json" --markdown ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/batch_inventory.md"
          npm run validate:batch-inventory -- --inventory ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/batch_inventory.json" --base origin/master --head "${{ steps.candidate.outputs.sha }}" --require-ship
          npm run check:documentation-closure -- --inventory ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/batch_inventory.json" --base origin/master --head "${{ steps.candidate.outputs.sha }}" --output ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/documentation_closure.json" --markdown ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/documentation_closure.md"
          npm run check:regression-risk -- --inventory ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/batch_inventory.json" --output ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/regression_risk_notice.json" --markdown ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/regression_risk_notice.md" --target-sha "${{ steps.candidate.outputs.sha }}"

      - name: Create or update PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          STAGING_QUALIFICATION_ARTIFACT_URL: ${{ github.event.workflow_run.html_url }}
        run: npm run promote:staging-to-master -- --base master --head staging --title "Promote staging to master" --candidate-sha "${{ steps.candidate.outputs.sha }}" --artifact-url "${{ github.event.workflow_run.html_url }}" --inventory-markdown ".tmp/release-gates/${{ steps.candidate.outputs.sha }}/batch_inventory.md"

      - name: Upload short-lived promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: promotion-candidate-${{ steps.candidate.outputs.sha }}
          path: .tmp/release-gates/${{ steps.candidate.outputs.sha }}/**
          if-no-files-found: error
          retention-days: 5

      - name: Record external authorization requirement
        run: |
          {
            echo "## Promotion PR Created"
            echo ""
            echo "- Candidate SHA: \`${{ steps.candidate.outputs.sha }}\`"
            echo "- Documentation closure: \`.tmp/release-gates/${{ steps.candidate.outputs.sha }}/documentation_closure.json\`"
            echo "- Regression risk notice: \`.tmp/release-gates/${{ steps.candidate.outputs.sha }}/regression_risk_notice.json\`"
            echo "- GitHub auto-merge: prohibited"
            echo "- Merge authority: external signed promotion controller"
          } >> "$GITHUB_STEP_SUMMARY"
