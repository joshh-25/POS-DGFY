name: Production Deploy

on:
  pull_request:
    branches: [ master ]
    types: [ closed ]
  workflow_dispatch:
    inputs:
      release_target_sha:
        description: Exact origin/master SHA to deploy
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: vars.ENABLE_AUTO_PRODUCTION_DEPLOY == '1' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'staging'))

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci

      - name: Resolve target SHA
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sha=${{ inputs.release_target_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Requalify exact master SHA
        shell: bash
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${{ steps.target.outputs.sha }}"
          npm run check:deploy-source-contract -- --target-sha "${{ steps.target.outputs.sha }}" --remote-ref origin/master --require-remote-match --report ".tmp/release-gates/${{ steps.target.outputs.sha }}/deploy_source_contract.master.json"
          BASE_REF="origin/master~1"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          fi
          npm run check:batch-inventory -- --base "$BASE_REF" --head "${{ steps.target.outputs.sha }}" --write --require-ship --inventory ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json" --markdown ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.md"

      - name: Deploy exact origin/master SHA
        env:
          RELEASE_TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_PROD_REMOTE_HOST: ${{ secrets.DEPLOY_PROD_REMOTE_HOST }}
          DEPLOY_PROD_REMOTE_PORT: ${{ secrets.DEPLOY_PROD_REMOTE_PORT }}
          DEPLOY_PROD_REMOTE_USER: ${{ secrets.DEPLOY_PROD_REMOTE_USER }}
          DEPLOY_PROD_REMOTE_DIR: ${{ secrets.DEPLOY_PROD_REMOTE_DIR }}
          QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
          QA_SSH_HOST: ${{ secrets.QA_SSH_HOST }}
          QA_SSH_PORT: ${{ secrets.QA_SSH_PORT }}
          QA_SSH_USER: ${{ secrets.QA_SSH_USER }}
          QA_APP_DIR: ${{ secrets.QA_APP_DIR }}
          QA_COMPANY_TOKEN: ${{ secrets.QA_COMPANY_TOKEN }}
          QA_AUTH_JWT: ${{ secrets.QA_AUTH_JWT }}
        run: npm run deploy:prod:ci

      - name: Upload production deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ steps.target.outputs.sha }}
          path: .tmp/release-gates/${{ steps.target.outputs.sha }}/**
          if-no-files-found: ignore
          retention-days: 90
