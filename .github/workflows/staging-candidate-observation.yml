name: Staging candidate observation

on:
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Repository-relative candidate manifest JSON path
        required: true
        type: string
      observation_report:
        description: Repository-relative read-only staging observation JSON path
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact-SHA staging observation
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate ref
        uses: actions/checkout@v7
      # check-promotion-candidate.js reaches check-app-version-bump.js, which
      # imports the root devDependency `madge` for web-core reachability.
      # Install the lockfile-pinned root dependencies before validating it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Validate candidate lineage
        run: node scripts/check-promotion-candidate.js --manifest "${{ inputs.candidate_manifest }}"
      - name: Validate observation report
        run: node scripts/check-staging-candidate-observation.js --candidate-manifest "${{ inputs.candidate_manifest }}" --observation "${{ inputs.observation_report }}"
