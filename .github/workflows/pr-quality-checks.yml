name: PR Quality Checks

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for quality jobs
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  dgfy-api-quality:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-api/package-lock.json
            apps/dgfy-migration-runner/package-lock.json
            apps/dgfy-web/package-lock.json

      - name: Install API dependencies
        working-directory: apps/dgfy-api
        run: npm ci

      - name: Install migration-runner dependencies
        working-directory: apps/dgfy-migration-runner
        run: npm ci

      # dgfy-api's cross-layer contract tests (tests/*.crossLayer.contract.test.js,
      # tests/modeItemTaxonomy.contract.test.js) import apps/dgfy-web source directly to
      # prove backend and frontend stay byte-identical on shared vocabulary. Those imports
      # resolve @sieitzz/shared-constants relative to dgfy-web, so dgfy-web's own
      # node_modules has to exist here too.
      - name: Install dgfy-web dependencies
        working-directory: apps/dgfy-web
        run: npm ci

      - name: Prepare test schema
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Enforce modular architecture guardrails
        working-directory: apps/dgfy-api
        run: npm run check:architecture-guardrails

      - name: Enforce controller architecture boundaries
        working-directory: apps/dgfy-api
        run: npm run check:controller-boundaries

      - name: Run API lint
        working-directory: apps/dgfy-api
        run: npm run lint

      - name: Run dgfy-api test matrix
        working-directory: .
        run: node scripts/run-backend-test-matrix.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Run F&B contracts with open-handle diagnostics
        working-directory: apps/dgfy-api
        run: >-
          npm test -- --detectOpenHandles --runTestsByPath
          tests/fnbMode.usecases.test.js
          tests/posCheckoutFnbContracts.usecase.test.js
          tests/storeFnbModifiers.usecases.test.js
          tests/fnbModifierCondition.migration.test.js
          tests/storeValidator.fnbModifiers.test.js
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Audit required indexes
        working-directory: apps/dgfy-api
        run: npm run audit:indexes
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Upload API test-matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgfy-api-test-matrix-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/backend-test-matrix/**
          if-no-files-found: ignore
          retention-days: 5

  migration-runner-quality:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-migration-runner/package-lock.json

      - name: Install migration-runner dependencies
        working-directory: apps/dgfy-migration-runner
        run: npm ci

      - name: Apply migrations against a fresh MySQL schema
        working-directory: apps/dgfy-migration-runner
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

  frontend-quality:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/dgfy-web
        run: npm ci

      - name: Run frontend lint
        working-directory: apps/dgfy-web
        run: npm run lint

      - name: Run frontend F&B contract tests
        working-directory: apps/dgfy-web
        run: >-
          npx vitest run
          src/features/fnb/__tests__/kitchenQueueDisplay.test.js
          src/features/fnb/__tests__/fnbMode.contract.test.js
          src/features/pos/__tests__/terminalViewModeContracts.test.js
          apps/store/src/__tests__/storefrontErrorMessages.test.js
          src/features/pos/__tests__/FnbModifierPickerDialog.test.jsx
          src/features/pos/__tests__/posFnbModifierManager.session.test.jsx
          src/features/pos/__tests__/serviceOptionsModal.contract.test.jsx

      - name: Build all frontend applications
        working-directory: apps/dgfy-web
        run: npm run build:all

      - name: Install Playwright Chromium
        working-directory: apps/dgfy-web
        run: npx playwright install --with-deps chromium

      - name: Run deterministic F&B browser contract
        working-directory: apps/dgfy-web
        run: npm run test:e2e:fnb-contract

      - name: Upload F&B browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnb-playwright-contract-${{ github.sha }}
          path: |
            apps/dgfy-web/playwright-report/fnb-contract/**
            apps/dgfy-web/test-results/fnb-contract/**
          if-no-files-found: ignore
          retention-days: 5

  repository-quality:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Validate blocking PR quality workflow contract
        run: npm run check:pr-quality-workflow

      - name: Run governed documentation lint
        run: npm run lint:docs

      - name: Run compatibility-seam contract gate
        run: npm run check:compat-seams

      - name: Check changed-file whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"
