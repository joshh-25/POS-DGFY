name: PR Changed Paths

# Tells pr-checks.yml which image builds this PR actually needs, so a
# backend-only PR doesn't spend a runner slot rebuilding the frontend image
# (and vice versa). That matters here beyond the wasted minutes: there are only
# two self-hosted runners, and PR Checks runs have queued for hours waiting on
# one.
#
# Deliberately does this with plain git rather than a third-party
# paths-filter action -- the same `git merge-base HEAD origin/$GITHUB_BASE_REF`
# approach scripts/check-compliance-impact.js already uses, which is also why
# the checkout below needs full history.

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'
    outputs:
      frontend:
        description: '"true" when this PR touches anything the frontend image is built from'
        value: ${{ jobs.detect.outputs.frontend }}
      backend:
        description: '"true" when this PR touches anything the backend image is built from'
        value: ${{ jobs.detect.outputs.backend }}

jobs:
  detect:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          MERGE_BASE="$(git merge-base HEAD "origin/${BASE_REF}")"
          FILES="$(git diff --name-only "${MERGE_BASE}" HEAD)"

          matches() { printf '%s\n' "${FILES}" | grep -qE "$1"; }

          # .github/workflows/ is in BOTH filters on purpose: a change to the
          # build workflows or to this filter itself must still exercise both
          # image builds, or the change that breaks them merges unverified.
          FRONTEND=false
          BACKEND=false
          matches '^(frontend/|packages/pos-receipt/|infrastructure/docker/frontend/|\.github/workflows/)' && FRONTEND=true || true
          matches '^(backend/|infrastructure/docker/backend/|\.github/workflows/)' && BACKEND=true || true

          {
            echo "frontend=${FRONTEND}"
            echo "backend=${BACKEND}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Changed-path filter"
            echo ""
            echo "| Image build | Needed |"
            echo "|-------------|--------|"
            echo "| Frontend | ${FRONTEND} |"
            echo "| Backend | ${BACKEND} |"
            echo ""
            echo "<details><summary>Changed files</summary>"
            echo ""
            echo '```'
            printf '%s\n' "${FILES}"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
