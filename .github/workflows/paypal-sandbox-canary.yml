name: PayPal Sandbox Canary

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend dependencies
        run: npm ci

      - name: Run PayPal sandbox canary test
        run: npm test -- paypalSandboxCanary.e2e.test.js
        env:
          NODE_ENV: test
          MOCK_PAYPAL: "false"
          PAYPAL_MODE: sandbox
          CANARY_STRICT: "true"

          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_DIALECT: mysql

          # Required by authService import-time validation
          JWT_SECRET: canary_jwt_secret_minimum_length_32_chars__ok
          REFRESH_TOKEN_SECRET: canary_refresh_secret_minimum_len_32_chars_ok

          # PayPal sandbox secrets
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_SANDBOX_ACTIVE_SUBSCRIPTION_ID: ${{ secrets.PAYPAL_SANDBOX_ACTIVE_SUBSCRIPTION_ID }}
          # Optional: provide a known non-active subscription ID. If omitted, test uses an invalid ID.
          PAYPAL_SANDBOX_NONACTIVE_SUBSCRIPTION_ID: ${{ secrets.PAYPAL_SANDBOX_NONACTIVE_SUBSCRIPTION_ID }}

      - name: Audit billing-funnel telemetry integrity after canary
        run: npm run audit:billing-funnel
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_DIALECT: mysql
          BILLING_FUNNEL_AUDIT_LOOKBACK_HOURS: 24
          BILLING_FUNNEL_AUDIT_ATTEMPT_GRACE_MINUTES: 15
          BILLING_FUNNEL_THRESHOLD_MISSING_CORRELATION: 0
          BILLING_FUNNEL_THRESHOLD_MISSING_OUTCOME: 0
          BILLING_FUNNEL_THRESHOLD_ORPHAN_ATTEMPTS: 0
          BILLING_FUNNEL_THRESHOLD_DUPLICATE_EVENTS: 0
          BILLING_FUNNEL_THRESHOLD_PAYMENT_WITHOUT_TELEMETRY: 0
          BILLING_FUNNEL_THRESHOLD_TENANT_STATE_MISMATCH: 0
          BILLING_FUNNEL_THRESHOLD_WEBHOOK_WITHOUT_TELEMETRY: 0
          BILLING_FUNNEL_THRESHOLD_ROUTE_OUTCOME_MISMATCH: 0
          BILLING_FUNNEL_THRESHOLD_WRITE_FAILURES: 0
          BILLING_FUNNEL_THRESHOLD_SKIPS: 0
