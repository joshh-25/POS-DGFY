name: Exact Master SHA Qualification

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release_target_sha:
        description: Exact origin/master SHA to qualify
        required: false
        type: string

concurrency:
  group: exact-master-sha-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  exact-master-sha-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Resolve unmoved master SHA
        id: target
        shell: bash
        run: |
          git fetch origin master --tags
          TARGET_SHA="${{ inputs.release_target_sha || github.sha }}"
          test "$(git rev-parse origin/master)" = "$TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve reviewed batch manifest
        id: manifest
        shell: bash
        run: echo "path=$(npm run --silent find:reviewed-batch-manifest -- --base origin/master~1 --head '${{ steps.target.outputs.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Rebuild strict exact-master inventory
        run: |
          npm run check:batch-inventory -- --base origin/master~1 --head "${{ steps.target.outputs.sha }}" --reviewed-manifest "${{ steps.manifest.outputs.path }}" --write --require-ship --inventory ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json" --markdown ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.md"
          npm run validate:batch-inventory -- --inventory ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json" --base origin/master~1 --head "${{ steps.target.outputs.sha }}" --require-ship
          npm run check:regression-risk -- --inventory ".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json" --output ".tmp/release-gates/${{ steps.target.outputs.sha }}/regression_risk_notice.json" --markdown ".tmp/release-gates/${{ steps.target.outputs.sha }}/regression_risk_notice.md" --target-sha "${{ steps.target.outputs.sha }}"

      - name: Collect structural promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          INVENTORY=".tmp/release-gates/${{ steps.target.outputs.sha }}/batch_inventory.json"
          export BATCH_INVENTORY_SHA256="$(sha256sum "$INVENTORY" | awk '{print $1}')"
          npm run collect:master-promotion-evidence -- --target-sha "${{ steps.target.outputs.sha }}" --repository "${{ github.repository }}" --output ".tmp/release-gates/${{ steps.target.outputs.sha }}/promotion_pr_evidence.json"
          npm run audit:master-promotion -- --target-sha "${{ steps.target.outputs.sha }}" --pr-evidence ".tmp/release-gates/${{ steps.target.outputs.sha }}/promotion_pr_evidence.json" --report ".tmp/release-gates/${{ steps.target.outputs.sha }}/master_promotion_audit.json"

      - name: Exact-SHA source and governance qualification
        run: |
          npm run check:deploy-source-contract -- --target-sha "${{ steps.target.outputs.sha }}" --remote-ref origin/master --require-remote-match --report ".tmp/release-gates/${{ steps.target.outputs.sha }}/deploy_source_contract.master.json"
          npm run lint:docs
          npm run check:architecture
          npm run check:compliance
          npm run test:development-to-production
          npm run test:deploy-contract
          npm run check:merge-adoption-required -- --base origin/master~1 --head "${{ steps.target.outputs.sha }}"

      - name: Upload short-lived exact-master evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-master-sha-qualification-${{ steps.target.outputs.sha }}
          path: .tmp/release-gates/${{ steps.target.outputs.sha }}/**
          if-no-files-found: error
          retention-days: 5
