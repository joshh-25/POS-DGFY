name: PR Backend Build Check

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same build as deploy-backend.yml, minus the push -- just proves the
      # image builds cleanly off this PR's code. Reads the canonical `backend`
      # cache scope that deploy-backend.yml writes (usually warm from the last
      # develop/staging/main build), but writes to a PR-scoped cache so a
      # broken PR build can never poison the canonical scope -- and repeated
      # pushes to the same PR still hit cache. GitHub evicts the PR-scoped
      # cache automatically once the PR closes.
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-pr-${{ github.event.pull_request.number }}
