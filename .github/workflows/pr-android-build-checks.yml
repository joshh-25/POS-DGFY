name: PR Android Build Check

# No longer wired into pr-checks.yml (removed 2026-08-14, #416 -- it was
# permanently `if: false` there since the self-hosted cutover, because
# vm-sieitzstaging has no Android SDK installed and this workflow's default
# runner is billing-blocked ubuntu-latest). Kept runnable by hand from the
# Actions tab via workflow_dispatch for whenever an Android build-check is
# actually wanted against a branch, without paying for it (or failing it) on
# every PR. `workflow_call` stays too, in case a future caller wants it
# path-gated or otherwise conditional again -- e.g. once an Android SDK is
# set up on a self-hosted runner.
on:
  workflow_call:
    inputs: &runner_labels_input
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        # Not self-hosted like the other reusables: needs a preinstalled
        # Android SDK, which the online self-hosted runner doesn't have.
        default: '["ubuntu-latest"]'
  workflow_dispatch:
    inputs: *runner_labels_input

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every plain (non-promotion-quality-gate.yml)
      # site, immediately above this job's actions/checkout. Enforced by
      # scripts/check-workspace-hygiene.js. Deliberately inline and duplicated: a composite action
      # or repo script cannot run before checkout populates the workspace. This job's own
      # runner_labels_json defaults to ubuntu-latest (the self-hosted runners have no Android SDK),
      # but the input is `workflow_dispatch`-overridable, so it's guarded like any other
      # inputs.runner_labels_json-derived job rather than carved out as a special case. See
      # docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v4

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Build both dev and staging release variants -- proves the change
      # actually compiles, most importantly that both flavors' own
      # app/src/{dev,staging}/res/xml/network_security_config.xml resource
      # sets merge cleanly (an XML comment or config typo here is a class of
      # bug a plain XML-syntax check won't catch, since it only fails inside
      # AAPT2's resource merge, not generic parsing -- see #254). prod
      # carries no network security config of its own and shares the same
      # app/src/main sources compiled by these two, so they don't need their
      # own build here. This deliberately only proves the app *builds*, same
      # scope as pr-frontend-build-checks.yml/pr-backend-build-checks.yml --
      # it doesn't sign or upload an APK. build-android-manual.yml stays the
      # path for an actual distributable/side-loadable build.
      - name: Build dev + staging release APKs and run unit tests
        working-directory: apps/dgfy-android-bridge/imin-wrapper
        run: |
          ./gradlew assembleDevRelease assembleStagingRelease \
                    testDevDebugUnitTest testStagingDebugUnitTest
