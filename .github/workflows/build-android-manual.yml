name: Build Android Release (manual)

# Builds a signed release APK of the iMin Android wrapper for the selected
# product flavor via scripts/build-android-release.sh and uploads it to the
# configured S3-compatible evidence store. Manual only -- run from the Actions
# tab when an APK is needed for distribution/testing.
#
# workflow_dispatch lets you pick the ref (branch/tag/commit) this runs
# against, independent of the flavor. That's what makes it possible to
# build a `dev` or `staging` APK straight off an unmerged feature branch --
# install it on a real iMin device and verify hardware behavior there --
# before that branch ever reaches `main` (which is what `prod` is routed
# to). See apps/dgfy-android-bridge/imin-wrapper/README.md for the flavor table
# and the on-device verification steps.
#
# The `beta` flavor was removed 2026-08-23 (#329/#897) -- beta.dgfy.ph now
# redirects to prod, and a WebView origin allowlist doesn't follow a
# cross-origin redirect, so a beta-flavored build would ship broken.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor to build (routes to that environment's POS origin)"
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      clean:
        description: "Run a clean Gradle build (./gradlew clean) before assembling"
        type: boolean
        default: false
      pos_origin:
        description: "Override this flavor's POS origin (e.g. https://pos.example.ph). Leave blank to use the flavor's default."
        type: string
        default: ""

concurrency:
  group: build-android-manual-${{ inputs.flavor }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Stays hosted: vm-sieitzstaging (the online self-hosted runner) has no
    # Android SDK installed, so a Gradle build fails there regardless of
    # billing status ("SDK location not found"). Revisit once the SDK is
    # set up on that box.
    runs-on: ubuntu-latest
    # No timeout previously set -- a hung Gradle build would have run to
    # GitHub's 6-hour default. 45min covers a cold cache + two release
    # assembles with real margin; see the PR checks' android-build-check
    # equivalent (currently disabled) for the measured baseline.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        run: |
          ARGS=("${{ inputs.flavor }}")
          if [[ "${{ inputs.clean }}" == "true" ]]; then
            ARGS+=("--clean")
          fi
          if [[ -n "${{ inputs.pos_origin }}" ]]; then
            ARGS+=("--pos-origin" "${{ inputs.pos_origin }}")
          fi
          bash scripts/build-android-release.sh "${ARGS[@]}"

      - name: Validate release APK and checksum
        id: validate_release_files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(releases/android/*.apk)
          if (( ${#apk_files[@]} != 1 )); then
            echo "::error::Expected exactly one release APK under releases/android; found ${#apk_files[@]}."
            exit 1
          fi
          apk_file="${apk_files[0]}"
          checksum_file="${apk_file}.sha256"
          if [[ ! -f "$apk_file" ]]; then
            echo "::error::Release APK is missing: $apk_file"
            exit 1
          fi
          if [[ ! -f "$checksum_file" ]]; then
            echo "::error::Release APK checksum is missing: $checksum_file"
            exit 1
          fi
          echo "apk_file=$apk_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"

      - name: Upload release APK to S3
        id: upload_release_apk
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_S3_ACCESS_KEY_SECRET }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_NAME: android-${{ inputs.flavor }}-release-${{ github.run_number }}
          EVIDENCE_FILE: ${{ steps.validate_release_files.outputs.apk_file }}
        run: bash scripts/ci-s3-upload.sh "$EVIDENCE_FILE" "$ARTIFACT_NAME"

      - name: Upload release APK checksum to S3
        id: upload_release_checksum
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_S3_ACCESS_KEY_SECRET }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_NAME: android-${{ inputs.flavor }}-release-${{ github.run_number }}
          EVIDENCE_FILE: ${{ steps.validate_release_files.outputs.checksum_file }}
        run: bash scripts/ci-s3-upload.sh "$EVIDENCE_FILE" "$ARTIFACT_NAME"

      - name: Record release APK S3 evidence
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload_release_apk.outcome }}
          CHECKSUM_OUTCOME: ${{ steps.upload_release_checksum.outcome }}
          APK_URI: ${{ steps.upload_release_apk.outputs.object_uri }}
          APK_SIZE: ${{ steps.upload_release_apk.outputs.size_bytes }}
          APK_SHA256: ${{ steps.upload_release_apk.outputs.source_sha256 }}
          APK_DIRECT_SHA256: ${{ steps.upload_release_apk.outputs.direct_readback_sha256 }}
          APK_PRESIGNED_SHA256: ${{ steps.upload_release_apk.outputs.presigned_readback_sha256 }}
          APK_PRESIGNED_HTTP_STATUS: ${{ steps.upload_release_apk.outputs.presigned_http_status }}
          APK_PRESIGNED_URL: ${{ steps.upload_release_apk.outputs.presigned_url }}
          CHECKSUM_URI: ${{ steps.upload_release_checksum.outputs.object_uri }}
          CHECKSUM_SHA256: ${{ steps.upload_release_checksum.outputs.source_sha256 }}
        run: |
          {
            echo "### Android release evidence storage"
            echo "- APK upload step: ${UPLOAD_OUTCOME:-not run}."
            echo "- Checksum upload step: ${CHECKSUM_OUTCOME:-not run}."
            if [[ -n "$APK_URI" ]]; then
              echo "- APK object URI: ${APK_URI}"
              echo "- APK size: ${APK_SIZE:-unknown} bytes"
              echo "- APK SHA-256: source ${APK_SHA256:-unknown}; direct readback ${APK_DIRECT_SHA256:-unknown}; presigned readback ${APK_PRESIGNED_SHA256:-unknown}"
              echo "- APK presigned readback HTTP status: ${APK_PRESIGNED_HTTP_STATUS:-unknown}"
              if [[ -n "$APK_PRESIGNED_URL" ]]; then
                echo "- APK retrieval URL (48-hour bearer link): ${APK_PRESIGNED_URL}"
              fi
            fi
            if [[ -n "$CHECKSUM_URI" ]]; then
              echo "- Checksum object URI: ${CHECKSUM_URI}"
              echo "- Checksum file SHA-256: ${CHECKSUM_SHA256:-unknown}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
