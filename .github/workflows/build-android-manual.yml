name: Build Android Release (manual)

# Builds a signed release APK of the iMin Android wrapper for the selected
# product flavor via scripts/build-android-release.sh and uploads it to the
# GitHub Actions Artifacts with configured S3-compatible fallback. Manual only -- run from the Actions
# tab when an APK is needed for distribution/testing.
#
# workflow_dispatch lets you pick the ref (branch/tag/commit) this runs
# against, independent of the flavor. That's what makes it possible to
# build a `dev` or `staging` APK straight off an unmerged feature branch --
# install it on a real iMin device and verify hardware behavior there --
# before that branch ever reaches `main` (which is what `prod` is routed
# to). See apps/dgfy-android-bridge/imin-wrapper/README.md for the flavor table
# and the on-device verification steps.
#
# The `beta` flavor was removed 2026-08-23 (#329/#897) -- beta.dgfy.ph now
# redirects to prod, and a WebView origin allowlist doesn't follow a
# cross-origin redirect, so a beta-flavored build would ship broken.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor to build (routes to that environment's POS origin)"
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      clean:
        description: "Run a clean Gradle build (./gradlew clean) before assembling"
        type: boolean
        default: false
      pos_origin:
        description: "Override this flavor's POS origin (e.g. https://pos.example.ph). Leave blank to use the flavor's default."
        type: string
        default: ""

concurrency:
  group: build-android-manual-${{ inputs.flavor }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Stays hosted: vm-sieitzstaging (the online self-hosted runner) has no
    # Android SDK installed, so a Gradle build fails there regardless of
    # billing status ("SDK location not found"). Revisit once the SDK is
    # set up on that box.
    runs-on: ubuntu-latest
    # No timeout previously set -- a hung Gradle build would have run to
    # GitHub's 6-hour default. 45min covers a cold cache + two release
    # assembles with real margin; see the PR checks' android-build-check
    # equivalent (currently disabled) for the measured baseline.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        run: |
          ARGS=("${{ inputs.flavor }}")
          if [[ "${{ inputs.clean }}" == "true" ]]; then
            ARGS+=("--clean")
          fi
          if [[ -n "${{ inputs.pos_origin }}" ]]; then
            ARGS+=("--pos-origin" "${{ inputs.pos_origin }}")
          fi
          bash scripts/build-android-release.sh "${ARGS[@]}"

      - name: Validate release APK and checksum
        id: validate_release_files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(releases/android/*.apk)
          if (( ${#apk_files[@]} != 1 )); then
            echo "::error::Expected exactly one release APK under releases/android; found ${#apk_files[@]}."
            exit 1
          fi
          apk_file="${apk_files[0]}"
          checksum_file="${apk_file}.sha256"
          if [[ ! -f "$apk_file" ]]; then
            echo "::error::Release APK is missing: $apk_file"
            exit 1
          fi
          if [[ ! -f "$checksum_file" ]]; then
            echo "::error::Release APK checksum is missing: $checksum_file"
            exit 1
          fi
          echo "apk_file=$apk_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"

      - name: Upload release APK evidence
        id: upload_release_apk
        uses: ./.github/actions/upload-evidence
        with:
          path: ${{ steps.validate_release_files.outputs.apk_file }}
          name: android-${{ inputs.flavor }}-release-${{ github.run_number }}
          github-name: android-${{ inputs.flavor }}-release-${{ github.run_number }}-apk
          retention-days: 30
          source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          s3-endpoint: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          s3-bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          s3-access-key-id: ${{ vars.ARTIFACT_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.ARTIFACT_S3_ACCESS_KEY_SECRET }}
      - name: Upload release APK checksum evidence
        id: upload_release_checksum
        uses: ./.github/actions/upload-evidence
        with:
          path: ${{ steps.validate_release_files.outputs.checksum_file }}
          name: android-${{ inputs.flavor }}-release-${{ github.run_number }}
          github-name: android-${{ inputs.flavor }}-release-${{ github.run_number }}-checksum
          retention-days: 30
          source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          s3-endpoint: ${{ vars.ARTIFACT_S3_ENDPOINT }}
          s3-bucket: ${{ vars.ARTIFACT_S3_BUCKET }}
          s3-access-key-id: ${{ vars.ARTIFACT_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.ARTIFACT_S3_ACCESS_KEY_SECRET }}

      - name: Fail on evidence storage failure
        if: always() && (steps.upload_release_apk.outputs.storage_status == 'failed' || steps.upload_release_checksum.outputs.storage_status == 'failed')
        run: |
          echo "::error::Android release evidence storage failed. See the APK and checksum summaries for both backend outcomes."
          exit 1
