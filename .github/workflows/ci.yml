name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Lint governed documentation
        run: npm run lint:docs

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci

      - name: Enforce modular architecture guardrails
        run: npm run check:architecture-guardrails

      - name: Enforce controller architecture boundaries
        run: npm run check:controller-boundaries
      
      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

      - name: Run open handle diagnostics
        run: npm test -- --detectOpenHandles
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

      - name: Run migrations for schema audit
        run: npm run migrate
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

      - name: Audit required indexes
        run: npm run audit:indexes
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Build
        run: npm run build

      - name: Enforce frontend bundle budgets
        working-directory: ./
        run: npm run check:frontend-budgets

  build:
    needs: [lint-docs, test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker images
        run: |
          docker build -t sku-inventory-backend ./backend
          docker build -t sku-inventory-frontend .

