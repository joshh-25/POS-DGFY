name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop, staging ]
  pull_request:
    branches: [ master, main, develop, staging ]

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint governed documentation
        run: npm run lint:docs

  release-verdict-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release verdict contract when present
        run: node scripts/verify-release-verdict.js --file .tmp/release-gates/release_verdict.json --sha "${GITHUB_SHA}" --allow-missing true

  merge-adoption-required:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require merge adoption proof for storefront customer-flow PRs
        run: npm run check:merge-adoption-required -- --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}"

  batch-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root dependencies
        run: npm ci
      - name: Generate and validate batch inventory
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
          elif [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            BASE_REF="origin/${{ github.ref_name }}~1"
          else
            BASE_REF="origin/master"
          fi
          npm run check:batch-inventory -- --base "$BASE_REF" --head "${{ github.sha }}" --write --require-ship --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --markdown ".tmp/release-gates/${{ github.sha }}/batch_inventory.md"
          npm run validate:batch-inventory -- --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --base "$BASE_REF" --head "${{ github.sha }}" --require-ship
      - name: Upload batch inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-inventory-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/batch_inventory.*
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Validate production env fixtures
        run: npm run check:production-env
      - name: Audit production dependency trees
        run: npm run audit:dependencies:prod
      - name: Audit full dependency trees
        run: npm run audit:dependencies

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci

      - name: Enforce modular architecture guardrails
        run: npm run check:architecture-guardrails

      - name: Enforce controller architecture boundaries
        run: npm run check:controller-boundaries

      - name: Enforce compliance impact declarations
        run: npm run check:compliance

      - name: Prepare test schema
        run: npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
      
      - name: Run backend test matrix
        run: node ../scripts/run-backend-test-matrix.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Upload backend test matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-matrix-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/backend-test-matrix/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Run migrations for schema audit
        run: npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Audit required indexes
        run: npm run audit:indexes
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
      
      - name: Build storefront, POS, and SKUpervisor apps
        run: npm run build:all

      - name: Enforce frontend bundle budgets
        working-directory: ./
        run: npm run check:frontend-budgets

  journey-e2e-release-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [lint-docs, dependency-audit, test-backend, test-frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ./backend

      - name: Prepare runtime schema
        run: npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager
          DB_NAME_TEST: sku_inventory_manager
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Run core IMS->POS->Sales browser journey gate
        run: npm run test:frontend-ims-pos-sales-e2e
        working-directory: ./backend
        env:
          RUN_BROWSER_E2E: 'true'
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager
          DB_NAME_TEST: sku_inventory_manager
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
          BROWSER_E2E_HEADLESS: 'true'

      - name: Upload journey artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ims-pos-sales-journey-release-gate-artifacts
          path: |
            backend/tests/artifacts/**
            backend/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: [lint-docs, release-verdict-contract, batch-inventory, dependency-audit, test-backend, test-frontend, journey-e2e-release-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker images
        run: |
          docker build -t sku-inventory-backend ./backend
          docker build -t sku-inventory-frontend .
