name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Lint governed documentation
        run: npm run lint:docs
      - name: Verify compatibility inventory doc matches manifest
        run: |
          npm run generate:compat-inventory
          git diff --exit-code -- docs/architecture/COMPATIBILITY_INVENTORY.md || {
            echo "COMPATIBILITY_INVENTORY.md is stale — run npm run generate:compat-inventory and commit the result."
            exit 1
          }

  release-verdict-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate release verdict contract when present
        run: node scripts/verify-release-verdict.js --file .tmp/release-gates/release_verdict.json --sha "${GITHUB_SHA}" --allow-missing true

  merge-adoption-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check lightweight merge hygiene
        run: npm run check:merge-hygiene -- --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}" --target "origin/${{ github.base_ref }}" --report ".tmp/release-gates/${{ github.sha }}/merge_hygiene_report.json"
      - name: Require merge adoption proof for storefront customer-flow PRs
        run: npm run check:merge-adoption-required -- --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}"
      - name: Upload merge hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-hygiene-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/merge_hygiene_report.json
          if-no-files-found: ignore
          retention-days: 30

  batch-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Run compat-seams regression suite
        run: npm run test:compat-seams
      - name: Generate and validate batch inventory
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
          elif [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            BASE_REF="origin/${{ github.ref_name }}~1"
          else
            BASE_REF="origin/master"
          fi
          npm run check:batch-inventory -- --base "$BASE_REF" --head "${{ github.sha }}" --write --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --markdown ".tmp/release-gates/${{ github.sha }}/batch_inventory.md"
          npm run check:regression-risk -- --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --output ".tmp/release-gates/${{ github.sha }}/regression_risk_notice.json" --markdown ".tmp/release-gates/${{ github.sha }}/regression_risk_notice.md" --target-sha "${{ github.sha }}"
      - name: Upload batch inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-inventory-${{ github.sha }}
          path: |
            .tmp/release-gates/${{ github.sha }}/batch_inventory.*
            .tmp/release-gates/${{ github.sha }}/regression_risk_notice.*
          if-no-files-found: error
          retention-days: 5

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Validate production env fixtures
        run: npm run check:production-env
      - name: Audit production dependency trees
        run: npm run audit:dependencies:prod
      - name: Audit full dependency trees
        run: npm run audit:dependencies

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Enforce modular architecture guardrails
        run: npm run check:architecture-guardrails

      - name: Enforce controller architecture boundaries
        run: npm run check:controller-boundaries

      - name: Enforce compliance impact declarations
        run: npm run check:compliance

      - name: Enforce compatibility-seam manifest gate
        working-directory: .
        run: npm run check:compat-seams

      - name: Prepare test schema
        run: npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
      
      - name: Run backend test matrix
        run: node ../scripts/run-backend-test-matrix.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Upload backend test matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-matrix-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/backend-test-matrix/**
          if-no-files-found: ignore
          retention-days: 5

      - name: Run migrations for schema audit
        run: npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Audit required indexes
        run: npm run audit:indexes
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

  test-dgfy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/dgfy-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce architecture guardrails
        working-directory: .
        run: npm run check:architecture:dgfy-api

      - name: Run lint
        run: npm run lint

      # apps/dgfy-api is now a straight copy of backend/'s app code (see
      # docs/ai/CLAUDE.md), so its tests/ directory is backend's full,
      # DB-backed test suite -- exercising it needs the same mysql/redis
      # services + migration prep + sharded test-matrix runner test-backend
      # uses above. That CI parity is deferred until dgfy-api absorbs more
      # of backend; for now this job only enforces guardrails + lint.

  test-dgfy-migration-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/dgfy-migration-runner

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dgfy-migration-runner/package-lock.json
      - name: Install dependencies
        run: npm ci

      # Smoke test: this is the exact command the migration-runner
      # container runs on boot (see infrastructure/docker/
      # dgfy-migration-runner/Dockerfile). If migrations apply cleanly to a
      # fresh MySQL 8 instance, the migration domain is self-contained and
      # correct -- this package has no unit tests of its own to run.
      - name: Apply migrations against a fresh database
        run: npx sequelize-cli db:migrate --config src/config/sequelize.config.cjs
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
      
      - name: Build storefront, POS, and SKUpervisor apps
        run: npm run build:all

      - name: Enforce frontend bundle budgets
        working-directory: ./
        run: npm run check:frontend-budgets

  journey-e2e-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch'
    needs: [lint-docs, dependency-audit, test-backend, test-frontend, test-dgfy-migration-runner]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ./backend

      - name: Prepare runtime schema
        run: npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager
          DB_NAME_TEST: sku_inventory_manager
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Run core IMS->POS->Sales browser journey gate
        run: npm run test:frontend-ims-pos-sales-e2e
        working-directory: ./backend
        env:
          RUN_BROWSER_E2E: 'true'
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager
          DB_NAME_TEST: sku_inventory_manager
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123
          BROWSER_E2E_HEADLESS: 'true'

      - name: Upload journey artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ims-pos-sales-journey-release-gate-artifacts
          path: |
            backend/tests/artifacts/**
            backend/test-results/**
          if-no-files-found: ignore
          retention-days: 5
