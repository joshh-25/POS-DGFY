name: PR Migration Runner Build Check

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["self-hosted"]'

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Same build as deploy-migration-runner.yml, minus the push -- proves the
      # image builds cleanly for both arches off this PR's code. Reads the
      # canonical `migration-runner` cache scope that deploy-migration-runner.yml
      # writes (usually warm from the last develop/staging/main build), but
      # writes to a PR-scoped cache so a broken PR build can never poison the
      # canonical scope -- and repeated pushes to the same PR still hit cache.
      # GitHub evicts the PR-scoped cache automatically once the PR closes.
      - name: Build migration-runner image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dgfy-migration-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=migration-runner
          cache-to: type=gha,mode=max,scope=migration-runner-pr-${{ github.event.pull_request.number }}
