name: PR Migration Runner Build Check

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Same build as deploy-migration-runner.yml, minus the push -- proves the
      # image builds cleanly for both arches off this PR's code. Shares the gha
      # cache scope with the real deploy build so both stay fast.
      - name: Build migration-runner image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dgfy-migration-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=migration-runner
          cache-to: type=gha,scope=migration-runner,mode=max
