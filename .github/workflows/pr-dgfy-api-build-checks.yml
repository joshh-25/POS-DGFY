name: PR DGFY API Build Check

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # See pr-frontend-build-checks.yml for why this builder is named and
      # retained rather than created-and-destroyed per run.
      - uses: docker/setup-buildx-action@v3
        with:
          name: dgfy-builder
          keep-state: true
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              gckeepstorage = "20GB"

      # Same build as deploy-api.yml, minus the push -- just proves the
      # image builds cleanly off this PR's code. No cache-from/cache-to: the
      # retained builder above IS the cache.
      - name: Build api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dgfy-api/Dockerfile
          push: false
