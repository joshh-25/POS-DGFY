name: CI S3 Artifact Upload POC

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: 'JSON array of runner labels, e.g. ["sieitz-runner"] or ["ubuntu-latest"]'
        type: string
        default: '["sieitz-runner"]'

permissions: {}

jobs:
  s3-artifact-poc:
    # runs-on: ${{ fromJSON(inputs.runner_labels_json || '["ubuntu-latest"]') }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["sieitz-runner"]') }}
    timeout-minutes: 15
    steps:
      - name: Ensure AWS CLI v2 is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1 && aws --version 2>&1 | grep -q '^aws-cli/2\.'; then
            aws --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64) aws_arch="x86_64" ;;
            aarch64|arm64) aws_arch="aarch64" ;;
            *) echo "Unsupported runner architecture for AWS CLI v2" >&2; exit 1 ;;
          esac

          install_root="$RUNNER_TEMP/aws-cli-install"
          bin_dir="$RUNNER_TEMP/aws-cli-bin"
          mkdir -p "$install_root" "$bin_dir"
          curl --fail --silent --show-error \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            --output "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$install_root"
          "$install_root/aws/install" --install-dir "$install_root/aws-cli" --bin-dir "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/aws" --version

      - name: Record pre-existing AWS CLI credential files
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/s3-artifact-poc-state"
          mkdir -p "$state_dir"
          for name in credentials config; do
            if [[ -e "$HOME/.aws/$name" ]]; then
              echo present > "$state_dir/$name.before"
            else
              echo absent > "$state_dir/$name.before"
            fi
          done

      - name: Upload, verify, and remove POC objects
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_S3_USERNAME }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_S3_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
          POC_PREFIX: poc/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail

          run_dir="$RUNNER_TEMP/s3-artifact-poc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$run_dir"
          export AWS_CONFIG_FILE="$run_dir/aws-config"
          export AWS_SHARED_CREDENTIALS_FILE="$run_dir/aws-credentials"
          cat > "$AWS_CONFIG_FILE" <<'AWS_CONFIG'
          [default]
          region = us-east-1
          s3 =
              addressing_style = path
              multipart_threshold = 8MB
          AWS_CONFIG
          small_key="$POC_PREFIX/small-sample.bin"
          large_key="$POC_PREFIX/large-sample.bin"
          small_uri="s3://${S3_BUCKET}/${small_key}"
          large_uri="s3://${S3_BUCKET}/${large_key}"
          small_display_uri="s3://[bucket-redacted]/${small_key}"
          large_display_uri="s3://[bucket-redacted]/${large_key}"

          failed=0
          failure_reason=""
          verified=0
          cleanup_status="not run"
          small_upload="not attempted"
          large_upload="not attempted"
          small_direct="not attempted"
          large_direct="not attempted"
          small_presigned="not attempted"
          large_presigned="not attempted"
          small_cleanup="not attempted"
          large_cleanup="not attempted"
          small_http="not received"
          large_http="not received"
          small_source_sha="not calculated"
          large_source_sha="not calculated"
          small_direct_sha="not calculated"
          large_direct_sha="not calculated"
          small_presigned_sha="not calculated"
          large_presigned_sha="not calculated"
          small_size="4096 bytes"
          large_size="105906176 bytes (101 MiB)"

          mark_failure() {
            failed=1
            if [[ -z "$failure_reason" ]]; then
              failure_reason="$1"
            else
              failure_reason="$failure_reason; $1"
            fi
          }

          finish() {
            retained_objects=""
            if [[ "$verified" -eq 1 ]]; then
              if [[ "$small_cleanup" != "removed" ]]; then
                retained_objects="$small_display_uri"
              fi
              if [[ "$large_cleanup" != "removed" ]]; then
                if [[ -n "$retained_objects" ]]; then
                  retained_objects="$retained_objects, "
                fi
                retained_objects="$retained_objects$large_display_uri"
              fi
            else
              retained_objects="possible objects from this run: $small_display_uri, $large_display_uri"
            fi
            {
              echo "### S3 artifact POC"
              echo
              echo "- Endpoint: https://s3.patteruel.dev"
              echo "- Bucket: configured repository secret (redacted)"
              echo "- Small object: ${small_display_uri} (${small_size})"
              echo "- Large object: ${large_display_uri} (${large_size})"
              echo "- Upload client: AWS CLI v2 s3 cp with path-style addressing and an 8 MiB multipart threshold; the 101 MiB file exercises multipart upload."
              echo "- Upload results: small ${small_upload}; large ${large_upload}"
              echo "- Direct download results: small ${small_direct}; large ${large_direct}"
              echo "- Presigned unauthenticated readback HTTP status: small ${small_http}; large ${large_http}"
              echo "- Presigned readback results: small ${small_presigned}; large ${large_presigned}"
              echo "- SHA-256 small: source ${small_source_sha}; direct download ${small_direct_sha}; presigned download ${small_presigned_sha}"
              echo "- SHA-256 large: source ${large_source_sha}; direct download ${large_direct_sha}; presigned download ${large_presigned_sha}"
              echo "- Cleanup: ${cleanup_status} (small ${small_cleanup}; large ${large_cleanup})"
              if [[ "$verified" -eq 1 && "$failed" -eq 0 ]]; then
                echo "- Retained objects: none; both objects passed direct and presigned checksum verification and cleanup succeeded."
              else
                echo "- Retained objects: ${retained_objects:-none}."
                echo "- Failure: ${failure_reason:-verification did not complete}"
              fi
              echo "- Secrets: values, including the bucket secret, are not recorded. Presigned URLs are not recorded."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" || -z "${S3_BUCKET:-}" ]]; then
            mark_failure "one or more required ARTIFACT_S3_* secrets are unavailable"
            finish
            exit 1
          fi

          head -c 4096 /dev/urandom > "$run_dir/small-source.bin"
          head -c 105906176 /dev/urandom > "$run_dir/large-source.bin"
          small_source_sha="$(sha256sum "$run_dir/small-source.bin" | cut -d ' ' -f1)"
          large_source_sha="$(sha256sum "$run_dir/large-source.bin" | cut -d ' ' -f1)"

          if aws s3 cp "$run_dir/small-source.bin" "$small_uri" \
            --endpoint-url https://s3.patteruel.dev --only-show-errors --no-progress \
            >/dev/null 2>&1; then
            small_upload="exit 0"
          else
            rc=$?
            small_upload="exit $rc"
            mark_failure "small object upload failed"
          fi
          if aws s3 cp "$run_dir/large-source.bin" "$large_uri" \
            --endpoint-url https://s3.patteruel.dev --only-show-errors --no-progress \
            >/dev/null 2>&1; then
            large_upload="exit 0"
          else
            rc=$?
            large_upload="exit $rc"
            mark_failure "large object upload failed"
          fi

          if [[ "$failed" -eq 0 ]]; then
            if aws s3 cp "$small_uri" "$run_dir/small-direct.bin" \
              --endpoint-url https://s3.patteruel.dev --only-show-errors --no-progress \
              >/dev/null 2>&1; then
              small_direct="exit 0"
              small_direct_sha="$(sha256sum "$run_dir/small-direct.bin" | cut -d ' ' -f1)"
              [[ "$small_direct_sha" == "$small_source_sha" ]] || mark_failure "small direct-download SHA-256 mismatch"
            else
              rc=$?
              small_direct="exit $rc"
              mark_failure "small direct download failed"
            fi
            if aws s3 cp "$large_uri" "$run_dir/large-direct.bin" \
              --endpoint-url https://s3.patteruel.dev --only-show-errors --no-progress \
              >/dev/null 2>&1; then
              large_direct="exit 0"
              large_direct_sha="$(sha256sum "$run_dir/large-direct.bin" | cut -d ' ' -f1)"
              [[ "$large_direct_sha" == "$large_source_sha" ]] || mark_failure "large direct-download SHA-256 mismatch"
            else
              rc=$?
              large_direct="exit $rc"
              mark_failure "large direct download failed"
            fi
          fi

          if [[ "$failed" -eq 0 ]]; then
            small_url="$(aws s3 presign "$small_uri" --endpoint-url https://s3.patteruel.dev --expires-in 900 2>/dev/null)" || {
              mark_failure "small object presigning failed"
            }
            large_url="$(aws s3 presign "$large_uri" --endpoint-url https://s3.patteruel.dev --expires-in 900 2>/dev/null)" || {
              mark_failure "large object presigning failed"
            }
            if [[ "$failed" -eq 0 ]]; then
              if small_http="$(curl --fail --silent --show-error --output "$run_dir/small-presigned.bin" \
                --write-out '%{http_code}' "$small_url" 2>/dev/null)"; then
                small_presigned="downloaded"
                small_presigned_sha="$(sha256sum "$run_dir/small-presigned.bin" | cut -d ' ' -f1)"
                [[ "$small_presigned_sha" == "$small_source_sha" ]] || mark_failure "small presigned-download SHA-256 mismatch"
              else
                small_presigned="failed"
                mark_failure "small presigned URL readback failed"
              fi
              if large_http="$(curl --fail --silent --show-error --output "$run_dir/large-presigned.bin" \
                --write-out '%{http_code}' "$large_url" 2>/dev/null)"; then
                large_presigned="downloaded"
                large_presigned_sha="$(sha256sum "$run_dir/large-presigned.bin" | cut -d ' ' -f1)"
                [[ "$large_presigned_sha" == "$large_source_sha" ]] || mark_failure "large presigned-download SHA-256 mismatch"
              else
                large_presigned="failed"
                mark_failure "large presigned URL readback failed"
              fi
            fi
          fi

          if [[ "$failed" -eq 0 ]]; then
            verified=1
            if aws s3 rm "$small_uri" --endpoint-url https://s3.patteruel.dev --only-show-errors >/dev/null 2>&1; then
              small_cleanup="removed"
            else
              rc=$?
              small_cleanup="exit $rc"
              mark_failure "small object cleanup failed"
            fi
            if aws s3 rm "$large_uri" --endpoint-url https://s3.patteruel.dev --only-show-errors >/dev/null 2>&1; then
              large_cleanup="removed"
            else
              rc=$?
              large_cleanup="exit $rc"
              mark_failure "large object cleanup failed"
            fi
            if [[ "$small_cleanup" == "removed" && "$large_cleanup" == "removed" ]]; then
              cleanup_status="both objects removed after verification"
            else
              cleanup_status="verification passed; one or more cleanup attempts failed"
            fi
          else
            cleanup_status="skipped because verification failed; retain objects for inspection"
          fi

          finish
          rm -rf "$run_dir"
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Remove AWS CLI credential files created by this job
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/s3-artifact-poc-state"
          created_files=()
          for name in credentials config; do
            before="absent"
            if [[ -f "$state_dir/$name.before" ]]; then
              before="$(cat "$state_dir/$name.before")"
            fi
            if [[ "$before" == "absent" && -e "$HOME/.aws/$name" ]]; then
              rm -f "$HOME/.aws/$name"
              created_files+=("$name (removed)")
            elif [[ "$before" == "present" ]]; then
              created_files+=("$name (pre-existing; preserved)")
            else
              created_files+=("$name (not created)")
            fi
          done
          {
            echo
            echo "### AWS CLI credential file check"
            echo "- ~/.aws/credentials: ${created_files[0]}"
            echo "- ~/.aws/config: ${created_files[1]}"
          } >> "$GITHUB_STEP_SUMMARY"
