name: Build Images (develop)

on:
  push:
    branches: [ develop ]

concurrency:
  group: build-develop-${{ github.ref }}
  # false, not true: `changes` diffs each run against github.event.before (that
  # push's immediately-preceding commit), not "the last commit this pipeline
  # actually finished building". Cancelling an in-flight run on the next push
  # loses that run's diff outright, so a burst of quick pushes to develop can
  # silently skip a real backend/frontend change if only the last push's run
  # survives to completion. false makes bursts queue instead: every push still
  # diffs its own correct range and gets built, at the cost of the queue
  # taking longer to drain during a burst -- correctness over saved minutes
  # for what's the actual deploy pipeline (unlike pr-checks.yml, which stays
  # cancel-in-progress since a superseded/closed PR's check has no cost of
  # being wrong to skip).
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-pos-receipt:
    # Fully independent of build-and-push (no `needs:`) so a source change here
    # without a matching version bump can never stall or fail the deploy
    # pipeline - the two jobs simply run in parallel. `continue-on-error` is
    # not a valid key on a job that calls a reusable workflow via `uses:`
    # (GitHub rejects the whole workflow file if present, which is what
    # broke this pipeline outright); independence via no shared `needs:` is
    # what actually makes this job optional.
    uses: ./.github/workflows/publish-pos-receipt.yml
    with:
      before_sha: ${{ github.event.before }}
      # GHA billing exhausted -- running on self-hosted (vm-sieitzstaging).
      # Switch back to # runner_labels_json: '["ubuntu-slim"]' once hosted
      # runners are available again.
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  changes:
    uses: ./.github/workflows/shared-changed-paths.yml
    with:
      base_sha: ${{ github.event.before }}
      # runner_labels_json: '["ubuntu-slim"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'

  build-and-push:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dgfy_api == 'true' || needs.changes.outputs.migration_runner == 'true'
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: DEV
      image_tags: "develop"
      publish: true
      # The self-hosted runner (vm-sieitzstaging) already sits on the DEV/
      # STAGING network, so the OpenVPN hop that hosted runners needed is
      # unnecessary here -- and running it would have the runner open a VPN
      # tunnel into itself and rewrite its own routing on every deploy.
      vpn_required: false
      build_api: ${{ needs.changes.outputs.dgfy_api == 'true' || needs.changes.outputs.migration_runner == 'true' }}
      build_frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      # runner_labels_json: '["ubuntu-latest"]'  # revert to this when hosted runners are back
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write
