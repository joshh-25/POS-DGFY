name: Build Images (develop)

on:
  push:
    branches: [ develop ]

concurrency:
  group: build-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-pos-receipt:
    uses: ./.github/workflows/publish-pos-receipt.yml
    with:
      before_sha: ${{ github.event.before }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  build-and-push:
    needs: publish-pos-receipt
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: DEV
      image_tags: "develop"
      publish: true
      vpn_required: true
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write
