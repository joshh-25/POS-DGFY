name: Build Images (develop)

on:
  push:
    branches: [ develop ]

concurrency:
  group: build-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-pos-receipt:
    # Fully independent of build-and-push (no `needs:`) so a source change here
    # without a matching version bump can never stall or fail the deploy
    # pipeline - the two jobs simply run in parallel. `continue-on-error` is
    # not a valid key on a job that calls a reusable workflow via `uses:`
    # (GitHub rejects the whole workflow file if present, which is what
    # broke this pipeline outright); independence via no shared `needs:` is
    # what actually makes this job optional.
    uses: ./.github/workflows/publish-pos-receipt.yml
    with:
      before_sha: ${{ github.event.before }}
      # Switch back to the free self-hosted runners if Actions minutes run
      # out. Pin the label so jobs avoid vm-sieitzstaging (AVX-less CPU ->
      # exit 132 on native addons like @napi-rs/canvas).
      # runner_labels_json: '["self-hosted","sieitz-ubuntu-runner"]'
      runner_labels_json: '["ubuntu-slim"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  changes:
    uses: ./.github/workflows/shared-changed-paths.yml
    with:
      base_sha: ${{ github.event.before }}
      # runner_labels_json: '["self-hosted","sieitz-ubuntu-runner"]'
      runner_labels_json: '["ubuntu-slim"]'

  build-and-push:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: DEV
      image_tags: "develop"
      publish: true
      vpn_required: true
      build_backend: ${{ needs.changes.outputs.backend == 'true' }}
      build_frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      # runner_labels_json: '["self-hosted","sieitz-ubuntu-runner"]'
      runner_labels_json: '["ubuntu-latest"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write
