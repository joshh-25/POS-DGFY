name: Build Images (develop)

on:
  push:
    branches: [ develop ]

concurrency:
  group: build-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-pos-receipt:
    # Non-blocking: a source change here without a matching version bump
    # shouldn't stall the whole develop deploy pipeline. Failures still show
    # up in the run so they can be caught and fixed in a follow-up push.
    continue-on-error: true
    uses: ./.github/workflows/publish-pos-receipt.yml
    with:
      before_sha: ${{ github.event.before }}
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write

  build-and-push:
    needs: publish-pos-receipt
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: DEV
      image_tags: "develop"
      publish: true
      vpn_required: true
      runner_labels_json: '["self-hosted"]'
    secrets: inherit
    permissions:
      contents: read
      packages: write
