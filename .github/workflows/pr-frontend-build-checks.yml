name: PR Frontend Build Check

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same build as deploy-frontend.yml, minus the push -- just proves the
      # image builds cleanly off this PR's code. Deliberately omits the
      # VITE_* build-args block: those resolve from a GitHub Environment's
      # vars.* and aren't needed just to prove the build succeeds -- the
      # Dockerfile's own ARG defaults are fine here. Reads the canonical
      # `frontend` cache scope that deploy-frontend.yml writes (usually warm
      # from the last develop/staging/main build), but writes to a PR-scoped
      # cache so a broken PR build can never poison the canonical scope -- and
      # repeated pushes to the same PR still hit cache. GitHub evicts the
      # PR-scoped cache automatically once the PR closes.
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend-pr-${{ github.event.pull_request.number }}
