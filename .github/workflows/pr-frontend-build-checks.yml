name: PR Frontend Build Check

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  packages: read

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same build as deploy-frontend.yml, minus the push -- just proves the
      # image builds cleanly off this PR's code. Deliberately omits the
      # VITE_* build-args block: those resolve from a GitHub Environment's
      # vars.* and aren't needed just to prove the build succeeds -- the
      # Dockerfile's own ARG defaults are fine here. Shares the gha cache
      # scope with the real deploy build so both stay fast.
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
