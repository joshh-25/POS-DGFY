name: PR Frontend Build Check

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box
      cache_from:
        description: >-
          Cache backend for cache-from, e.g. "type=gha". Empty disables the
          cache entirely -- see #726: the Actions cache endpoint currently
          costs ~21x the build it's meant to skip on self-hosted runners.
        required: false
        type: string
        default: ''

jobs:
  build-check:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same build as deploy-frontend.yml, minus the push -- just proves the
      # image builds cleanly off this PR's code. Deliberately omits the
      # VITE_* build-args block: those resolve from a GitHub Environment's
      # vars.* and aren't needed just to prove the build succeeds -- the
      # Dockerfile's own ARG defaults are fine here. Reads the canonical
      # `frontend` cache scope that deploy-frontend.yml writes (usually warm
      # from the last develop/staging/main build). Deliberately no cache-to:
      # a per-PR mode=max cache write is full-size and nothing ever reads it
      # back (each PR only reads the canonical scope), so it was pure
      # eviction pressure against the repo's 10GB Actions cache quota --
      # see #412.
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          push: false
          cache-from: ${{ inputs.cache_from != '' && format('{0},scope=frontend', inputs.cache_from) || '' }}
