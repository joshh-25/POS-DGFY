name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Light jobs: git/bash only, well under ubuntu-slim's 15-minute cap.
  RUNNER_LIGHT_JSON: &runner_light '["ubuntu-slim"]'
  # Heavy jobs: ubuntu-slim runs unprivileged (no Docker-in-Docker), so buildx
  # needs a full VM.
  RUNNER_HEAVY_JSON: &runner_heavy '["ubuntu-latest"]'

# Deliberately just 3 billable jobs. PR title/body validation and the
# pos-receipt version-bump check used to be their own jobs (conventional-
# commits, and a step inside code-quality); each extra job pays its own
# per-job 1-minute GitHub Actions billing floor regardless of how many
# seconds of actual work it does, so they're now folded into `changes`
# (validate_pr_metadata: true) instead. code-quality (lint/architecture/
# compliance/docs) was `continue-on-error: true` -- it could never block a
# merge -- and has been removed outright; that coverage now lives in local
# pre-commit hooks (see .husky/pre-commit) instead of CI.
jobs:
  changes:
    uses: ./.github/workflows/shared-changed-paths.yml
    with:
      runner_labels_json: *runner_light
      validate_pr_metadata: true

  backend-build-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/pr-backend-build-checks.yml
    with:
      runner_labels_json: *runner_heavy

  frontend-build-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/pr-frontend-build-checks.yml
    with:
      runner_labels_json: *runner_heavy
