name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `edited` (title/body edits) used to be in `types:` above. On a single-
# concurrency self-hosted runner that's pure queue waste: a prose-only edit
# cancels an in-flight run and requeues both Docker build-checks behind it
# for zero code-signal (see #412, and #194's older billing-era version of the
# same finding). Dropped. `ready_for_review` replaces it instead -- without
# it, a PR opened as a draft and later marked ready never gets checked unless
# someone also pushes a commit.

env:
  # GHA billing is exhausted (spending limit / failed payment), so every job
  # runs on self-hosted for now. Since #923 (2026-08-23), light/heavy is a real
  # routing split, not just a no-op scaffold: sieitz-runner is either box,
  # sieitz-lg is vm-sieitzstaging only. Split by measured GHA history, not by
  # guess -- see docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md's #923 section. This
  # is still a one-line revert if/when hosted runners come back (swap the
  # value, not the anchor name -- see scripts/check-pr-quality-workflow.js,
  # which asserts *runner_heavy).
  RUNNER_LIGHT_JSON: &runner_light '["self-hosted", "sieitz-runner"]'
  RUNNER_HEAVY_JSON: &runner_heavy '["self-hosted", "sieitz-lg"]'
  # Empty on self-hosted: the Actions cache service serves these runners at 49-69 KB/s, so
  # importing the layer cache costs ~21x the build it skips (#726). Revert to type=gha when
  # hosted runners are back -- see docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md.
  BUILD_CACHE_FROM: &build_cache_from ''
  # BUILD_CACHE_FROM: &build_cache_from 'type=gha'  # revert to this when hosted runners are back

# Deliberately just `changes` plus one build-check job per deployable (this
# repo splits `apps/dgfy-api` from `apps/dgfy-migration-runner`, so that's
# two backend jobs instead of develop's one). PR title/body validation and
# the pos-receipt version-bump check used to be their own jobs (conventional-
# commits, and a step inside code-quality); each extra job pays its own
# per-job 1-minute GitHub Actions billing floor regardless of how many
# seconds of actual work it does, so they're now folded into `changes`
# (validate_pr_metadata: true) instead. code-quality (lint/architecture/
# compliance/docs) was `continue-on-error: true` -- it could never block a
# merge -- and has been removed outright; that coverage now lives in local
# pre-commit hooks (see .husky/pre-commit) instead of CI.
#
# The compliance impact guardrail was briefly restored as a blocking step
# (enforce_compliance_declarations: true) on 2026-08-07 to close the gap that
# let PRs #284/#288 merge with a mandatory POS impact declaration missing
# (pre-commit hooks are bypassable with `git commit --no-verify`, which both
# did). Set back to `false` the same day: it immediately blocked an in-flight
# release on the same two already-merged PRs, with no fast path to satisfy it
# (preflight needs a live authenticated backend session). Re-enabling this is
# still the right fix for the underlying gap -- see
# docs/ops/RELEASE_CANDIDATE_POLICY.md and
# docs/compliance/request-time-preflight-protocol.md -- but needs to land
# alongside a way to actually clear it, not just flip on. The `changes` job
# and shared-changed-paths.yml's `enforce_compliance_declarations` input are
# left in place so re-enabling is a one-line change, not a redo.
#
# quality-checks and android-build-check used to be jobs here, gated
# `if: false` (see #345 and #254 respectively for why each was paused, not
# deleted). A permanently-skipped job is still a row in every PR's Checks
# tab with nothing to say -- pure clutter, and it invites the false read
# that something is actually being checked. Removed outright 2026-08-14
# (#416); both reusable workflows are untouched and still runnable by hand
# from the Actions tab (pr-quality-checks.yml / pr-android-build-checks.yml,
# now `workflow_dispatch`-triggered) whenever a full test run or an Android
# build-check is actually wanted, without paying for either on every PR.
jobs:
  changes:
    # Drafts aren't merge candidates -- skip the whole pipeline rather than
    # pay a runner slot for them. Every job below depends on `changes`, and a
    # skipped job's outputs are the empty string, so `== 'true'` is false and
    # they all skip cleanly with no further changes needed.
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/shared-changed-paths.yml
    with:
      runner_labels_json: *runner_light
      validate_pr_metadata: true
      enforce_compliance_declarations: false

  dgfy-api-build-check:
    needs: changes
    if: needs.changes.outputs.dgfy_api == 'true'
    uses: ./.github/workflows/pr-dgfy-api-build-checks.yml
    with:
      # Measured (#923): npm ci --omit=dev + COPY, no compile step -- median
      # 2.8m on the small box vs 3.4m on the large. Faster on either-box.
      runner_labels_json: *runner_light
      cache_from: *build_cache_from

  dgfy-migration-runner-build-check:
    needs: changes
    if: needs.changes.outputs.migration_runner == 'true'
    uses: ./.github/workflows/pr-migration-runner-build-checks.yml
    with:
      # Measured (#923): same shape as dgfy-api-build-check -- median 1.4m on
      # the small box vs 1.8m on the large. Faster on either-box.
      runner_labels_json: *runner_light
      cache_from: *build_cache_from

  frontend-build-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/pr-frontend-build-checks.yml
    with:
      # Measured (#923): npm run build:all:parallel (3 concurrent vite
      # builds) -- median 3.7m on the small box vs 2.4m on the large, and the
      # documented exit-137 OOM case (#662). Keep on the large box.
      runner_labels_json: *runner_heavy
      cache_from: *build_cache_from
