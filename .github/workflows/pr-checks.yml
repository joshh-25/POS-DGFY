name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Toggle the runner for ALL PR checks here by commenting/uncommenting one line.
  # RUNNER_LABELS_JSON: &runner_labels_json '["ubuntu-latest"]'
  RUNNER_LABELS_JSON: &runner_labels_json '["self-hosted"]'

jobs:
  changes:
    uses: ./.github/workflows/pr-changed-paths.yml
    with:
      runner_labels_json: *runner_labels_json

  conventional-commits:
    uses: ./.github/workflows/pr-conventional-commits.yml
    with:
      runner_labels_json: *runner_labels_json

  code-quality:
    uses: ./.github/workflows/pr-code-checks.yml
    with:
      runner_labels_json: *runner_labels_json

  # The build checks deliberately do NOT wait on code-quality. That job takes
  # ~1m45s and is `continue-on-error: true`, so it can never block a merge --
  # gating on it only delayed the builds by its full runtime. conventional-
  # commits (~10s) stays as a cheap fail-fast.
  backend-build-check:
    needs: [changes, conventional-commits]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/pr-backend-build-checks.yml
    with:
      runner_labels_json: *runner_labels_json

  frontend-build-check:
    needs: [changes, conventional-commits]
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/pr-frontend-build-checks.yml
    with:
      runner_labels_json: *runner_labels_json

  summary:
    needs: [conventional-commits, code-quality, backend-build-check, frontend-build-check]
    if: always()
    uses: ./.github/workflows/pr-checks-summary.yml
    with:
      runner_labels_json: *runner_labels_json
      conventional_commits_result: ${{ needs.conventional-commits.result }}
      code_quality_result: ${{ needs.code-quality.result }}
      backend_build_result: ${{ needs.backend-build-check.result }}
      frontend_build_result: ${{ needs.frontend-build-check.result }}
