name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    uses: ./.github/workflows/pr-conventional-commits.yml

  code-quality:
    uses: ./.github/workflows/pr-code-checks.yml

  backend-build-check:
    needs: [conventional-commits, code-quality]
    uses: ./.github/workflows/pr-backend-build-checks.yml

  frontend-build-check:
    needs: [conventional-commits, code-quality]
    uses: ./.github/workflows/pr-frontend-build-checks.yml

  dgfy-api-build-check:
    needs: [conventional-commits, code-quality]
    uses: ./.github/workflows/pr-dgfy-api-build-checks.yml

  dgfy-migration-runner-build-check:
    needs: [conventional-commits, code-quality]
    uses: ./.github/workflows/pr-migration-runner-build-checks.yml

  dgfy-api-code-check:
    needs: [conventional-commits]
    uses: ./.github/workflows/pr-dgfy-api-code-checks.yml

  summary:
    runs-on: ubuntu-latest
    needs: [conventional-commits, code-quality, backend-build-check, frontend-build-check, dgfy-api-build-check, dgfy-migration-runner-build-check, dgfy-api-code-check]
    if: always()
    steps:
      - name: PR checks summary
        run: |
          echo "## PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Conventional Commits | ${{ needs.conventional-commits.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Build | ${{ needs.backend-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DGFY API Build | ${{ needs.dgfy-api-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DGFY Migration Runner Build | ${{ needs.dgfy-migration-runner-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DGFY API Code (lint/tests) | ${{ needs.dgfy-api-code-check.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
