name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `edited` (title/body edits) used to be in `types:` above. On a single-
# concurrency self-hosted runner that's pure queue waste: a prose-only edit
# cancels an in-flight run and requeues both Docker build-checks behind it
# for zero code-signal (see #412, and #194's older billing-era version of the
# same finding). Dropped. `ready_for_review` replaces it instead -- without
# it, a PR opened as a draft and later marked ready never gets checked unless
# someone also pushes a commit.

env:
  # GHA billing is exhausted (spending limit / failed payment), so every job
  # runs on self-hosted for now. Since #923 (2026-08-23), light/heavy is a real
  # routing split, not just a no-op scaffold: sieitz-runner is either box,
  # sieitz-lg is vm-sieitzstaging only. Split by measured GHA history, not by
  # guess -- see docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md's #923 section. This
  # is still a one-line revert if/when hosted runners come back (swap the
  # value, not the anchor name -- see scripts/check-pr-quality-workflow.js,
  # which asserts *runner_heavy).
  RUNNER_LIGHT_JSON: &runner_light '["sieitz-runner"]'
  RUNNER_HEAVY_JSON: &runner_heavy '["sieitz-lg"]'
  # Empty on self-hosted: the Actions cache service serves these runners at 49-69 KB/s, so
  # importing the layer cache costs ~21x the build it skips (#726). Revert to type=gha when
  # hosted runners are back -- see docs/ops/CI_RUNNER_MIGRATION_HANDOFF.md.
  BUILD_CACHE_FROM: &build_cache_from ''
  # BUILD_CACHE_FROM: &build_cache_from 'type=gha'  # revert to this when hosted runners are back

# Deliberately just `changes` plus one build-check job per deployable (this
# repo splits `apps/dgfy-api` from `apps/dgfy-migration-runner`, so that's
# two backend jobs, plus one job per frontend app -- dgfy-ims/dgfy-pos/
# dgfy-storefront, issue #322 Phase 6 -- instead of develop's single
# frontend job). PR title/body validation and
# the pos-receipt version-bump check used to be their own jobs (conventional-
# commits, and a step inside code-quality); each extra job pays its own
# per-job 1-minute GitHub Actions billing floor regardless of how many
# seconds of actual work it does, so they're now folded into `changes`
# (validate_pr_metadata: true) instead. code-quality (lint/architecture/
# compliance/docs) was `continue-on-error: true` -- it could never block a
# merge -- and has been removed outright; that coverage now lives in local
# pre-commit hooks (see .husky/pre-commit) instead of CI.
#
# The compliance impact guardrail was briefly restored as a blocking step
# (enforce_compliance_declarations: true) on 2026-08-07 to close the gap that
# let PRs #284/#288 merge with a mandatory POS impact declaration missing
# (pre-commit hooks are bypassable with `git commit --no-verify`, which both
# did). Set back to `false` the same day: it immediately blocked an in-flight
# release on the same two already-merged PRs, with no fast path to satisfy it
# (preflight needs a live authenticated backend session). Re-enabling this is
# still the right fix for the underlying gap -- see
# docs/ops/RELEASE_CANDIDATE_POLICY.md and
# docs/compliance/request-time-preflight-protocol.md -- but needs to land
# alongside a way to actually clear it, not just flip on. The `changes` job
# and shared-changed-paths.yml's `enforce_compliance_declarations` input are
# left in place so re-enabling is a one-line change, not a redo.
#
# quality-checks and android-build-check used to be jobs here, gated
# `if: false` (see #345 and #254 respectively for why each was paused, not
# deleted). A permanently-skipped job is still a row in every PR's Checks
# tab with nothing to say -- pure clutter, and it invites the false read
# that something is actually being checked. Removed outright 2026-08-14
# (#416); pr-android-build-checks.yml is still `workflow_dispatch`-only,
# runnable by hand from the Actions tab whenever an Android build-check is
# actually wanted, without paying for it on every PR.
#
# 2026-08-25 (PR #1003): this PR's own head commit re-added a `quality-checks:`
# job block right here, unconditional and unfiltered by path -- exactly the
# every-PR cost the paragraph directly above it describes removing. Reverted
# in the same PR before merge; the block never ran as part of develop's
# history. If quality-checks is ever genuinely re-wired on purpose, it needs
# its own PR that says so in the title/body and updates this comment plus
# scripts/check-pr-quality-workflow.js's expectations -- not a side effect of
# an unrelated feature PR.
#
# #1018/#1008 Phase 3 (this repo's own answer to the paragraph directly above): the former
# pr-quality-checks.yml, renamed promotion-quality-gate.yml, is genuinely re-wired on purpose --
# but NOT as a job added to this file. It triggers itself, on its own `pull_request: branches:
# [staging, main]`, gated by its own `gate` job to only the `to-staging/*`/`release/*` promotion
# PRs specifically. This file (pr-checks.yml) still runs on every `develop`/`staging`/`main` PR
# and stays exactly as cheap as the paragraphs above describe -- the promotion-time gate is a
# fully separate workflow file precisely so it never becomes a row in an ordinary feature PR's
# Checks tab.
jobs:
  changes:
    # Drafts aren't merge candidates -- skip the whole pipeline rather than
    # pay a runner slot for them. Every job below depends on `changes`, and a
    # skipped job's outputs are the empty string, so `== 'true'` is false and
    # they all skip cleanly with no further changes needed.
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/shared-changed-paths.yml
    with:
      runner_labels_json: *runner_light
      validate_pr_metadata: true
      enforce_compliance_declarations: false

  # #1529: a release/*|hotfix/* head into a main base is a promotion or hotfix PR -- its
  # build-check jobs get the same GitHub-hosted isolation/predictability rationale
  # docs/ops/CI_RUNNER_POLICY.md already gives the deploy path itself, one step earlier in the PR
  # lifecycle. Every other PR (develop/staging targets, or any other PR that happens to target main
  # without one of these two head shapes) stays self-hosted, unchanged. Mirrors
  # promotion-quality-gate.yml's own `gate` job `case "$HEAD_REF" in` pattern, with an added
  # hotfix/* arm -- promotion-quality-gate.yml's own gate-activation deliberately excludes
  # hotfix/* (per #1527: whether the *quality gate* runs at all is a different, already-settled
  # question from this one). Always self-hosted itself, same reasoning as that `gate` job's own
  # Phase 233 anchor exception: a ~1-2 minute control-plane job that must run even when everything
  # downstream is conditionally routed, so it can't depend on the routing decision it's making.
  route-build-checks:
    if: github.event.pull_request.draft == false
    runs-on: ['sieitz-runner']
    timeout-minutes: 2
    outputs:
      light: ${{ steps.check.outputs.light }}
      heavy: ${{ steps.check.outputs.heavy }}
    steps:
      - name: Determine whether build-checks should route to GitHub-hosted runners
        id: check
        # A bug here must never itself redden the build-check pipeline -- worst case is staying
        # self-hosted (see each build-check job's own `|| '["sieitz-runner"]'` fallback below).
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          RUNNER_LIGHT_JSON: *runner_light
          RUNNER_HEAVY_JSON: *runner_heavy
        run: |
          HOSTED_JSON='["ubuntu-latest"]'
          case "$BASE_REF" in
            main)
              case "$HEAD_REF" in
                release/*|hotfix/*)
                  echo "light=$HOSTED_JSON" >> "$GITHUB_OUTPUT"
                  echo "heavy=$HOSTED_JSON" >> "$GITHUB_OUTPUT"
                  echo "base=$BASE_REF head=$HEAD_REF matches release/*|hotfix/*-into-main -- routing build-checks to GitHub-hosted runners"
                  exit 0
                  ;;
              esac
              ;;
          esac
          echo "light=$RUNNER_LIGHT_JSON" >> "$GITHUB_OUTPUT"
          echo "heavy=$RUNNER_HEAVY_JSON" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_REF head=$HEAD_REF does not match release/*|hotfix/*-into-main -- staying self-hosted"

  dgfy-api-build-check:
    needs: [changes, route-build-checks]
    # PR #1534 review RF-1: route-build-checks failing at the job level (not just its own
    # continue-on-error'd step) must not implicitly skip this job via GitHub Actions' default
    # success() condition -- that would silently drop the self-hosted `||` fallback below along
    # with it. always() overrides the implicit condition; needs.changes.result == 'success'
    # restores the "don't run with a failed changes job" half that always() alone would remove,
    # and the existing changes.outputs check still gates on whether there's anything to build.
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.dgfy_api == 'true'
    uses: ./.github/workflows/pr-dgfy-api-build-checks.yml
    with:
      # Measured (#923): npm ci --omit=dev + COPY, no compile step -- median
      # 2.8m on the small box vs 3.4m on the large. Faster on either-box.
      # #1529: hosted for a release/*|hotfix/* PR into main (route-build-checks above); the
      # `!= '' && ... ||` guard falls back to self-hosted if that job's own step ever failed
      # before producing an output, rather than passing '' into fromJSON() downstream.
      runner_labels_json: ${{ needs.route-build-checks.outputs.light != '' && needs.route-build-checks.outputs.light || '["sieitz-runner"]' }}
      cache_from: *build_cache_from

  dgfy-migration-runner-build-check:
    needs: [changes, route-build-checks]
    # PR #1534 review RF-1: same always()/needs.changes.result reasoning as dgfy-api-build-check
    # above -- without it, a route-build-checks job-level failure implicitly skips this job too.
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.migration_runner == 'true'
    uses: ./.github/workflows/pr-migration-runner-build-checks.yml
    with:
      # Measured (#923): same shape as dgfy-api-build-check -- median 1.4m on
      # the small box vs 1.8m on the large. Faster on either-box.
      # #1529: same routing/fallback shape as dgfy-api-build-check above.
      runner_labels_json: ${{ needs.route-build-checks.outputs.light != '' && needs.route-build-checks.outputs.light || '["sieitz-runner"]' }}
      cache_from: *build_cache_from

  frontend-ims-build-check:
    needs: [changes, route-build-checks]
    # PR #1534 review RF-1: same always()/needs.changes.result reasoning as dgfy-api-build-check
    # above -- without it, a route-build-checks job-level failure implicitly skips this job too.
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.frontend_ims == 'true'
    uses: ./.github/workflows/pr-frontend-build-checks.yml
    with:
      # #923's own measurement was taken pre-split, against the old
      # `npm run build:all:parallel` (3 concurrent vite builds in one job) --
      # median 3.7m on the small box vs 2.4m on the large, plus the documented
      # exit-137 OOM case (#662). The split (#322) turned that into three
      # separate single-app build jobs below; each now builds only one app
      # instead of three concurrently, so the OOM risk per job is lower than
      # what was measured, but this hasn't been re-measured post-split. Keep
      # all three on the large box until it is -- the conservative default,
      # not a re-confirmed one.
      # #1529: hosted for a release/*|hotfix/* PR into main (route-build-checks above); same
      # empty-output fallback reasoning as the two jobs above.
      app: dgfy-ims
      runner_labels_json: ${{ needs.route-build-checks.outputs.heavy != '' && needs.route-build-checks.outputs.heavy || '["sieitz-lg"]' }}
      cache_from: *build_cache_from

  frontend-pos-build-check:
    needs: [changes, route-build-checks]
    # PR #1534 review RF-1: same always()/needs.changes.result reasoning as dgfy-api-build-check
    # above -- without it, a route-build-checks job-level failure implicitly skips this job too.
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.frontend_pos == 'true'
    uses: ./.github/workflows/pr-frontend-build-checks.yml
    with:
      app: dgfy-pos
      runner_labels_json: ${{ needs.route-build-checks.outputs.heavy != '' && needs.route-build-checks.outputs.heavy || '["sieitz-lg"]' }}
      cache_from: *build_cache_from

  frontend-storefront-build-check:
    needs: [changes, route-build-checks]
    # PR #1534 review RF-1: same always()/needs.changes.result reasoning as dgfy-api-build-check
    # above -- without it, a route-build-checks job-level failure implicitly skips this job too.
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.frontend_storefront == 'true'
    uses: ./.github/workflows/pr-frontend-build-checks.yml
    with:
      app: dgfy-storefront
      runner_labels_json: ${{ needs.route-build-checks.outputs.heavy != '' && needs.route-build-checks.outputs.heavy || '["sieitz-lg"]' }}
      cache_from: *build_cache_from
