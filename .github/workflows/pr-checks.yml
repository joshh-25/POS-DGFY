name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Toggle the runner for ALL PR checks here by commenting/uncommenting one line.
  # RUNNER_LABELS_JSON: &runner_labels_json '["ubuntu-latest"]'
  RUNNER_LABELS_JSON: &runner_labels_json '["self-hosted"]'

jobs:
  conventional-commits:
    uses: ./.github/workflows/pr-conventional-commits.yml
    with:
      runner_labels_json: *runner_labels_json

  code-quality:
    uses: ./.github/workflows/pr-code-checks.yml
    with:
      runner_labels_json: *runner_labels_json

  backend-build-check:
    needs: [conventional-commits, code-quality]
    uses: ./.github/workflows/pr-backend-build-checks.yml
    with:
      runner_labels_json: *runner_labels_json

  frontend-build-check:
    needs: [conventional-commits, code-quality]
    uses: ./.github/workflows/pr-frontend-build-checks.yml
    with:
      runner_labels_json: *runner_labels_json

  # TEMP: Not necessary for staging and main as of the moment
  # dgfy-api-build-check:
  #   needs: [conventional-commits, code-quality]
  #   uses: ./.github/workflows/pr-dgfy-api-build-checks.yml
  #   with:
  #     runner_labels_json: *runner_labels_json

  summary:
    runs-on: ubuntu-latest
    needs: [conventional-commits, code-quality, backend-build-check, frontend-build-check]
    if: always()
    steps:
      - name: PR checks summary
        run: |
          echo "## PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Conventional Commits | ${{ needs.conventional-commits.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Build | ${{ needs.backend-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          # TEMP: DGFY API Build row removed while dgfy-api-build-check is disabled above

      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
