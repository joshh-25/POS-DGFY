name: PR Code Quality Checks

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  code-quality:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 15
    continue-on-error: true
    env:
      # Keep npm's download cache job-scoped so it can be reclaimed without
      # touching shared runner or deployment caches.
      NPM_CONFIG_CACHE: ${{ runner.temp }}/dgfy-pr-code-npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by check-compliance-impact.js, which does
          # `git merge-base HEAD origin/$GITHUB_BASE_REF` -- a shallow clone
          # doesn't have the base branch's history available.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --no-fund

      - name: Lint backend
        run: npm --prefix backend run lint

      - name: Enforce modular architecture guardrails + controller boundaries
        run: npm run check:architecture

      - name: Enforce tenant schema registry coverage for new migrations
        run: npm run check:tenant-schema-coverage

      - name: Enforce pos-receipt package version bump on source changes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npm run check:pos-receipt-version

      - name: Enforce compliance impact declarations + API contracts
        run: npm run check:compliance

      - name: Lint governed documentation
        run: npm run lint:docs

      - name: Reclaim backend dependency space before frontend install
        shell: bash
        run: rm -rf node_modules backend/node_modules "$NPM_CONFIG_CACHE"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Reclaim job dependency space
        if: always()
        shell: bash
        run: rm -rf node_modules backend/node_modules frontend/node_modules "$NPM_CONFIG_CACHE"
