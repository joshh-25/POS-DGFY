name: Compliance Preflight Sweep

# Automated compliance preflight sweep, run against an EPHEMERAL, CI-PROVISIONED dgfy-api instance
# -- not a manually provisioned remote bot account (#1163/#1248, supersedes the #1121 design this
# file originally shipped with).
#
# Why: the #1121 design (a bot account manually registered on stage.dgfy.ph, credentials stored as
# four PREFLIGHT_* GitHub Environment secrets) was never actually provisioned -- confirmed empty on
# both STAGING and DEV as of 2026-08-29 -- and blocked the 2026-08-29 develop->main promotion
# outright, requiring #1007's expedited override to ship. #1163 tracked provisioning it by hand;
# #1248 found that unnecessary. The remote host bought no compliance property to begin with: the
# endpoint writes nothing (buildCompliancePreflightUseCase reads tenant state and runs a pure
# policy evaluation), never executes the change's code (the response is evaluated purely from the
# impact_declaration payload plus the target tenant's own compliance posture), and the response
# carries no server-generated request id (preflight_request_ref was always entirely
# operator-authored). docs/ops/RELEASE_CANDIDATE_POLICY.md (authoritative) already states the
# governing principle the old design violated: "A merge gate ... must be satisfiable without a
# deployed environment, or every leg that needs one becomes circular."
#
# What changed, concretely:
#   - No GitHub Environment, no PREFLIGHT_* secrets. This job provisions its own throwaway tenant
#     + settings:edit bot (apps/dgfy-api/scripts/seed-preflight-fixture.js) against its own
#     ephemeral mysql+redis+dgfy-api, then tears both down at the end of the run.
#   - Auto-triggers on push when a declaration actually lands on develop (path-filtered -- see the
#     `on:` block below for why that filter is required, not optional, on this repo's runners).
#   - Reconciles front matter and opens + auto-merges a PR into develop when every result passed,
#     closing the loop this file's original version deliberately left as a separate manual step.
#
# ADR 0074 Decision 5 ("against a deployed non-production host") is `[default]` tier -- this change
# is recorded as a dated Amendments block on that ADR in the same PR, not a superseding ADR (ADR
# 0039 line 83, AGENTS.md Planning Rule 4).
#
# Governance/checkpoint classification carried forward unchanged from the #1121 design: every
# remote call this workflow makes (login, preflight, git/gh operations against this repo) is
# read-only or additive (no destructive git op, no force-push, no deploy dispatch) -- see
# .agents/skills/promoter/SKILL.md's "Pre-`main` gates" section and AGENTS.md's checkpoint table.
# The one new capability -- opening and auto-merging a PR into `develop` -- is unattended by the
# same reasoning `pr-reviewer`'s own merge policy already uses for a `develop`-base PR: no
# destructive action, no `main`, and every result gates on an actual `no_breach`/`can_proceed`
# pass, never merged past a real policy breach.

on:
  push:
    branches: [develop]
    paths: ['docs/compliance/impact-declarations/**']
  workflow_dispatch:
    inputs:
      declarations:
        description: Comma-separated declaration filenames (bare, e.g. 2026-08-28-example.md -- resolved under docs/compliance/impact-declarations/ automatically) to sweep. A full docs/compliance/impact-declarations/... path also works. Leave blank to auto-discover every outstanding declaration in the develop..main diff.
        type: string
        required: false

# This repo runs every job on a fixed-count self-hosted runner pool with no ephemeral-port
# isolation between jobs (AGENTS.md's queue-starvation history, and this workflow's own fixed
# 3306/6379 container ports below) -- path-filtering the trigger above is what keeps this workflow
# from firing on every unrelated develop push, and this concurrency group is the second half of
# that same discipline: never two sweeps racing for the same ports at once. The reconciliation PR
# this workflow opens re-triggers this workflow exactly once (it also touches
# docs/compliance/impact-declarations/**) -- that second run's own discovery step finds zero
# outstanding declarations and exits immediately, so the loop terminates on its own.
concurrency:
  group: compliance-preflight-sweep
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  MYSQL_CONTAINER: dgfy-preflight-mysql-${{ github.run_id }}-${{ github.run_attempt }}
  REDIS_CONTAINER: dgfy-preflight-redis-${{ github.run_id }}-${{ github.run_attempt }}
  PREFLIGHT_DB_NAME: sku_inventory_manager_preflight
  PREFLIGHT_DB_PASSWORD: preflightci
  # #1284: NOT 5000 -- this runner host's own persistent DEV deployment of dgfy-api also
  # publishes 127.0.0.1:5000 (docker-compose, infrastructure/docker/env/dev.compose-
  # fragment.yml), so this ephemeral instance's health check would silently poll DEV's real,
  # unrelated server instead of its own (see "Boot dgfy-api" step's own comment for the full
  # story). 15000 is well clear of every deployed environment's port map: DEV uses
  # 5000/8081-8083, STAGE uses 6000/9081-9083 (infrastructure/docker/env/*.compose-fragment.yml).
  PREFLIGHT_API_PORT: 15000

jobs:
  sweep:
    runs-on: ['sieitz-runner']
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover NOT-EXECUTED-* declarations
        id: discover
        env:
          DECLARATIONS_INPUT: ${{ inputs.declarations }}
        run: |
          set -euo pipefail

          DECLARATIONS_DIR="docs/compliance/impact-declarations"

          if [ -n "$DECLARATIONS_INPUT" ]; then
            # Explicit list -- one value per line, comma-split, then normalized (pr-reviewer RF-7
            # on PR #1127/#1121: the input is documented as accepting a bare filename, but was
            # passed straight through unchanged -- resolving from the runner's cwd, not this
            # directory, so a bare filename silently failed to be found). A bare filename gets
            # this directory prefixed; a value that already starts with it is left alone; anything
            # absolute or containing ".." is rejected outright rather than silently mishandled.
            : > /tmp/declarations.txt
            # printf's trailing \n matters: without it, `read` hits EOF on the LAST split entry
            # before a newline and the while-loop body silently never runs for it (found live
            # while testing this fix -- a single-entry input was silently dropped entirely).
            printf '%s\n' "$DECLARATIONS_INPUT" | tr ',' '\n' | sed '/^\s*$/d' | while read -r entry; do
              entry="$(echo "$entry" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              case "$entry" in
                /*|*..*)
                  echo "::error::rejected declarations input entry (absolute path or path traversal): $entry"
                  exit 1
                  ;;
                "$DECLARATIONS_DIR"/*)
                  echo "$entry" >> /tmp/declarations.txt
                  ;;
                *)
                  echo "$DECLARATIONS_DIR/$entry" >> /tmp/declarations.txt
                  ;;
              esac
            done
          else
            # Only the front matter's CURRENT preflight_request_ref decides "outstanding" --
            # pr-reviewer RF-6 on PR #1127/#1121: a whole-file `grep NOT-EXECUTED-` also matches a
            # reconciled declaration whose body still mentions the placeholder in a historical
            # note (its front matter carries a real reference by then). See
            # scripts/is-preflight-outstanding.js for the fix and its tests.
            git fetch origin main develop --quiet
            git diff --name-only origin/main origin/develop -- docs/compliance/impact-declarations/ \
              | while read -r f; do
                  if [ -f "$f" ] && node scripts/is-preflight-outstanding.js "$f" > /dev/null; then
                    echo "$f"
                  fi
                done > /tmp/declarations.txt || true
          fi

          count=$(wc -l < /tmp/declarations.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count declaration(s) to sweep:"
          cat /tmp/declarations.txt || true

      - name: Setup Node.js
        id: setup_node
        if: steps.discover.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/dgfy-api/package-lock.json
            apps/dgfy-migration-runner/package-lock.json

      # Same explicit-step pattern as promotion-quality-gate.yml (#1066 RF-2), for the same reason:
      # GitHub's own `services:` containers are provisioned before any user step runs, so a failed
      # container there leaves no chance for this workflow to report why. Ordinary steps let a
      # failure here surface through the same summary/artifact path as every other step. The
      # `docker ps -aq --filter label=...` sweep exists for the identical reason it does there:
      # `cancel-in-progress: false` above means this workflow never cancels its own prior run, but
      # a runner-level interruption (VM restart, manual kill) could still leak a port-holding
      # container from a previous attempt.
      - name: Start service containers
        id: start_services
        if: steps.discover.outputs.count != '0'
        timeout-minutes: 3
        run: |
          docker ps -aq --filter "label=dgfy-preflight-sweep=1" | xargs -r docker rm -f
          docker run -d --name "$MYSQL_CONTAINER" \
            --label dgfy-preflight-sweep=1 \
            -e MYSQL_ROOT_PASSWORD="$PREFLIGHT_DB_PASSWORD" \
            -e MYSQL_DATABASE="$PREFLIGHT_DB_NAME" \
            -p 3306:3306 \
            mysql:8.0 --log-bin-trust-function-creators=1
          docker run -d --name "$REDIS_CONTAINER" \
            --label dgfy-preflight-sweep=1 \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for service containers
        id: wait_services
        if: steps.discover.outputs.count != '0'
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 12); do
            docker exec "$MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -uroot -p"$PREFLIGHT_DB_PASSWORD" && mysql_ready=1 && break
            sleep 10
          done
          for _ in $(seq 1 12); do
            docker exec "$REDIS_CONTAINER" redis-cli ping && redis_ready=1 && break
            sleep 10
          done
          [ -n "${mysql_ready:-}" ] && [ -n "${redis_ready:-}" ]

      - name: Install migration-runner dependencies
        if: steps.discover.outputs.count != '0'
        working-directory: apps/dgfy-migration-runner
        run: npm ci

      - name: Run landlord migrations
        if: steps.discover.outputs.count != '0'
        working-directory: apps/dgfy-migration-runner
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ env.PREFLIGHT_DB_NAME }}
          DB_USER: root
          DB_PASSWORD: ${{ env.PREFLIGHT_DB_PASSWORD }}
        run: npm run migrate

      - name: Install dgfy-api dependencies
        if: steps.discover.outputs.count != '0'
        working-directory: apps/dgfy-api
        run: npm ci

      # Provisions a throwaway tenant + settings:edit bot user, fresh every run -- see
      # apps/dgfy-api/scripts/seed-preflight-fixture.js's own header for the pinned posture and
      # why it's more reproducible than the manual remote-bot account it replaces. Its four
      # PREFLIGHT_* lines are written to $GITHUB_ENV so every later step (mint-preflight-token.js
      # included, unchanged since #1121) sees them as ordinary env vars -- these are per-run
      # ephemeral fixture credentials for a database this same job creates and destroys, not
      # secrets in any meaningful sense.
      #
      # The script's own KEY=VALUE lines go to stdout, but so does everything the app's winston
      # logger and Sequelize's own query logging write under NODE_ENV=development -- confirmed
      # live during the #1248 spike. Piping raw stdout into $GITHUB_ENV would corrupt it with
      # non-KEY=VALUE lines, which GitHub Actions rejects outright. The grep below keeps only lines
      # matching this script's five known output names.
      - name: Provision preflight fixture tenant
        id: seed_fixture
        if: steps.discover.outputs.count != '0'
        working-directory: apps/dgfy-api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ env.PREFLIGHT_DB_NAME }}
          DB_USER: root
          DB_PASSWORD: ${{ env.PREFLIGHT_DB_PASSWORD }}
          NODE_ENV: development
          JWT_SECRET: preflight-ci-jwt-secret-ephemeral-only
          REFRESH_TOKEN_SECRET: preflight-ci-refresh-secret-ephemeral-only
        run: |
          node scripts/seed-preflight-fixture.js > /tmp/seed-fixture.out
          grep -E '^(PREFLIGHT_HOST|PREFLIGHT_COMPANY_TOKEN|PREFLIGHT_BOT_EMAIL|PREFLIGHT_BOT_PASSWORD|FIXTURE_TENANT_ID)=' /tmp/seed-fixture.out >> "$GITHUB_ENV"
          # Mask the per-run fixture credentials from the rest of this job's logs -- low-stakes
          # (throwaway DB, destroyed at the end of this same run) but no reason to print them
          # in plaintext when it costs nothing not to.
          for var in PREFLIGHT_COMPANY_TOKEN PREFLIGHT_BOT_PASSWORD; do
            value=$(grep "^${var}=" /tmp/seed-fixture.out | cut -d= -f2-)
            [ -n "$value" ] && echo "::add-mask::${value}"
          done
          echo "Fixture tenant provisioned: $(grep '^FIXTURE_TENANT_ID=' /tmp/seed-fixture.out)"

      - name: Boot dgfy-api
        id: boot_api
        if: steps.discover.outputs.count != '0'
        working-directory: apps/dgfy-api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ env.PREFLIGHT_DB_NAME }}
          DB_USER: root
          DB_PASSWORD: ${{ env.PREFLIGHT_DB_PASSWORD }}
          NODE_ENV: development
          PORT: ${{ env.PREFLIGHT_API_PORT }}
          JWT_SECRET: preflight-ci-jwt-secret-ephemeral-only
          REFRESH_TOKEN_SECRET: preflight-ci-refresh-secret-ephemeral-only
          REDIS_URL: redis://127.0.0.1:6379
          # See infrastructure/docker/local-test/docker-compose.yml's own comment on these two --
          # both flip /api/v1/health to 503 (not the process exit-code path) when enabled, which
          # would make the poll below fail even though the API is genuinely up.
          BILLING_FUNNEL_AUDIT_ENABLED: "false"
          SCHEMA_INDEX_AUDIT_ENABLED: "false"
        run: |
          # #1284: PREFLIGHT_API_PORT (5000) collided with this same runner host's own
          # PERSISTENT DEV deployment of dgfy-api, which docker-compose also publishes on
          # 127.0.0.1:5000 (-> container port 5100, infrastructure/docker/env/dev.compose-
          # fragment.yml). This ephemeral `node src/server.js` fails EADDRINUSE against an
          # already-bound port and exits almost immediately; the health-check loop then
          # unknowingly polls the *real* DEV instance instead (indistinguishable by a bare
          # `curl .../health` 200), which has no idea about the fixture tenant this run just
          # created -- producing a 404 TENANT_TOKEN_INVALID on every mint-preflight-token.js
          # call downstream, on a completely unrelated database. Confirmed live via temporary
          # diagnostics: the responding server's own health payload reported `uptime: "635225s"`
          # (~7.3 days) -- a live deployment, not anything this job spawned -- and no matching
          # `node src/server.js` process was visible to this job's `ps` at all (the real bind
          # owner is a Docker container in a different PID namespace, invisible to a bare host
          # `pkill`/`ps`, which is why an earlier attempt at this fix that only tried to kill a
          # stale *process* on the port never actually touched it).
          #
          # The real fix is a dedicated port nothing else on this host will ever bind to --
          # picked well clear of every deployed environment's own port map (DEV 5000/8081-8083,
          # STAGE 6000/9081-9083, per infrastructure/docker/env/*.compose-fragment.yml) --
          # rather than trying to detect or evict whatever else happens to be squatting on 5000.
          # See PREFLIGHT_API_PORT in this workflow's job-level `env:` above.
          nohup node src/server.js > /tmp/dgfy-api-preflight.log 2>&1 &
          api_pid=$!
          echo "$api_pid" > /tmp/dgfy-api-preflight.pid
          for _ in $(seq 1 12); do
            # Confirm THIS run's own process is still alive before trusting a 200 from curl --
            # a dedicated port means there should be nothing else to false-positive against, but
            # this also catches OUR OWN process dying mid-startup (e.g. a real crash) instead of
            # silently continuing to poll a port nothing is listening on anymore.
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::dgfy-api process (pid $api_pid) exited during startup"
              cat /tmp/dgfy-api-preflight.log
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:${PREFLIGHT_API_PORT}/api/v1/health" > /dev/null 2>&1; then
              echo "dgfy-api is healthy (pid $api_pid)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::dgfy-api did not become healthy in time"
          cat /tmp/dgfy-api-preflight.log
          exit 1

      - name: Run preflight sweep
        id: sweep
        if: steps.discover.outputs.count != '0'
        run: |
          set -euo pipefail

          echo '[]' > /tmp/results.json
          overall_fail=0

          while IFS= read -r declaration; do
            [ -z "$declaration" ] && continue
            echo "--- $declaration ---"

            # Fresh token per call -- cheap to mint, no reuse, matches #1121's original rationale
            # (unchanged: still true against an ephemeral instance, still the lower-exposure
            # choice even though these are now per-run fixture credentials, not a durable secret).
            if ! token="$(node scripts/mint-preflight-token.js)"; then
              echo "::error::failed to mint a preflight token for $declaration"
              overall_fail=1
              continue
            fi

            # Full impact_declaration payload (declaration_id, classification, summary,
            # affected_surfaces, reason_codes_impacted, policy_version, verification_evidence,
            # rollback_note) -- pr-reviewer RF-1 on PR #1127/#1121: the endpoint 422s on anything
            # less. See scripts/build-preflight-request.js's own header for the parsing/summary-
            # derivation rationale, and for the surface-filtering + evidence-truncation fixes
            # confirmed necessary during the #1248 spike.
            if ! body=$(node scripts/build-preflight-request.js "$declaration"); then
              echo "::error::failed to build the preflight request body for $declaration"
              overall_fail=1
              continue
            fi

            response=$(curl -sS -w '\n%{http_code}' -X POST "${PREFLIGHT_HOST}/api/v1/compliance/preflight" \
              -H 'Content-Type: application/json' \
              -H "x-company-token: ${PREFLIGHT_COMPANY_TOKEN}" \
              -H "Authorization: Bearer ${token}" \
              -d "$body" || echo -e "\n000")

            http_code=$(printf '%s' "$response" | tail -1)
            response_body=$(printf '%s' "$response" | sed '$d')

            echo "HTTP $http_code"
            echo "$response_body"

            # pr-reviewer RF-2 on PR #1127/#1121: HTTP 200 alone is not success -- the endpoint
            # returns 200 for result=breach / result=review_required too (can_proceed=false). Only
            # result=no_breach AND can_proceed=true is an actual pass; anything else -- including
            # unparseable JSON -- is a sweep failure, not a silently-recorded "swept". Parsing (and
            # unwrapping the { success, data: {...} } envelope -- pr-reviewer RF-5) lives in
            # scripts/parse-preflight-response.js, tested directly against that exact envelope
            # shape rather than reimplemented inline here.
            verdict=$(node scripts/parse-preflight-response.js <<< "$response_body")

            pass=$(printf '%s' "$verdict" | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).pass))')
            result_value=$(printf '%s' "$verdict" | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).result))')
            reason_code=$(printf '%s' "$verdict" | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).reason_code))')

            if [ "$http_code" != "200" ] || [ "$pass" != "true" ]; then
              echo "::error::preflight call for $declaration did not pass -- HTTP $http_code, result=$result_value, reason_code=$reason_code"
              overall_fail=1
            fi

            node -e '
              const fs = require("fs");
              const results = JSON.parse(fs.readFileSync("/tmp/results.json", "utf8"));
              results.push({
                declaration: process.argv[1],
                http_code: process.argv[2],
                verdict: JSON.parse(process.argv[3])
              });
              fs.writeFileSync("/tmp/results.json", JSON.stringify(results, null, 2));
            ' "$declaration" "$http_code" "$verdict"
          done < /tmp/declarations.txt

          echo "overall_fail=$overall_fail" >> "$GITHUB_OUTPUT"

      - name: Upload results artifact
        if: steps.discover.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: compliance-preflight-sweep-results
          path: /tmp/results.json
          retention-days: 30

      # Only reached when every declaration in this run passed (overall_fail=0) -- a real
      # breach/review_required result is a policy finding, not something this workflow reconciles
      # away; reconcile-preflight-declarations.js itself refuses to write a passing ref for a
      # failing verdict as a second, independent guard against exactly that.
      - name: Reconcile declaration front matter
        id: reconcile
        if: steps.discover.outputs.count != '0' && steps.sweep.outputs.overall_fail == '0'
        run: node scripts/reconcile-preflight-declarations.js /tmp/results.json

      # #1163 itself is the reason this step exists: the runner's missing `node` on PATH silently
      # caused the original sweep to vacuously "pass" with 0 declarations discovered, undetected
      # until dispatched with an explicit declarations= input. No workflow in this repo has ever
      # run `gh` as a CI step before (only as the tool AI agents use in their own shell) -- rather
      # than repeat that exact class of silent-missing-binary failure, this step checks and
      # self-installs a portable `gh` binary into a per-run temp dir if it's not already on PATH,
      # with no `sudo` required either way.
      - name: Ensure gh CLI is available
        if: steps.discover.outputs.count != '0' && steps.sweep.outputs.overall_fail == '0'
        run: |
          set -euo pipefail
          if command -v gh > /dev/null 2>&1; then
            echo "gh already on PATH: $(gh --version | head -1)"
            exit 0
          fi
          echo "gh not found on PATH -- installing a portable copy into $RUNNER_TEMP/gh-cli"
          GH_VERSION="2.63.2"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) GH_ARCH=amd64 ;;
            aarch64|arm64) GH_ARCH=arm64 ;;
            *) echo "::error::Unsupported architecture for gh CLI install: $ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz" \
            -o /tmp/gh-cli.tar.gz
          mkdir -p "$RUNNER_TEMP/gh-cli"
          tar -xzf /tmp/gh-cli.tar.gz -C "$RUNNER_TEMP/gh-cli" --strip-components=1
          echo "$RUNNER_TEMP/gh-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh-cli/bin/gh" --version

      # Cut-branch-and-PR discipline unchanged from the manual procedure this replaces
      # (docs/compliance/request-time-preflight-protocol.md: "never a direct commit" to develop --
      # this is regulator-facing evidence and gets the same review path as everything else).
      # Auto-merged here rather than left for a human because every declaration in this PR already
      # passed a real policy evaluation in the reconcile step above -- there is nothing left for a
      # reviewer to adjudicate that this workflow hasn't already gated on.
      - name: Open and merge reconciliation PR
        if: steps.discover.outputs.count != '0' && steps.sweep.outputs.overall_fail == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/compliance/impact-declarations/; then
            echo "Nothing to reconcile (results were empty or already reconciled)."
            exit 0
          fi

          BRANCH="compliance-sweep/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/compliance/impact-declarations/
          git commit -m "docs(compliance): reconcile preflight sweep results (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"

          # PR body written via a heredoc piped through `sed` to strip this step's own 10-space
          # YAML block-scalar indentation -- a plain heredoc does not strip leading spaces on its
          # own (only `<<-` strips leading TABS), and this file's own indent width is spaces
          # throughout, so an un-stripped heredoc would land as an indented code block in the
          # rendered PR body instead of the intended headings/paragraphs. GitHub Actions expression
          # substitution runs before bash ever sees this script, so it resolves correctly here
          # regardless of the heredoc delimiter's own quoting.
          cat << PR_BODY_EOF | sed 's/^ \{10\}//' > /tmp/pr-body.md
          ## Summary

          Automated compliance preflight sweep (run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) against an ephemeral CI-provisioned dgfy-api instance -- see \`.github/workflows/compliance-preflight-sweep.yml\` and #1248.

          Every declaration reconciled here returned \`result: no_breach\`, \`can_proceed: true\` from a real \`POST /api/v1/compliance/preflight\` call. Full per-declaration responses are in the \`compliance-preflight-sweep-results\` artifact on the linked run.

          ## Testing Evidence

          N/A -- automated front-matter reconciliation only, no code change. The preflight call itself is the evidence; see the linked run's artifact.
          PR_BODY_EOF

          PR_URL=$(gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "docs(compliance): reconcile preflight sweep results ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/pr-body.md)
          PR_NUMBER="${PR_URL##*/}"
          echo "Opened PR #${PR_NUMBER}: ${PR_URL}"

          # AGENTS.md's Merge Safety hard stop applies to every GitHub merge in this repo,
          # unconditionally -- "confirm no check run on the head commit has status in_progress or
          # queued... and that merge state is CLEAN, not unstable... never merge past it and never
          # wait it out silently." This step is a real `gh pr merge`, so it is not exempt just
          # because the reconciliation content was already gated on a real preflight pass above
          # (Codex review, PR #1249 RF-1, 2026-08-31): the preflight gate proves the declaration
          # content is safe, it says nothing about whether THIS PR's own checks (compliance/
          # architecture/docs lint against the reconciled front matter) have actually finished, and
          # this repo has no branch protection to enforce that separately.
          #
          # Bounded poll, not an indefinite wait: 10 minutes at 15s intervals. `gh pr checks`
          # exits non-zero while any check is still pending OR failing, so its exit code alone
          # can't distinguish "still running" from "failed" -- read --json bucket instead: any
          # `pending` bucket means keep polling, any `fail` bucket means stop and never merge.
          #
          # RF-2 (Codex re-review, PR #1249, 2026-08-31): the query itself can fail independently
          # of any check's own state -- a transient GitHub API/auth/network error. The original
          # `2>/dev/null || echo ""` fallback collapsed that failure into an empty bucket list,
          # which the logic below would then read as "no pending checks" and proceed straight to
          # merge -- failing OPEN during exactly the kind of outage this gate exists to be safe
          # against.
          #
          # RF-3 (Codex re-review round 2, PR #1249, 2026-08-31): `gh pr checks` documents a
          # nonzero exit code (8) for a genuine `fail` bucket too, not only for a query error --
          # the RF-2 fix's `if ! buckets=$(...)` treated both cases identically and retried a real
          # failure for up to 10 minutes instead of stopping immediately, which is both slower to
          # surface a real problem and wastes this repo's single-concurrency runner, worsening the
          # exact queue-starvation risk this PR exists to avoid. Fixed by capturing stdout under
          # `set +e` (so a nonzero exit never trips this script's own `set -e`) and only treating a
          # GENUINELY EMPTY response as a query failure -- any real bucket data, `fail` included, is
          # inspected regardless of what exit code produced it.
          checks_terminal=0
          for _ in $(seq 1 40); do
            set +e
            buckets=$(gh pr checks "$PR_NUMBER" --json bucket --jq '.[].bucket' 2>/tmp/pr-checks-stderr.log)
            checks_exit=$?
            set -e
            if [ -z "$buckets" ] && [ "$checks_exit" != "0" ]; then
              echo "::warning::Failed to query checks for PR #${PR_NUMBER} (will retry): $(cat /tmp/pr-checks-stderr.log 2>/dev/null)"
              sleep 15
              continue
            fi
            if printf '%s\n' "$buckets" | grep -qx "fail"; then
              echo "::error::PR #${PR_NUMBER} has a failing check -- refusing to merge. Left open for investigation: ${PR_URL}"
              exit 1
            fi
            if ! printf '%s\n' "$buckets" | grep -qx "pending"; then
              checks_terminal=1
              break
            fi
            sleep 15
          done
          if [ "$checks_terminal" != "1" ]; then
            echo "::error::PR #${PR_NUMBER}'s checks did not reach a terminal state within 10 minutes -- refusing to merge. Left open for investigation: ${PR_URL}"
            exit 1
          fi

          merge_state=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')
          mergeable=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable')
          if [ "$merge_state" != "CLEAN" ] || [ "$mergeable" != "MERGEABLE" ]; then
            echo "::error::PR #${PR_NUMBER} is not safe to merge (mergeStateStatus=${merge_state}, mergeable=${mergeable}) -- refusing to merge. Left open for investigation: ${PR_URL}"
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --merge --delete-branch

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### Compliance preflight sweep"
            echo ""
            if [ "${{ steps.discover.outputs.count }}" = "0" ]; then
              echo "No NOT-EXECUTED-* declarations found -- nothing to sweep."
            else
              echo "Swept ${{ steps.discover.outputs.count }} declaration(s) against an ephemeral"
              echo "CI-provisioned instance. Results attached as the"
              echo "\`compliance-preflight-sweep-results\` artifact."
              echo ""
              echo '```'
              cat /tmp/results.json 2>/dev/null || echo "(no results captured)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Best-effort, always attempted -- never gates the run's own pass/fail (that's the next
      # step). Removes the fixture tenant/database this run created; see
      # apps/dgfy-api/scripts/teardown-preflight-fixture.js's own header for why this is cleanup,
      # not a correctness requirement, on ephemeral CI infrastructure.
      - name: Tear down fixture and containers
        if: always() && steps.discover.outputs.count != '0'
        working-directory: apps/dgfy-api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ env.PREFLIGHT_DB_NAME }}
          DB_USER: root
          DB_PASSWORD: ${{ env.PREFLIGHT_DB_PASSWORD }}
          NODE_ENV: development
          JWT_SECRET: preflight-ci-jwt-secret-ephemeral-only
          REFRESH_TOKEN_SECRET: preflight-ci-refresh-secret-ephemeral-only
        run: |
          if [ -f /tmp/dgfy-api-preflight.pid ]; then
            kill "$(cat /tmp/dgfy-api-preflight.pid)" 2>/dev/null || true
          fi
          if [ -n "${FIXTURE_TENANT_ID:-}" ]; then
            node scripts/teardown-preflight-fixture.js "$FIXTURE_TENANT_ID" || true
          fi
          docker rm -f "$MYSQL_CONTAINER" "$REDIS_CONTAINER" 2>/dev/null || true

      - name: Fail the run on any bad result
        if: steps.sweep.outputs.overall_fail == '1'
        run: |
          echo "::error::One or more preflight calls failed -- see the step summary for details. Declaration(s) left with their NOT-EXECUTED-* ref intact, not reconciled."
          exit 1
