name: Staging Qualification

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

concurrency:
  group: staging-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sku_inventory_manager_test
        ports: [ '3306:3306' ]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        timeout-minutes: 12
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Resolve reviewed batch manifest
        id: manifest
        shell: bash
        run: echo "path=$(npm run --silent find:reviewed-batch-manifest -- --base origin/master --head '${{ github.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Generate strict reviewed inventory
        run: |
          npm run check:batch-inventory -- --base origin/master --head "${{ github.sha }}" --reviewed-manifest "${{ steps.manifest.outputs.path }}" --write --require-ship --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --markdown ".tmp/release-gates/${{ github.sha }}/batch_inventory.md"
          npm run validate:batch-inventory -- --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --base origin/master --head "${{ github.sha }}" --require-ship
          npm run check:documentation-closure -- --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --base origin/master --head "${{ github.sha }}" --output ".tmp/release-gates/${{ github.sha }}/documentation_closure.json" --markdown ".tmp/release-gates/${{ github.sha }}/documentation_closure.md"
          npm run check:regression-risk -- --inventory ".tmp/release-gates/${{ github.sha }}/batch_inventory.json" --output ".tmp/release-gates/${{ github.sha }}/regression_risk_notice.json" --markdown ".tmp/release-gates/${{ github.sha }}/regression_risk_notice.md" --target-sha "${{ github.sha }}"

      - name: Governance and dependency gates
        timeout-minutes: 15
        run: |
          npm run lint:docs
          npm run check:architecture
          npm run check:compliance
          npm run check:production-env
          npm run audit:dependencies:prod
          npm run audit:dependencies

      - name: Prepare backend test schema
        working-directory: backend
        run: npx sequelize-cli db:migrate --env development --config src/config/sequelize.config.cjs --migrations-path migrations
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Backend test matrix
        timeout-minutes: 25
        run: npm run test:backend:matrix
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: sku_inventory_manager_test
          DB_NAME_TEST: sku_inventory_manager_test
          DB_USER: root
          DB_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_for_tests_only_123456
          REFRESH_TOKEN_SECRET: ci_refresh_secret_key_for_tests_only_123

      - name: Frontend tests, builds, and budgets
        timeout-minutes: 25
        run: |
          npm run test:frontend
          npm --prefix frontend run build:all
          npm run check:frontend-budgets

      - name: Release script, source, and merge-adoption gates
        run: |
          npm run test:development-to-production
          npm run check:merge-hygiene -- --base origin/master --head "${{ github.sha }}" --target origin/master --report ".tmp/release-gates/${{ github.sha }}/merge_hygiene_report.json"
          npm run check:merge-adoption-required -- --base origin/master --head "${{ github.sha }}"
          npm run check:deploy-source-contract -- --target-sha "${{ github.sha }}" --skip-remote-match --report ".tmp/release-gates/${{ github.sha }}/deploy_source_contract.staging.json"

      - name: Upload short-lived staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ github.sha }}
          path: .tmp/release-gates/${{ github.sha }}/**
          if-no-files-found: error
          retention-days: 5
