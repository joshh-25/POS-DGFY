name: Deploy DGFY Migration Runner Image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tags:
        description: Comma-separated branch tags, e.g. "latest,beta"
        required: true
        type: string
      runner_labels_json:
        description: JSON array passed to runs-on for this build job
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box
    outputs:
      sha_tag:
        value: ${{ jobs.build-and-push.outputs.sha_tag }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sieitzz/dgfy-platform/migration-runner

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            IFS=',' read -ra TAG_ARR <<< "${{ inputs.image_tags }}"
            for t in "${TAG_ARR[@]}"; do echo "${IMAGE_NAME}:${t}"; done
            echo "${IMAGE_NAME}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The migration-runner is run ad-hoc on both amd64 hosts (EC2) and arm64
      # dev machines (lima-dgfy-dev), so it is published multi-arch. QEMU
      # provides the arm64 emulation layer for the cross-build.
      - uses: docker/setup-qemu-action@v3

      # Ephemeral runners get a fresh builder every run, so the layer cache has
      # to travel through the GitHub Actions cache instead of living on a
      # retained local builder (that only worked on persistent self-hosted
      # runners; see git history for that approach). This is the canonical
      # `migration-runner` cache scope -- this job is the only writer, so PR
      # builds (pr-migration-runner-build-checks.yml) read from it via
      # cache-from without ever writing back to it.
      - uses: docker/setup-buildx-action@v3

      # Revision label is what makes "what SHA is actually deployed?"
      # answerable after builds stop being tied to a push event -- read back
      # with `docker buildx imagetools inspect <image>:<tag>` without needing
      # to correlate the mutable tag to a sha-<short> tag by hand.
      - name: Build and push migration-runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dgfy-migration-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Registry cache (type=registry) removed 2026-08-14 (#427) -- it
          # was added in #415 as "reachable from either runner type," a
          # reason that stopped applying once #386 recorded self-hosted as
          # the only CI tier (type=gha is already reachable from
          # self-hosted). It also doubled every build's GHCR push volume,
          # which is what actually tripped GHCR's secondary rate limit in
          # run 31728787346 (deploy-main.yml's frontend-prod, 2026-08-13,
          # same job graph this workflow shares registry pressure with).
          # type=gha,scope=migration-runner is unaffected and stays as the
          # only cache.
          cache-from: type=gha,scope=migration-runner
          cache-to: type=gha,mode=max,scope=migration-runner

      # The migration-runner is a one-shot CLI, not a compose service, so there
      # is no server pull/restart in publish-platform.yml -- publishing to GHCR
      # is the deliverable (pull and run it ad-hoc where a migration is needed).
