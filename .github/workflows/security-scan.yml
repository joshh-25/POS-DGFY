name: Security Scanning

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      large_object_poc_bytes:
        description: 'One-time multipart POC size in bytes (100,000,001 through 134,217,728)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  security-scan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ['sieitz-runner']
    timeout-minutes: 45
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_clear
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - id: checkout
        uses: actions/checkout@v7
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        continue-on-error: true
        id: workspace_hygiene_assert
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Scan PR diff with gitleaks
        if: github.event_name == 'pull_request'
        shell: bash
        continue-on-error: true
        timeout-minutes: 15
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-scan"
          touch "$RUNNER_TEMP/security-scan/gitleaks-report.json"
          MERGE_BASE="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$RUNNER_TEMP/security-scan:/reports" \
            -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            --redact=100 \
            git --config=.gitleaks.toml \
              --log-opts="$MERGE_BASE..$PR_HEAD_SHA" \
              --report-format=json \
              --report-path=/reports/gitleaks-report.json \
              /repo

      - name: Upload gitleaks report to S3
        if: always() && github.event_name == 'pull_request'
        id: s3_upload
        continue-on-error: true
        shell: bash
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_S3_USERNAME }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_S3_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-s3-upload.sh "$RUNNER_TEMP/security-scan/gitleaks-report.json" gitleaks-report

      - name: Upload and verify large multipart POC object
        if: github.event_name == 'workflow_dispatch' && inputs.large_object_poc_bytes != ''
        id: large_s3_upload
        shell: bash
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_S3_USERNAME }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_S3_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          LARGE_OBJECT_POC_BYTES: ${{ inputs.large_object_poc_bytes }}
          S3_KEY_PREFIX: poc-large
          S3_DELETE_AFTER_VERIFY: "true"
        run: |
          set -euo pipefail
          if [[ ! "$LARGE_OBJECT_POC_BYTES" =~ ^[1-9][0-9]{0,8}$ ]] || \
            (( 10#$LARGE_OBJECT_POC_BYTES <= 100000000 || 10#$LARGE_OBJECT_POC_BYTES > 134217728 )); then
            echo "::error::large_object_poc_bytes must be between 100,000,001 and 134,217,728 bytes."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/security-scan"
          payload="$RUNNER_TEMP/security-scan/large-object-poc.bin"
          trap 'rm -f "$payload"' EXIT
          head -c "$LARGE_OBJECT_POC_BYTES" /dev/urandom > "$payload"
          bash scripts/ci-s3-upload.sh "$payload" large-object-poc

      - name: Record S3 evidence results
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_OUTCOME: ${{ steps.s3_upload.outcome }}
          UPLOAD_STATUS: ${{ steps.s3_upload.outputs.upload_status }}
          UPLOAD_URI: ${{ steps.s3_upload.outputs.object_uri }}
          UPLOAD_SIZE: ${{ steps.s3_upload.outputs.size_bytes }}
          SOURCE_SHA256: ${{ steps.s3_upload.outputs.source_sha256 }}
          DIRECT_SHA256: ${{ steps.s3_upload.outputs.direct_readback_sha256 }}
          PRESIGNED_SHA256: ${{ steps.s3_upload.outputs.presigned_readback_sha256 }}
          PRESIGNED_HTTP_STATUS: ${{ steps.s3_upload.outputs.presigned_http_status }}
          PRESIGNED_URL: ${{ steps.s3_upload.outputs.presigned_url }}
          LARGE_POC_BYTES: ${{ inputs.large_object_poc_bytes }}
          LARGE_UPLOAD_OUTCOME: ${{ steps.large_s3_upload.outcome }}
          LARGE_UPLOAD_STATUS: ${{ steps.large_s3_upload.outputs.upload_status }}
          LARGE_UPLOAD_URI: ${{ steps.large_s3_upload.outputs.object_uri }}
          LARGE_UPLOAD_SIZE: ${{ steps.large_s3_upload.outputs.size_bytes }}
          LARGE_SOURCE_SHA256: ${{ steps.large_s3_upload.outputs.source_sha256 }}
          LARGE_DIRECT_SHA256: ${{ steps.large_s3_upload.outputs.direct_readback_sha256 }}
          LARGE_PRESIGNED_SHA256: ${{ steps.large_s3_upload.outputs.presigned_readback_sha256 }}
          LARGE_HTTP_STATUS: ${{ steps.large_s3_upload.outputs.presigned_http_status }}
          LARGE_CLEANUP_STATUS: ${{ steps.large_s3_upload.outputs.cleanup_status }}
        run: |
          {
            echo "### S3 evidence storage"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "- Gitleaks report upload step: ${UPLOAD_OUTCOME:-not run} (${UPLOAD_STATUS:-no verified result})."
              if [[ -n "$UPLOAD_URI" ]]; then
                echo "- Object URI: ${UPLOAD_URI}"
                echo "- Size: ${UPLOAD_SIZE:-unknown} bytes"
                echo "- SHA-256: source ${SOURCE_SHA256:-unknown}; direct readback ${DIRECT_SHA256:-unknown}; presigned readback ${PRESIGNED_SHA256:-unknown}"
                echo "- Presigned readback HTTP status: ${PRESIGNED_HTTP_STATUS:-unknown}"
                if [[ -n "$PRESIGNED_URL" && "$UPLOAD_STATUS" == "verified" ]]; then
                  echo "- Retrieval URL (48-hour bearer link): ${PRESIGNED_URL}"
                fi
              fi
              echo "- Gitleaks report generation uses 100% redaction."
              if [[ "$UPLOAD_OUTCOME" == "failure" ]]; then
                echo "- Upload failure is visible in this run; the step is continue-on-error so Semgrep can still run."
              fi
            elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              if [[ -z "$LARGE_POC_BYTES" ]]; then
                echo "- Large multipart POC skipped; set large_object_poc_bytes to 100,000,001–134,217,728 for the one-time proof."
              else
                echo "- Large multipart POC step: ${LARGE_UPLOAD_OUTCOME:-not run} (${LARGE_UPLOAD_STATUS:-no verified result})."
                echo "- Requested size: ${LARGE_POC_BYTES} bytes"
                if [[ -n "$LARGE_UPLOAD_URI" ]]; then
                  echo "- Object URI: ${LARGE_UPLOAD_URI}"
                  echo "- Size: ${LARGE_UPLOAD_SIZE:-unknown} bytes"
                  echo "- SHA-256: source ${LARGE_SOURCE_SHA256:-unknown}; direct readback ${LARGE_DIRECT_SHA256:-unknown}; presigned readback ${LARGE_PRESIGNED_SHA256:-unknown}"
                  echo "- Presigned readback HTTP status: ${LARGE_HTTP_STATUS:-unknown}"
                  echo "- Cleanup: ${LARGE_CLEANUP_STATUS:-not confirmed}; if verification or cleanup failed, inspect this object before removing it."
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan with Semgrep
        if: github.event_name == 'pull_request'
        shell: bash
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan \
              --config=p/javascript \
              --config=p/secrets \
              --error \
              --metrics=off \
              --exclude=node_modules \
              --exclude=dist \
              --exclude=build \
              --exclude=coverage \
              /src
