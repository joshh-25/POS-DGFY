name: Build Images (staging)

on:
  push:
    branches: [ staging, ci/ovpn-integration ] # TEMPORARY TRIGGER: Remove after testing

concurrency:
  group: build-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/deployment-orchestrator.yml
    with:
      environment: STAGING
      image_tags: "staging"
      publish: true
      vpn_required: true
    secrets: inherit
    permissions:
      contents: read
      packages: write
