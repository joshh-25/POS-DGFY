name: Shared Changed Paths

# Tells callers which image builds a given range of commits actually needs, so
# a backend-only change doesn't spend a runner rebuilding the frontend image
# (and vice versa). Used by pr-checks.yml (PR mode) -- the only remaining
# caller since every push-triggered build/deploy was removed 2026-08-14
# (#417) and deploy.yml's build_sha-diffing "auto" mode was removed 2026-08-14
# (#420, same day -- Pat's own pushback: manual dispatch should mean you pick,
# not something detecting for you). `base_sha` (push mode) is now unused by
# any live caller but kept -- cheap to keep, and a future reusable-workflow
# caller diffing a push range is a reasonable thing to want again.
#
# Deliberately does this with plain git rather than a third-party
# paths-filter action -- the same `git merge-base`/`git diff --name-only`
# approach scripts/check-compliance-impact.js already uses, which is also why
# the checkout below needs full history.
#
# Also optionally runs the PR title/body + pos-receipt-version-bump checks
# (validate_pr_metadata: true, PR mode only) -- folded in here rather than
# kept as their own workflows/jobs so they don't each pay a separate per-job
# 1-minute GitHub Actions billing floor for a few seconds of git/bash work.
#
# Same reasoning for the compliance impact guardrail
# (enforce_compliance_declarations, PR mode only): both scripts behind
# `npm run check:compliance` are dependency-free plain node (fs/path/
# child_process, no npm install), so they run in seconds and fold in here
# rather than earning their own billable job. Unlike every other folded-in
# step, that one is NOT continue-on-error -- see its step comment.

on:
  workflow_call:
    inputs:
      base_sha:
        description: >-
          Commit to diff against. Empty (default) selects PR mode, diffing
          HEAD against the merge-base with origin/$GITHUB_BASE_REF. Set this
          (e.g. to github.event.before) to diff a push range instead.
        required: false
        type: string
        default: ''
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["sieitz-runner"]'  # #923: generic, either box
      validate_pr_metadata:
        description: >-
          Also validate PR title/body format and check for a missing
          packages/pos-receipt version bump (PR mode only). Folded in here
          rather than kept as separate jobs to avoid paying a second/third
          per-job 1-minute billing floor for checks that each run in single-
          digit seconds. Advisory only (continue-on-error per step) -- never
          fails this job, matching the behavior of the workflows this
          replaces (pr-conventional-commits.yml, and the pos-receipt-version
          step formerly in pr-code-checks.yml).
        required: false
        type: boolean
        default: false
      enforce_compliance_declarations:
        description: >-
          Run the compliance impact guardrail (`npm run check:compliance`) and
          FAIL the job when a compliance-sensitive change is missing its
          declaration. PR mode only -- the script resolves the changed-file set
          from GITHUB_BASE_REF, and exempts aggregate promotion PRs itself via
          PROMOTION_HEAD_BY_BASE / PROMOTION_HEAD_PREFIX_BY_BASE.
        required: false
        type: boolean
        default: false
    outputs:
      frontend_ims:
        description: '"true" when this range touches anything the dgfy-ims image is built from'
        value: ${{ jobs.detect.outputs.frontend_ims }}
      frontend_pos:
        description: '"true" when this range touches anything the dgfy-pos image is built from'
        value: ${{ jobs.detect.outputs.frontend_pos }}
      frontend_storefront:
        description: '"true" when this range touches anything the dgfy-storefront image is built from'
        value: ${{ jobs.detect.outputs.frontend_storefront }}
      dgfy_api:
        description: '"true" when this range touches anything the dgfy-api image is built from'
        value: ${{ jobs.detect.outputs.dgfy_api }}
      migration_runner:
        description: '"true" when this range touches anything the dgfy-migration-runner image is built from'
        value: ${{ jobs.detect.outputs.migration_runner }}
      android:
        description: '"true" when this range touches anything the Android wrapper build is built from'
        value: ${{ jobs.detect.outputs.android }}

jobs:
  detect:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 5
    outputs:
      frontend_ims: ${{ steps.filter.outputs.frontend_ims }}
      frontend_pos: ${{ steps.filter.outputs.frontend_pos }}
      frontend_storefront: ${{ steps.filter.outputs.frontend_storefront }}
      dgfy_api: ${{ steps.filter.outputs.dgfy_api }}
      migration_runner: ${{ steps.filter.outputs.migration_runner }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      # workspace-hygiene v1 -- keep byte-identical at every site, immediately above this job's
      # actions/checkout. Enforced by scripts/check-workspace-hygiene.js. Deliberately inline and
      # duplicated: a composite action or repo script cannot run before checkout populates the
      # workspace. See docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528).
      - name: Clear stale sparse-checkout state (workspace-hygiene v1)
        shell: bash
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [ -z "$WS" ] || [ ! -e "$WS/.git" ]; then
            echo "[workspace-hygiene] no pre-existing workspace -- nothing to clear."; exit 0
          fi
          GIT_DIR="$(git -C "$WS" rev-parse --absolute-git-dir 2>/dev/null || echo "$WS/.git")"
          git -C "$WS" sparse-checkout disable 2>/dev/null || true
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$WS" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$GIT_DIR/info/sparse-checkout" "$GIT_DIR/config.worktree"
          SKIPPED="$(git -C "$WS" ls-files -v 2>/dev/null | grep -c '^[Sa-z]' || true)"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "[workspace-hygiene] clearing ${SKIPPED} skip-worktree/assume-unchanged bits"
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-skip-worktree || true
            git -C "$WS" ls-files -z | xargs -0 -n 500 git -C "$WS" update-index --no-assume-unchanged || true
          fi
          echo "[workspace-hygiene] OK"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert complete working tree (workspace-hygiene v1)
        shell: bash
        run: |
          set -euo pipefail
          SKIPPED="$(git ls-files -v | grep -c '^[Sa-z]' || true)"
          SPARSE="$(git config --get core.sparseCheckout || true)"
          if [ "${SKIPPED:-0}" -ne 0 ] || [ "${SPARSE:-}" = "true" ]; then
            echo "::error::Incomplete working tree on runner '${RUNNER_NAME:-unknown}': ${SKIPPED} skip-worktree entries, core.sparseCheckout='${SPARSE:-<unset>}'. This workspace is sparse-poisoned -- git status reports CLEAN while most of the tree is absent. Fix: docs/ops/CI_RUNNER_WORKSPACE_HYGIENE.md (#1528)."
            exit 1
          fi
          echo "[workspace-hygiene] tree complete."

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail

          NULL_SHA="0000000000000000000000000000000000000000"
          REASON=""

          if [ -n "${BASE_SHA}" ]; then
            # Push mode. A brand-new branch reports its before-SHA as all
            # zeros, and a force-push/rewritten-history before-SHA may no
            # longer exist on the remote at all -- both mean "no diff is
            # computable", so fall back to building everything rather than
            # silently skipping a build.
            if [ "${BASE_SHA}" = "${NULL_SHA}" ]; then
              REASON="base_sha is the null SHA (new branch) -- building all"
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              REASON="base_sha ${BASE_SHA} is unreachable (force-push/rewritten history) -- building all"
            fi
          else
            BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          fi

          if [ -n "${REASON}" ]; then
            FILES="(unavailable: ${REASON})"
            FRONTEND_IMS=true
            FRONTEND_POS=true
            FRONTEND_STOREFRONT=true
            DGFY_API=true
            MIGRATION_RUNNER=true
            ANDROID=true
          else
            FILES="$(git diff --name-only "${BASE_SHA}" HEAD)"

            # Here-string rather than `printf … | grep` -- under `set -o
            # pipefail`, grep finding no match makes the printf side of the
            # pipe report failure too, which silently produced a false
            # negative for a range with zero matching files.
            matches() { grep -qE "$1" <<< "${FILES}"; }

            # .github/workflows/ only lists the workflows that actually affect
            # each image build, not the whole directory -- editing e.g. the PR
            # conventional-commits check shouldn't force every Docker build.
            #
            # Each frontend app depends on packages/web-core (the shared trunk)
            # and packages/shared-constants; dgfy-ims/dgfy-pos additionally
            # depend on packages/pos-receipt (dgfy-storefront doesn't -- see
            # its package.json). All three share the reusable deploy-frontend.yml
            # workflow, so a change there invalidates all three, not just one.
            FRONTEND_IMS=false
            FRONTEND_POS=false
            FRONTEND_STOREFRONT=false
            DGFY_API=false
            MIGRATION_RUNNER=false
            ANDROID=false
            matches '^(apps/dgfy-ims/|packages/pos-receipt/|packages/shared-constants/|packages/web-core/|infrastructure/docker/dgfy-ims/|\.dockerignore|\.github/workflows/(shared-changed-paths|deploy-frontend|deployment-orchestrator|pr-frontend-build-checks|pr-frontend-lint-checks|deploy|deploy-main)\.yml)' && FRONTEND_IMS=true || true
            matches '^(apps/dgfy-pos/|packages/pos-receipt/|packages/shared-constants/|packages/web-core/|infrastructure/docker/dgfy-pos/|\.dockerignore|\.github/workflows/(shared-changed-paths|deploy-frontend|deployment-orchestrator|pr-frontend-build-checks|deploy|deploy-main)\.yml)' && FRONTEND_POS=true || true
            matches '^(apps/dgfy-storefront/|packages/shared-constants/|packages/web-core/|infrastructure/docker/dgfy-storefront/|\.dockerignore|\.github/workflows/(shared-changed-paths|deploy-frontend|deployment-orchestrator|pr-frontend-build-checks|deploy|deploy-main)\.yml)' && FRONTEND_STOREFRONT=true || true
            matches '^(apps/dgfy-api/|packages/shared-constants/|infrastructure/docker/dgfy-api/|\.dockerignore|\.github/workflows/(shared-changed-paths|deploy-api|deployment-orchestrator|pr-dgfy-api-build-checks|deploy|deploy-main)\.yml)' && DGFY_API=true || true
            matches '^(apps/dgfy-migration-runner/|infrastructure/docker/dgfy-migration-runner/|\.dockerignore|\.github/workflows/(shared-changed-paths|deploy-migration-runner|deployment-orchestrator|pr-migration-runner-build-checks|deploy|deploy-main)\.yml)' && MIGRATION_RUNNER=true || true
            matches '^(apps/dgfy-android-bridge/|scripts/build-android-release\.sh|\.github/workflows/(shared-changed-paths|pr-android-build-checks|build-android-manual)\.yml)' && ANDROID=true || true
          fi

          {
            echo "frontend_ims=${FRONTEND_IMS}"
            echo "frontend_pos=${FRONTEND_POS}"
            echo "frontend_storefront=${FRONTEND_STOREFRONT}"
            echo "dgfy_api=${DGFY_API}"
            echo "migration_runner=${MIGRATION_RUNNER}"
            echo "android=${ANDROID}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Changed-path filter"
            echo ""
            if [ -n "${REASON}" ]; then
              echo "_${REASON}_"
              echo ""
            fi
            echo "| Image build | Needed |"
            echo "|-------------|--------|"
            echo "| dgfy-ims | ${FRONTEND_IMS} |"
            echo "| dgfy-pos | ${FRONTEND_POS} |"
            echo "| dgfy-storefront | ${FRONTEND_STOREFRONT} |"
            echo "| DGFY API | ${DGFY_API} |"
            echo "| Migration Runner | ${MIGRATION_RUNNER} |"
            echo "| Android | ${ANDROID} |"
            echo ""
            echo "<details><summary>Changed files</summary>"
            echo ""
            echo '```'
            printf '%s\n' "${FILES}"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate PR title format
        if: inputs.validate_pr_metadata
        continue-on-error: true
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::warning::PR title must follow conventional commits format"
            echo "Expected format: feat(scope)!: description"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert"
            exit 1
          fi

      - name: Validate PR body sections
        if: inputs.validate_pr_metadata
        continue-on-error: true
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Required sections mirror .github/pull_request_template.md verbatim -
          # keep these two in sync any time that template's headers change.
          if ! echo "$BODY" | grep -q "## Summary"; then
            echo "::warning::PR body must contain '## Summary' section"
            exit 1
          fi
          if ! echo "$BODY" | grep -q "## Testing Evidence"; then
            echo "::warning::PR body must contain '## Testing Evidence' section"
            exit 1
          fi

      - name: Set up Node
        if: inputs.validate_pr_metadata
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This step exited 127 ("node: command not found") on every run before
      # the setup-node step above was added -- continue-on-error swallowed
      # it silently, so the check had been effectively not running since the
      # self-hosted cutover. An advisory check that always fails is worse
      # than none (see the compliance-guardrail comment below for why this
      # repo takes that seriously) -- see #412.
      - name: Enforce pos-receipt package version bump on source changes
        if: inputs.validate_pr_metadata
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-pos-receipt-version-bump.js

      # #1569: single repo-level toggle for the step below, instead of a hardcoded
      # continue-on-error literal -- see scripts/lib/version-bump-gate-toggle.js's own
      # header for why this is a genuine runtime read, not a hand-kept-in-sync pair.
      # Flipping that one module flips this step *and* scripts/pr-checks.js's own
      # blocking argument for the same check together; nothing else to edit here.
      # #1774: the toggle is now base-aware -- `resolveBlocking(base, head)` is blocking only on
      # a `staging`/`main` base (a promotion leg or a hotfix), advisory on `develop` -- so this
      # step now threads github.base_ref/github.head_ref through instead of reading a flat
      # boolean. See that module's own header for why a `develop`-base PR should not be blocked
      # on this check.
      - name: Load check:app-versions gate toggle
        if: inputs.validate_pr_metadata
        id: app_versions_gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "continue_on_error=$(node -e "console.log(require('./scripts/lib/version-bump-gate-toggle').resolveBlocking(process.env.GITHUB_BASE_REF, process.env.GITHUB_HEAD_REF) ? 'false' : 'true')")" >> "$GITHUB_OUTPUT"

      # #1695 (Phase 303): check-app-version-bump.js now transitively requires the root
      # devDependency `madge` (via scripts/resolve-web-core-reachability.js's shadow-mode
      # reachability audit) -- unlike every other script folded into this job (see the workflow
      # header's "dependency-free plain node... no npm install" note), that one require() fails
      # outright ("Cannot find module 'madge'") without root node_modules present. Installing here,
      # immediately before the one step that actually needs it, keeps that dependency-free property
      # true for every other step in this job. --ignore-scripts: nothing here needs postinstall side
      # effects, only madge's own module resolution at require() time. RF-1, PR #1708 review.
      - name: Install root dependencies (for check-app-version-bump.js's madge import)
        if: inputs.validate_pr_metadata
        run: npm ci --ignore-scripts

      # #1560 (#1548 Wave 1): per-app container SemVer bump check -- generalizes the
      # pos-receipt check above to all five deployable apps, with a real semver-increase
      # requirement and a (base, head) mode switch (see the script's own header). #1569:
      # continue-on-error reads the toggle step above (scripts/lib/version-bump-gate-
      # toggle.js) instead of a hardcoded literal. Shipped advisory (BLOCKING: false);
      # flipped to blocking globally (BLOCKING: true) by #1592 (epic #1548, Phase 283) on
      # 2026-09-05, once scripts/check-version-bump-flip-readiness.js confirmed enough
      # clean-run evidence existed and a human confirmed it. #1774 then narrowed that global
      # flip to be base-aware: blocking on a `staging`/`main` base, advisory on `develop` --
      # see the toggle module's own header and docs/ops/GATE_RELEASE_LOCAL_CI_MAPPING.md.
      - name: Enforce per-app version bump on source changes
        if: inputs.validate_pr_metadata
        continue-on-error: ${{ steps.app_versions_gate.outputs.continue_on_error == 'true' }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-app-version-bump.js

      # Deliberately NOT continue-on-error, unlike every other folded-in step
      # above. This check previously lived in a `code-quality` job that WAS
      # continue-on-error, which meant it could never block a merge; that job
      # was then removed entirely as dead weight. The result was a gap nothing
      # covered: PRs #284 and #288 (2026-08-07) each merged to develop and rode
      # a promotion to staging with a mandatory `apps/dgfy-web/src/features/pos/**`
      # (`frontend/src/features/pos/**` on develop) impact declaration missing,
      # and both PR descriptions asserted in good
      # faith that "CI's compliance gate will still block merge" -- because
      # docs/ops/RELEASE_CANDIDATE_POLICY.md and
      # docs/compliance/request-time-preflight-protocol.md both still said a
      # gate existed. An advisory-only guardrail here is worse than none: it
      # produces exactly that false confidence. If this fails, add the
      # declaration under docs/compliance/impact-declarations/ -- see
      # docs/compliance/request-time-preflight-protocol.md.
      #
      # Aggregate promotion PRs (to-staging -> staging, release/* -> main) are
      # exempted inside check-compliance-impact.js itself, so this is safe to
      # run on every PR including promotions.
      - name: Enforce compliance impact declarations
        if: inputs.enforce_compliance_declarations
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: npm run check:compliance
