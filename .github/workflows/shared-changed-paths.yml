name: Shared Changed Paths

# Tells callers which image builds a given range of commits actually needs, so
# a backend-only change doesn't spend a runner rebuilding the frontend image
# (and vice versa). Used both by pr-checks.yml (PR mode) and build-develop.yml
# (push mode), so every push to develop is gated the same way a PR already is
# instead of unconditionally rebuilding both images every time.
#
# Deliberately does this with plain git rather than a third-party
# paths-filter action -- the same `git merge-base`/`git diff --name-only`
# approach scripts/check-compliance-impact.js already uses, which is also why
# the checkout below needs full history.
#
# Also optionally runs the PR title/body + pos-receipt-version-bump checks
# (validate_pr_metadata: true, PR mode only) -- folded in here rather than
# kept as their own workflows/jobs so they don't each pay a separate per-job
# 1-minute GitHub Actions billing floor for a few seconds of git/bash work.
#
# Same reasoning for the compliance impact guardrail
# (enforce_compliance_declarations, PR mode only): both scripts behind
# `npm run check:compliance` are dependency-free plain node (fs/path/
# child_process, no npm install), so they run in seconds and fold in here
# rather than earning their own billable job. Unlike every other folded-in
# step, that one is NOT continue-on-error -- see its step comment.

on:
  workflow_call:
    inputs:
      base_sha:
        description: >-
          Commit to diff against. Empty (default) selects PR mode, diffing
          HEAD against the merge-base with origin/$GITHUB_BASE_REF. Set this
          (e.g. to github.event.before) to diff a push range instead.
        required: false
        type: string
        default: ''
      runner_labels_json:
        description: JSON array passed to runs-on for this job
        required: false
        type: string
        default: '["self-hosted"]'
      validate_pr_metadata:
        description: >-
          Also validate PR title/body format and check for a missing
          packages/pos-receipt version bump (PR mode only). Folded in here
          rather than kept as separate jobs to avoid paying a second/third
          per-job 1-minute billing floor for checks that each run in single-
          digit seconds. Advisory only (continue-on-error per step) -- never
          fails this job, matching the behavior of the workflows this
          replaces (pr-conventional-commits.yml, and the pos-receipt-version
          step formerly in pr-code-checks.yml).
        required: false
        type: boolean
        default: false
      enforce_compliance_declarations:
        description: >-
          Run the compliance impact guardrail (`npm run check:compliance`) and
          FAIL the job when a compliance-sensitive change is missing its
          declaration. PR mode only -- the script resolves the changed-file set
          from GITHUB_BASE_REF, and exempts aggregate promotion PRs itself via
          PROMOTION_HEAD_BY_BASE / PROMOTION_HEAD_PREFIX_BY_BASE.
        required: false
        type: boolean
        default: false
    outputs:
      frontend:
        description: '"true" when this range touches anything the frontend image is built from'
        value: ${{ jobs.detect.outputs.frontend }}
      backend:
        description: '"true" when this range touches anything the backend image is built from'
        value: ${{ jobs.detect.outputs.backend }}
      android:
        description: '"true" when this range touches anything the Android wrapper build is built from'
        value: ${{ jobs.detect.outputs.android }}

jobs:
  detect:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail

          NULL_SHA="0000000000000000000000000000000000000000"
          REASON=""

          if [ -n "${BASE_SHA}" ]; then
            # Push mode. A brand-new branch reports its before-SHA as all
            # zeros, and a force-push/rewritten-history before-SHA may no
            # longer exist on the remote at all -- both mean "no diff is
            # computable", so fall back to building everything rather than
            # silently skipping a build.
            if [ "${BASE_SHA}" = "${NULL_SHA}" ]; then
              REASON="base_sha is the null SHA (new branch) -- building both"
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              REASON="base_sha ${BASE_SHA} is unreachable (force-push/rewritten history) -- building both"
            fi
          else
            BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          fi

          if [ -n "${REASON}" ]; then
            FILES="(unavailable: ${REASON})"
            FRONTEND=true
            BACKEND=true
            ANDROID=true
          else
            FILES="$(git diff --name-only "${BASE_SHA}" HEAD)"

            # Deliberately not `grep -qE`: -q exits the moment it finds a
            # match, and under `set -o pipefail` (above) that can race
            # printf's write into a broken pipe -- printf gets SIGPIPE,
            # the pipeline's exit status becomes non-zero even though a
            # match WAS found, and the `|| true` below silently swallows
            # it, leaving e.g. ANDROID=false on a PR that touches only
            # android/. Observed live in practice, not hypothetical. Without
            # -q, grep always reads FILES to EOF before exiting, so there's
            # no early-exit race; matches its output to /dev/null and keeps
            # the same 0-if-matched/1-if-not exit code.
            matches() { printf '%s\n' "${FILES}" | grep -E "$1" > /dev/null; }

            # .github/workflows/ only lists the workflows that actually affect
            # each image build, not the whole directory -- editing e.g. the PR
            # conventional-commits check shouldn't force both Docker builds.
            FRONTEND=false
            BACKEND=false
            ANDROID=false
            matches '^(frontend/|packages/pos-receipt/|packages/shared-constants/|infrastructure/docker/frontend/|\.dockerignore|\.github/workflows/(shared-changed-paths|deploy-frontend|deployment-orchestrator|pr-frontend-build-checks|build-develop|build-staging|build-main)\.yml)' && FRONTEND=true || true
            matches '^(backend/|packages/shared-constants/|infrastructure/docker/backend/|\.dockerignore|\.github/workflows/(shared-changed-paths|deploy-backend|deployment-orchestrator|pr-backend-build-checks|build-develop|build-staging|build-main)\.yml)' && BACKEND=true || true
            matches '^(android/|scripts/build-android-release\.sh|\.github/workflows/(shared-changed-paths|pr-android-build-checks|build-android-manual)\.yml)' && ANDROID=true || true
          fi

          {
            echo "frontend=${FRONTEND}"
            echo "backend=${BACKEND}"
            echo "android=${ANDROID}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Changed-path filter"
            echo ""
            if [ -n "${REASON}" ]; then
              echo "_${REASON}_"
              echo ""
            fi
            echo "| Image build | Needed |"
            echo "|-------------|--------|"
            echo "| Frontend | ${FRONTEND} |"
            echo "| Backend | ${BACKEND} |"
            echo "| Android | ${ANDROID} |"
            echo ""
            echo "<details><summary>Changed files</summary>"
            echo ""
            echo '```'
            printf '%s\n' "${FILES}"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate PR title format
        if: inputs.validate_pr_metadata
        continue-on-error: true
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\([^)]+\))?(!)?: .+'; then
            echo "::warning::PR title must follow conventional commits format"
            echo "Expected format: feat(scope)!: description"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert"
            exit 1
          fi

      - name: Validate PR body sections
        if: inputs.validate_pr_metadata
        continue-on-error: true
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Required sections mirror .github/pull_request_template.md verbatim -
          # keep these two in sync any time that template's headers change.
          if ! echo "$BODY" | grep -q "## Summary"; then
            echo "::warning::PR body must contain '## Summary' section"
            exit 1
          fi
          if ! echo "$BODY" | grep -q "## Testing Evidence"; then
            echo "::warning::PR body must contain '## Testing Evidence' section"
            exit 1
          fi

      - name: Enforce pos-receipt package version bump on source changes
        if: inputs.validate_pr_metadata
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-pos-receipt-version-bump.js

      # Deliberately NOT continue-on-error, unlike every other folded-in step
      # above. This check previously lived in a `code-quality` job that WAS
      # continue-on-error, which meant it could never block a merge; that job
      # was then removed entirely as dead weight. The result was a gap nothing
      # covered: PRs #284 and #288 (2026-08-07) each merged to develop and rode
      # a promotion to staging with a mandatory `frontend/src/features/pos/**`
      # impact declaration missing, and both PR descriptions asserted in good
      # faith that "CI's compliance gate will still block merge" -- because
      # docs/ops/RELEASE_CANDIDATE_POLICY.md and
      # docs/compliance/request-time-preflight-protocol.md both still said a
      # gate existed. An advisory-only guardrail here is worse than none: it
      # produces exactly that false confidence. If this fails, add the
      # declaration under docs/compliance/impact-declarations/ -- see
      # docs/compliance/request-time-preflight-protocol.md.
      #
      # Aggregate promotion PRs (to-staging -> staging, release/* -> main) are
      # exempted inside check-compliance-impact.js itself, so this is safe to
      # run on every PR including promotions.
      - name: Enforce compliance impact declarations
        if: inputs.enforce_compliance_declarations
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: npm run check:compliance
