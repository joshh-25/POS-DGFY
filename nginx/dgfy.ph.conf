# dgfy.ph nginx virtual host configuration
# Deploy to VPS: sudo cp nginx/dgfy.ph.conf /etc/nginx/sites-available/dgfy.ph
# Enable:        sudo ln -s /etc/nginx/sites-available/dgfy.ph /etc/nginx/sites-enabled/dgfy.ph
# Test:          sudo nginx -t
# Reload:        sudo systemctl reload nginx
# SSL (optional):sudo certbot --nginx -d skupervisor.dgfy.ph -d pos.dgfy.ph -d dgfy.ph -d store.dgfy.ph -d staging.dgfy.ph
#
# SUPERSEDED for skupervisor.dgfy.ph / pos.dgfy.ph / dgfy.ph / store.dgfy.ph as
# of the Docker cutover (see infrastructure/docker/) — routing for those four
# production domains now lives in infrastructure/docker/nginx/conf.d/*.conf,
# baked into the `nginx` container image. This file remains the live,
# authoritative source ONLY for staging.dgfy.ph, which still runs on PM2 and
# was explicitly kept out of scope for the Docker migration. Do not
# `sudo cp` this file back onto the VPS for the production domains post-cutover
# — it will re-diverge from the containerized config.

# staging.dgfy.ph → staging SKUpervisor (IMS) on port 5183, staging backend on port 5002
server {
    listen 80;
    server_name staging.dgfy.ph;
    client_max_body_size 8m;

    location /api {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Batch menu import upload -- see infrastructure/docker/nginx/nginx.conf.template's
    # matching location for the full rationale. staging.dgfy.ph is this file's
    # one live, authoritative server block (see the file header) -- the other
    # three below are kept in sync for parity even though they're superseded
    # by the Dockerized nginx config.
    location = /api/v1/items/import/menu/jobs {
        client_max_body_size 64m;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5183;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

