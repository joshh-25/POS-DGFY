# Local-only edge proxy copied from the verified temporary staging setup.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream local_dgfy_api { server dgfy-api:5100; keepalive 32; }
upstream local_dgfy_admin { server dgfy-admin:8085; keepalive 16; }
upstream local_storefront { server dgfy-storefront:8083; keepalive 16; }
upstream local_pos { server dgfy-pos:8082; keepalive 16; }
upstream local_ims { server dgfy-ims:8081; keepalive 16; }
upstream local_opis { server dgfy-opis:8084; keepalive 16; }

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name dgfy-store.nicenature.space;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300s;
    sub_filter_types *;
    sub_filter_once off;
    sub_filter 'api.stage.dgfy.ph' 'dgfy-api.nicenature.space';
    sub_filter 'api.dgfy.ph' 'dgfy-api.nicenature.space';
    sub_filter 'store.dgfy.ph' 'dgfy-store.nicenature.space';
    sub_filter 'pos.dgfy.ph' 'dgfy-pos.nicenature.space';
    sub_filter 'ims.dgfy.ph' 'dgfy-ims.nicenature.space';
    sub_filter 'skupervisor.dgfy.ph' 'dgfy-opis.nicenature.space';
    sub_filter 'opis.dgfy.ph' 'dgfy-opis.nicenature.space';

    location = /admin { proxy_pass http://local_dgfy_admin/admin/; }
    location ^~ /admin/ { proxy_pass http://local_dgfy_admin/admin/; }
    location ^~ /api/ { proxy_pass http://local_dgfy_api; }
    location ^~ /uploads/ { proxy_pass http://local_dgfy_api; }
    location ^~ /storage/ { proxy_pass http://local_dgfy_api; }
    location / { proxy_pass http://local_storefront; }
}

