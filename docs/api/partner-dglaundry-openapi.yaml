# Scoped OpenAPI 3.1 fragment: DGFY <-> DGLaundry partner surface only.
#
# This is NOT a specification for all of dgfy-api -- issue #466's finding that no such spec exists
# remains accurate after this file is added. It covers exactly the routes mounted at /oidc and
# /api/v1/partners/dglaundry, plus the inbound event receiver and the customer-facing laundry
# routes, as they exist in apps/dgfy-api/src/routes/{dgfyLaundry,dgfyLaundryOidc,dgfyLaundryOrders}.js
# as of 2026-10-08. See docs/api/PARTNER_INTEGRATION_CONTRACT.md for the prose contract and the
# "Known gaps" table -- some routes declared by DGLaundry's own proposal
# (docs/integrations/dgfy/partner-openapi.yaml in the dglaundry repo) were absent from the original
# DGFY source and have since been added; the prose contract records the remaining gaps.
openapi: 3.1.0
info:
  title: DGFY DGLaundry Partner API
  version: external-runtime-v0.1
  description: >
    The DGFY-owned surface exposed to the DGLaundry sibling app. Scoped fragment, not a full
    dgfy-api specification. Authoritative prose contract:
    docs/api/PARTNER_INTEGRATION_CONTRACT.md.
servers:
  - url: https://api.dgfy.ph
    description: Production
  - url: https://api.stage.dgfy.ph
    description: Staging
tags:
  - name: oidc
    description: Browser and machine OIDC provider (mounted at /oidc)
  - name: partner-provider
    description: Partner provider API (mounted at /api/v1/partners/dglaundry)
  - name: events
    description: Inbound signed event receiver
  - name: customer-laundry
    description: Customer/storefront-facing laundry routes (see Known gaps -- not customer-callable as built)
security:
  - {}
paths:
  /api/v1/partners/dglaundry/health:
    get:
      tags: [partner-provider]
      summary: Provider liveness and contract version
      security: [{ dglaundryPartner: [] }]
      responses:
        "200":
          description: Provider health
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [status, provider, contractVersion, time]
                    properties:
                      status: { type: string, const: ok }
                      provider: { type: string, const: dgfy }
                      contractVersion: { type: string }
                      time: { type: string, format: date-time }
  /api/v1/partners/dglaundry/capabilities:
    get:
      tags: [partner-provider]
      summary: Provider contract and signature capabilities
      security: [{ dglaundryPartner: [] }]
      responses:
        "200":
          description: Supported partner capabilities
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [provider, contractVersion, signatureProfiles, enforcedProfile]
                    properties:
                      provider: { type: string, const: dgfy }
                      contractVersion: { type: string }
                      signatureProfiles:
                        type: array
                        items:
                          type: object
                          required: [scope, tag, algorithm]
                          properties:
                            scope: { type: string, enum: [request, event] }
                            tag: { type: string }
                            algorithm: { type: string }
                      enforcedProfile: { type: string }
  /api/v1/partners/dglaundry/companies/{companyId}:
    get:
      tags: [partner-provider]
      summary: Read an active DGLaundry-owned company and its owner/mappings
      security: [{ dglaundryPartner: [] }]
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Company, owner membership, and active location mappings
        "404":
          description: Company is missing or outside the active DGLaundry tenant boundary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/partners/dglaundry/orders/{externalOrderReference}:
    get:
      tags: [partner-provider]
      summary: Read an order projection for an actively mapped company and location
      security: [{ dglaundryPartner: [] }]
      parameters:
        - name: externalOrderReference
          in: path
          required: true
          schema: { type: string }
        - name: company_id
          in: query
          description: Snake_case query alias; takes precedence over companyId and the header.
          schema: { type: string }
        - name: companyId
          in: query
          description: CamelCase query alias used by the joint qualification harness.
          schema: { type: string }
        - name: location_id
          in: query
          description: Snake_case query alias; takes precedence over locationId and the header.
          schema: { type: string }
        - name: locationId
          in: query
          description: CamelCase query alias used by the joint qualification harness.
          schema: { type: string }
        - name: X-DGFY-Company-Id
          in: header
          schema: { type: string }
        - name: X-DGFY-Location-Id
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Order projection
        "403":
          description: Company/location has no active DGLaundry mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Order not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/partners/dglaundry/customer-activities:
    post:
      tags: [partner-provider]
      summary: Register or replay a customer counter activity projection
      security: [{ dglaundryPartner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, locationId]
              properties:
                companyId: { type: string }
                locationId: { type: string }
                activityReference: { type: string }
                localOrderId: { type: string }
                externalOrderReference: { type: string }
                activityVersion: { type: integer, minimum: 1 }
                version: { type: integer, minimum: 1 }
                activityKind: { type: string }
                trackingReference: { type: string }
                externalTrackingReference: { type: string }
                summary: { type: string, maxLength: 500 }
                customerSafeSummary: { type: string, maxLength: 500 }
                occurredAt: { type: string }
                customerReference: { type: object }
      responses:
        "201":
          description: Activity projection registered
        "403":
          description: Company/location has no active DGLaundry mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid activity payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /oidc/.well-known/openid-configuration:
    get:
      tags: [oidc]
      summary: OIDC discovery document
      security: []
      responses:
        "200":
          description: Discovery document
          content:
            application/json:
              schema:
                type: object
                required: [issuer, authorization_endpoint, token_endpoint, jwks_uri]
                properties:
                  issuer: { type: string, format: uri }
                  authorization_endpoint: { type: string, format: uri }
                  pushed_authorization_request_endpoint: { type: string, format: uri }
                  token_endpoint: { type: string, format: uri }
                  revocation_endpoint: { type: string, format: uri }
                  end_session_endpoint: { type: string, format: uri }
                  introspection_endpoint: { type: string, format: uri }
                  jwks_uri: { type: string, format: uri }
                  response_types_supported: { type: array, items: { type: string } }
                  grant_types_supported: { type: array, items: { type: string } }
                  code_challenge_methods_supported: { type: array, items: { type: string } }
                  scopes_supported: { type: array, items: { type: string } }
                  token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
  /oidc/jwks:
    get:
      tags: [oidc]
      summary: JSON Web Key Set
      security: []
      responses:
        "200":
          description: Active signing keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { type: object }
        "503":
          description: Signing key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /oidc/par:
    post:
      tags: [oidc]
      summary: Pushed Authorization Request (RFC 9126)
      security: [{ dglaundryBrowserClient: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, redirect_uri, response_type, code_challenge, code_challenge_method]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string, format: uri }
                response_type: { type: string, enum: [code] }
                code_challenge: { type: string }
                code_challenge_method: { type: string, enum: [S256] }
                scope: { type: string }
                state: { type: string }
                nonce: { type: string }
      responses:
        "201":
          description: Pushed request accepted
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /oidc/authorize:
    get:
      tags: [oidc]
      summary: Authorization endpoint (requires an authenticated DGFY account session)
      responses:
        "302":
          description: Redirect to redirect_uri with code, or to DGFY login/company-selection
  /oidc/token:
    post:
      tags: [oidc]
      summary: Token endpoint (authorization_code or client_credentials grant)
      description: Browser authorization-code exchange uses client_secret_basic. Machine client_credentials uses private_key_jwt. Browser client secrets in the form body are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, client_credentials] }
                code: { type: string }
                redirect_uri: { type: string, format: uri }
                code_verifier: { type: string }
                client_id: { type: string }
                client_assertion_type: { type: string }
                client_assertion: { type: string }
                scope: { type: string }
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  id_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  scope: { type: string }
        "400":
          description: invalid_grant / invalid_request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "503":
          description: Signing key not configured, or Redis-backed state unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
  /oidc/revoke:
    post:
      tags: [oidc]
      summary: Token revocation (RFC 7009)
      description: Browser clients use client_secret_basic. The registered machine client authenticates with private_key_jwt; only tokens owned by the authenticated client are revoked.
      security: [{ dglaundryBrowserClient: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Revoked (or already invalid; RFC 7009 semantics)
  /oidc/introspect:
    post:
      tags: [oidc]
      summary: Opaque access-token introspection (RFC 7662)
      description: Browser clients use client_secret_basic. The registered machine client authenticates with private_key_jwt. Tokens owned by another client are reported inactive; access tokens are accepted only in the form body.
      security: [{ dglaundryBrowserClient: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Active token metadata or active false for invalid/expired/other-client tokens
        "400":
          description: Missing token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "503":
          description: Durable Redis-backed token state unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
  /oidc/logout:
    get:
      tags: [oidc]
      summary: End the current DGFY account session for the registered DGLaundry client
      description: Requires the signed-in DGFY browser session and a matching valid id_token_hint. post_logout_redirect_uri is rejected until explicitly registered; logout returns a JSON confirmation and clears the DGFY session.
      security: [{ dgfyAccountBearer: [] }]
      parameters:
        - { name: id_token_hint, in: query, required: true, schema: { type: string } }
        - { name: client_id, in: query, required: false, schema: { type: string } }
        - { name: post_logout_redirect_uri, in: query, required: false, schema: { type: string, format: uri } }
      responses:
        "200":
          description: DGFY account session revoked and cookie cleared
        "400":
          description: Invalid ID token hint or unsupported redirect URI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: No active DGFY account session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/partners/dglaundry/account/companies:
    get:
      tags: [partner-provider]
      summary: List this DGFY account's laundry company memberships
      security: [{ dgfyAccountBearer: [] }]
      responses:
        "200":
          description: Company list
        "403":
          description: No active laundry company membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/partners/dglaundry/dead-letters:
    get:
      tags: [partner-provider]
      summary: List scoped DGLaundry delivery failures
      description: Requires an accepted owner/admin membership and an active company/location mapping. Payloads and tracking capabilities are omitted. Failed paid-session completion is included for recovery without resending the delivered provider event.
      security: [{ dgfyAccountBearer: [] }]
      parameters:
        - { name: company_id, in: query, required: true, schema: { type: string } }
        - { name: location_id, in: query, required: true, schema: { type: string } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [inbound, outbound] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: Scoped failure metadata }
        "400": { description: Invalid scope or limit }
        "403": { description: Owner/admin membership or active mapping required }
  /api/v1/partners/dglaundry/dead-letters/{id}/redrive:
    post:
      tags: [partner-provider]
      summary: Audited recovery of an eligible dead letter
      description: Cookie-authenticated calls require the existing CSRF token. Caller-supplied event payloads are not accepted. Failed paid-session completion is retried locally without resending provider delivery.
      security: [{ dgfyAccountBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, location_id, direction, reason]
              properties:
                company_id: { type: string }
                location_id: { type: string }
                direction: { type: string, enum: [inbound, outbound] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "202": { description: Recovery queued or stored event reprocessed }
        "400": { description: Missing recovery reason or invalid scope }
        "403": { description: Owner/admin membership or active mapping required }
        "404": { description: Scoped recoverable dead letter not found }
        "409": { description: Recovery is concurrent or operation is not eligible }
  /api/v1/partners/dglaundry/account/launch:
    post:
      tags: [partner-provider]
      summary: Launch DGLaundry staff operations for a selected company
      security: [{ dgfyAccountBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId: { type: string }
                branchId: { type: string }
      responses:
        "200":
          description: Launch URL and session context, or selection_required
  /api/v1/partners/dglaundry/session-context:
    get:
      tags: [partner-provider]
      summary: Resolve the authenticated DGLaundry session's DGFY identity/mapping context
      security: [{ dglaundryAccessToken: [] }]
      responses:
        "200":
          description: Session context
  /api/v1/partners/dglaundry/registration-intents:
    post:
      tags: [partner-provider]
      summary: Submit a laundry company registration intent
      security: [{ dglaundryPartner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey, issuer, subject, organizationName, branchName, branchCode]
              properties:
                idempotencyKey: { type: string }
                issuer: { type: string, format: uri }
                subject: { type: string }
                organizationName: { type: string }
                branchName: { type: string }
                branchCode: { type: string }
                timezone: { type: string }
                currency: { type: string }
                publicStorefrontHandle: { type: string }
      responses:
        "201":
          description: Intent created
  /api/v1/partners/dglaundry/registration-intents/{intentId}:
    get:
      tags: [partner-provider]
      summary: Read a registration intent's status
      security: [{ dglaundryPartner: [] }]
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Intent status
        "404":
          description: Not found
  /api/v1/partners/dglaundry/location-intents:
    post:
      tags: [partner-provider]
      summary: Submit a branch/location mapping intent
      security: [{ dglaundryPartner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey, companyId, branchId, branchName, branchCode]
              properties:
                idempotencyKey: { type: string }
                companyId: { type: string }
                branchId: { type: string }
                branchName: { type: string }
                branchCode: { type: string }
      responses:
        "201":
          description: Intent created
  /api/v1/partners/dglaundry/location-intents/{intentId}:
    get:
      tags: [partner-provider]
      summary: Read a location intent's status
      security: [{ dglaundryPartner: [] }]
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Intent status
        "404":
          description: Not found
  /api/v1/partners/dglaundry/staff-invitation-intents:
    post:
      tags: [partner-provider]
      summary: Submit a staff invitation intent
      security: [{ dglaundryPartner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, companyId, email, displayName, role, branchIds]
              properties:
                requestId: { type: string }
                companyId: { type: string }
                email: { type: string, format: email }
                displayName: { type: string }
                role: { type: string }
                branchIds: { type: array, items: { type: string } }
      responses:
        "201":
          description: Invitation created
  /api/v1/partners/dglaundry/staff-invitation-intents/{intentId}:
    get:
      tags: [partner-provider]
      summary: Read a staff invitation intent's status
      security: [{ dglaundryPartner: [] }]
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation status
        "404":
          description: Not found
  /api/v1/partners/dglaundry/mappings:
    post:
      tags: [partner-provider]
      summary: Create an explicit company/location mapping approval
      security: [{ dglaundryPartner: [] }]
      responses:
        "201":
          description: Mapping created
  /api/v1/integrations/dglaundry/events:
    post:
      tags: [events]
      summary: Inbound signed DGLaundry event (Ed25519, dglaundry-dgfy-v1 profile)
      security: [{ ed25519EventSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventEnvelope" }
      responses:
        "200":
          description: Event persisted and applied (or duplicate -- idempotent)
        "401":
          description: Signature verification failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Payload schema validation failed for this event type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/dgfy/laundry/catalog:
    get:
      tags: [customer-laundry]
      summary: >
        Laundry catalog for the caller's mapped company. NOTE: despite the "customer/storefront"
        comment in source, this route requires an active laundry-company membership
        (authenticateDgfyAccount + resolveLaundryCompany). It is not customer-callable as built --
        see Known gaps in docs/api/PARTNER_INTEGRATION_CONTRACT.md.
      security: [{ dgfyAccountBearer: [] }]
      parameters:
        - name: company_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Catalog
        "403":
          description: No active laundry company membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Ambiguous company selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/dgfy/laundry/availability:
    get:
      tags: [customer-laundry]
      summary: Branch availability for the caller's mapped company (same auth caveat as /catalog)
      security: [{ dgfyAccountBearer: [] }]
      responses:
        "200":
          description: Availability
  /api/v1/dgfy/laundry/quotes:
    post:
      tags: [customer-laundry]
      summary: Create a server-priced quote (same auth caveat as /catalog)
      security: [{ dgfyAccountBearer: [] }]
      responses:
        "201":
          description: Quote
  /api/v1/dgfy/laundry/orders:
    post:
      tags: [customer-laundry]
      summary: Submit an order (same auth caveat as /catalog)
      security: [{ dgfyAccountBearer: [] }]
      responses:
        "201":
          description: Order created
  /api/v1/dgfy/laundry/orders/{externalOrderReference}:
    get:
      tags: [customer-laundry]
      summary: Read an order (same auth caveat as /catalog)
      security: [{ dgfyAccountBearer: [] }]
      parameters:
        - name: externalOrderReference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
    patch:
      tags: [customer-laundry]
      summary: Update an order (same auth caveat as /catalog)
      security: [{ dgfyAccountBearer: [] }]
      parameters:
        - name: externalOrderReference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated order
  /api/v1/dgfy/laundry/orders/{externalOrderReference}/cancel:
    post:
      tags: [customer-laundry]
      summary: Cancel an eligible order (same auth caveat as /catalog)
      security: [{ dgfyAccountBearer: [] }]
      parameters:
        - name: externalOrderReference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled
components:
  securitySchemes:
    dglaundryBrowserClient:
      type: http
      scheme: basic
      description: Dedicated DGLaundry browser client credentials; never the legacy shared partner token.
    dgfyAccountBearer:
      type: http
      scheme: bearer
      description: DGFY account session token (authenticateDgfyAccount)
    dglaundryAccessToken:
      type: http
      scheme: bearer
      description: Opaque DGFY access token issued via the browser OIDC flow
    dglaundryPartner:
      type: apiKey
      in: header
      name: Authorization
      description: >
        requireDglaundryPartner -- bearer machine token + RFC 9421 P-256 request signature in
        production, or the legacy shared-secret header as a fallback (see Known gaps).
    ed25519EventSignature:
      type: apiKey
      in: header
      name: Signature-Input
      description: RFC 9421 Ed25519 event signature, tag dglaundry-dgfy-v1
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        error_code: { type: string }
        error: { type: string }
    OAuthError:
      type: object
      properties:
        error: { type: string }
    EventEnvelope:
      type: object
      required: [specversion, id, type, source, data]
      properties:
        specversion: { type: string }
        id: { type: string, maxLength: 200 }
        type:
          type: string
          enum:
            - dglaundry.laundry_catalog.published.v1
